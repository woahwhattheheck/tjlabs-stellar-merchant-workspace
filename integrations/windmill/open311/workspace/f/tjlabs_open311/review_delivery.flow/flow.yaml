{
  "summary": "Review requests and prepare a complete delivery",
  "description": "Retain selected source rows and proposed assignments, collect native Windmill approval, apply original reviews and export the complete workspace.",
  "schema": {
    "type": "object",
    "properties": {
      "runKey": {
        "type": "string",
        "description": "Stable identifier for this operator action; reuse it when continuing the same flow.",
        "pattern": "^[A-Za-z0-9][A-Za-z0-9_.:@-]{0,119}$"
      },
      "captureId": {
        "type": "string"
      },
      "selection": {
        "type": "array",
        "minItems": 1,
        "items": {
          "type": "object",
          "properties": {
            "serviceRequestId": {
              "type": "string"
            },
            "sourceSha256": {
              "type": "string"
            },
            "priorReviewId": {
              "type": [
                "string",
                "null"
              ]
            }
          },
          "required": [
            "serviceRequestId",
            "sourceSha256",
            "priorReviewId"
          ]
        }
      },
      "review": {
        "type": "object",
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "new",
              "assigned",
              "in_progress",
              "done"
            ]
          },
          "assignee": {
            "type": "string"
          },
          "dueDate": {
            "type": "string"
          },
          "note": {
            "type": "string"
          }
        },
        "required": [
          "status"
        ]
      }
    },
    "required": [
      "runKey",
      "captureId",
      "selection",
      "review"
    ]
  },
  "value": {
    "modules": [
      {
        "id": "plan",
        "summary": "Retain the proposed review",
        "value": {
          "type": "script",
          "path": "f/tjlabs_open311/workspace",
          "input_transforms": {
            "action": {
              "type": "static",
              "value": "prepare_review"
            },
            "target": {
              "type": "static",
              "value": "source"
            },
            "args": {
              "type": "javascript",
              "expr": "({runKey:flow_input.runKey,captureId:flow_input.captureId,selection:flow_input.selection,review:flow_input.review})"
            }
          }
        }
      },
      {
        "id": "approval",
        "summary": "Approve request assignments",
        "value": {
          "type": "rawscript",
          "language": "bun",
          "content": "import * as wmill from \"windmill-client\";\nexport async function main(plan: any) {\n  const urls = await wmill.getResumeUrls();\n  return { ...urls, description: { markdown: \"## Review \" + plan.rows.length + \" requests\\n\\nInternal status: **\" + plan.review.status + \"**\\n\\nAssignee: \" + (plan.review.assignee || \"Unassigned\") + \"\\n\\nDue date: \" + (plan.review.dueDate || \"None\") + \"\\n\\n\" + plan.review.note + \"\\n\\nRequests: \" + plan.rows.map((r:any)=>r.serviceRequestId).join(\", \") }, planSha256: plan.planSha256 };\n}\n",
          "input_transforms": {
            "plan": {
              "type": "javascript",
              "expr": "results.plan"
            }
          }
        },
        "suspend": {
          "required_events": 1,
          "timeout": 604800,
          "skin": "minimal"
        }
      },
      {
        "id": "reviews",
        "summary": "Apply approved assignments",
        "value": {
          "type": "script",
          "path": "f/tjlabs_open311/workspace",
          "input_transforms": {
            "action": {
              "type": "static",
              "value": "apply_reviews"
            },
            "target": {
              "type": "static",
              "value": "source"
            },
            "args": {
              "type": "javascript",
              "expr": "({plan:results.plan,approval:{approved:true,event:resume,approvers:approvers}})"
            }
          }
        }
      },
      {
        "id": "delivery",
        "summary": "Build original source and workspace exports",
        "value": {
          "type": "script",
          "path": "f/tjlabs_open311/workspace",
          "input_transforms": {
            "action": {
              "type": "static",
              "value": "export_pack"
            },
            "target": {
              "type": "static",
              "value": "source"
            },
            "args": {
              "type": "javascript",
              "expr": "({captureId:flow_input.captureId})"
            }
          }
        }
      },
      {
        "id": "result",
        "summary": "Return review and delivery",
        "value": {
          "type": "rawscript",
          "language": "bun",
          "content": "export async function main(reviews: any, delivery: any) { return {schema:\"tjlabs.windmill.open311.review-delivery.v1\",reviews,delivery}; }\n",
          "input_transforms": {
            "reviews": {
              "type": "javascript",
              "expr": "results.reviews"
            },
            "delivery": {
              "type": "javascript",
              "expr": "results.delivery"
            }
          }
        }
      }
    ]
  }
}
