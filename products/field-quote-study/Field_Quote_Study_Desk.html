rated quotes, company decisions, customer delivery and customer outcomes remain separate supplied events. Exact quote payloads, contemporaneous authority and source availability determine traceability. The desk evaluates observed workflow and full person-time; technical scope, company pricing and customer acceptance remain decisions of their actual participants.'};\n}\n\nfunction editRow(w,{kind,side,row_index,value,reason,at}){\n validate(w);assert(KINDS.includes(kind)&&['source','returned'].includes(side),'Select table and side');text(reason,'Correction reason');assert(reason.trim(),'Explain this observed correction or newly recorded event');stamp(at);const e=selected(w,kind,side),list=rows(w,kind,side),old=row_index===null?null:list[row_index];\n assert(row_index===null||Number.isSafeInteger(row_index)&&old,'Selected row no longer exists');\n assert(value&&Object.keys(value).sort().join()===FIELDS[kind].slice().sort().join(),'Complete canonical row required');\n const mapped=e?FIELDS[kind].filter(k=>e.mapping[k]):FIELDS[kind];for(const k of FIELDS[kind]){if(mapped.includes(k))text(value[k],k);else assert(value[k]===null,'Unobserved '+k+' needs an explicit source mapping before editing');}\n const data=list.map(x=>clone(x.values));if(old)data[row_index]=clone(value);else data.push(clone(value));\n const content=CSV.csv([mapped,...data.map(x=>mapped.map(k=>x[k]))]),mapping=Object.fromEntries(FIELDS[kind].map(k=>[k,mapped.includes(k)?k:'']));\n let x=importExtract(w,{kind,side,name:'recorded-'+kind+'-'+at.replace(/[:.]/g,'-')+'.csv',content,mapping,label:'Recorded '+kind+' revision',at,derivation:{source_extract_id:e?.id||null,row_index,before:old?clone(old):null,after:clone(value),reason,at}});\n return validate(x);\n}\nfunction review(w,{study_sha256,role,reviewer,at,decision,notes}){\n assert(study_sha256===digest(w),'Review belongs to another selected edition; start a new review.');\n assert(w.config.quote.required_review_roles.includes(role),'Choose a current configured review role');text(reviewer,'Reviewer');assert(reviewer.trim(),'Reviewer required');stamp(at);assert(['accepted','revise'].includes(decision),'Review decision');text(notes,'Review notes');\n const x=clone(w),r={study_sha256,role,reviewer,at,decision,notes};if(!x.reviews.some(q=>hash(q)===hash(r)))x.reviews.push(r);return validate(x);\n}\nfunction report(w){const r=analyze(w),esc=x=>String(x??'').replace(/\\|/g,'\\\\|').replace(/[\\r\\n]+/g,' ');\n return '# '+w.config.label+'\\n\\nData class: '+r.data_class+'\\n\\nSource scope: '+r.scope.source+'\\n\\nReturned scope: '+r.scope.returned+'\\n\\nSelected edition: '+r.study_sha256+'\\n\\nComparison: '+r.comparison_state+'; review: '+r.decision+'\\n\\n| Kind | Original rows | Returned rows |\\n|---|---:|---:|\\n'+KINDS.map(k=>'| '+k+' | '+r.counts[k].source+' | '+r.counts[k].returned+' |').join('\\n')+'\\n\\n## Differences\\n\\n'+(r.findings.length?'| Code | Kind | ID | Field | Expected | Returned | Original location |\\n|---|---|---|---|---|---|---|\\n'+r.findings.map(x=>'| '+[x.code,x.kind,x.record_id,x.field,x.expected,x.actual,x.source?x.source.name+':'+x.source.line_start+'–'+x.source.line_end:''].map(esc).join(' | ')+' |').join('\\n'):'Every selected canonical field matches through the explicit identity maps.')+'\\n\\n## Retained photo and document bytes\\n\\n'+(r.document_comparisons.length?r.document_comparisons.map(x=>x.kind+': '+x.source_id+' → '+x.returned_id+': '+x.state+'; original '+x.source_sha256.join(', ')+'; returned '+x.returned_sha256.join(', ')).join('\\n'):'No uniquely mapped records have retained attachment comparison scope.')+'\\n\\nUnobserved means neither side supplied retained attachment bytes. Matching record references do not establish matching photo or document contents.\\n\\n## Operator review\\n\\n'+(r.reviews.length?r.reviews.map(x=>x.at+' — '+x.role+' / '+x.reviewer+' — '+x.decision+'\\n\\n'+x.notes).join('\\n\\n'):'No review recorded for this edition.')+ '\\n\\n'+Quote.report(r.quote)+'\\n\\n'+r.limits+'\\n';\n}\nfunction exports(w){validate(w);const r=analyze(w),out=[{path:'study.json',content:json(w)},{path:'comparison.json',content:json(r)},{path:'comparison.md',content:report(w)},{path:'crosswalks.csv',content:CSV.csv([['kind','source_id','target_id'],...w.crosswalks.map(x=>[x.kind,x.source_id,x.target_id])])}];for(const side of ['source','returned'])for(const kind of KINDS)out.push({path:'selected/'+side+'-'+kind+'.csv',content:CSV.csv([FIELDS[kind],...rows(w,kind,side).map(x=>FIELDS[kind].map(k=>x.values[k]===null?'':x.values[k]))])});const idx=[];for(const o of w.originals){const path='originals/'+o.id+'.txt';out.push({path,content:o.content});idx.push({id:o.id,name:o.name,path,sha256:o.sha256,captured_at:o.captured_at});}out.push({path:'originals/index.json',content:json(idx)},{path:'selected/availability.json',content:json(availability(w))});const docs=[];for(const d of w.documents){const path='documents/'+d.sha256+'.bin';if(!out.some(x=>x.path===path))out.push({path,bytes:Array.from(Binary.decode(d.base64))});docs.push({id:d.id,name:d.name,media_type:d.media_type,path,bytes:d.bytes,sha256:d.sha256,captured_at:d.captured_at,available_at:d.available_at,notes:d.notes});}out.push({path:'documents/index.json',content:json({documents:docs,links:w.document_links})});out.push(...Quote.exports(w,r.quote));return out;}\nmodule.exports={SCHEMA,KINDS,FIELDS,RELATIONS,clone,hash,json,empty,validate,digest,inspectCSV,importExtract,addDocument,documentAvailability,linkDocument,unlinkDocument,availability,selected,rows,choose,crosswalk,matchIds,analyze,editRow,review,report,exports};\n"},{"path":"csv.cjs","content":"'use strict';\nfunction parse(text){const raw=text.charCodeAt(0)===0xfeff?text.slice(1):text,rows=[];let row=[],v='',quoted=false,closed=false,line=1,start=1;for(let i=0;i\u003craw.length;i++){const ch=raw[i];if(quoted){if(ch==='\"'){if(raw[i+1]==='\"'){v+='\"';i++;}else{quoted=false;closed=true;}}else{v+=ch;if(ch==='\\r'||ch==='\\n'&&raw[i-1]!=='\\r')line++;}continue;}if(ch==='\"'){if(v!==''||closed)throw Error('Unexpected quote at line '+line);quoted=true;continue;}if(ch===','||ch==='\\n'||ch==='\\r'){row.push(v);v='';closed=false;if(ch!==','){if(ch==='\\r'&&raw[i+1]==='\\n')i++;rows.push({values:row,line_start:start,line_end:line});row=[];line++;start=line;}continue;}if(closed)throw Error('Unexpected text after closing quote at line '+line);v+=ch;}if(quoted)throw Error('Unclosed quoted field');if(row.length||v!==''||closed)rows.push({values:[...row,v],line_start:start,line_end:line});return rows;}\nconst cell=x=>{const s=String(x??'');return /[\",\\r\\n]/.test(s)?'\"'+s.replace(/\"/g,'\"\"')+'\"':s;};\nfunction csv(table){return table.map(r=>r.map(cell).join(',')).join('\\r\\n')+'\\r\\n';}\n\nfunction table(text){const rows=parse(text);if(!rows.length)throw Error('CSV is empty');const header=rows[0].values;if(header.some(x=>!x)||new Set(header).size!==header.length)throw Error('Every column requires a unique nonempty name');const data=rows.slice(1).filter(x=>!x.values.every(v=>v===''));for(const r of data)if(r.values.length!==header.length)throw Error('Wrong field count at line '+r.line_start);return{header,rows:data};}\nmodule.exports={parse,csv,table};\n"},{"path":"examples/RESULT.md","content":"# Field quote workflow\n\nAs of 2026-10-10T00:00:00Z\n\n| Observation | Full visit population |\n|---|---:|\n| Published | 5 / 8 |\n| Delivered | 5 / 8 |\n| Delivered before departure | 3 / 8 |\n| Authorised first delivery | 4 / 8 |\n| Traceable and authorised before departure | 2 / 8 |\n\n## Complete visit outcomes\n\n- V1: first delivery 2026-10-08T10:20:00Z; editions Q1; departure 2026-10-08T10:30:00Z; authorisation true; traceability true\n- V2: first delivery 2026-10-08T10:50:00Z; editions Q2B; departure 2026-10-08T10:30:00Z; authorisation true; traceability true\n- V3: no actual delivery; departure 2026-10-08T10:30:00Z; authorisation false; traceability false\n- V4: first delivery 2026-10-08T10:20:00Z; editions Q4B; departure 2026-10-08T10:30:00Z; authorisation false; traceability true\n- V5: no actual delivery; departure 2026-10-08T10:30:00Z; authorisation false; traceability false\n- V6: first delivery 2026-10-08T10:25:00Z; editions Q6; departure 2026-10-08T10:30:00Z; authorisation true; traceability true\n- V7: first delivery 2026-10-08T10:45:00Z; editions Q7; departure 2026-10-08T10:30:00Z; authorisation true; traceability true\n- V8: no actual delivery; departure 2026-10-08T10:30:00Z; authorisation false; traceability false\n\n## All-phase person-time\n\nPaired visits: 4. Existing 160; study 140 person-minutes. All observed study work: 170 person-minutes. Unpaired or incomplete: V3, V5, V7, V8.\n\nSupplied actual field work only. Publication, sending, delivery, company approval and customer acceptance are separate. Earliest actual delivery is retained even when its edition or authority is unresolved. All eligible visits, including failed, abstained, unfinished and withdrawn work, remain in the declared population. Stage-specific source availability applies at actual input use. Quote tax is supplied, not independently determined; price and line arithmetic use declared exact-decimal rounding. Paired effort is descriptive, with unmatched work retained; it is not an annual or cash benefit.\n"},{"path":"examples/build-course.cjs","content":"'use strict';\nconst C=require('../core.cjs'),Q=require('../quote.cjs'),CSV=require('../csv.cjs'),S=require('../sha256.cjs'),M=require('../session.cjs');\nconst AT='2026-10-08T12:00:00Z',LATER='2026-10-09T12:00:00Z',t=s=>'2026-10-08T'+s+':00Z',utf=s=>Uint8Array.from(unescape(encodeURIComponent(s)),c=>c.charCodeAt(0));\nfunction put(w,kind,records,side='returned',at=AT){const fields=C.FIELDS[kind];return C.importExtract(w,{kind,side,name:kind+'-'+side+'.csv',content:CSV.csv([fields,...records.map(r=>fields.map(f=>r[f]??''))]),mapping:Object.fromEntries(fields.map(f=>[f,f])),at,available_at:at,label:'Authored '+kind});}\nfunction edit(w,kind,id,changes){const values=C.rows(w,kind,'returned').map(x=>x.values),i=values.findIndex(r=>r.id===id);if(i\u003c0)throw Error('Missing course row '+id);return C.editRow(w,{kind,side:'returned',row_index:i,value:{...values[i],...changes},reason:'Authored source-backed correction',at:LATER});}\nfunction add(w,kind,value){return C.editRow(w,{kind,side:'returned',row_index:null,value:Object.fromEntries(C.FIELDS[kind].map(k=>[k,value[k]??''])),reason:'Authored additional observation',at:LATER});}\nfunction result(w){return C.analyze(w).quote;}\nfunction make(){\n let w=C.empty('Authored eight-visit field quote course');w.id='study-authored-field-quotes';w.config.data_class='authored_course';w.config.source_scope='Authored eight visits and actual supplied fixture outputs';w.config.returned_scope='Same complete fixture after source-backed corrections';w.config.quote={...Q.empty(),as_of:'2026-10-10T00:00:00Z',population_start:'2026-10-08T00:00:00Z',population_end:'2026-10-09T00:00:00Z',inventory_complete:true,inventory_location:'authored/course complete visits V1–V8',company_ids:['CO'],service_kinds:['repair']};\n const data=Object.fromEntries(C.KINDS.map(k=>[k,[]])),attachments=[];\n data.companies=[{id:'CO',name:'Authored Service Company',currency:'USD',approval_policy:'review_required',source_ref:'authored/company'}];\n data.users=[{id:'TECH',company_id:'CO',name:'Authored technician',role:'technician',source_ref:'authored/people'},{id:'OFFICE',company_id:'CO',name:'Authored office reviewer',role:'operations',source_ref:'authored/people'}];\n data.sites=[{id:'SITE',company_id:'CO',customer_ref:'CUSTOMER',address_ref:'authored/site',source_ref:'authored/site'}];\n data.authorities=[{id:'APPROVE',company_id:'CO',user_id:'OFFICE',action:'approve_quote',service_kind:'repair',currency:'USD',maximum_total:'1000',effective_from:'2026-10-01T00:00:00Z',effective_until:'',recorded_at:'2026-10-01T00:00:00Z',source_ref:'authored/authority'}];\n data.price_rules=[{id:'PRICE',company_id:'CO',release_ref:'PRICE-1',item_code:'WORK',unit:'unit',currency:'USD',unit_price:'45.125',effective_from:'2026-10-01T00:00:00Z',effective_until:'',recorded_at:'2026-10-01T00:00:00Z',source_ref:'authored/rate'}];\n for(let n=1;n\u003c=8;n++){const id='V'+n;data.visits.push({id,company_id:'CO',site_id:'SITE',technician_id:'TECH',service_kind:'repair',opened_at:t('10:00'),recorded_at:t('10:00'),included:'true',exclusion_reason:'',source_ref:'authored/visit/'+id});data.visit_events.push({id:'DEPART'+n,visit_id:id,event:'departed',effective_at:t('10:30'),recorded_at:t('10:30'),actor_id:'TECH',reason:'Actual authored departure',source_ref:'authored/departure/'+id});\n const content='Authored original field evidence '+id+'\\n',digest=S.sha256Utf8(content).sha256;\n data.evidence.push({id:'E'+n,visit_id:id,kind:'field_note',captured_at:t('10:05'),recorded_at:t('10:05'),content_sha256:digest,source_ref:'authored/evidence/'+id});attachments.push({kind:'evidence',record:'E'+n,content,at:t('10:05')});\n for(const [stage,recipient,minute]of [['device','DEVICE-1','10:05'],['server','SERVER-1',n===2?'10:35':'10:05']])data.evidence_receipts.push({id:'RECEIPT-'+stage+n,evidence_id:'E'+n,stage,recipient_ref:recipient,content_sha256:digest,available_at:t(minute),recorded_at:t(minute),source_ref:'authored/receipt/'+stage+n});\n }\n const configs=[['Q1','V1','1','','10:10','device','drafted'],['Q2A','V2','1','','10:20','server','drafted'],['Q2B','V2','2','Q2A','10:40','server','drafted'],['Q3','V3','1','','10:10','server','failed'],['Q4A','V4','1','','10:10','server','drafted'],['Q4B','V4','2','Q4A','10:15','server','drafted'],['Q5','V5','1','','10:10','server','drafted'],['Q6','V6','1','','10:10','server','drafted'],['Q7','V7','1','','10:10','server','drafted'],['Q8','V8','1','','10:10','server','abstained']];\n for(const [id,visit,version,prior,time,stage,status]of configs){const drafted=status==='drafted',content='Authored exact quote payload '+id+'\\n2 units at45.125; net90.25; supplied tax9.75; total100USD\\n',digest=drafted?S.sha256Utf8(content).sha256:'',inputTime=id==='Q2B'?'10:38':id==='Q2A'?'10:18':'10:08';data.quote_editions.push({id,visit_id:visit,quote_id:'QUOTE-'+visit,version,supersedes_id:prior,output_status:status,stage,recipient_ref:stage==='device'?'DEVICE-1':'SERVER-1',produced_at:t(time),input_cutoff_at:t(inputTime),recorded_at:t(time),payload_sha256:digest,currency:drafted?'USD':'',net:drafted?'90.25':'',tax:drafted?'9.75':'',total:drafted?'100':'',model_version:'authored-model-1',rule_release_ref:'PRICE-1',reason:drafted?'':'Authored '+status+' output',source_ref:'authored/output/'+id});\n if(!drafted)continue;attachments.push({kind:'quote_editions',record:id,content,at:t(time)});data.quote_inputs.push({id:'INPUT-'+id,edition_id:id,evidence_id:'E'+visit.slice(1),used_sha256:data.evidence.find(e=>e.visit_id===visit).content_sha256,used_at:t(inputTime),source_ref:'authored/input/'+id});data.quote_lines.push({id:'LINE-'+id,edition_id:id,item_code:'WORK',description:'Authored scoped service',quantity:'2',unit:'unit',unit_price:'45.125',discount:'0',net:'90.25',tax:'9.75',total:'100',source_ref:'authored/line/'+id});data.line_price_bindings.push({id:'BIND-'+id,line_id:'LINE-'+id,rule_id:'PRICE',override_authority_id:'',override_actor_id:'',override_at:'',override_reason:'',source_ref:'authored/binding/'+id});data.decisions.push({id:'DECISION-'+id,edition_id:id,policy_ref:'AUTHORED-POLICY-1',result:'review_required',decided_at:t(time),recorded_at:t(time),actor_id:'TECH',reason:'Company requires office review',source_ref:'authored/decision/'+id});\n }\n for(const [id,time]of [['Q1','10:16'],['Q2B','10:42'],['Q4A','10:16'],['Q6','10:16'],['Q7','10:16']]){const e=data.quote_editions.find(x=>x.id===id);data.approvals.push({id:'APPROVAL-'+id,edition_id:id,payload_sha256:e.payload_sha256,authority_id:'APPROVE',reviewer_id:'OFFICE',decision:'approved',effective_at:t(time),recorded_at:t(time),supersedes_id:'',reason:'Authored scope and price review',source_ref:'authored/approval/'+id});}\n for(const [id,time]of [['Q1','10:20'],['Q2B','10:50'],['Q4B','10:20'],['Q6','10:25'],['Q7','10:45']])for(const event of ['published','sent','delivered'])data.quote_events.push({id:event+'-'+id,edition_id:id,event,effective_at:t(time),recorded_at:t(time),actor_id:'OFFICE',authority_id:'',recipient_ref:'CUSTOMER',delivery_ref:'AUTHORED-'+id,source_ref:'authored/'+event+'/'+id});\n data.quote_events.push({id:'WITHDRAW-Q5',edition_id:'Q5',event:'withdrawn',effective_at:t('11:00'),recorded_at:t('11:00'),actor_id:'OFFICE',authority_id:'',recipient_ref:'',delivery_ref:'',source_ref:'authored/withdrawal'});\n for(const [id,event,time]of [['Q1','accepted','11:05'],['Q2B','viewed','11:06'],['Q6','rejected','11:07']])data.customer_events.push({id:'CUSTOMER-'+id,edition_id:id,payload_sha256:data.quote_editions.find(x=>x.id===id).payload_sha256,event,effective_at:t(time),recorded_at:t(time),customer_ref:'CUSTOMER',source_ref:'authored/customer/'+id});\n const phases=Q.empty().required_effort_phases;\n const old=[8,10,7,7.5,4,3.5],cur=[6,7,5,10,4,3];\n for(const n of [1,2,4,6])for(const method of ['existing_process','study_process'])for(let i=0;i\u003cphases.length;i++)data.effort.push({id:'EFF-'+n+'-'+method+'-'+i,visit_id:'V'+n,method,phase:phases[i],work_key:'WORK-'+n+'-'+method+'-'+i,active_person_minutes:String((method==='existing_process'?old:cur)[i]),observed_at:t('11:'+String(i).padStart(2,'0')),recorded_at:t('11:10'),observer:'Authored '+method+' operator',source_ref:'authored/timing/'+n+'/'+method+'/'+i});\n for(let i=0;i\u003cphases.length;i++)data.effort.push({id:'EFF-7-study-'+i,visit_id:'V7',method:'study_process',phase:phases[i],work_key:'WORK-7-study-'+i,active_person_minutes:'5',observed_at:t('11:'+String(i).padStart(2,'0')),recorded_at:t('11:10'),observer:'Authored study_process operator',source_ref:'authored/timing/7/study/'+i});\n for(const kind of C.KINDS)for(const side of ['source','returned'])w=put(w,kind,data[kind],side);\n w=C.addDocument(w,{name:'authored-complete-visit-inventory.txt',media_type:'text/plain',bytes:utf('Complete consecutive eligible visits V1 V2 V3 V4 V5 V6 V7 V8\\n'),at:AT,available_at:AT});w.config.quote.inventory_document_id=w.documents.at(-1).id;\n for(const a of attachments){w=C.addDocument(w,{name:a.record+'-original.txt',media_type:'text/plain',bytes:utf(a.content),at:AT,available_at:a.at});const document_id=w.documents.at(-1).id;for(const side of ['source','returned'])w=C.linkDocument(w,{side,kind:a.kind,record_id:a.record,document_id,available_at:a.at,notes:'Authored exact original'});}\n for(const kind of C.KINDS)w=C.matchIds(w,kind);return C.validate(w);\n}\nfunction run(){const w=make(),r=result(w),checks=[],check=(name,v)=>{if(!v)throw Error('Field quote course failed: '+name);checks.push({name,passed:true});};\n check('Complete eight-visit denominator retains failed, abstained and unfinished work',r.population.population_resolved&&r.population.eligible===8&&r.summary.no_actual_delivery.length===3);\n check('Publication, actual delivery and accepted customer event stay separate',r.summary.delivered.count===5&&r.customer_events.filter(x=>x.valid&&x.event==='accepted').length===1);\n check('Three actual deliveries occur before first departure',r.summary.delivered_before_departure.count===3);\n check('Four first deliveries bind their exact approved payload',r.summary.authorised_first_delivery.count===4);\n check('Two of eight are traceable and authorised before departure',r.summary.traceable_authorised_before_departure.count===2&&r.summary.traceable_authorised_before_departure.denominator===8);\n check('Offline original is locally available before server receipt',r.editions.find(x=>x.id==='Q1').traceable&&r.editions.find(x=>x.id==='Q2A').inputs[0].issues.includes('EVIDENCE_UNAVAILABLE_AT_STAGE'));\n check('Later supplied output preserves the earlier unavailable-input edition',r.editions.find(x=>x.id==='Q2B').traceable&&!r.editions.find(x=>x.id==='Q2A').traceable);\n check('Approval for older quote edition does not cover changed delivery',!r.deliveries.find(x=>x.id==='delivered-Q4B').authorised);\n check('Exact quote arithmetic retains supplied tax and decimal prices',r.editions.find(x=>x.id==='Q1').lines[0].expected_net==='90.25');\n check('Four paired visits: 160 to 140, all observed current 170 person-minutes',r.effort_summary.paired_visits===4&&r.effort_summary.paired_baseline_minutes.decimal==='160'&&r.effort_summary.paired_current_minutes.decimal==='140'&&r.effort_summary.all_observed_current_minutes.decimal==='170');\n let x=edit(w,'authorities','APPROVE',{maximum_total:'99'});check('Actual authority amount ceiling is evaluated at approval',result(x).summary.authorised_first_delivery.count===0);\n x=edit(w,'approvals','APPROVAL-Q1',{payload_sha256:'0'.repeat(64)});check('Changed payload cannot reuse an earlier approval',!result(x).visits.find(v=>v.id==='V1').first_delivery_authorised);\n x=edit(w,'price_rules','PRICE',{recorded_at:t('10:12')});check('Later known price rule does not backfill a 10:10 output',!result(x).editions.find(v=>v.id==='Q1').traceable);\n x=add(w,'effort',{...C.rows(w,'effort','returned')[0].values,id:'COPIED',work_key:'DIFFERENT',source_ref:'another filename'});check('Renaming the same actual person-time does not manufacture disjoint work',!result(x).effort.find(v=>v.visit_id==='V1').paired);\n x=edit(w,'visits','V3',{included:''});check('Unresolved inventory suppresses full population fractions',result(x).summary.delivered.denominator===null);\n x=add(w,'quote_events',{...C.rows(w,'quote_events','returned').find(r=>r.values.id==='delivered-Q1').values,id:'EARLY-Q1',effective_at:t('10:06'),recorded_at:t('10:06')});let edge=result(x),first=edge.visits.find(v=>v.id==='V1');check('Earlier observed delivery before edition production remains first and cannot qualify',first.first_delivery_at===t('10:06')&&!first.traceable_authorised_before_departure&&edge.deliveries.find(v=>v.id==='EARLY-Q1').observed&&!edge.deliveries.find(v=>v.id==='EARLY-Q1').chronology_valid);\n x=edit(w,'visits','V3',{company_id:''});edge=result(x);check('Missing company identity keeps scoped population unresolved',!edge.population.population_resolved&&edge.population.unresolved.some(v=>v.id==='V3')&&!edge.population.excluded.some(v=>v.id==='V3')&&edge.summary.delivered.denominator===null);\n x=edit(w,'quote_events','delivered-Q1',{actor_id:'UNKNOWN'});edge=result(x);let event=edge.deliveries.find(v=>v.id==='delivered-Q1');check('Unknown delivery actor preserves approval but prevents event authorisation',event.approval.state==='approved'&&!event.authorised&&!edge.visits.find(v=>v.id==='V1').first_delivery_authorised&&event.issues.includes('EVENT_SOURCE_OR_ACTOR'));\n let session=M.create(w);session=M.draft(session,'quote-line',{description:'Unfinished actual scope',edition_id:'Q5'});session=M.checkpoint(session,x,'Retain complete previous cohort');const reopened=M.validate(JSON.parse(JSON.stringify(session)));check('Complete session keeps unfinished scope and prior source',reopened.drafts['quote-line'].description==='Unfinished actual scope'&&reopened.history.length>0);\n check('Declared decimal tie rounding is exact',Q.money(Q.round(require('../rational.cjs').dec('1.005'),'half_up'))==='1.01'&&Q.money(Q.round(require('../rational.cjs').dec('1.005'),'half_even'))==='1.00');\n return{checks,study:w,result:r,session};\n}\nmodule.exports={make,run,edit,add,put,result};\n"},{"path":"examples/complete.study.json","content":"{\n  \"schema\": \"quote.source-study/v1\",\n  \"id\": \"study-authored-field-quotes\",\n  \"config\": {\n    \"label\": \"Authored eight-visit field quote course\",\n    \"data_class\": \"authored_course\",\n    \"source_scope\": \"Authored eight visits and actual supplied fixture outputs\",\n    \"returned_scope\": \"Same complete fixture after source-backed corrections\",\n    \"authority_notes\": \"\",\n    \"quote\": (\"Provide the complete source document or all of its exported text parts\");\n  const received = documents.map(document => {\n    const text = document.replace(/^\\uFEFF/, \"\"), lines = text.split(/\\r?\\n/);\n    const starts = [], ends = [];\n    lines.forEach((line, index) => {\n      if (line.trim() === NATIVE_SOURCE_BEGIN) starts.push(index);\n      if (line.trim() === NATIVE_SOURCE_END) ends.push(index);\n    });\n    if (starts.length !== 1 || ends.length !== 1 || ends[0] \u003c= starts[0])\n      throw Error(\"Each source document must contain one complete source part\");\n    const headers = lines.slice(0, starts[0]);\n    const metadataRows = headers.filter(line => line.startsWith(\"SOURCE_TRANSPORT_METADATA=\"));\n    const partRows = headers.filter(line => line.startsWith(\"SOURCE_TRANSPORT_PART=\"));\n    if (metadataRows.length !== 1 || partRows.length > 1)\n      throw Error(\"Missing or duplicate native source transport metadata\");\n    const metadata = JSON.parse(metadataRows[0].slice(\"SOURCE_TRANSPORT_METADATA=\".length));\n    const part = partRows.length ? JSON.parse(partRows[0].slice(\"SOURCE_TRANSPORT_PART=\".length)) : null;\n    const base64 = lines.slice(starts[0] + 1, ends[0]).join(\"\").replace(/\\s+/g, \"\");\n    if (part !== null) {\n      if (!part || !Number.isSafeInteger(part.part) || !Number.isSafeInteger(part.parts) ||\n          part.parts \u003c 1 || part.part \u003c 1 || part.part > part.parts)\n        throw Error(\"Invalid original source part identity\");\n      if (base64.length !== part.base64_chars ||\n          sha256Bytes(utf8Encode(base64)) !== part.base64_sha256)\n        throw Error(\"An exported source part differs from its original content\");\n    }\n    return {metadata, part, base64};\n  });\n  const metadata = received[0].metadata, identity = nativeCanonical(metadata);\n  if (received.some(row => nativeCanonical(row.metadata) !== identity))\n    throw Error(\"The exported source parts belong to different app
