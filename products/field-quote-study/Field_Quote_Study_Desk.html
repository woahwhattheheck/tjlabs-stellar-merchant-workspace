or('Choose a declared fieldquote collection');\n}\nexport function previewFieldQuoteStudy(core,workspace,kind,input={}){\n if(kind==='assessment')return core.analyze(workspace.study);\n if(kind==='command'){const next=applyDomain(workspace,input.operation).workspace;return {head:workspaceHead(next),result:core.analyze(next.study)};}\n throw Error('Choose a declared fieldquote preview');\n}\n"},{"path":"host/export-core.mjs","content":"// MIT. Complete sources, original files, compact history, pending forms and native request lineage.\nexport function buildFieldQuoteStudyExport(files,state,records=[],editions=[],{codec:C,core,originalSessions:M,sessions:S,buildDesk,zip}){\n const s=S.receive(JSON.stringify(state.carrier)),w=s.workspace,entries=[],names=new Set(),contentCache=new Map();let cacheBytes=0;\n const add=(name,value)=>{if(names.has(name))throw Error('Duplicate complete export path '+name);names.add(name);let prepared;\n  if(value instanceof Uint8Array)prepared={data:value,sha256:C.sha256Bytes(value)};\n  else {const text=typeof value==='string'?value:JSON.stringify(value,null,2)+'\\n';prepared=contentCache.get(text);if(!prepared){const data=C.utf8Encode(text);prepared={data,sha256:C.sha256Bytes(data)};const cost=text.length*2+data.length;if(cost\u003c=16*1024*1024){while(contentCache.size&&(cacheBytes+cost>16*1024*1024||contentCache.size>=4096)){const key=contentCache.keys().next().value;cacheBytes-=contentCache.get(key).cost;contentCache.delete(key);}contentCache.set(text,{...prepared,cost});cacheBytes+=cost;}}}\n  entries.push({name,data:prepared.data,sha256:prepared.sha256});};\n for(const [p,t]of Object.entries(files))add('source/'+p,t);\n add('working/Field_Quote_Study_Working.json',state.carrier);add('working/Managed_Edition.json',state);add('working/Field_Quote_Study_Original_Session.json',w);add('working/Field_Quote_Study_Editable.html',buildDesk(files,{carrier:state.carrier}));\n const original=(prefix,items)=>{for(const e of items)add(prefix+e.path,e.content===undefined?Uint8Array.from(e.bytes):e.content);};\n original('current/',M.exports(w));add('working/emergency.json',{schema:'quote.source-emergency/v1',session:w,pending_forms:s.emergency.drafts,pending_imports:s.emergency.imports,reason:s.emergency.reason});add('working/retained-emergencies.json',s.retainedEmergency);\n const studies=new Map(),historyRoots=new Set(),addHistory=(session,h)=>{if(historyRoots.has(h.study_ref))return;const study=M.historyStudy(session,h);historyRoots.add(h.study_ref);studies.set(core.hash(study),study);};studies.set(core.hash(w.study),w.study);for(const h of w.history)addHistory(w,h);\n for(const b of w.backups){const branch=M.branchSession(w,b);add('working/prior/'+b.hash+'.json',branch);studies.set(core.hash(branch.study),branch.study);for(const h of branch.history)addHistory(branch,h);}\n for(const [hash,study]of studies)original('editions/'+hash+'/',core.exports(study));\n for(const e of s.retainedEmergency)original('emergency-editions/'+e.sha256+'/',M.exports(e.session));\n add('managed/RETAINED_HISTORY_INDEX.json',{schema:'stellar-forge.fieldquote-retained-history.v1',currentStateSha256:state.sha256,requests:records.map(r=>({sha256:r.id,requestId:r.value.request?.id,selection:state.receipts?.some(x=>x.recordSha256===r.id)?'COMMITTED':state.rejections?.some(x=>x.recordSha256===r.id)?'REJECTED_NOT_COMMITTED':'UNSELECTED_PREPARED_RECORD'})),editions:editions.map(r=>({sha256:r.id,sequence:r.value.sequence,selection:r.id===state.sha256?'CURRENT_EDITION':'RETAINED_EDITION'}))});\n for(const r of records)add('managed/requests/'+r.id+'.json',r.value);for(const e of editions)add('managed/editions/'+e.id+'.json',e.value);\n add('EXPORT_MANIFEST.json',{schema:'stellar-forge.fieldquote-export.v1',installationId:state.installationId,editionSha256:state.sha256,sessionSha256:state.carrier.sha256,sequence:state.sequence,files:entries.map(e=>({path:e.name,bytes:e.data.length,sha256:e.sha256}))});\n return zip.packStoredZip(entries,{timestamp:'2026-10-15T00:00:00Z',maxBytes:256*1024*1024,maxEntries:10000});\n}\n"},{"path":"host/export.mjs","content":"// MIT. Read exact complete installed source before constructing a retained handover.\nimport {readFile,lstat} from 'node:fs/promises';\nimport {join} from 'node:path';\nimport {fileURLToPath} from 'node:url';\nimport {codec,core,originalSessions,sessions} from '../runtime.mjs';\nimport {buildFieldQuoteStudyDesk} from '../src/build-installed.mjs';\nimport {buildFieldQuoteStudyExport} from './export-core.mjs';\nimport zip from '../src/connected_zip.cjs';\nconst root=fileURLToPath(new URL('../',import.meta.url));\nexport async function moduleSources(){\n const raw=await readFile(join(root,'source-manifest.json'),'utf8'),manifest=JSON.parse(raw),files={};\n for(const e of manifest.files){\n  if(typeof e.path!=='string'||e.path.startsWith('/')||e.path.split('/').some(x=>!x||x==='.'||x==='..')||e.path.includes('\\\\'))throw Error('Unsafe source path');\n  let path=root;for(const part of e.path.split('/')){path=join(path,part);if((await lstat(path)).isSymbolicLink())throw Error('Source link is not an original file');}\n  const b=await readFile(path);if(b.length!==e.bytes||codec.sha256Bytes(b)!==e.sha256)throw Error('Complete application source differs: '+e.path);\n  const t=codec.utf8Decode(b);if(codec.toBase64(codec.utf8Encode(t))!==codec.toBase64(b))throw Error('Source is not exact UTF-8');files[e.path]=t;\n }files['source-manifest.json']=raw;return files;\n}\nexport function buildExport(files,state,records=[],editions=[]){\n return buildFieldQuoteStudyExport(files,state,records,editions,{codec,core,originalSessions,sessions,buildDesk:buildFieldQuoteStudyDesk,zip});\n}\n"},{"path":"host/io.mjs","content":"// MIT. Owner-private, complete original file storage.\nimport {open,lstat,realpath,mkdir,rename,link,unlink} from 'node:fs/promises';\nimport {constants} from 'node:fs';\nimport {resolve,join,dirname,isAbsolute} from 'node:path';\nimport {randomUUID,createHash} from 'node:crypto';\nexport const MAX_BYTES=256*1024*1024;\nexport const sha=b=>createHash('sha256').update(b).digest('hex');\nexport const json=v=>JSON.stringify(v,null,2)+'\\n';\nexport function need(value,code,message,status=400){if(!value)throw Object.assign(new Error(message),{code,status});}\nexport function absolute(p){need(typeof p==='string'&&isAbsolute(p)&&!p.includes('\\0'),'FIELDQUOTE_PATH','Select an absolute host-owned path.');return resolve(p);}\nexport async function privateDirectory(p,{create=false}={}){\n p=absolute(p);if(create)try{await mkdir(p,{mode:0o700});}catch(e){if(e.code!=='EEXIST')throw e;}\n const s=await lstat(p);need(s.isDirectory()&&!s.isSymbolicLink()&&!(s.mode&0o077)&&s.uid===process.getuid(),'FIELDQUOTE_DIRECTORY','Use an owner-private directory.');\n need(await realpath(p)===p,'FIELDQUOTE_DIRECTORY','Select the physical directory path.');\n return {path:p,dev:String(s.dev),ino:String(s.ino)};\n}\nexport async function readBytes(p,max=MAX_BYTES){\n p=absolute(p);const f=await open(p,constants.O_RDONLY|constants.O_NOFOLLOW);\n try{const s=await f.stat();need(s.isFile()&&s.size\u003c=max&&s.uid===process.getuid()&&!(s.mode&0o077),'FIELDQUOTE_FILE','Use a complete owner-private regular file within the size limit.');\n const b=await f.readFile();const end=await f.stat();need(b.length===s.size&&s.size===end.size&&s.mtimeMs===end.mtimeMs&&s.ctimeMs===end.ctimeMs,'FIELDQUOTE_FILE_CHANGED','The original file changed while reading.',409);\n return {path:p,bytes:b,sha256:sha(b)};}finally{await f.close();}\n}\nexport function decode(b){return new TextDecoder('utf-8',{fatal:true,ignoreBOM:true}).decode(b);}\nexport async function readJSON(p,max){const r=await readBytes(p,max);return {...r,value:JSON.parse(decode(r.bytes))};}\nasync function syncDir(dir){const f=await open(dir,'r');try{await f.sync();}finally{await f.close();}}\nexport async function writeBytes(p,bytes,{replace=false}={}){\n p=absolute(p);bytes=Buffer.from(bytes);need(bytes.length\u003c=MAX_BYTES,'FIELDQUOTE_FILE_SIZE','Complete file exceeds the 256 MiB storage limit.');\n const dir=dirname(p);await privateDirectory(dir);const temp=join(dir,'.fieldquote-pending-'+randomUUID());let fd;\n try{fd=await open(temp,'wx',0o600);await fd.writeFile(bytes);await fd.sync();await fd.close();fd=null;\n if(replace){try{await readBytes(p);}catch(e){if(e.code!=='ENOENT')throw e;}await rename(temp,p);}\n else{try{await link(temp,p);}catch(e){if(e.code!=='EEXIST')throw e;const prior=await readBytes(p);need(prior.bytes.equals(bytes),'FIELDQUOTE_OUTPUT_CONFLICT','A different complete output already exists.',409);}await unlink(temp);}\n await syncDir(dir);return {path:p,sha256:sha(bytes),bytes:bytes.length};\n }finally{await fd?.close();try{await unlink(temp);}catch(e){if(e.code!=='ENOENT')throw e;}}\n}\nexport async function writeJSON(p,v,options){return writeBytes(p,Buffer.from(json(v),'utf8'),options);}\n"},{"path":"host/model.cjs","content":"// MIT. Whole editable-session transactions. Storage is injected by the sole private writer.\nfunction createManagedModel({sessions:S,applyDomain,codec:C}){\n const copy=x=>JSON.parse(JSON.stringify(x)),hash=x=>C.hashText(JSON.stringify(x));\n const need=(v,code,message,status=409)=>{if(!v)throw Object.assign(Error(message),{code,status});};\n const text=(v,n)=>typeof v===\"string\"&&v.length>0&&v.length\u003c=n;\n const receive=c=>S.receive(JSON.stringify(c));\n function initial(installationId,carrier){\n  need(text(installationId,120),\"FIELDQUOTE_ID\",\"Choose the installation identity.\");carrier=S.pack(receive(carrier));\n  return {schema:\"stellar-forge.fieldquote-state.v1\",installationId,sequence:0,carrier:copy(carrier),receipts:[],rejections:[]};\n }\n function validate(state){\n  need(state?.schema===\"stellar-forge.fieldquote-state.v1\"&&text(state.installationId,120)&&Number.isSafeInteger(state.sequence)&&state.sequence>=0&&Array.isArray(state.receipts)&&Array.isArray(state.rejections),\"FIELDQUOTE_STATE\",\"Select the complete managed session.\");\n  receive(state.carrier);const ids=new Set();\n  for(const row of [...state.receipts,...state.rejections]){need(text(row.id,120)&&/^[a-f0-9]{64}$/.test(row.requestSha256)&&/^[a-f0-9]{64}$/.test(row.recordSha256)&&!ids.has(row.id),\"FIELDQUOTE_HISTORY\",\"Original request history differs.\");ids.add(row.id);}\n  return state;\n }\n function view(state){validate(state);return {schema:\"stellar-forge.fieldquote-view.v1\",installationId:state.installationId,sequence:state.sequence,sha256:hash(state),carrier:copy(state.carrier),receipts:copy(state.receipts),rejections:copy(state.rejections)};}\n function request(r,state){\n  need(r?.schema===\"stellar-forge.fieldquote-request.v1\"&&r.installationId===state.installationId&&text(r.id,120)&&text(r.actor,240)&&text(r.at,40)&&Number.isFinite(Date.parse(r.at))&&/^[a-f0-9]{64}$/.test(r.baseSha256||\"\")&&[\"save\",\"action\"].includes(r.kind),\"FIELDQUOTE_REQUEST\",\"Retain the installation, original request ID, base SHA, actor, time and full successor.\",400);\n  const allowed=[\"schema\",\"installationId\",\"id\",\"baseSha256\",\"actor\",\"at\",\"kind\",r.kind===\"save\"?\"carrier\":\"operation\"];\n  need(Object.keys(r).every(k=>allowed.includes(k))&&allowed.every(k=>Object.hasOwn(r,k)),\"FIELDQUOTE_REQUEST\",\"Use the complete declared request fields.\",400);return hash(r);\n }\n function prior(state,r){const requestSha256=request(r,state),entry=[...state.receipts,...state.rejections].find(x=>x.id===r.id);\n  if(entry)need(entry.requestSha256===requestSha256,\"FIELDQUOTE_REQUEST_CHANGED\",\"This request ID already names different original content.\");return {requestSha256,entry};\n }\n function plan(state,r){\n  validate(state);const found=prior(state,r);if(found.entry)return {existing:found.entry};\n  need(hash(state)===r.baseSha256,\"FIELDQUOTE_BASE_CHANGED\",\"The selected saved edition changed. Retain this request, refresh and deliberately select the next edition.\");\n  let session;\n  if(r.kind===\"save\")session=receive(r.carrier);\n  else{\n   session=receive(state.carrier);const op=r.operation;\n   need(op?.id===r.id&&op?.actor===r.actor&&op?.at===r.at&&/^[a-f0-9]{64}$/.test(op.expectedHead||''),\"FIELDQUOTE_OPERATION\",\"Domain operation must retain the request actor, time and expected workspace head.\",400);\n   const result=applyDomain(session.workspace,op);session=S.advance(session,result.workspace,op);\n  }\n  const next=copy(state);next.sequence++;next.carrier=S.pack(session);\n  const record={schema:\"stellar-forge.fieldquote-prepared-result.v1\",request:copy(r),requestSha256:found.requestSha256,sequence:next.sequence,beforeSha256:hash(state),afterCarrierSha256:next.carrier.sha256,outcome:\"PREPARED_SUCCESSOR\"};\n  const recordSha256=hash(record);next.receipts.push({id:r.id,requestSha256:found.requestSha256,recordSha256});\n  return {record,recordSha256,next};\n }\n function reject(state,r,error){\n  const found=prior(state,r);need(!found.entry,\"FIELDQUOTE_EXISTING\",\"Reconcile the original outcome first.\");\n  const record={schema:\"stellar-forge.fieldquote-prepared-rejection.v1\",request:copy(r),requestSha256:found.requestSha256,outcome:\"PREPARED_REJECTION\",error:{code:error.code||\"FIELDQUOTE_INVALID_SUCCESSOR\",message:error.message}};\n  const recordSha256=hash(record),next=copy(state);next.rejections.push({id:r.id,requestSha256:found.requestSha256,recordSha256});return {record,recordSha256,next};\n }\n function record(state,r,retained){const p=prior(state,r);need(p.entry&&hash(retained)===p.entry.recordSha256&&retained.requestSha256===p.requestSha256&&JSON.stringify(retained.request)===JSON.stringify(r),\"FIELDQUOTE_RECEIPT\",\"The retained original outcome differs.\");const committed=state.receipts.some(x=>x.id===r.id);need(retained.outcome===(committed?\"PREPARED_SUCCESSOR\":\"PREPARED_REJECTION\"),\"FIELDQUOTE_RECEIPT\",\"The selected result kind differs.\");return {outcome:committed?\"COMMITTED\":\"REJECTED_NOT_COMMITTED\",record:copy(retained),state:view(state),reused:true};}\n return {initial,validate,view,request,prior,plan,reject,record,hash,copy,need};\n}\nmodule.exports={createManagedModel};\n"},{"path":"host/server.mjs","content":"// MIT. Authenticated loopback listener owns the complete private session writer.\nimport http from 'node:http';\nimport {randomUUID,randomBytes,timingSafeEqual} from 'node:crypto';\nimport {unlink} from 'node:fs/promises';\nimport {join} from 'node:path';\nimport {openStore} from './store.mjs';\nimport {writeJSON,readJSON,readBytes,privateDirectory,json,need,MAX_BYTES,decode} from './io.mjs';\nimport {moduleSources,buildExport} from './export.mjs';\nimport {buildFieldQuoteStudyDesk} from '../src/build-installed.mjs';\nimport {codec} from '../runtime.mjs';\nexport const CONNECTION='fieldquote.connection.json',CONNECTION_SCHEMA='stellar-forge.fieldquote-connection.v1',STARTUP_SCHEMA='stellar-forge.fieldquote-startup.v1';\nasync function body(req){const chunks=[];let bytes=0;for await(const b of req){bytes+=b.length;need(bytes\u003c=MAX_BYTES,'FIELDQUOTE_SIZE','Complete request exceeds 256 MiB.',413);chunks.push(b);}return JSON.parse(decode(Buffer.concat(chunks)));}\nfunction send(res,status,value,type='application/json;charset=utf-8'){const b=Buffer.from(type.startsWith('application/json')?json(value):value);res.writeHead(status,{'content-type':type,'content-length':b.length,'cache-control':'no-store','x-content-type-options':'nosniff','referrer-policy':'no-referrer'});res.end(b);}\nexport async function startServer({directory,installationId,port=0}){\n need(Number.isInteger(port)&&port>=0&&port\u003c=65535,'FIELDQUOTE_PORT','Select a port from 0 to 65535.');\n const store=await openStore(directory),instanceId=randomUUID(),token=randomBytes(32).toString('hex'),pending=new Set();let server,connection,origin,closing=false,closePromise,selectedPort=port;\n try{\n  need(!installationId||installationId===store.id,'FIELDQUOTE_INSTALLATION_CHANGED','The selected installation differs.',409);const files=await moduleSources();\n  if(port===0){let prior;try{prior=(await readJSON(join(directory,'fieldquote.listener.json'),32768)).value;}catch(e){if(e.code!=='ENOENT')throw e;}\n   if(prior){need(prior.schema==='stellar-forge.fieldquote-listener.v1'&&prior.installationId===store.id&&Number.isInteger(prior.port)&&prior.port>0&&prior.port\u003c=65535,'FIELDQUOTE_LISTENER','Original listener selection differs.',409);selectedPort=prior.port;}}\n  const handler=async(req,res)=>{\n   need(!closing,'FIELDQUOTE_CLOSING','The application is closing.',503);need(req.headers.host===new URL(origin).host,'FIELDQUOTE_HOST','Use the actual loopback origin.',403);const u=new URL(req.url,origin);\n   if(req.method==='GET'&&u.pathname==='/')return send(res,200,buildFieldQuoteStudyDesk(files,{managed:{installationId:store.id,instanceId}}),'text/html;charset=utf-8');\n   const bearer=req.headers.authorization?.replace(/^Bearer /,'')||'';\n   need(/^[a-f0-9]{64}$/.test(bearer)&&timingSafeEqual(Buffer.from(bearer),Buffer.from(token)),'FIELDQUOTE_AUTH','Open the current private application connection.',401);\n   need(req.headers['x-fieldquote-instance']===instanceId,'FIELDQUOTE_INSTANCE_CHANGED','Reconnect the current application instance.',409);\n   need(!req.headers.origin||req.headers.origin===origin,'FIELDQUOTE_ORIGIN','Use the same application origin.',403);\n   if(req.method==='GET'&&u.pathname==='/api/status')return send(res,200,{schema:CONNECTION_SCHEMA,instanceId,...await store.summary()});\n   if(req.method==='GET'&&u.pathname==='/api/state')return send(res,200,await store.state());\n   if(req.method==='POST'&&u.pathname==='/api/request')return send(res,200,await store.apply(await body(req)));\n   if(req.method==='POST'&&u.pathname==='/api/request-status')return send(res,200,await store.requestStatus(await body(req)));\n   if(req.method==='POST'&&u.pathname==='/api/export'){const r=await body(req);return send(res,200,await store.export(r.expectedSha256,(state,records,editions)=>buildExport(files,state,records,editions)));}\n   if(req.method==='GET'&&u.pathname==='/api/file'){\n    const id=u.searchParams.get('id'),offset=Number(u.searchParams.get('offset')||0),limit=Number(u.searchParams.get('limit')||196608);need(/^[a-f0-9]{64}$/.test(id||'')&&Number.isSafeInteger(offset)&&offset>=0&&Number.isInteger(limit)&&limit>0&&limit\u003c=196608,'FIELDQUOTE_FILE','Choose a retained file and byte range.');\n    const identity=await privateDirectory(directory);need(identity.dev===store.identity.dev&&identity.ino===store.identity.ino,'FIELDQUOTE_DIRECTORY_CHANGED','The original export directory changed.',409);\n    const r=await readBytes(join(directory,'exports',id+'.zip'));need(r.sha256===id&&offset\u003c=r.bytes.length,'FIELDQUOTE_FILE_CHANGED','Retained export or range differs.',409);\n    const end=Math.min(r.bytes.length,offset+limit);return send(res,200,{fileId:id,sha256:id,bytes:r.bytes.length,offset,nextOffset:end\u003cr.bytes.length?end:null,contentBase64:r.bytes.subarray(offset,end).toString('base64')});\n   }\n   return send(res,404,{error:{code:'FIELDQUOTE_ROUTE',message:'Unknown managed operation.'}});\n  };\n  server=http.createServer((req,res)=>{const p=handler(req,res).catch(e=>{if(!res.headersSent)send(res,e.status||500,{error:{code:e.code||'FIELDQUOTE_FAILED',message:e.message}});else res.destroy();});pending.add(p);p.finally(()=>pending.delete(p));});server.requestTimeout=121000;server.headersTimeout=15000;\n  await new Promise((resolve,reject)=>{server.once('error',reject);server.listen(selectedPort,'127.0.0.1',()=>{server.off('error',reject);resolve();});});origin='http://127.0.0.1:'+server.address().port;\n  await writeJSON(join(directory,'fieldquote.listener.json'),{schema:'stellar-forge.fieldquote-listener.v1',installationId:store.id,port:server.address().port},{replace:true});\n  const value={schema:CONNECTION_SCHEMA,directory,directoryIdentity:store.identity,installationId:store.id,instanceId,pid:process.pid,origin,url:origin+'/#token='+token,token};const saved=await writeJSON(join(directory,CONNECTION),value,{replace:true});connection={...saved,value};\n  const close=()=>closePromise||(closePromise=(async()=>{closing=true;let failure;try{const c=await readJSON(connection.path,32768);if(c.sha256===connection.sha256)await unlink(connection.path);}catch(e){if(e.code!=='ENOENT')failure=e;}try{await new Promise((resolve,reject)=>{server.close(e=>e?reject(e):resolve());server.closeIdleConnections();});await Promise.allSettled([...pending]);}catch(e){failure??=e;}try{await store.close();}catch(e){failure??=e;}if(failure)throw failure;})());\n  return {directory,installationId:store.id,instanceId,origin,url:value.url,connection,close};\n }catch(e){if(e.code==='EADDRINUSE'&&port===0)e.message='Original listener port is occupied. Preserve complete recovery JSON before deliberately choosing a new port. '+e.message;if(server?.listening)await new Promise(r=>server.close(r));await store.close();throw e;}\n}\nexport function startup(s){return {schema:STARTUP_SCHEMA,status:'FIELDQUOTE_READY',directory:s.directory,installationId:s.installationId,instanceId:s.instanceId,pid:process.pid,origin:s.origin,url:s.url,connectionFile:s.connection.path,connectionSha256:s.connection.sha256};}\n"},{"path":"host/store.mjs","content":"// MIT. One physical private writer; exact requests and immutable editions precede the atomic current pointer.\nimport {join,dirname} from 'node:path';\nimport {randomUUID} from 'node:crypto';\nimport {readdir} from 'node:fs/promises';\nimport {acquirePrivateDirectoryWriter} from '../../../stellar/scf-starforge-20261009/sf30-seller-sdk/operations/history.mjs';\nimport {privateDirectory,readJSON,writeJSON,writeBytes,need} from './io.mjs';\nimport {sessions,applyDomain,codec,core,workspaceHead} from '../runtime.mjs';\nimport modelModule from './model.cjs';\nexport const model=modelModule.createManagedModel({sessions,applyDomain,codec});\nexport async function initializeStore(directory,carrier,installationId=randomUUID()){\n await privateDirectory(dirname(directory));const identity=await privateDirectory(directory,{create:true}),lease=await acquirePrivateDirectoryWriter(directory);\n try{\n  let prior;try{prior=(await readJSON(join(directory,'state.json'))).value;}catch(e){if(e.code!=='ENOENT')throw e;}\n  need(!prior,'FIELDQUOTE_EXISTS','Receive into an unused private directory; adopt through the existing writer to retain history.',409);\n  const state=model.initial(installationId,carrier);\n  for(const sub of ['editions','requests','exports'])await privateDirectory(join(directory,sub),{create:true});\n  await writeJSON(join(directory,'editions',model.hash(state)+'.json'),state);\n  await writeJSON(join(directory,'state.json'),state);return model.view(state);\n }finally{await lease.release();}\n}\nexport async function openStore(directory){\n const identity=await privateDirectory(directory),lease=await acquirePrivateDirectoryWriter(directory);let current,tail=Promise.resolve(),closing=false,closed;\n const sameDirectory=async()=>{const next=await privateDirectory(directory);need(next.dev===identity.dev&&next.ino===identity.ino,'FIELDQUOTE_DIRECTORY_CHANGED','The physical original managed directory moved or was replaced.',409);};\n const reload=async()=>{await sameDirectory();const next=model.validate((await readJSON(join(directory,'state.json'))).value);need(!current||next.installationId===current.installationId,'FIELDQUOTE_INSTALLATION_CHANGED','The managed installation identity changed.',409);current=next;return next;};\n try{await reload();for(const sub of ['editions','requests','exports'])await privateDirectory(join(directory,sub));}catch(e){await lease.release();throw e;}\n const queue=fn=>{need(!closing,'FIELDQUOTE_CLOSING','The original writer is closing.',409);const p=tail.then(fn);tail=p.catch(()=>{});return p;};\n const readRecord=async row=>{await sameDirectory();return (await readJSON(join(directory,'requests',row.recordSha256+'.json'))).value;};\n const commit=async planned=>{\n  await sameDirectory();await writeJSON(join(directory,'requests',planned.recordSha256+'.json'),planned.record);\n  await sameDirectory();await writeJSON(join(directory,'editions',model.hash(planned.next)+'.json'),planned.next);\n  await sameDirectory();await writeJSON(join(directory,'state.json'),planned.next,{replace:true});current=planned.next;\n };\n return {directory,identity,id:current.installationId,\n  state:()=>queue(async()=>model.view(await reload())),\n  summary:()=>queue(async()=>{const s=await reload(),w=s.carrier.session.workspace;return {installationId:s.installationId,sha256:model.hash(s),sequence:s.sequence,label:w.study.config.label,head:workspaceHead(w),originals:w.study.originals.length,extracts:w.study.extracts.length,documents:w.study.documents.length,reviews:w.study.reviews.length,requests:s.receipts.length,rejectedRequests:s.rejections.length,backups:w.backups.length};}),\n  requestStatus:r=>queue(async()=>{const state=await reload(),p=model.prior(state,r);return p.entry?model.record(state,r,await readRecord(p.entry)):{outcome:'UNRECORDED',state:model.view(state),requestSha256:p.requestSha256};}),\n  apply:r=>queue(async()=>{\n   const state=await reload(),p=model.prior(state,r);\n   if(p.entry)return model.record(state,r,await readRecord(p.entry));\n   let planned;\n   // Only pure validation has definitely made no managed commit. I/O failures stay ambiguous.\n   try{planned=model.plan(state,r);}catch(e){planned=model.reject(state,r,e);await commit(planned);return {...model.record(current,r,planned.record),reused:false};}\n   await commit(planned);return {...model.record(current,r,planned.record),reused:false};\n  }),\n  retainedRecord:id=>queue(async()=>{const state=await reload(),row=[...state.receipts,...state.rejections].find(r=>r.id===id);need(row,'FIELDQUOTE_REQUEST','Choose an original request.',404);return readRecord(row);}),\n  export: (expectedSha256,build)=>queue(async()=>{const state=await reload();need(model.hash(state)===expectedSha256,'FIELDQUOTE_BASE_CHANGED','Select the exact saved edition to export.',409);const records=[],editions=[];for(const sub of ['requests','editions'])for(const name of (await readdir(join(directory,sub))).sort()){need(/^[a-f0-9]{64}\\.json$/.test(name),'FIELDQUOTE_HISTORY','Unexpected retained history file.');await sameDirectory();const value=(await readJSON(join(directory,sub,name))).value;need(model.hash(value)===name.slice(0,-5),'FIELDQUOTE_HISTORY','Retained complete history changed.',409);(sub==='requests'?records:editions).push({id:name.slice(0,-5),value});}const bytes=await build(model.view(state),records,editions);await sameDirectory();const id=codec.sha256Bytes(bytes);await writeBytes(join(directory,'exports',id+'.zip'),bytes);return {fileId:id,sha256:id,bytes:bytes.length,installationId:state.installationId,editionSha256:expectedSha256,sequence:state.sequence};}),\n  close:()=>closed||(closing=true,closed=(async()=>{await tail;await lease.release();})())\n };\n}\n"},{"path":"installed-cli.mjs","content":"#!/usr/bin/env node\n// MIT. Source-owned native workspace entry and attachment to the Applications writer.\nimport {resolve,join} from 'node:path';\nimport {readFile} from 'node:fs/promises';\nimport {fileURLToPath} from 'node:url';\nimport {initializeStore,openStore} from './host/store.mjs';\nimport {sessions,core,originalSessions,codec} from './runtime.mjs';\nimport {readJSON,readBytes,writeJSON,writeBytes,absolute,json,need} from './host/io.mjs';\nimport {FieldQuoteStudyClient} from './host/client.mjs';\nimport {moduleSources,buildExport} from './host/export.mjs';\nimport {buildFieldQuoteStudyDesk} from './src/build-installed.mjs';\nconst help='Field Quote Study Desk workspace\\n init DIRECTORY LABEL\\n course DIRECTORY\\n receive DIRECTORY WORKING.json\\n inspect DIRECTORY\\n session DIRECTORY OUTPUT.json\\n request DIRECTORY ORIGINAL_REQUEST.json\\n request-status DIRECTORY ORIGINAL_REQUEST.json\\n ingest DIRECTORY INTAKE_META.json ORIGINAL_FILE ORIGINAL_REQUEST_OUTPUT.json\\n connected DIRECTORY ORIGINAL_REQUEST.json\\n connected-status DIRECTORY ORIGINAL_REQUEST.json\\n export DIRECTORY EXPECTED_EDITION_SHA OUTPUT.zip\\n desk DIRECTORY OUTPUT.html\\nClose Applications before standalone writer commands. Connected commands attach to its existing writer. All paths are absolute, physical and owner-private.\\n';\nexport async function main(argv=process.argv.slice(2)){\n const [command,raw,...args]=argv;if(!command||command==='--help'||command==='help'){process.stdout.write(help);return;}\n const directory=absolute(raw);let store,result;\n try{\n  if(command==='init'){need(args.length===1,'FIELDQUOTE_ARGS',help);result=await initializeStore(directory,sessions.pack(sessions.create(args[0])));}\n  else if(command==='course'){const s=sessions.fromSession(originalSessions.create(JSON.parse(await readFile(new URL('./examples/complete.study.json',import.meta.url),'utf8'))));s.draft.actor='Authored receiving operator';result=await initializeStore(directory,sessions.pack(s));}\n  else if(command==='receive'){const received=sessions.receive((await readFile(absolute(args[0]),'utf8')));result=await initializeStore(directory,sessions.pack(received));}\n  else if(command==='connected'||command==='connected-status'){const c=await FieldQuoteStudyClient.connect(directory);try{const r=(await readJSON(absolute(args[0]))).value;result=await(command==='connected'?c.apply(r):c.requestStatus(r));}finally{await c.close();}}\n  else{store=await openStore(directory);\n   if(command==='inspect')result=await store.summary();\n   else if(command==='request')result=await store.apply((await readJSON(absolute(args[0]))).value);\n   else if(command==='ingest'){\n    need(args.length===3,'FIELDQUOTE_ARGS',help);const r=(await readJSON(absolute(args[0]))).value,op=r.operation;\n    need(r.kind==='action'&&op&&['import','document'].includes(op.kind)&&op.payload?.originalSha256,'FIELDQUOTE_INTAKE','Choose an original action request with pinned file metadata.');\n    const original=await readBytes(absolute(args[1]));need(original.sha256===op.payload.originalSha256,'FIELDQUOTE_INPUT_CHANGED','Choose the exact declared original file.');delete op.payload.originalSha256;\n    if(op.kind==='document')op.payload.contentBase64=original.bytes.toString('base64');\n    else{const text=codec.utf8Decode(original.bytes);need(codec.toBase64(codec.utf8Encode(text))===codec.toBase64(original.bytes),'FIELDQUOTE_UTF8','Choose exact UTF-8 source bytes');op.payload.content=text;}\n    const retained=await writeJSON(absolute(args[2]),r);result={originalRequest:retained,outcome:await store.apply(r)};\n   }\n   else if(command==='request-status')result=await store.requestStatus((await readJSON(absolute(args[0]))).value);\n   else if(command==='session')result=await writeJSON(absolute(args[0]),(await store.state()).carrier);\n   else if(command==='desk'){const html=buildFieldQuoteStudyDesk(await moduleSources(),{carrier:(await store.state()).carrier});result=await writeBytes(absolute(args[0]),Buffer.from(html));}\n   else if(command==='export'){const files=await moduleSources();result=await store.export(args[0],(state,records,editions)=>buildExport(files,state,records,editions));await writeBytes(absolute(args[1]),await readFile(join(directory,'exports',result.fileId+'.zip')));}\n   else throw Error(help);\n  }\n  process.stdout.write(json(result));return result;\n }finally{await store?.close();}\n}\nif(process.argv[1]&&resolve(process.argv[1])===fileURLToPath(import.meta.url))main().catch(e=>{process.stderr.write(json({error:{code:e.code||'FIELDQUOTE_FAILED',message:e.message}}));process.exitCode=1;});\n"},{"path":"managed.mjs","content":"#!/usr/bin/env node\n// MIT. Applications owns the original Field Quote Study Desk listener and its writer lifetime.\nimport {resolve} from 'node:path';\nimport {fileURLToPath} from 'node:url';\nimport {absolute,need} from './host/io.mjs';\nimport {startServer,startup} from './host/server.mjs';\nimport {join} from 'node:path';\nimport {readJSON} from './host/io.mjs';\nimport {initializeStore} from './host/store.mjs';\nimport {sessions} from './runtime.mjs';\nexport function managedOptions(argv){\n const v={};for(let i=0;i\u003cargv.length;i+=2){need(['--workspace','--installation-id','--port','--new-label'].includes(argv[i])&&!Object.hasOwn(v,argv[i])&&typeof argv[i+1]==='string','FIELDQUOTE_ARGS','Use each documented option once.');v[argv[i]]=argv[i+1];}\n need(/^\\d+$/.test(v['--port']??'0')&&Number(v['--port']??0)\u003c=65535,'FIELDQUOTE_PORT','Choose port 0–65535.');\n need(v['--new-label']===undefined||v['--new-label'].trim()===v['--new-label']&&v['--new-label'].length>0&&v['--new-label'].length\u003c=240,'FIELDQUOTE_LABEL','Choose a readable new-workspace label.');\n return {newLabel:v['--new-label'],directory:absolute(v['--workspace']),installationId:v['--installation-id'],port:Number(v['--port']??0)};\n}\nexport async function main(argv=process.argv.slice(2)){\n if(!argv.length||argv.includes('--help')){process.stdout.write('Field Quote Study Desk managed application\\nfieldquote-managed --workspace /physical/private/fieldquote [--new-label \"Project label\"] [--port 0]\\nUse --new-label to create an unused workspace; existing saved sessions resume. Receive a portable working file with fieldquote-workspace receive.\\n');return;}\n const options=managedOptions(argv);\n if(options.newLabel){let existing;try{existing=(await readJSON(join(options.directory,'state.json'))).value;}catch(e){if(e.code!=='ENOENT')throw e;}if(!existing)await initializeStore(options.directory,sessions.pack(sessions.create(options.newLabel)),options.installationId);}\n const service=await startServer(options);let stop;\n try{process.stdout.write(JSON.stringify(startup(service))+'\\n');\n await new Promise((resolve,reject)=>{let closing=false;stop=async()=>{if(closing)return;closing=true;try{await service.close();resolve();}catch(e){reject(e);}};process.once('SIGINT',stop);process.once('SIGTERM',stop);});\n }finally{if(stop){process.off('SIGINT',stop);process.off('SIGTERM',stop);}await service.close();}\n}\nif(process.argv[1]&&resolve(process.argv[1])===fileURLToPath(import.meta.url))main().catch(e=>{process.stderr.write(JSON.stringify({error:{code:e.code||'FIELDQUOTE_FAILED',message:e.message}})+'\\n');process.exitCode=1;});\n"},{"path":"mcp.mjs","content":"// MIT. All mutations attach to the existing managed writer; declared original input bytes remain exact.\nimport {join,dirname,resolve,basename} from 'node:path';\nimport {privateDirectory,readJSON,readBytes,decode,need} from './host/io.mjs';\nimport {FieldQuoteStudyClient} from './host/client.mjs';\nimport {core,sessions,workspaceHead} from './runtime.mjs';\nimport {previewFieldQuoteStudy,inspectFieldQuoteStudy} from './host/domain.mjs';\nimport {model} from './host/store.mjs';\nimport {fieldquoteTools} from './tools.mjs';\nconst alias=v=>{need(typeof v==='string'&&/^[a-z0-9][a-z0-9_-]{0,63}$/.test(v),'FIELDQUOTE_ALIAS','Choose a declared host alias.');return v;};\nconst definitions=new Map(fieldquoteTools((name,description,properties,required)=>({name,properties,required})).map(x=>[x.name,x]));\nexport async function readFieldQuoteStudyConfiguration(path){\n const file=await readJSON(path,1024*1024),value=file.value;need(value.schema==='stellar-forge.fieldquote-host.v1'&&value.workspaces&&Object.keys(value.workspaces).length>0&&Object.keys(value.workspaces).length\u003c=32,'FIELDQUOTE_CONFIG','Declare 1–32 original managed workspaces.');\n const workspaces=Object.create(null),seen=new Set();\n for(const [key,input]of Object.entries(value.workspaces)){\n  alias(key);const directoryIdentity=await privateDirectory(resolve(dirname(path),input.directory)),directory=directoryIdentity.path;\n  need(!seen.has(directory),'FIELDQUOTE_ALIAS','Declare one alias per original directory.');seen.add(directory);\n  const state=model.validate((await readJSON(join(directory,'state.json'))).value);\n  need(!input.installationId||input.installationId===state.installationId,'FIELDQUOTE_INSTALLATION_CHANGED','Configured installation differs.',409);\n  const inputs=Object.create(null);\n  for(const [name,declared]of Object.entries(input.inputs||{})){alias(name);need(/^[a-f0-9]{64}$/.test(declared.sha256||''),'FIELDQUOTE_INPUT','Declare complete input hash.');const r=await readBytes(resolve(dirname(path),declared.file));need(r.sha256===declared.sha256,'FIELDQUOTE_INPUT_CHANGED','Declared input differs.',409);inputs[name]={file:r.path,filename:basename(r.path),bytes:r.bytes.length,sha256:r.sha256};}\n  workspaces[key]={label:input.label||key,directory,directoryIdentity,installationId:state.installationId,inputs};\n }return {path,sha256:file.sha256,workspaces};\n}\nexport class MerchantFieldQuoteStudy{\n constructor(config){this.config=config;this.clients=new Map();this.tail=Promise.resolve();this.closing=false;}\n get summary(){return {configured:!!this.config.fieldquote,connected:[...this.clients.keys()],closing:this.closing};}\n async dispatch(name,args){\n  const definition=definitions.get(name);need(definition&&args&&Object.keys(args).every(k=>Object.hasOwn(definition.properties,k))&&definition.required.every(k=>Object.hasOwn(args,k)),'FIELDQUOTE_TOOL','Use the declared tool fields.');\n  const all=this.config.fieldquote?.workspaces||{};\n  if(name==='merchant_fieldquote_status'&&!args.workspace)return {...this.summary,workspaces:Object.entries(all).map(([workspace,s])=>({workspace,label:s.label,installationId:s.installationId,inputs:Object.entries(s.inputs).map(([sourceInput,x])=>({sourceInput,filename:x.filename,bytes:x.bytes,sha256:x.sha256}))}))};\n  const scope=all[alias(args.workspace)];need(scope,'FIELDQUOTE_WORKSPACE','Choose a declared original workspace.',404);let c=this.clients.get(args.workspace);\n  if(name==='merchant_fieldquote_connect'){const next=await FieldQuoteStudyClient.connect(scope.directory,{installationId:scope.installationId,instanceId:args.instanceId,directoryIdentity:scope.directoryIdentity});await c?.close();this.clients.set(args.workspace,next);return {...next.identity,status:await next.status()};}\n  if(name==='merchant_fieldquote_disconnect'){await c?.close();this.clients.delete(args.workspace);return {workspace:args.workspace,state:'DISCONNECTED'};}\n  if(name==='merchant_fieldquote_file'){\n   const actual=await privateDirectory(scope.directory);need(actual.dev===scope.directoryIdentity.dev&&actual.ino===scope.directoryIdentity.ino,'FIELDQUOTE_DIRECTORY_CHANGED','The original export directory was replaced.',409);\n   const offset=args.offset??0,limit=args.limit??196608;need(/^[a-f0-9]{64}$/.test(args.fileId||'')&&Number.isSafeInteger(offset)&&offset>=0&&Number.isInteger(limit)&&limit>0&&limit\u003c=196608,'FIELDQUOTE_FILE','Select a retained export and byte range.');\n   const r=await readBytes(join(scope.directory,'exports',args.fileId+'.zip'));need(r.sha256===args.fileId&&offset\u003c=r.bytes.length,'FIELDQUOTE_FILE_CHANGED','Retained original or byte range differs.',409);\n   const end=Math.min(r.bytes.length,offset+limit);return {fileId:args.fileId,sha256:r.sha256,bytes:r.bytes.length,offset,nextOffset:end\u003cr.bytes.length?end:null,contentBase64:r.bytes.subarray(offset,end).toString('base64')};\n  }\n  if(name==='merchant_fieldquote_status'&&!c)return {workspace:args.workspace,state:'DISCONNECTED'};need(c,'FIELDQUOTE_DISCONNECTED','Connect the existing Applications workspace.',409);\n  if(name==='merchant_fieldquote_status')return c.status();\n  if(name==='merchant_fieldquote_browser')return c.browser();\n  if(name==='merchant_fieldquote_export')return c.export(args.expectedSha256);\n  if(['merchant_fieldquote_action','merchant_fieldquote_ingest','merchant_fieldquote_receive'].includes(name)){\n   let operation=args.operation,request;\n   if(name==='merchant_fieldquote_ingest'){\n    const selected=scope.inputs[alias(args.sourceInput)];need(selected&&selected.sha256===args.expectedSourceSha256,'FIELDQUOTE_INPUT','Select a declared complete original hash.',409);\n    const original=await readBytes(selected.file);need(original.sha256===selected.sha256&&original.bytes.length===selected.bytes,'FIELDQUOTE_INPUT_CHANGED','The original changed.',409);let kind,payload;\n    if(args.kind==='csv'){need(core.KINDS.includes(args.recordKind)&&['source','returned'].includes(args.side)&&args.mapping&&typeof args.availableAt==='string','FIELDQUOTE_CSV','Declare record kind, side, explicit column mapping and actual edition availability.');kind='import';payload={kind:args.recordKind,side:args.side,name:selected.filename,content:decode(original.bytes),mapping:args.mapping,label:args.label||selected.filename,at:args.request.at,available_at:args.availableAt};}\n    else if(args.kind==='document'){need(typeof args.availableAt==='string','FIELDQUOTE_DOCUMENT','Declare actual original document availability.');kind='document';payload={name:selected.filename,media_type:args.mediaType||'application/octet-stream',contentBase64:original.bytes.toString('base64'),available_at:args.availableAt,at:args.request.at,notes:args.notes||''};}\n    else throw Error('Choose a declared CSV or original document input');\n    operation={id:args.request.id,kind,actor:args.request.actor,at:args.request.at,expectedHead:args.expectedHead,payload};\n   }else if(name==='merchant_fieldquote_receive'){\n    const selected=scope.inputs[alias(args.sourceInput)];need(selected&&selected.sha256===args.expectedSourceSha256,'FIELDQUOTE_INPUT','Select a declared complete input hash.',409);\n    const original=await readBytes(selected.file);need(original.sha256===selected.sha256&&original.bytes.length===selected.bytes,'FIELDQUOTE_INPUT_CHANGED','The complete original changed.',409);\n    if(args.kind==='request')request=JSON.parse(decode(original.bytes));\n    else{need(args.request,'FIELDQUOTE_REQUEST','Retain the original save request fields.');const received=sessions.receive(decode(original.bytes));received.draft.actor=args.request.actor;request={schema:'stellar-forge.fieldquote-request.v1',installationId:scope.installationId,...args.request,kind:'save',carrier:sessions.pack(received)};}\n   }\n   request??={schema:'stellar-forge.fieldquote-request.v1',installationId:scope.installationId,...args.request,kind:'action',operation};\n   const r=await(args.recoverOnly?c.requestStatus(request):c.apply(request));return {outcome:r.outcome,reused:r.reused,requestSha256:r.record?.requestSha256||r.requestSha256,sequence:r.state.sequence,sha256:r.state.sha256,sessionSha256:r.state.carrier.sha256,error:r.record?.error};\n  }\n  const state=await c.state();need(state.sha256===args.expectedSha256,'FIELDQUOTE_BASE_CHANGED','Select the current saved edition before reading or previewing.',409);const w=state.carrier.session.workspace;\n  if(name==='merchant_fieldquote_preview')return {editionSha256:state.sha256,head:workspaceHead(w),result:previewFieldQuoteStudy(core,w,args.kind,args.input)};\n  if(name==='merchant_fieldquote_inspect')return inspectFieldQuoteStudy(core,state,args);\n  throw Error('Unknown fieldquote operation');\n }\n call(name,args={}){need(!this.closing,'FIELDQUOTE_CLOSING','This attachment is closing.',409);const p=this.tail.then(()=>this.dispatch(name,args));this.tail=p.catch(()=>{});return p;}\n close(){if(this.closed)return this.closed;this.closing=true;return this.closed=(async()=>{await this.tail;await Promise.all([...this.clients.values()].map(c=>c.close()));this.clients.clear();})();}\n}\n"},{"path":"merchant-provider.mjs","content":"// MIT. Source-owned Merchant customer-agent lifecycle.\nimport {defineMerchantProvider,MERCHANT_PROVIDER_SCHEMA} from '../../stellar-forge/mcp-merchant-operator/provider-contract.mjs';\nimport {fieldquoteTools} from './tools.mjs';\nexport default defineMerchantProvider({schema:MERCHANT_PROVIDER_SCHEMA,id:'field-quote-study',family:'fieldquote',title:'Field Quote Study Desk',order:1290,catalogOrder:1290,configKey:'fieldquote',summary:true,dependencies:[],\n configuration:{input:'fieldquoteConnection',privateExports:true,read:async(value,{hostPath})=>(await import('./mcp.mjs')).readFieldQuoteStudyConfiguration(hostPath(value))},\n tools:fieldquoteTools,load:()=>import('./mcp.mjs'),create:(m,c)=>new m.MerchantFieldQuoteStudy(c),initialize:async o=>(await import('./setup.mjs')).initializeMerchant(o),maxRequestBytes:2*1024*1024,\n instructions:[{prefix:'merchant_fieldquote_',order:1290,text:\"Connect the original Applications-owned private field quote study installation. Pin saved state SHA and complete session head. Import all eighteen supplied source/returned families with explicit mappings and actual availability. Preserve consecutive visit eligibility and retain failed, abstained, unfinished and withdrawn work. Keep local capture distinct from exact stage/recipient evidence receipt and later server availability. Evaluate the actual supplied quote edition with exact payload identity, input use, line arithmetic, price release, company policy and effective authority. Preserve earliest actual delivery even when a later correction is better; distinguish publication, sending, delivery, approval and customer response. An approval binds the exact edition and payload and cannot authorize a different version. Page full visit outcomes, quote edition traces, actual delivery/customer events, contributing raw rows and source availability. Retain all recurring effort phases, unmatched work and explicit denominator limitations. Named source reviews bind the complete study digest. Preserve originals, pending forms, full branches, emergency inputs and original requests. Exact retries recover prior outcomes while keeping later edits. Retrieve every complete source-export byte range. Disconnect leaves Applications running; Stop drains the writer.\"}]});\n"},{"path":"native/quote-desk.cjs","content":"#!/usr/bin/env node\n'use strict';\nconst fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto');\nconst Core=require('../core.cjs'),M=require('../session.cjs'),ZIP=require('../zip.cjs'),CSV=require('../csv.cjs'),Quote=require('../quote.cjs');\nconst root=path.resolve(__dirname,'..'),args=process.argv.slice(2),command=args.shift(),opts={};\nwhile(args.length){const k=args.shift();if(!k.startsWith('--')||!args.length)throw Error('Use --key value options');opts[k.slice(2)]=args.shift();}\nconst required=k=>{if(!opts[k])throw Error('Missing --'+k);return opts[k];};\nconst read=p=>new TextDecoder('utf-8',{fatal:true,ignoreBOM:true}).decode(fs.readFileSync(p));\nconst parseText=text=>JSON.parse(text.charCodeAt(0)===0xfeff?text.slice(1):text),parse=p=>parseText(read(p));\nfunction load(){const x=parse(required('in'));return x.schema===M.SCHEMA?M.validate(x):M.create(Core.validate(x));}\nfunction write(p,data){const dest=path.resolve(p);fs.mkdirSync(path.dirname(dest),{recursive:true});const b=Buffer.from(data);if(fs.existsSync(dest)){if(fs.readFileSync(dest).equals(b))return;throw Error('Refusing to replace an existing different file: '+dest);}const tmp=dest+'.partial-'+crypto.randomUUID();fs.writeFileSync(tmp,b,{flag:'wx'});try{fs.linkSync(tmp,dest);}finally{fs.unlinkSync(tmp);}}\nfunction save(s){M.validate(s);write(required('out'),Core.json(s));process.stdout.write(Core.json({session_id:s.id,revision:s.revision,study_id:s.study.id,sha256:M.hash(s),output:path.resolve(opts.out)}));}\nfunction sourceFiles(){const manifestText=read(path.join(root,'SOURCE_MANIFEST.json')),manifest=parseText(manifestText);return manifest.files.map(x=>{const p=path.resolve(root,x.path);if(!p.startsWith(root+path.sep))throw Error('Unsafe source path');const content=read(p),sha=crypto.createHash('sha256').update(content).digest('hex');if(sha!==x.sha256)throw Error('Source changed: '+x.path);return{path:x.path,content};}).concat([{path:'SOURCE_MANIFEST.json',content:manifestText}]);}\ntry{\n if(command==='new')save(M.create(Core.empty(opts.label||'New field quote study')));\n else if(command==='course'){const kind=required('kind');if(kind!=='complete')throw Error('Choose complete');save(M.create(parse(path.join(root,'examples',kind+'.study.json'))));}\n else if(command==='inspect'){const s=load();process.stdout.write(Core.json({session_id:s.id,revision:s.revision,unfinished_forms:Object.keys(s.drafts),retained_branches:s.backups.length,comparison:Core.analyze(s.study)}));}\n else if(command==='set-config'){const s=load(),st=Core.clone(s.study),key=required('field');if(!['label','data_class','source_scope','returned_scope','authority_notes'].includes(key))throw Error('Unknown editable configuration field');st.config[key]=required('value');save(M.checkpoint(s,st,'CLI scope '+key));}\n else if(command==='import-csv'){const s=load(),p=required('file'),kind=required('kind'),side=required('side'),content=read(p),mapping=opts.mapping?parse(opts.mapping):Object.fromEntries((Core.FIELDS[kind]||[]).map(k=>[k,Core.inspectCSV(content).header.includes(k)?k:'']));save(M.checkpoint(s,Core.importExtract(s.study,{kind,side,name:path.basename(p),content,mapping,label:opts.label||path.basename(p),at:opts.at||new Date().toISOString(),available_at:required('available-at')}),'CLI original CSV and mapping'));}\n else if(command==='select'){const s=load();save(M.checkpoint(s,Core.choose(s.study,required('kind'),required('side'),required('extract')),'CLI selected extract'));}\n else if(command==='crosswalk'){const s=load(),t=CSV.table(read(required('file')));for(const k of ['source_id','target_id'])if(!t.header.includes(k))throw Error('Crosswalk CSV requires '+k);const si=t.header.indexOf('source_id'),ti=t.header.indexOf('target_id');save(M.checkpoint(s,Core.crosswalk(s.study,required('kind'),t.rows.map(r=>({source_id:r.values[si],target_id:r.values[ti]}))),'CLI explicit identity map'));}\n else if(command==='match-ids'){const s=load();save(M.checkpoint(s,Core.matchIds(s.study,required('kind')),'CLI add unique exact-ID maps'));}\n else if(command==='add-document'){const s=load(),p=required('file');save(M.checkpoint(s,Core.addDocument(s.study,{name:path.basename(p),media_type:opts.type||'application/octet-stream',bytes:new Uint8Array(fs.readFileSync(p)),at:opts.at||new Date().toISOString(),notes:opts.notes||'',available_at:opts['available-at']||opts.at||new Date().toISOString()}),'CLI retain exact document'));}\n else if(command==='link-document'){const s=load();save(M.checkpoint(s,Core.linkDocument(s.study,{side:required('side'),kind:required('kind'),record_id:required('record'),document_id:required('document'),notes:opts.notes||'',available_at:required('available-at')}),'CLI record-document identity'));}\n else if(command==='document-availability'){const s=load(),d=s.study.documents.find(x=>x.id===required('document'));if(!d)throw Error('Document not found');save(M.checkpoint(s,Core.documentAvailability(s.study,{study_id:s.study.id,document_id:d.id,expected_sha256:required('digest'),expected_metadata_sha256:required('metadata-digest'),available_at:required('available-at'),reason:required('reason'),at:opts.at||new Date().toISOString()}),'CLI document source availability'));}\n else if(command==='unlink-document'){const s=load();save(M.checkpoint(s,Core.unlinkDocument(s.study,{side:required('side'),kind:required('kind'),record_id:required('record'),document_id:required('document')}),'CLI remove exact record-document link'));}\n\n else if(command==='quote-plan'){const s=load(),st=Core.clone(s.study),value=parse(required('file'));for(const key of Object.keys(value))if(!Object.hasOwn(st.config.quote,key))throw Error('Unknown or non-plan field '+key);Object.assign(st.config.quote,value);save(M.checkpoint(s,Core.validate(st),'CLI known-at population and evaluation plan'));}\n else if(command==='record'){const s=load(),value=parse(required('file'));save(M.checkpoint(s,Core.editRow(s.study,{...value,at:opts.at||new Date().toISOString(),reason:required('reason')}),'CLI dated record correction'));}\n else if(command==='review'){const s=load();save(M.recordReview(s,{study_sha256:required('digest'),role:required('role'),reviewer:required('reviewer'),at:opts.at||new Date().toISOString(),decision:required('decision'),notes:opts.notes||''}));}\n else if(command==='import-session'){const s=load(),x=parse(required('file'));save(x.schema===M.SCHEMA?M.takeSession(s,M.validate(x),'CLI complete session replacement'):M.use(s,Core.validate(x),'CLI study replacement'));}\n else if(command==='restore-edition'){const s=load(),h=s.history[Number(required('index'))];if(!h)throw Error('Unknown study edition');save(M.use(s,M.historyStudy(s,h),'CLI restore prior study'));}\n else if(command==='open-branch'){const s=load(),b=s.backups.find(x=>x.hash===required('hash'));if(!b)throw Error('Unknown retained branch');save(M.takeSession(s,M.branchSession(s,b),'CLI open prior complete branch'));}\n else if(command==='export'){const s=load(),files=M.exports(s);write(required('out'),ZIP.write(files));process.stdout.write(Core.json({output:path.resolve(opts.out),files:files.map(x=>x.path),comparison:Core.analyze(s.study).comparison_state}));}\n else if(command==='export-directory'){const s=load(),dest=path.resolve(required('out'));if(fs.existsSync(dest))throw Error('Choose a new export directory');fs.mkdirSync(dest,{recursive:true});for(const x of M.exports(s))write(path.join(dest,x.path),x.bytes===undefined?x.content:new Uint8Array(x.bytes));process.stdout.write(dest+'\\n');}\n else if(command==='build-html'){write(required('out'),require('../operator/render-desk.cjs').renderDesk(sourceFiles()));process.stdout.write(path.resolve(opts.out)+'\\n');}\n else if(command==='source-zip')write(required('out'),ZIP.write(sourceFiles()));\n else {process.stdout.write('Field Quote Study Desk — Node 18+\\nCommands: new, course, inspect, set-config, import-csv, select, crosswalk, match-ids, add-document, link-document, unlink-document, review, import-session, restore-edition, open-branch, export, export-directory, build-html, source-zip, quote-plan, document-availability, record. See NATIVE.md.\\n');if(command)process.exitCode=2;}\n}catch(e){process.stderr.write(e.message+'\\n');process.exitCode=1;}\n"},{"path":"native/receive-installed.mjs","content":"#!/usr/bin/env node\n// MIT. Actual private filesystem, listener, complete domain action and original request receiving.\nimport assert from 'node:assert/strict';\nimport {mkdtemp,readFile,rm} from 'node:fs/promises';\nimport {tmpdir} from 'node:os';\nimport {join} from 'node:path';\nimport {core,originalSessions,sessions,codec,workspaceHead} from '../runtime.mjs';\nimport {initializeStore,openStore} from '../host/store.mjs';\nimport {startServer} from '../host/server.mjs';\nimport {FieldQuoteStudyClient} from '../host/client.mjs';\nconst directory=await mkdtemp(join(tmpdir(),'fieldquote-installed-'));let service,client,success=false;\ntry{\n const session=sessions.fromSession(originalSessions.create(JSON.parse(await readFile(new URL('../examples/complete.study.json',import.meta.url),'utf8'))));session.draft.actor='Authored receiving operator';\n const initial=await initializeStore(join(directory,'workspace'),sessions.pack(session),'authored-native-fieldquote');\n service=await startServer({directory:join(directory,'workspace')});client=await FieldQuoteStudyClient.connect(service.directory);\n assert.equal((await client.status()).installationId,initial.installationId);await assert.rejects(openStore(service.directory));\n const next=sessions.clone(session);next.workspace=originalSessions.draft(next.workspace,'intake:quote_lines:returned',{content:'id,serial\\n\"unfinished',mapping:{id:'id'}});next.emergency.drafts.review={notes:'Retain this complete emergency-only review'};\n const request={schema:'stellar-forge.fieldquote-request.v1',installationId:initial.installationId,id:'native-editor-save',baseSha256:initial.sha256,actor:session.draft.actor,at:'2026-10-15T05:35:00Z',kind:'save',carrier:sessions.pack(next)};\n const saved=await client.apply(request);assert.equal(saved.outcome,'COMMITTED');\n const operation={id:'native-source-review',kind:'review',actor:session.draft.actor,at:'2026-10-15T05:36:00Z',expectedHead:workspaceHead(next.workspace),payload:{role:'operations',study_sha256:core.digest(next.workspace.study),reviewer:session.draft.actor,at:'2026-10-15T05:36:00Z',decision:'revise',notes:'Named exact-source review of authored returned differences'}};\n const action={schema:request.schema,installationId:initial.installationId,id:operation.id,baseSha256:saved.state.sha256,actor:session.draft.actor,at:operation.at,kind:'action',operation};\n const changed=await client.apply(action);assert.equal(changed.outcome,'COMMITTED');assert.equal(changed.state.carrier.session.workspace.drafts['intake:quote_lines:returned'].content,next.workspace.drafts['intake:quote_lines:returned'].content);assert.deepEqual(changed.state.carrier.session.emergency,next.emergency);\n const retry=await client.apply(request);assert.equal(retry.reused,true);assert.equal(retry.state.carrier.sha256,changed.state.carrier.sha256);\n const rejected=await client.apply({...request,id:'native-obsolete-save'});assert.equal(rejected.outcome,'REJECTED_NOT_COMMITTED');assert.equal(rejected.state.carrier.sha256,changed.state.carrier.sha256);\n const state=await client.state(),file=await client.export(state.sha256),parts=[];let offset=0;\n for(;;){const part=await client.file(file.fileId,offset);assert.equal(part.offset,offset);assert.equal(part.sha256,file.sha256);const b=Buffer.from(part.contentBase64,'base64');parts.push(b);offset+=b.length;if(part.nextOffset===null)break;assert.equal(part.nextOffset,offset);}\n const bytes=Buffer.concat(parts);assert.equal(bytes.length,file.bytes);assert.equal(codec.sha256Bytes(bytes),file.sha256);\n const origin=service.origin;await client.close();await service.close();service=null;service=await startServer({directory:join(directory,'workspace')});assert.equal(service.origin,origin);client=await FieldQuoteStudyClient.connect(service.directory);assert.equal((await client.requestStatus(request)).outcome,'COMMITTED');\n process.stdout.write(JSON.stringify({schema:'stellar-forge.fieldquote-native-receiving.v1',runtime:process.version,writer:'SINGLE_PRIVATE_WRITER',originalDraftRetained:true,requestRecovery:'ORIGINAL_COMMITTED_WITH_LATER_EDITION',reopenedListener:true,originals:(await client.state()).carrier.session.workspace.study.originals.length,export:{bytes:file.bytes,sha256:file.sha256}},null,2)+'\\n');success=true;\n}finally{await client?.close();await service?.close();if(success)await rm(directory,{recursive:true});else process.stderr.write('Complete original receiving files retained at '+directory+'\\n');}\n"},{"path":"operator/browser-course.cjs","content":"'use strict';\nmodule.exports=async function browserCourse(bundle){\nconst files=Object.fromEntries(bundle.map(x=>[x.path,x.content])),cache={};\nfunction req(p){if(cache[p])return cache[p];const m={exports:{}};const dir=p.split(\"/\").slice(0,-1);Function(\"module\",\"exports\",\"require\",files[p])(m,m.exports,n=>{const a=[];for(const v of [...dir,...n.split(\"/\")])if(v===\"..\")a.pop();else if(v&&v!==\".\")a.push(v);return req(a.join(\"/\"));});return cache[p]=m.exports;}\nconst Core=req(\"core.cjs\"),M=req(\"session.cjs\"),SHA=req(\"sha256.cjs\"),ZIP=req(\"zip.cjs\"),course=JSON.parse(files[\"examples/complete.study.json\"]),CSV=req(\"csv.cjs\");\nconst records=new Map(),shared={tail:Promise.resolve()},checks=[];\nfunction check(v,l){if(!v)throw Error(l);checks.push(l);}\nconst clone=x=>x===undefined?undefined:JSON.parse(JSON.stringify(x));\nfunction database(){return{objectStoreNames:{contains:()=>true},transaction(){let aborted=false;const tx={error:null,oncomplete:null,onerror:null,onabort:null,abort(){aborted=true;if(tx.onabort)tx.onabort();},objectStore(){return{get(key){const q={};shared.tail=shared.t n:\"new-record\"});check(a.window.QuoteDesk.getSession().drafts[\"record:companies:returned\"]?.kind===\"companies\",\"Restored stale record family and side normalize to the visible editor\");await a.click({view:\"crosswalks\"});await a.click({action:\"add-pair\"});check(a.window.QuoteDesk.getSession().drafts[\"crosswalk:companies\"]?.pairs.some(p=>p.source_id===\"\"&&p.target_id===\"\"),\"Restored stale map family uses the visible identity draft\");await a.click({view:\"intake\"});check(a.nodes.main.innerHTML.includes(\"data-file='csv:companies:source'\"),\"Restored stale intake selection uses the visible canonical family and source side\");\nawait a.click({action:\"course\",course:\"complete\"});let original=\"\\ufeff\"+files[\"examples/input/companies.csv\"].replace(/\\n/g,\"\\r\\n\");await a.loadFile(original,\"company-original.csv\",\"csv:companies:source\");s=a.window.QuoteDesk.getSession();check(s.drafts[\"intake:companies:source\"].content===original,\"CSV staging retains BOM and original CRLF\");\nform=a.formFor(\"intake:companies:source\",{},\"intake\",{label:\"Retained company source\",available_at:\"2026-10-08T12:00:00Z\"});a.handlers.input({target:form.fields[0]});a.handlers.submit({target:{closest:()=>form.form},preventDefault(){}});await a.settle();check(a.window.QuoteDesk.getSession().study.originals.some(x=>x.content===original),\"Applied mapping preserves exact original text\");\nawait a.click({action:\"new-review\"});s=a.window.QuoteDesk.getSession();form=a.formFor(\"review\",s.drafts.review,\"review\",{reviewer:\"Authored owner\",decision:\"accepted\",notes:\"Review notes prepared for exact source\"});a.handlers.input({target:form.fields[0]});await a.configLabel(\"Changed source scope\");a.handlers.submit({target:{closest:()=>form.form},preventDefault(){}});await a.settle();check(a.window.QuoteDesk.getSession().study.reviews.length===0,\"Changed study cannot accept a stale retained review\");\nconst other=await boot();await a.configLabel(\"Branch tudy\",\"Study scope\"],[\"intake\",\"CSV intake & mapping\"],[\"selection\",\"Selected editions\"],[\"records\",\"Observed records\"],[\"crosswalks\",\"Identity maps\"],[\"documents\",\"Supporting originals\"],[\"plan\",\"Visit & measurement plan\"],[\"timeline\",\"Quotes & delivery study\"],[\"compare\",\"Return comparison\"],[\"reviews\",\"Source & quote review\"],[\"recovery\",\"Save & recover\"]];\nfunction say(t){message=t;status();}\nfunction hasEmergency(){return Object.keys(emergency.drafts).length>0||emergency.imports.length>0;}\nfunction status(){if($(\"message\"))$(\"message\").textContent=message;if($(\"save-state\"))$(\"save-state\").textContent=busy?\"Working…\":hasEmergency()?\"Pending input is in memory — download emergency recovery\":conflict?\"Another saved branch exists — resolve in Save & recover\":storageError?\"Memory only: \"+storageError:dirty?\"Unsaved changes\":\"Saved in this browser\";if($(\"revision\"))$(\"revision\").textContent=session.study.id+\" · session revision \"+session.revision;}\nfunction freeze(v){busy=v;document.querySelectorAll(\"button,input,select,textarea\").forEach(e=>e.disabled=v);status();}\nfunction transaction(mode,fn){return new Promise((resolve,reject)=>{if(!db)return reject(Error(\"Browser storage unavailable\"));const tx=db.transaction(\"sessions\",mode),st=tx.objectStore(\"sessions\");let result;tx.oncomplete=()=>resolve(result);tx.onerror=()=>reject(tx.error||Error(\"Browser storage failed\"));tx.onabort=()=>reject(tx.error||Error(\"Browser save aborted\"));fn(st,x=>{result=x;},e=>{try{tx.abort();}catch{}reject(e);});});}\nfunction checkedSaved(v){if(!v)return null;if(M.hash(v.session)!==v.hash)throw Error(\"Saved session digest mismatch\");return {...v,session:M.normalize(v.session)};}\nfunction readActive(){return transaction(\"readonly\",(st,done,fail)=>{const q=st.get(\"active\");q.onsuccess=()=>{try{const v=checkedSaved(q.result);done(v||null);}catch(e){fail(e);}};});}\nfunction saveExact(snapshot,expected){return transaction(\"readwrite\",(st,done,fail)=>{const q=st.get(\"active\");q.onsuccess=()=>{try{const old=checkedSaved(q.result);if((old?.hash||null)!==expected){done({conflict:true,current:old||null});return;}const h=M.hash(snapshot);st.put({key:\"active\",hash:h,session:snapshot,updated_at:now()});done({hash:h});}catch(e){fail(e);}};});}\nfunction persist(){dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(()=>{saveTimer=null;enqueueSave();},150);status();}\nfunction enqueueSave(){queue=queue.then(async()=>{if(conflict)return;const snap=M.clone(session);try{const r=await saveExact(snap,seen);if(r.conflict){conflict=true;if(r.current)session=M.retain(session,r.current.session,\"Other tab's saved branch\");message=\"Your complete working copy and the competing saved copy are retained. Use Save & recover to select a branch.\";dirty=true;}else{seen=r.hash;storageError=\"\";dirty=hasEmergency()||M.hash(session)!==r.hash;}}catch(e){storageError=e.message;dirty=true;}status();});return queue;}\nasync function flush(){if(saveTimer){clearTimeout(saveTimer);saveTimer=null;enqueueSave();}await queue;}\nfunction download(name,data,type=\"application/json\"){const blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement(\"a\");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}\nfunction recoveryEnvelope(){return hasEmergency()?{schema:\"quote.source-emergency/v1\",session,pending_forms:emergency.drafts,pending_imports:emergency.imports,reason:emergency.reason}:session;}\nfunction exportSession(){download(hasEmergency()?\"quote-source-emergency-recovery.json\":\"quote-source-session.json\",Core.json(recoveryEnvelope()));say(hasEmergency()?\"Complete emergency recovery downloaded, including every pending form and import.\":\"Complete session downloaded, including every unfinished form and retained branch.\");}\nfunction draftValue(key,fallback){return emergency.drafts[key]??session.drafts[key]??fallback;}\nfunction recordDraft(key,value){dirty=true;try{session=M.draft(session,key,value);delete emergency.drafts[key];persist();}catch(e){emergency.drafts[key]=M.clone(value);emergency.reason=e.message;dirty=true;message=e.message+\" The full pending form remains in memory; use Save complete file.\";status();}}\nfunction retainImport(kind,name,text,error){const p={kind,name,text,error,at:now()},key=\"pending-import:\"+SHA.sha256Utf8(kind+\"\\0\"+name+\"\\0\"+text).sha256;try{session=M.draft(session,key,p);persist();}catch(e){if(!emergency.imports.some(x=>x.key===key))emergency.imports.push({key,...p});emergency.reason=e.message;dirty=true;}}\nfunction retainForm(key,reason){const prior=Object.hasOwn(emergency.drafts,key)?M.draft(session,key,emergency.drafts[key]):session;return M.retain(prior,prior,reason);}\nfunction optionsHtml(values,selected,labels={}){const multi=Array.isArray(selected),chosen=multi?selected:[String(selected??\"\")],all=[...values,...chosen.filter(x=>!values.includes(x))];return [...new Set(all)].map(x=>'\u003coption value=\"'+esc(x)+'\"'+(chosen.includes(x)?\" selected\":\"\")+'>'+esc((Object.hasOwn(labels,x)?labels[x]:undefined)??(values.includes(x)?String(x).replaceAll(\"_\",\" \"):\"[Unresolved] \"+x))+'\u003c/option>').join(\"\");}\nfunction control(path,label,value,{type=\"text\",options=null,nullable=false,list=null,help=\"\"}={}){\n const name=esc(path),v=value??\"\";let html;\n if(list){const chosen=Array.isArray(value)?value:[];html='\u003cselect multiple data-path=\"'+name+'\" data-array=\"1\">'+optionsHtml(list,chosen)+\"\u003c/select>\";}\n else if(options)html='\u003cselect data-path=\"'+name+'\">'+optionsHtml(options,v)+\"\u003c/select>\";\n else if(type===\"boolean\")html='\u003cselect data-path=\"'+name+'\" data-bool=\"1\">'+optionsHtml([\"true\",\"false\"],String(value))+\"\u003c/select>\";\n else if(type===\"decimal\")html='\u003cinput data-path=\"'+name+'\" value=\"'+esc(v)+'\" type=\"text\" inputmode=\"decimal\"'+(nullable?' data-null-text=\"1\"':\"\")+\">\";\n else if(type===\"textarea\")html='\u003ctextarea rows=\"4\" data-path=\"'+name+'\">'+esc(v)+'\u003c/textarea>';\n else html='\u003cinput data-path=\"'+name+'\" value=\"'+esc(v)+'\" type=\"'+(type===\"number\"?\"number\":\"text\")+'\"'+(type===\"number\"?' step=\"any\" data-number=\"1\"'+(nullable?' data-null=\"1\"':\"\"):\"\")+([\"at\",\"captured_at\",\"available_at\"].includes(path)?' placeholder=\"2026-10-15T00:00:00Z\"':\"\")+\">\";\n return '\u003clabel>'+esc(label)+html+(help?'\u003csmall>'+esc(help)+\"\u003c/small>\":\"\")+\"\u003c/label>\";\n}\nfunction at(obj,path){return path.split(\".\").reduce((o,k)=>o?.[k],obj);}\nfunction set(obj,path,value){const p=path.split(\".\");let x=obj;for(const k of p.slice(0,-1)){if(x[k]===undefined)x[k]={};x=x[k];}x[p.at(-1)]=value;}\nfunction collect(form,convert=false){const key=form.dataset.key,base=draftValue(key,JSON.parse(form.dataset.base)),obj=M.clone(base);for(const e of form.querySelectorAll(\"[data-path]\")){let v=e.multiple?Array.from(e.selectedOptions).map(o=>o.value):e.value;if(convert&&e.dataset.number){if(v===\"\"){if(e.dataset.null)v=null;else throw Error(e.dataset.path+\": enter a number\");}else{v=Number(v);if(!Number.isFinite(v))throw Error(e.dataset.path+\": enter a finite number\");}}if(e.dataset.bool)v=v===\"true\";if(e.dataset.nullText&&v===\"\")v=null;if(e.dataset.roles)v=String(v).split(\",\").map(s=>s.trim()).filter(Boolean);set(obj,e.dataset.path,v);}return obj;}\nfunction formOpen(key,base,kind=\"\",oldId=\"\"){return '\u003cform data-key=\"'+esc(key)+'\" data-kind=\"'+esc(kind)+'\" data-old=\"'+esc(oldId)+'\" data-base=\"'+esc(JSON.stringify(base))+'\">';}\nconst label=k=>k.replaceAll(\"_\",\" \").replace(/^./,c=>c.toUpperCase()),fmt=x=>x===null||x===undefined?\"Unobserved\":String(x);\nfunction table(headers,rows){return\"\u003cdiv class='table-wrap'>\u003ctable>\u003cthead>\u003ctr>\"+headers.map(x=>\"\u003cth>\"+esc(x)+\"\u003c/th>\").join(\"\")+\"\u003c/tr>\u003c/thead>\u003ctbody>\"+rows.map(r=>\"\u003ctr>\"+r.map(v=>\"\u003ctd>\"+esc(v)+\"\u003c/td>\").join(\"\")+\"\u003c/tr>\").join(\"\")+\"\u003c/tbody>\u003c/table>\u003c/div>\";}\nfunction studyView(){const base=Object.fromEntries(Object.entries(session.study.config).filter(([k])=>![\"selection\",\"quote\"].includes(k))),v=draftValue(\"config\",base);return\"\u003ch1>Field Quote Study Desk\u003c/h1>\u003cp>Follow actual field originals through supplied quote drafts, price rules, company decisions, approval and customer delivery. Keep local-device evidence availability separate from later server availability. Review the full visit population and every recurring work phase.\u003c/p>\"+formOpen(\"config\",base,\"config\")+\"\u003cdiv class='grid'>\"+control(\"label\",\"Study label\",v.label)+control(\"data_class\",\"Data class\",v.data_class,{options:[\"operational\",\"authored_course\"]})+control(\"source_scope\",\"Original field/source scope\",v.source_scope,{type:\"textarea\"})+control(\"returned_scope\",\"Returned supplied output and event scope\",v.returned_scope,{type:\"textarea\"})+control(\"authority_notes\",\"Company source owners and actual decision authority\",v.authority_notes,{type:\"textarea\"})+\"\u003c/div>\u003cbutton type='submit'>Save scope\u003c/button>\u003c/form>\u003ch2>Working notes\u003c/h2>\u003ctextarea id='study-notes' rows='5'>\"+esc(draftValue(\"study-notes\",{})?.text??session.study.notes)+\"\u003c/textarea>\u003cbutton data-action='save-notes'>Save notes\u003c/button>\u003ch2>Authored eight-visit course\u003c/h2>\u003cp>Eight eligible visits retain five actual deliveries, three before departure, and two that combine traceability, authority and timeliness. One device receipt precedes the server receipt; one revised quote retains only its predecessor's approval. Four paired visits have 160 existing versus 140 study person-minutes, while all observed study work is 170 minutes. These are authored method fixtures, not contractor or product outcomes.\u003c/p>\u003cbutton data-action='course' data-course='complete'>Open complete authored workflow\u003c/button>\";}\nfunction intakeView(){const kind=(Core.KINDS.includes(session.selection.intakeKind)?session.selection.intakeKind:Core.KINDS[0]),side=([\"source\",\"returned\"].includes(session.selection.intakeSide)?session.selection.intakeSide:\"source\"),key=\"intake:\"+kind+\":\"+side,v=draftValue(key,null);let h=\"\u003ch1>Original CSV and field mapping\u003c/h1>\u003cdiv class='actions'>\"+Core.KINDS.map(k=>\"\u003cbutton data-action='intake-kind' data-kind='\"+k+\"'\"+(k===kind?\" aria-current='true'\":\"\")+\">\"+esc(label(k))+\"\u003c/button>\").join(\"\")+\"\u003c/div>\u003cdiv class='actions'>\"+[\"source\",\"returned\"].map(x=>\"\u003cbutton data-action='intake-side' data-side='\"+x+\"'\"+(x===side?\" aria-current='true'\":\"\")+\">\"+(x===\"source\"?\"Original source\":\"Returned trial\")+\"\u003c/button>\").join(\"\")+\"\u003c/div>\u003cp>Retain the approved CSV extraction exactly. A blank mapping means the field was not observed; an empty cell in a mapped column is an observed blank. IDs are text, preserving leading zeros and punctuation. The current study retains every previously imported edition.\u003c/p>\u003cdiv class='actions'>\u003clabel class='file-label'>Choose \"+esc(kind)+\" CSV\u003cinput type='file' data-file='csv:\"+kind+\":\"+side+\"' accept='.csv,text/csv'>\u003c/label>\u003cbutton data-action='csv-template' data-kind='\"+kind+\"'>Download canonical header template\u003c/button>\u003c/div>\";\nif(!v)return h+\"\u003cp>No pending file for this table and side. You can switch sections without losing another table's pending file or mapping.\u003c/p>\";let t;try{t=Core.inspectCSV(v.content);}catch(e){return h+\"\u003cp class='notice'>\"+esc(e.message)+\"\u003c/p>\";}h+=\"\u003ch2>\"+esc(v.name)+\"\u003c/h2>\u003cp>\"+t.rows.length+\" parsed rows; exact original remains retained with this pending map
