)throw Error(\"Document missing\");download(d.name,Binary.decode(d.base64),d.media_type);}\n else if(act===\"reset-draft\"){let next=retainForm(el.dataset.key,\"Before resetting draft \"+el.dataset.key);delete next.drafts[el.dataset.key];next.revision++;replace(next,\"Form reset; previous form is in recovery.\",[el.dataset.key]);}\n else if(act===\"download-pending\"){const p=session.drafts[el.dataset.key];if(!p)throw Error(\"Import candidate not found\");download(p.name,p.base64?Binary.decode(p.base64):p.text,p.media_type||\"text/plain\");}\n else if(act===\"retry-pending\"){const p=session.drafts[el.dataset.key];if(!p)throw Error(\"Import candidate not found\");await openFile(new File([p.base64?Binary.decode(p.base64):p.text],p.name,{type:p.media_type||\"text/plain\"}),p.kind);}\n else if(act===\"save-notes\"){const st=M.clone(session.study);st.notes=draftValue(\"study-notes\",{})?.text??$(\"study-notes\").value;replace(M.checkpoint(session,st,\"Save study notes\"),\"Notes saved.\");}\n else if(act===\"download-original\"){const o=session.study.originals.find(x=>x.id===el.dataset.id);if(!o)throw Error(\"Original not found\");download(o.name,o.content,\"text/plain\");}\n else if(act===\"download-branch\"){const b=session.backups.find(b=>b.hash===el.dataset.id);if(!b)throw Error(\"Branch not found\");download(\"quote-source-branch-\"+b.hash.slice(0,12)+\".json\",Core.json(M.branchSession(session,b)));}\n else if(act===\"open-branch\"){const b=session.backups.find(b=>b.hash===el.dataset.id);if(!b)throw Error(\"Branch not found\");exportSession();replace(M.takeSession(session,M.branchSession(session,b),\"Before opening retained branch\"),\"Retained branch opened. If another saved copy exists, acknowledge it explicitly.\");}\n else if(act===\"restore-edition\"){const h=session.history[Number(el.dataset.index)];if(!h)throw Error(\"Edition not found\");exportSession();replace(M.use(session,M.historyStudy(session,h),\"Before restoring study edition\"),\"Study edition restored; complete prior session retained.\");}\n else if(act===\"adopt-local\")await adoptLocal();\n else if(act===\"open-saved\"){freeze(true);await flush();const old=await readActive();if(!old)throw Error(\"No saved copy exists\");exportSession();const next=M.takeSession(session,old.session,\"Local session before opening saved branch\");seen=old.hash;session=next;conflict=false;dirty=true;persist();message=\"Saved branch opened; local branch retained.\";freeze(false);render();}\n }catch(e){freeze(false);say(e.message);}}\ndocument.addEventListener(\"input\",e=>{if(busy)return;if(e.target.id===\"record-filter\"){const q=e.target.value.toLowerCase();document.querySelectorAll(\"[data-filter]\").forEach(x=>x.hidden=!x.dataset.filter.includes(q));return;}if(e.target.id===\"study-notes\"){recordDraft(\"study-notes\",{text:e.target.value});return;}const form=e.target.closest(\"form[data-key]\");if(form){recordDraft(form.dataset.key,collect(form));}});\ndocument.addEventListener(\"change\",e=>{if(e.target.dataset.file)openFile(e.target.files?.[0],e.target.dataset.file);else if(!busy&&e.target.dataset.selectionKind){try{const kind=e.target.dataset.selectionKind,side=e.target.dataset.selectionSide;replace(M.checkpoint(session,Core.choose(session.study,kind,side,e.target.value),\"Select \"+side+\" \"+kind),\"Selected exact retained edition.\");}catch(err){say(err.message);render();}}else if(!busy&&e.target.matches(\"select\")){const form=e.target.closest(\"form[data-key]\");if(form){recordDraft(form.dataset.key,collect(form));if(form.dataset.key===\"document-link\"&&[\"side\",\"kind\"].includes(e.target.dataset.path))render();}}});\ndocument.addEventListener(\"submit\",e=>{const form=e.target.closest(\"form[data-key]\");if(!form)return;e.preventDefault();if(busy)return;try{const value=collect(form,true),kind=form.dataset.kind;let next;\n if(kind===\"config\"){const st=M.clone(session.study);st.config={...st.config,...value};next=M.checkpoint(session,st,\"Save study scope\");}\n\n else if(kind===\"record\"){if(value.study_id!==session.study.id||value.expected_extract_id!==(Core.selected(session.study,value.kind,value.side)?.id||null))throw Error(\"Selected records changed after this draft began; retain it and prepare a fresh correction\");next=M.checkpoint(session,Core.editRow(session.study,value),\"Record source-backed \"+value.kind+\" revision\");}\n else if(kind===\"quote-plan\"){const st=M.clone(session.study);st.config.quote={...st.config.quote,...value};next=M.checkpoint(session,st,\"Revise complete visit population and measurement plan\");}\n\n else if(kind===\"review\")next=M.recordReview(session,value);\n else if(kind===\"intake\")next=M.checkpoint(session,Core.importExtract(session.study,value),\"Retain original and mapped extract \"+value.kind);\n else if(kind===\"crosswalk\")next=M.checkpoint(session,Core.crosswalk(session.study,value.kind,value.pairs),\"Apply explicit identity map \"+value.kind);\n else if(kind===\"document-availability\")next=M.checkpoint(session,Core.documentAvailability(session.study,value),\"Retain sourced document availability\");\n else if(kind===\"document-link\")next=M.checkpoint(session,Core.linkDocument(session.study,value),\"Link retained record document\");\n else throw Error(\"Unknown form\");\n next=M.retain(next,session,\"Complete form before saving \"+form.dataset.key);delete next.drafts[form.dataset.key];replace(next,\"Saved \"+kind+\". Comparison retains every unresolved field and source difference.\",[form.dataset.key]);\n }catch(err){say(err.message+\" — unfinished form retained.\");}});\ndocument.addEventListener(\"click\",e=>{const el=e.target.closest(\"button\");if(!el||busy)return;if(el.dataset.view){session.view=el.dataset.view;session.revision++;persist();render();}else if(el.dataset.action)action(el);});\nwindow.addEventListener(\"beforeunload\",e=>{if(dirty||busy||conflict||storageError||hasEmergency()){e.preventDefault();e.returnValue=\"\";}});\n// IndexedDB compare-and-swap on every commit is the saved-state authority.\n$(\"nav\").innerHTML=views.map(([v,label])=>'\u003cbutton data-view=\"'+v+'\">'+label+\"\u003c/button>\").join(\"\");\nrender();freeze(true);\n(async()=>{try{db=await new Promise((resolve,reject)=>{const q=indexedDB.open(\"quote-source-desk\",1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains(\"sessions\"))q.result.createObjectStore(\"sessions\",{keyPath:\"key\"});};q.onerror=()=>reject(q.error);q.onblocked=()=>reject(Error(\"Close another browser copy to upgrade storage\"));q.onsuccess=()=>resolve(q.result);});const old=await readActive();if(old){session=old.session;seen=old.hash;dirty=M.hash(session)!==seen;if(dirty)persist();message=\"Complete saved session reopened, including unfinished forms.\";}else{persist();}freeze(false);render();}catch(e){storageError=e.message;dirty=true;freeze(false);say(\"Browser storage unavailable. Download the complete session before leaving.\");}})();\nwindow.QuoteDesk={getSession:()=>M.clone(session),getRecovery:()=>M.clone(recoveryEnvelope()),exportFiles:()=>M.exports(session),flush,assessment:()=>M.assess(session)};\n})(window.QuoteCore,window.QuoteSession,window.StudySHA,window.QuoteZIP,window.QuoteCSV,window.QuoteBinary,window.QuoteDomain,window.QUOTE_COURSES,window.QUOTE_SOURCE_FILES);\n"},{"path":"operator/installed-desk.js","content":"(function deskMain(Core,M,SHA,ZIP,CSV,Binary,Quote,courses,sourceFiles){\n\"use strict\";\nconst S=window.FieldQuoteInstalledSessions,C=window.FieldQuoteCodec,installed=window.FIELDQUOTE_INSTALLATION;let installedMeta={actor:\"\",retainedEmergency:[]},managed=null;const localRecovery=createManagedRecoveryStore({C,A:createFieldQuoteStudyArchive(M,C),indexedDB}),localKey=\"standalone\";\n\nlet session=M.create(),seen=null,db=null,dirty=true,busy=false,conflict=false,storageError=\"\",saveTimer=null,queue=Promise.resolve(),message=\"Complete the study setup, or open the clearly labelled authored course.\",selectedFile=null,emergency={drafts:{},imports:[],reason:\"\"};\nfunction getInstalled(){return S.fromSession(session,emergency,installedMeta);}\nfunction emergencyCarrier(){return {schema:\"stellar-forge.fieldquote-emergency-carrier.v1\",session:M.clone(session),emergency:S.clone(emergency),metadata:S.clone(installedMeta)};}\nfunction setInstalled(value){const v=S.validate(S.clone(value));session=v.workspace;emergency=v.emergency;installedMeta={actor:v.draft.actor,retainedEmergency:v.retainedEmergency};if(document.getElementById(\"installed-actor\"))document.getElementById(\"installed-actor\").value=v.draft.actor;}\nfunction selectInstalled(next,nextEmergency=emergency,metadata=installedMeta){const v=S.fromSession(next,nextEmergency,metadata);setInstalled(v);return v;}\nsetInstalled(S.receive(installed.carrier));\nconst $=id=>document.getElementById(id),esc=x=>String(x??\"\").replace(/[&\u003c>\"']/g,c=>({\"&\":\"&amp;\",\"\u003c\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[c])),now=()=>new Date().toISOString();\nconst views=[[\"study\",\"Study scope\"],[\"intake\",\"CSV intake & mapping\"],[\"selection\",\"Selected editions\"],[\"records\",\"Observed records\"],[\"crosswalks\",\"Identity maps\"],[\"documents\",\"Supporting originals\"],[\"plan\",\"Visit & measurement plan\"],[\"timeline\",\"Quotes & delivery study\"],[\"compare\",\"Return comparison\"],[\"reviews\",\"Source & quote review\"],[\"recovery\",\"Save & recover\"]];\nfunction say(t){message=t;status();}\nfunction hasEmergency(){return Object.keys(emergency.drafts).length>0||emergency.imports.length>0;}\nfunction status(){if($(\"message\"))$(\"message\").textContent=message;if($(\"save-state\"))$(\"save-state\").textContent=busy?\"Working…\":hasEmergency()?\"Pending input is in memory — download emergency recovery\":conflict?\"Another saved branch exists — resolve in Save & recover\":storageError?\"Memory only: \"+storageError:dirty?\"Unsaved changes\":\"Saved in this browser\";if($(\"revision\"))$(\"revision\").textContent=session.study.id+\" · session revision \"+session.revision;}\nfunction freeze(v){busy=v;document.querySelectorAll(\"button,input,select,textarea\").forEach(e=>e.disabled=v);status();}\nfunction checkedSaved(value){if(!value)return null;const wrapped=S.receive(value.carrier);return {installed:wrapped,session:wrapped.workspace};}\nasync function readActive(){const r=await localRecovery.read(db,localKey);return r.value?{...checkedSaved(r.value),hash:r.sha256}:null;}\nasync function saveExact(snapshot,expected){const value={schema:\"stellar-forge.fieldquote-local.v1\",carrier:S.pack(snapshot)},r=await localRecovery.save(db,localKey,value,expected);return r.conflict?{conflict:true,current:await readActive()}:{hash:r.sha256,sessionSha256:value.carrier.sha256};}\nfunction persist(){dirty=true;if(managed){try{managed.persist();managed.status();}catch(e){storageError=e.message;message=e.message;}status();return;}clearTimeout(saveTimer);saveTimer=setTimeout(()=>{saveTimer=null;enqueueSave();},150);status();}\nfunction enqueueSave(){const save=async()=>{if(conflict)return;try{const snap=getInstalled();const r=await saveExact(snap,seen);if(r.conflict){conflict=true;if(r.current)setInstalled(S.replace(r.current.installed,snap,\"Retain competing saved browser session\"));message=\"Complete working copy and competing saved copy are retained. Select a branch in Save & recover.\";dirty=true;}else{seen=r.hash;storageError=\"\";dirty=S.pack(getInstalled()).sha256!==r.sessionSha256;}}catch(e){storageError=e.message;dirty=true;}status();};queue=queue.then(save,save);return queue;}\nasync function flush(){if(saveTimer){clearTimeout(saveTimer);saveTimer=null;enqueueSave();}await queue;}\nfunction download(name,data,type=\"application/json\"){const blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement(\"a\");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}\nfunction recoveryEnvelope(){return hasEmergency()?{schema:\"quote.source-emergency/v1\",session,pending_forms:emergency.drafts,pending_imports:emergency.imports,reason:emergency.reason}:session;}\nfunction exportSession(){download(hasEmergency()?\"Field_Quote_Study_Complete_Emergency.json\":\"fieldquote-source-session.json\",Core.json(hasEmergency()?emergencyCarrier():session));say(hasEmergency()?\"Complete emergency recovery downloaded, including every pending form and import.\":\"Complete session downloaded, including every unfinished form and retained branch.\");}\nfunction draftValue(key,fallback){return emergency.drafts[key]??session.drafts[key]??fallback;}\nfunction recordDraft(key,value){dirty=true;try{const nextEmergency=S.clone(emergency);delete nextEmergency.drafts[key];selectInstalled(M.draft(session,key,value),nextEmergency);persist();}catch(e){emergency.drafts[key]=M.clone(value);emergency.reason=e.message;dirty=true;message=e.message+\" The full pending form remains in memory; use Save complete file.\";status();}}\nfunction retainImport(kind,name,text,error){const p={kind,name,text,error,at:now()},key=\"pending-import:\"+SHA.sha256Utf8(kind+\"\\0\"+name+\"\\0\"+text).sha256;try{selectInstalled(M.draft(session,key,p));persist();}catch(e){if(!emergency.imports.some(x=>x.key===key))emergency.imports.push({key,...p});emergency.reason=e.message;dirty=true;}}\nfunction retainForm(key,reason){const prior=Object.hasOwn(emergency.drafts,key)?M.draft(session,key,emergency.drafts[key]):session;return M.retain(prior,prior,reason);}\nfunction optionsHtml(values,selected,labels={}){const multi=Array.isArray(selected),chosen=multi?selected:[String(selected??\"\")],all=[...values,...chosen.filter(x=>!values.includes(x))];return [...new Set(all)].map(x=>'\u003coption value=\"'+esc(x)+'\"'+(chosen.includes(x)?\" selected\":\"\")+'>'+esc((Object.hasOwn(labels,x)?labels[x]:undefined)??(values.includes(x)?String(x).replaceAll(\"_\",\" \"):\"[Unresolved] \"+x))+'\u003c/option>').join(\"\");}\nfunction control(path,label,value,{type=\"text\",options=null,nullable=false,list=null,help=\"\"}={}){\n const name=esc(path),v=value??\"\";let html;\n if(list){const chosen=Array.isArray(value)?value:[];html='\u003cselect multiple data-path=\"'+name+'\" data-array=\"1\">'+optionsHtml(list,chosen)+\"\u003c/select>\";}\n else if(options)html='\u003cselect data-path=\"'+name+'\">'+optionsHtml(options,v)+\"\u003c/select>\";\n else if(type===\"boolean\")html='\u003cselect data-path=\"'+name+'\" data-bool=\"1\">'+optionsHtml([\"true\",\"false\"],String(value))+\"\u003c/select>\";\n else if(type===\"decimal\")html='\u003cinput data-path=\"'+name+'\" value=\"'+esc(v)+'\" type=\"text\" inputmode=\"decimal\"'+(nullable?' data-null-text=\"1\"':\"\")+\">\";\n else if(type===\"textarea\")html='\u003ctextarea rows=\"4\" data-path=\"'+name+'\">'+esc(v)+'\u003c/textarea>';\n else html='\u003cinput data-path=\"'+name+'\" value=\"'+esc(v)+'\" type=\"'+(type===\"number\"?\"number\":\"text\")+'\"'+(type===\"number\"?' step=\"any\" data-number=\"1\"'+(nullable?' data-null=\"1\"':\"\"):\"\")+([\"at\",\"captured_at\",\"available_at\"].includes(path)?' placeholder=\"2026-10-15T00:00:00Z\"':\"\")+\">\";\n return '\u003clabel>'+esc(label)+html+(help?'\u003csmall>'+esc(help)+\"\u003c/small>\":\"\")+\"\u003c/label>\";\n}\nfunction at(obj,path){return path.split(\".\").reduce((o,k)=>o?.[k],obj);}\nfunction set(obj,path,value){const p=path.split(\".\");let x=obj;for(const k of p.slice(0,-1)){if(x[k]===undefined)x[k]={};x=x[k];}x[p.at(-1)]=value;}\nfunction collect(form,convert=false){const key=form.dataset.key,base=draftValue(key,JSON.parse(form.dataset.base)),obj=M.clone(base);for(const e of form.querySelectorAll(\"[data-path]\")){let v=e.multiple?Array.from(e.selectedOptions).map(o=>o.value):e.value;if(convert&&e.dataset.number){if(v===\"\"){if(e.dataset.null)v=null;else throw Error(e.dataset.path+\": enter a number\");}else{v=Number(v);if(!Number.isFinite(v))throw Error(e.dataset.path+\": enter a finite number\");}}if(e.dataset.bool)v=v===\"true\";if(e.dataset.nullText&&v===\"\")v=null;if(e.dataset.roles)v=String(v).split(\",\").map(s=>s.trim()).filter(Boolean);set(obj,e.dataset.path,v);}return obj;}\nfunction formOpen(key,base,kind=\"\",oldId=\"\"){return '\u003cform data-key=\"'+esc(key)+'\" data-kind=\"'+esc(kind)+'\" data-old=\"'+esc(oldId)+'\" data-base=\"'+esc(JSON.stringify(base))+'\">';}\nconst label=k=>k.replaceAll(\"_\",\" \").replace(/^./,c=>c.toUpperCase()),fmt=x=>x===null||x===undefined?\"Unobserved\":String(x);\nfunction table(headers,rows){return\"\u003cdiv class='table-wrap'>\u003ctable>\u003cthead>\u003ctr>\"+headers.map(x=>\"\u003cth>\"+esc(x)+\"\u003c/th>\").join(\"\")+\"\u003c/tr>\u003c/thead>\u003ctbody>\"+rows.map(r=>\"\u003ctr>\"+r.map(v=>\"\u003ctd>\"+esc(v)+\"\u003c/td>\").join(\"\")+\"\u003c/tr>\").join(\"\")+\"\u003c/tbody>\u003c/table>\u003c/div>\";}\nfunction studyView(){const base=Object.fromEntries(Object.entries(session.study.config).filter(([k])=>![\"selection\",\"quote\"].includes(k))),v=draftValue(\"config\",base);return\"\u003ch1>Field Quote Study Desk\u003c/h1>\u003cp>Follow actual field originals through supplied quote drafts, price rules, company decisions, approval and customer delivery. Keep local-device evidence availability separate from later server availability. Review the full visit population and every recurring work phase.\u003c/p>\"+formOpen(\"config\",base,\"config\")+\"\u003cdiv class='grid'>\"+control(\"label\",\"Study label\",v.label)+control(\"data_class\",\"Data class\",v.data_class,{options:[\"operational\",\"authored_course\"]})+control(\"source_scope\",\"Original field/source scope\",v.source_scope,{type:\"textarea\"})+control(\"returned_scope\",\"Returned supplied output and event scope\",v.returned_scope,{type:\"textarea\"})+control(\"authority_notes\",\"Company source owners and actual decision authority\",v.authority_notes,{type:\"textarea\"})+\"\u003c/div>\u003cbutton type='submit'>Save scope\u003c/bu / \"+x.id,x.source?x.source.name+\":\"+x.source.line_start:\"\",x.detail]))+\"\u003cbutton data-action='report'>Download complete readable report\u003c/button>\";}\nfunction emergencyView(){return !hasEmergency()?\"\":\"\u003csection class='notice'>\u003ch2>Pending input retained in memory\u003c/h2>\u003cp>\"+esc(emergency.reason)+\"\u003c/p>\u003cbutton data-action='download-session'>Download complete emergency recovery\u003c/button>\u003cbutton data-action='clear-emergency'>Download and clear pending input\u003c/button>\"+Object.entries(emergency.drafts).map(([k])=>\"\u003cp>Pending form: \"+esc(k)+\"\u003c/p>\").join(\"\")+emergency.imports.map(p=>\"\u003cp>\"+esc(p.name)+\" \u003cbutton data-action='download-emergency-import' data-key='\"+esc(p.key)+\"'>Download exact file\u003c/button>\u003c/p>\").join(\"\")+\"\u003c/section>\";}\n\nfunction recoveryView(){return emergencyView()+\"\u003ch1>Save & recover\u003c/h1>\u003cp>Download the complete session to move between browsers or keep an independent copy. It includes the study, all unfinished forms, review history, source originals and retained browser branches.\u003c/p>\u003cdiv class='actions'>\u003cbutton data-action='download-session'>Download complete session\u003c/button>\u003cbutton data-action='export-zip'>Download complete export ZIP\u003c/button>\u003cbutton data-action='export-source'>Download application source ZIP\u003c/button>\u003clabel class='file-label'>Open session or study JSON\u003cinput type='file' data-file='session' accept='.json,application/json'>\u003c/label>\u003c/div>\"+(conflict?\"\u003cdiv class='notice'>\u003ch2>Choose how to continue\u003c/h2>\u003cp>The saved copy changed in another tab. Both copies are retained. Selecting your browser branch acknowledges the current saved copy in one atomic transaction; it remains available below.\u003c/p>\u003cbutton data-action='adopt-local'>Keep this browser branch; retain saved copy\u003c/button>\u003cbutton data-action='open-saved'>Open saved .parse(x);return Number.isFinite(n)&&(new Date(n).toISOString()===x||new Date(n).toISOString().replace('.000Z','Z')===x)?n:null;}\nfunction decimal(x,nonnegative=false){try{const r=R.dec(x);return nonnegative&&R.cmp(r,R.zero())\u003c0?null:r;}catch{return null;}}\nfunction empty(){return{side:'returned',as_of:'',population_start:'',population_end:'',inventory_complete:false,inventory_document_id:'',inventory_location:'',company_ids:[],service_kinds:[],selection_notes:'',required_review_roles:['operations','source_review'],required_effort_phases:['capture','drafting','pricing','office_review','correction','customer_handoff'],baseline_method:'existing_process',current_method:'study_process',line_rounding:'half_up',measurement_notes:''};}\nfunction validate(w){const p=w.config.quote;assert(p&&typeof p==='object','Field quote study plan required');for(const k of ['as_of','population_start','population_end','inventory_document_id','inventory_location','selection_notes','baseline_method','current_method','measurement_notes'])assert(typeof p[k]==='string','Plan '+k+' must be text');assert(['source','returned'].includes(p.side),'Choose source or returned evidence');assert(typeof p.inventory_complete==='boolean','Declare complete visit inventory');assert(['half_up','half_even'].includes(p.line_rounding),'Declare line rounding');assert(p.baseline_method&&p.current_method&&p.baseline_method!==p.current_method,'Distinct actual effort methods');for(const k of ['required_review_roles','required_effort_phases'])assert(Array.isArray(p[k])&&p[k].length&&p[k].every(x=>typeof x==='string'&&/^[a-z][a-z0-9_-]*$/.test(x))&&new Set(p[k]).size===p[k].length,'Distinct '+k+' required');for(const k of ['company_ids','service_kinds'])assert(Array.isArray(p[k])&&p[k].every(x=>typeof x==='string'&&x.trim())&&new Set(p[k]).size===p[k].length,'Distinct '+k+' required');return w;}\nfunction round(r,mode='half_up',places=2){const scale=10n**BigInt(places),sign=r.n\u003c0n?-1n:1n,n=(r.n\u003c0n?-r.n: on=operation.kind;\n if(operation.kind==='import')next=core.importExtract(w,p);\n else if(operation.kind==='choose')next=core.choose(w,p.kind,p.side,p.extractId);\n else if(operation.kind==='crosswalk')next=core.crosswalk(w,p.kind,p.pairs);\n else if(operation.kind==='match-ids')next=core.matchIds(w,p.kind);\n else if(operation.kind==='document')next=core.addDocument(w,{...p,bytes:codec.fromBase64(p.contentBase64)});\n else if(operation.kind==='document-availability')next=core.documentAvailability(w,p);\n else if(operation.kind==='link-document')next=core.linkDocument(w,p);\n else if(operation.kind==='unlink-document')next=core.unlinkDocument(w,p);\n else if(operation.kind==='review')next=core.review(w,p);\n else if(operation.kind==='configure'){next=core.clone(w);next.config={...next.config,...p,selection:w.config.selection,quote:w.config.quote};core.validate(next);}\n else if(operation.kind==='edit-row'){if(p.study_id!==w.id||p.expected_extract_id!==(core.selected(w,p.kind,p.side)?.id||null))throw Error('Selected records changed after this correction began');next=core.editRow(w,p);}\n else if(operation.kind==='quote-plan'){next=core.clone(w);next.config.quote={...next.config.quote,...p};core.validate(next);}\n else if(operation.kind==='notes'){next=core.clone(w);next.notes=p.text;core.validate(next);}\n else throw Error('Choose a declared complete fieldquote study operation');\n let successor=originalSessions.checkpoint(workspace,next,'Native '+reason);successor=originalSessions.retain(successor,workspace,'Complete editor before '+reason);return {workspace:originalSessions.validate(successor)};\n}\n"},{"path":"session.cjs","content":"'use strict';\nmodule.exports=(function sessionFactory(Core,SHA){\n\"use strict\";\nconst SCHEMA=\"quote.source-session/v1\";\nconst frozen=new WeakSet(),digestCache=new WeakMap(),studyCache=new WeakSet(),rootCache=new Map();\nconst clone=x=>JSON.parse(JSON.stringify(x)),now=()=>new Date().toISOString();\nfunction freezeDeep(x){if(!x||typeof x!==\"object\"||frozen.has(x))return x;for(const v of Object.values(x))freezeDeep(v);Object.freeze(x);frozen.add(x);return x;}\nfunction hash(x){if(x&&typeof x===\"object\"&&frozen.has(x)&&digestCache.has(x))return digestCache.get(x);const h=SHA.sha256Utf8(JSON.stringify(x)).sha256;if(x&&typeof x===\"object\"&&frozen.has(x))digestCache.set(x,h);return h;}\nfunction checkedStudy(st){if(studyCache.has(st))return st;shape(st);freezeDeep(st);studyCache.add(st);return st;}\n\nfunction assert(ok,msg){if(!ok)throw Error(msg);}\nfunction shape(s){return Core.validate(s);}\n\nconst LIMIT=40*1024*1024,LEGACY=\"quote.source-session/legacy\",collections=[\"originals\",\"documents\",\"document_links\",\"extracts\",\"crosswalks\",\"reviews\"];\nfunction create(study=Core.empty()){checkedStudy(study);return {schema:SCHEMA,id:\"session-\"+Date.now()+\"-\"+Math.random().toString(36).slice(2,8),revision:0,study:checkedStudy(clone(study)),drafts:{},view:\"study\",selection:{},history:[],backups:[],archive:{},saved_at:null};}\nfunction put(bank,value){const key=hash(value);if(!Object.hasOwn(bank,key)){bank[key]=freezeDeep(value);if(value&&typeof value===\"object\")digestCache.set(value,key);}return key;}\nfunction get(bank,key){assert(typeof key===\"string\"&&Object.hasOwn(bank,key),\"Missing retained object \"+key);return bank[key];}\nfunction packStudy(bank,study){const x={kind:\"study\",schema:study.schema,id:study.id,config:put(bank,study.config),notes:put(bank,study.notes)};for(const k of collections)x[k]=study[k].map(row=>put(bank,row));return put(bank,x);}\nfunction studyAt(s,key){const b=get(s.archive,key);assert(b.kind===\"study\",\"Invalid retained study\");const x={schema:b.schema,id:b.id,config:clone(get(s.archive,b.config)),notes:get(s.archive,b.notes)};for(const k of collections){assert(Array.isArray(b[k]),\"Invalid retained study collection\");x[k]=b[k].map(r=>clone(get(s.archive,r)));}return x;}\nfunction bodyAt(s,key){const b=get(s.archive,key);assert(b.kind=== ||u16(at+30)||u16(at+32)||u16(at+34)||u16(at+36))\n      throw TypeError('Unexpected ZIP member directory');\n    const names=u16(at+28),size=u32(at+24),packedSize=u32(at+20),method=u16(at+10),\n      offset=u32(at+42),crc=u32(at+16),mode=u32(at+38)>>>16;\n    uncompressedBytes+=size;\n    if(!Number.isSafeInteger(uncompressedBytes)||uncompressedBytes>maxUncompressedBytes)\n      throw RangeError('Complete uncompressed ZIP members exceed the selected limit');\n    if(at+46+names>end||(method===0&&size!==packedSize)||offset!==localAt||(mode&0o170000)!==0o100000||(mode&~0o100777))\n      throw TypeError('ZIP member layout or file mode changed');\n    if(offset+30>central||u32(offset)!==0x04034b50||u16(offset+4)!==20||u16(offset+6)!==0x800||\n       u16(offset+8)!==method||u16(offset+10)!==u16(at+12)||u16(offset+12)!==u16(at+14)||\n       u32(offset+14)!==crc||u32(offset+18)!==packedSize||u32(offset+22)!==size||u16(offset+26)!==names||u16(offset+28))\n      throw TypeError('ZIP local member differs from its directory');\n    const nameBytes=bytes.subarray(at+46,at+46+names),start=offset+30+names,finish=start+packedSize;\n    if(finish>central) throw TypeError('ZIP member exceeds its original boundary');\n    for(let j=0;j\u003cnames;j++)if(nameBytes[j]!==bytes[offset+30+j])throw TypeError('ZIP member names differ');\n    const name=utf8Text(nameBytes);pathName(name);\n    const packed=bytes.subarray(start,finish);\n    const data=method===0?packed:require('./connected_gzip.cjs').inflateRawBytes(packed,{\n      expected_bytes:size,max_output_bytes:Math.max(1,maxUncompressedBytes),\n      max_input_bytes:Math.max(1,Math.min(maxBytes,0x7fffffff))}).data;\n    if(crc32(data)!==crc)throw TypeError('ZIP member checksum changed: '+name);\n    records.push({name,mode:mode&0o777,data,crc32:crc,bytes:size,\n      ...(allowCompression?{method,compressedBytes:packedSize}:{})});\n    localAt=finish;at+=46+names;\n  }\n  if(at!==end||localAt!==central)throw TypeError('ZIP contains extra member or directory bytes');\n  checkPaths(records);\n  return records;\n}\nmodule.exports={utf8,utf8Text,base64,fromBase64,crc32,packStoredZip,readStoredZip,packZip,readZip};\n"},{"path":"src/managed-storage.mjs","content":"/* MIT. Complete managed recovery proposals share immutable original workspace objects.\n   The saved head changes in the same transaction that retains the full proposal.\n   Earlier v1 recovery rows migrate on first successful publication and stay reopenable. */\nexport function createManagedRecoveryStore({C,A,workspaceSchema='quote.source-session/v1',indexedDB:factory=globalThis.indexedDB}){\n const hash=t=>C.hashText(t),copy=x=>JSON.parse(JSON.stringify(x)),need=(v,m)=>{if(!v)throw Error(m)},name='tjlabs.fieldquote.managed.v1';\n const recordSchema='stellar-forge.fieldquote-recovery-record.v1',headSchema='stellar-forge.fieldquote-recovery-head.v1',refSchema='stellar-forge.fieldquote-workspace-reference.v1';\n const objectCache=new WeakMap(),opened=new Map();\n function prepare(value,key){\n  const objects=new Map();\n  function visit(v){\n   if(v&&typeof v==='object'&&v.schema===workspaceSchema){\n    let o=objectCache.get(v);if(!o){const packed=A.serialize(v);o={id:hash(JSON.stringify(v)),content:packed.content,sha256:packed.sha256,bytes:packed.bytes,workspaceSha256:packed.workspace.sha256};if(Object.isFrozen(v))objectCache.set(v,o);}\n    const old=objects.get(o.id);need(!old||old.sha256===o.sha256,'One workspace head has conflicting complete originals');objects.set(o.id,o);return {schema:refSchema,id:o.id};\n   }\n   if(Array.isArray(v))return v.map(visit);\n   if(v&&typeof v==='object')return Object.fromEntries(Object.entries(v).map(([k,x])=>[k,visit(x)]));\n   return v;\n  }\n  const raw=JSON.stringify(value),expandedBytes=C.utf8Encode(raw).length;need(expandedBytes\u003c=256*1024*1024,'Complete browser recovery exceeds 256 MiB; save all originals before beginning a separate installation');\n  const body=visit(value),record={schema:recordSchema,installationId:key,body,bodySha256:hash(JSON.stringify(body)),expandedSha256:hash(raw),expandedBytes,objects:[...objects.values()].map(({content,...m})=>m)};record.id=hash(JSON.stringify(record));\n  return {record,objects:[...objects.values()]};\n }\n function checkRecord(r,key){need(r?.schema===recordSchema&&r.installationId===key&&Array.isArray(r.objects)&&r.body&&typeof r.id==='string','Complete recovery proposal is missing');const {id,...body}=r;need(hash(JSON.stringify(body))===id&&hash(JSON.stringify(r.body))===r.bodySha256,'Complete recovery proposal identity differs');return r;}\n function expand(r,objects,key){\n  checkRecord(r,key);const byId=new Map(objects.map(o=>[o?.id,o]));\n  function visit(v){\n   if(v&&typeof v==='object'&&v.schema===refSchema){\n    need(Object.keys(v).length===2,'Workspace reference changed');const o=byId.get(v.id),binding=r.objects.find(x=>x.id===v.id);\n    need(o&&binding&&o.sha256===binding.sha256&&o.bytes===binding.bytes&&o.workspaceSha256===binding.workspaceSha256&&C.utf8Encode(o.content).length===o.bytes&&hash(o.content)===o.sha256,'Complete original workspace object differs');\n    let cached=opened.get(o.id);if(!cached||cached.sha256!==o.sha256){const w=A.receive(o.content);need(hash(JSON.stringify(w))===o.id,'Recovered workspace head differs');cached={sha256:o.sha256,workspace:w};opened.set(o.id,cached);while(opened.size>8)opened.delete(opened.keys().next().value);}\n    return cached.workspace;\n   }\n   if(Array.isArray(v))return v.map(visit);\n   if(v&&typeof v==='object')return Object.fromEntries(Object.entries(v).map(([k,x])=>[k,visit(x)]));\n   return v;\n  }\n  const value=visit(r.body),raw=JSON.stringify(value);need(C.utf8Encode(raw).length===r.expandedBytes&&hash(raw)===r.expandedSha256,'Reopened complete recovery differs');return copy(value);\n }\n function open(){return new Promise((resolve,reject)=>{if(!factory)return reject(Error('IndexedDB is unavailable; save the complete recovery JSON'));const q=factory.open(name,2);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('sessions'))q.result.createObjectStore('sessions');for(const s of ['workspace-objects','recovery-proposals'])if(!q.result.objectStoreNames.contains(s))q.result.createObjectStore(s,{keyPath:'id'});};q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error);q.onblocked=()=>reject(Error('Close older fieldquote openings after saving their recovery JSON, then reopen this application'));});}\n function transaction(db,mode,body){return new Promise((resolve,reject)=>{let answer,failure;const tx=db.transaction(['sessions','workspace-objects','recovery-proposals'],mode);const fail=e=>{failure=e;try{tx.abort()}catch{}};tx.oncomplete=()=>resolve(answer);tx.onerror=tx.onabort=()=>reject(failure||tx.error||Error('Complete recovery transaction did not commit'));try{body(tx,v=>{answer=v},fail)}catch(e){fail(e)}});}\n function loadIn(tx,key,id,done,fail){\n  const q=tx.objectStore('recovery-proposals').get(id);q.onsuccess=()=>{try{const r=checkRecord(q.result,key);need(r.id===id,'Requested proposal identity changed');const objects=[];let pending=r.objects.length;if(!pending){done({value:expand(r,objects,key),record:r});return;}for(const ref of r.objects){const get=tx.objectStore('workspace-objects').get(ref.id);get.onsuccess=()=>{try{objects.push(get.result);if(--pending===0)done({value:expand(r,objects,key),record:r});}catch(e){fail(e)}};}}catch(e){fail(e)}};\n }\n function headIn(tx,key,done,fail){const q=tx.objectStore('sessions').get(key);q.onsuccess=()=>{try{const h=q.result;if(!h){done({value:null,sha256:null});return;}if(h.schema===headSchema){need(h.installationId===key,'Browser installation head changed');loadIn(tx,key,h.recordId,r=>{need(r.record.expandedSha256===h.sha256,'Browser head identity changed');done({...r,sha256:h.sha256});},fail);}else done({value:h,sha256:hash(JSON.stringify(h)),legacy:true});}catch(e){fail(e)}};}\n function retainIn(tx,prepared,done,fail){\n  let pending=prepared.objects.length;const finish=()=>{tx.objectStore('recovery-proposals').put(prepared.record);done();};if(!pending){finish();return;}\n  for(const o of prepared.objects){const q=tx.objectStore('workspace-objects').get(o.id);q.onsuccess=()=>{try{const previous=q.result;if(previous)need(JSON.stringify(previous)===JSON.stringify(o),'Retained immutable workspace changed');else tx.objectStore('workspace-objects').add(o);if(--pending===0)finish();}catch(e){fail(e)}};}\n }\n function read(db,key){return transaction(db,'readonly',(tx,done,fail)=>headIn(tx,key,done,fail));}\n function load(db,key,id){return transaction(db,'readonly',(tx,done,fail)=>loadIn(tx,key,id,done,fail));}\n function commit(db,key,value,expectedSha256,transform){\n  return transaction(db,'readwrite',(tx,done,fail)=>headIn(tx,key,prior=>{try{\n   const next=transform?transform(copy(value),prior.value?copy(prior.value):null):value,prepared=prepare(next,key),conflict=!transform&&prior.sha256!==expectedSha256;\n   const publish=()=>retainIn(tx,prepared,()=>{if(!conflict)tx.objectStore('sessions').put({schema:headSchema,installationId:key,recordId:prepared.record.id,sha256:prepared.record.expandedSha256},key);done({value:next,sha256:prepared.record.expandedSha256,recordId:prepared.record.id,conflict,currentSha256:prior.sha256});},fail);\n   if(prior.legacy)retainIn(tx,prepare(prior.value,key),publish,fail);else publish();\n  }catch(e){fail(e)}},fail));\n }\n function list(db,key){return transaction(db,'readonly',(tx,done,fail)=>{const rows=[],q=tx.objectStore('recovery-proposals').openCursor();q.onsuccess=()=>{try{const c=q.result;if(!c){done(rows);return;}const r=c.value;if(r.installationId===key){checkRecord(r,key);rows.push({id:r.id,sha256:r.expandedSha256,bytes:r.expandedBytes,sequence:r.body.baseState?.sequence,pendingId:r.body.pending?.id||null,objects:r.objects.length});}c.continue();}catch(e){fail(e)}};});}\n return {name,open,read,load,list,prepare,expand,save:(db,key,value,expected)=>commit(db,key,value,expected),adopt:(db,key,value,transform)=>commit(db,key,value,null,transform)};\n}\n"},{"path":"src/managed.js","content":"/* MIT. Complete editable draft and original pending request live together in one IndexedDB transaction. */\nfunction createManagedSession({C,S,config,getSession,setSession,render,notice,download,isOperatorBusy=()=>false,recoveryStorage}){\n const hash=v=>S.hash(JSON.stringify(v)),copy=S.clone,key=config.installationId;let state=null,pending=null,history=[],branches=[],proposals=[],db=null,lastStored=null,ready=false,working=false,needsRefresh=false,dirtyPersistence=false,tail=Promise.resolve();\n const token=new URLSearchParams(location.hash.slice(1)).get('token')||'';historyReplace();function historyReplace(){if(location.hash)globalThis.history.replaceState(null,'',location.pathname);}\n const pane=document.getElementById('managed-controls');\n pane.innerHTML='\u003ch2>Managed workspace\u003c/h2>\u003cp id=\"managed-status\" role=\"status\">Opening the selected private session…\u003c/p>\u003cdiv class=\"actions\">\u003cbutton id=\"managed-save\">Save complete session\u003c/button>\u003cbutton id=\"managed-refresh\">Open newest saved edition\u003c/button>\u003cbutton id=\"managed-recover\">Recover original request\u003c/button>\u003cbutton id=\"managed-copy\">Save complete recovery JSON\u003c/button>\u003cbutton id=\"managed-adopt-browser\">Keep this browser branch; retain saved copy\u003c/button>\u003cbutton id=\"managed-export\">Save retained handover ZIP\u003c/button>\u003c/div>\u003clabel>Open complete recovery JSON\u003cinput id=\"managed-receive\" type=\"file\" accept=\".json\">\u003c/label>\u003cdiv id=\"managed-branches\">\u003c/div>';\n const status=message=>{renderBranches();document.getElementById('managed-status').textContent=message||(!ready?'Connecting…':pending?'An original save is pending. Recover it before further editing.':needsRefresh?'The save was rejected before commit. Open the newest edition; your complete local branch will be retained.':state?.carrier.sha256===S.pack(getSession()).sha256?'Complete session matches managed edition '+state.sequence+'.':'Local editable session has changes. Save it to the managed workspace.');};\n async function api(path,payload){const response=await fetch(path,{method:payload===undefined?'GET':'POST',headers:{authorization:'Bearer '+token,'x-fieldquote-instance':config.instanceId,...(payload===undefined?{}:{'content-type':'application/json'})},body:payload===undefined?undefined:JSON.stringify(payload),redirect:'error'});const r=await response.json();if(!response.ok)throw Object.assign(Error(r.error?.message||'Managed request failed'),{code:r.error?.code});return r;}\n function shell(){return {schema:'stellar-forge.fieldquote-recovery.v1',installationId:key,baseState:state,carrier:S.pack(getSession()),pending:copy(pending),history:copy(history),branches:copy(branches),needsRefresh};}\n\n function validateRecovery(value){\n  if(value?.schema!=='stellar-forge.fieldquote-recovery.v1'||value.installationId!==key||!value.baseState||!Array.isArray(value.history)||typeof value.needsRefresh!=='boolean')throw Error('Select this installation’s complete recovery JSON');\n  const b=value.baseState;if(b.schema!=='stellar-forge.fieldquote-view.v1'||b.installationId!==key||!Number.isSafeInteger(b.sequence)||b.sequence\u003c0||!Array.isArray(b.receipts)||!Array.isArray(b.rejections))throw Error('Recovery base edition is incomplete');\n  S.receive(JSON.stringify(b.carrier));\n  const original={schema:'stellar-forge.fieldquote-state.v1',installationId:b.installationId,sequence:b.sequence,carrier:b.carrier,receipts:b.receipts,rejections:b.rejections};\n  if(hash(original)!==b.sha256)throw Error('Recovery base edition identity differs');\n  if(value.branches!==undefined&&(!Array.isArray(value.branches)||value.branches.some(b=>!b||typeof b.id!=='string'||typeof b.reason!=='string'||!b.recovery||hash(b.recovery)!==b.sha256)))throw Error('Retained complete browser branch identity differs');\n  const incoming=S.receive(JSON.stringify(value.carrier)),r=value.pending;\n  if(r!==null){\n   const keys=['schema','installationId','id','baseSha256','actor','at','kind','carrier'];\n   if(!r||r.schema!=='stellar-forge.fieldquote-request.v1'||r.installationId!==key||r.kind!=='save'||r.baseSha256!==b.sha256||!keys.every(k=>Object.hasOwn(r,k))||Object.keys(r).some(k=>!keys.includes(k))||typeof r.id!=='string'||!r.id||r.id.length>120||typeof r.actor!=='string'||!r.actor||r.actor.length>240||typeof r.at!=='string'||r.at.length>40||!Number.isFinite(Date.parse(r.at)))throw Error('Recovery pending request is incomplete');\n   if(S.pack(S.receive(JSON.stringify(r.carrier))).sha256!==value.carrier.sha256)throw Error('Recovery editor differs from its exact pending successor');\n  }\n  return incoming;\n }\n\n\n function renderBranches(){\n  const node=document.getElementById('managed-branches');if(!node)return;node.replaceChildren();\n  if(!branches.length&&!proposals.length)return;const title=document.createElement('h3');title.textContent='Retained complete browser branches';node.append(title);\n  for(const p of proposals){const row=document.createElement('p'),button=document.createElement('button');button.textContent='Save complete proposal: edition '+p.sequence+(p.pendingId?' — original request '+p.pendingId:'')+' · '+p.id.slice(0,12);button.onclick=()=>{recoveryStorage.load(db,key,p.id).then(r=>download('Field_Quote_Study_Recovery_Proposal_'+p.id+'.json',JSON.stringify(r.value,null,2)+'\\n')).catch(e=>notice(e.message,true));};row.append(button);node.append(row);}\n  for(const b of branches){const row=document.createElement('p'),button=document.createElement('button');button.textContent='Save recovery JSON: '+b.reason+(b.recovery.pending?' — pending '+b.recovery.pending.id:'');button.onclick=()=>download('Field_Quote_Study_Browser_Branch_'+b.id+'.json',JSON.stringify(b.recovery,null,2)+'\\n');row.append(button);node.append(row);}\n }\n async function adoptBrowser(){\n  const work=tail.then(async()=>{\n   const selected=await recoveryStorage.adopt(db,key,shell(),(local,prior)=>{\n    if(prior)validateRecovery(prior);const next=copy(local),all=[...(local.branches||[]),...(prior?.branches||[])],seen=new Set(all.map(b=>b.sha256));\n    for(const [reason,recovery]of [['This local branch before explicit selection',local],['Other saved browser branch before explicit selection',prior]])if(recovery&&!seen.has(hash(recovery))){seen.add(hash(recovery));all.push({id:S.id(),reason,sha256:hash(recovery),recovery:copy(recovery)});}\n    next.branches=all;return next;\n   });\n   lastStored=selected.sha256;branches=selected.value.branches;dirtyPersistence=false;proposals=await recoveryStorage.list(db,key);status();notice('This browser branch is selected. Both complete preimages and earlier proposals remain available below.');\n  });tail=work.catch(()=>{});return work;\n }\n async function savedDB(value){\n  const result=await recoveryStorage.save(db,key,value,lastStored);proposals=await recoveryStorage.list(db,key);\n  if(result.conflict)throw Error('Another opening saved the browser head. This complete proposal is independently retained below; explicitly select this branch or receive the saved recovery.');\n  lastStored=result.sha256;\n }\n function persist(){if(!ready)return Promise.resolve();dirtyPersistence=true;const work=tail.then(async()=>{const value=shell();await savedDB(value);dirtyPersistence=hash(shell())!==hash(value);status();});tail=work.catch(()=>{});return work.catch(e=>{status('Complete session remains in this tab; browser persistence needs attention: '+e.message);throw e;});}\n async function finish(result){\n  if(!['COMMITTED','REJECTED_NOT_COMMITTED'].includes(result.outcome))throw Error('Original request remains unresolved');\n  if(result.record.requestSha256!==hash(pending)||JSON.stringify(result.record.request)!==JSON.stringify(pending))throw Error('Original request outcome identity differs');\n  history.push({requestId:pending.id,requestSha256:result.record.requestSha256,recordSha256:hash(result.record),outcome:result.outcome,sequence:result.record.sequence??null,editionSha256:result.state.sha256,error:result.record.error??null});pending=null;state=result.state;\n  if(result.outcome==='COMMITTED'){setSession(S.receive(JSON.stringify(state.carrier)));needsRefresh=false;}\n  else needsRefresh=true;\n  await persist();render();status();notice(result.outcome==='COMMITTED'?'Complete managed session saved; original request retained.':'Save rejected before commit: '+result.record.error.message,true);\n }\n async function recover(){if(!pending)throw Error('No original request is pending');let r=await api('/api/request-status',pending);if(r.outcome==='UNRECORDED')r=await api('/api/request',pending);await finish(r);}\n async function save(){if(pending||needsRefresh)throw Error('Recover the original request or open the newest edition first');const carrier=S.pack(getSession());if(carrier.sha256===state.carrier.sha256){status();return;}\n  if(!getSession().draft.actor.trim())throw Error('Enter the operation actor before saving');\n  pending={schema:'stellar-forge.fieldquote-request.v1',installationId:key,id:S.id(),baseSha256:state.sha256,actor:getSession().draft.actor.trim(),at:S.now(),kind:'save',carrier};\n  await persist();status();await recover();\n }\n async function refresh(){if(pending)throw Error('Recover the original request first');const next=await api('/api/state');const local=getSession(),fresh=S.receive(JSON.stringify(next.carrier));setSession(S.pack(local).sha256===next.carrier.sha256?fresh:S.replace(local,fresh,'Complete local branch before opening newest managed edition'));state=next;needsRefresh=false;await persist();render();status();notice('Newest saved edition opened. The complete prior local branch is retained in Open and restore.');}\n async function retainedExport(){if(pending||needsRefresh||S.pack(getSession()).sha256!==state.carrier.sha256)throw Error('Save the complete current session before exporting its retained managed edition');const file=await api('/api/export',{expectedSha256:state.sha256}),parts=[];let offset=0;\n  for(;;){const r=await api('/api/file?id='+file.fileId+'&offset='+offset+'&limit=196608');if(r.sha256!==file.sha256||r.bytes!==file.bytes||r.offset!==offset)throw Error('Retained export identity changed');const b=C.fromBase64(r.contentBase64);parts.push(b);offset+=b.length;if(r.nextOffset===null)break;if(r.nextOffset!==offset||!b.length)throw Error('Retained export continuation changed');}\n  const bytes=new Uint8Array(offset);let at=0;for(const p of parts){bytes.set(p,at);at+=p.length;}if(offset!==file.bytes||C.sha256Bytes(bytes)!==file.sha256)throw Error('Complete retained export differs');download('Field_Quote_Study_Managed_Handover.zip',bytes,'application/zip');notice('Complete retained handover downloaded.');\n }\n function run(fn){if(working)return;if(isOperatorBusy()){notice('Wait for the current operator action before saving or receiving.',true);return;}if(!ready){notice('Open the current private connection before managed actions.',true);return;}working=true;status('Working with the original saved edition…');Promise.resolve().then(fn).catch(e=>notice(e.message,true)).finally(()=>{working=false;status();});}\n document.getElementById('managed-adopt-browser').onclick=()=>run(adoptBrowser);\n document.getElementById('managed-save').onclick=()=>run(save);document.getElementById('managed-refresh').onclick=()=>run(refresh);document.getElementById('managed-recover').onclick=()=>run(recover);document.getElementById('managed-export').onclick=()=>run(retainedExport);\n document.getElementById('managed-copy').onclick=()=>download('Field_Quote_Study_Recovery.json',JSON.stringify(shell(),null,2)+'\\n');\n document.getElementById('managed-receive').onchange=e=>run(async()=>{const file=e.target.files[0];if(!file)return;if(file.size>256*1024*1024)throw Error('Recovery file exceeds the complete limit');const originalBytes=new Uint8Array(await file.arrayBuffer()),originalText=C.utf8Decode(originalBytes);if(C.toBase64(C.utf8Encode(originalText))!==C.toBase64(originalBytes))throw Error('Select exact UTF-8 recovery JSON');const received=JSON.parse(originalText);const incoming=validateRecovery(received);if(pending&&JSON.stringify(pending)!==JSON.stringify(received.pending))throw Error('Recover the current original request before opening a different one');if(received.pending&&(received.pending.installationId!==key||received.pending.baseSha256!==received.baseState.sha256))throw Error('Recovery request binding differs');history.push({localRecoveryBeforeReceive:shell()});state=received.baseState;pending=received.pending;history.push(...received.history);branches.push(...(received.branches||[]));needsRefresh=!!received.needsRefresh;setSession(incoming);await persist();render();status();notice('Complete recovery opened; recover its exact original request or select the newest managed edition.');});\n for(const event of ['click','input','change'])document.addEventListener(event,e=>{if((!ready||pending||working)&&!pane.contains(e.target)){e.preventDefault();e.stopImmediatePropagation();notice('Wait for connection or recover the original managed request before editing.',true);}},true);\n window.addEventListener('beforeunload',e=>{if(pending||dirtyPersistence||ready&&state.carrier.sha256!==S.pack(getSession()).sha256){e.preventDefault();e.returnValue='';}});\n async function initialize(){\n  if(!/^[a-f0-9]{64}$/.test(token))throw Error('Open the current private Applications link');\n  db=await recoveryStorage.open();\n  const selected=await recoveryStorage.read(db,key),prior=selected.value;proposals=await recoveryStorage.list(db,key);\n  const current=await api('/api/state');if(current.installationId!==key)throw Error('The managed installation identity changed');\n  lastStored=prior?hash(prior):null;\n  if(prior){validateRecovery(prior);state=prior.baseState;pending=prior.pending;history=prior.history;branches=prior.branches||[];needsRefresh=!!prior.needsRefresh;setSession(S.receive(JSON.stringify(prior.carrier)));if(!pending&&state.sha256!==current.sha256)needsRefresh=true;}\n  else{state=current;setSession(S.receive(JSON.stringify(current.carrier)));}\n  ready=true;render();status();if(pending)notice('An exact original request is pending. Recover it with the current listener.');\n }\n initialize().catch(e=>{status('Managed connection needs attention: '+e.message);notice(e.message,true);});\n return {persist:()=>persist().catch(e=>notice(e.message,true)),status,export:retainedExport,isManaged:true};\n}\n"},{"path":"src/session-cache.cjs","content":"'use strict';\n// MIT. Intern complete original objects only after original validation succeeds.\nconst Original=require('../session.cjs');\nconst bank=new Map(),MAX_BYTES=16*1024*1024,MAX_ENTRIES=4096;let used=0;\nconst content=x=>JSON.stringify(x);\nfunction candidate(value){const text=content(value),entry=bank.get(text);if(entry){bank.delete(text);bank.set(text,entry);return entry.value;}return value;}\nfunction remember(value){const text=content(value);if(bank.has(text))return;const bytes=Original.byteLength(text)*2;if(bytes>MAX_BYTES)return;while(bank.size&&(used+bytes>MAX_BYTES||bank.size>=MAX_ENTRIES)){const key=bank.keys().next().value;used-=bank.get(key).bytes;bank.delete(key);}bank.set(text,{value,bytes});used+=bytes;}\nfunction validate(value){\n if(!value||value.schema!==Original.SCHEMA)return Original.validate(value);\n const next={...value,study:candidate(value.study),archive:value.archive&&typeof value.archive==='object'&&!Array.isArray(value.archive)?Object.fromEntries(Object.entries(value.archive).map(([key,object])=>[key,candidate(object)])):value.archive};\n Original.validate(next);remember(next.study);for(const object of Object.values(next.archive))remember(object);return next;\n}\nconst hashes=new Map();let hashBytes=0;function hash(value){const text=JSON.strin function readActive(){return transaction("readonly",(st,done,fail)=>{const q=st.get("active");q.onsuccess=()=>{try{const v=checkedSaved(q.result);done(v||null);}catch(e){fail(e);}};});}
function saveExact(snapshot,expected){return transaction("readwrite",(st,done,fail)=>{const q=st.get("active");q.onsuccess=()=>{try{const old=checkedSaved(q.result);if((old?.hash||null)!==expected){done({conflict:true,current:old||null});return;}const h=M.hash(snapshot);st.put({key:"active",hash:h,session:snapshot,updated_at:now()});done({hash:h});}catch(e){fail(e);}};});}
function persist(){dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(()=>{saveTimer=null;enqueueSave();},150);status();}
function enqueueSave(){queue=queue.then(async()=>{if(conflict)return;const snap=M.clone(session);try{const r=await saveExact(snap,seen);if(r.conflict){conflict=true;if(r.current)session=M.retain(session,r.current.session,"Other tab's saved branch");message="Your complete working copy and the competing saved copy are retained. Use Save & recover to select a branch.";dirty=true;}else{seen=r.hash;storageError="";dirty=hasEmergency()||M.hash(session)!==r.hash;}}catch(e){storageError=e.message;dirty=true;}status();});return queue;}
async function flush(){if(saveTimer){clearTimeout(saveTimer);saveTimer=null;enqueueSave();}await queue;}

 else if(act==="download-original"){const o=session.study.originals.find(x=>x.id===el.dataset.id);if(!o)throw Error("Original not found");download(o.name,o.content,"text/plain");}
 else if(act==="download-branch"){const b=session.backups.find(b=>b.hash===el.dataset.id);if(!b)throw Error("Branch not found");download("quote-source-branch-"+b.hash.slice(0,12)+".json",Core.json(M.branchSession(session,b)));}
 else if(act==="open-branch"){const b=session.backups.find(b=>b.hash===el.dataset.id);if(!b)throw Error("Branch not found");exportSession();replace(M.takeSession(session,M.branchSession(session,b),"Before opening retained branch"),"Retained branch opened. If another saved copy exists, acknowledge it explicitly.");}
 else if(act==="restore-edition"){const h=session.history[Number(el.dataset.index)];if(!h)throw Error("Edition not found");exportSession();replace(M.use(session,M.historyStudy(session,h),"Before restoring study edition"),"Study edition restored; complete prior session retained.");}
 else if(act==="adopt-local")await adoptLocal();
 else if(act==="open-saved"){freeze(true);await flush();const old=await readActive();if(!old)throw Error("No saved copy exists");exportSession();const next=M.takeSession(session,old.session,"Local session before opening saved branch");seen=old.hash;session=next;conflict=false;dirty=true;persist();message="Saved branch opened; local branch retained.";freeze(false);render();}
 }catch(e){freeze(false);say(e.message);}}
document.addEventListener("input",e=>{if(busy)return;if(e.target.id==="record-filter"){const q=e.target.value.toLowerCase();document.querySelectorAll("[data-filter]").forEach(x=>x.hidden=!x.dataset.filter.includes(q));return;}if(e.target.id==="study-notes"){recordDraft("study-notes",{text:e.target.value});return;}const form=e.target.closest("form[data-key]");if(form){recordDraft(form.dataset.key,collect(form));}});
document.addEventListener("change",e=>{if(e.target.dataset.file)openFile(e.target.files?.[0],e.target.dataset.file);else if(!busy&&e.target.dataset.selectionKind){try{const kind=e.target.dataset.selectionKind,side=e.target.dataset.selectionSide;replace(M.checkpoint(session,Core.choose(session.study,kind,side,e.target.value),"Select "+side+" "+kind),"Selected exact retained edition.");}catch(err){say(err.message);render();}}else if(!busy&&e.target.matches("select")){const form=e.target.closest("form[data-key]");if(form){recordDraft(form.dataset.key,collect(form));if(form.dataset.key==="document-link"&&["side","kind"].includes(e.target.dataset.path))render();}}});
document.addEventListener("submit",e=>{const form=e.target.closest("form[data-key]");if(!form)return;e.preventDefault();if(busy)return;try{const value=collect(form,true),kind=form.dataset.kind;let next;
 if(kind==="config"){const st=M.clone(session.study);st.config={...st.config,...value};next=M.checkpoint(session,st,"Save study scope");}

 else if(kind==="record"){if(value.study_id!==session.study.id||value.expected_extract_id!==(Core.selected(session.study,value.kind,value.side)?.id||null))throw Error("Selected records changed after this draft began; retain it and prepare a fresh correction");next=M.checkpoint(session,Core.editRow(session.study,value),"Record source-backed "+value.kind+" revision");}
 else if(kind==="quote-plan"){const st=M.clone(session.study);st.config.quote={...st.config.quote,...value};next=M.checkpoint(session,st,"Revise complete visit population and measurement plan");}

 else if(kind==="review")next=M.recordReview(session,value);
 else if(kind==="intake")next=M.checkpoint(session,Core.importExtract(session.study,value),"Retain original and mapped extract "+value.kind);
 else if(kind==="crosswalk")next=M.checkpoint(session,Core.crosswalk(session.study,value.kind,value.pairs),"Apply explicit identity map "+value.kind);
 else if(kind==="document-availability")next=M.checkpoint(session,Core.documentAvailability(session.study,value),"Retain sourced document availability");
 else if(kind==="document-link")next=M.checkpoint(session,Core.linkDocument(session.study,value),"Link retained record document");
 else throw Error("Unknown form");
 next=M.retain(next,session,"Complete form before saving "+form.dataset.key);delete next.drafts[form.dataset.key];replace(next,"Saved "+kind+". Comparison retains every unresolved field and source difference.",[form.dataset.key]);
 }catch(err){say(err.message+" — unfinished form retained.");}});
document.addEventListener("click",e=>{const el=e.target.closest("button");if(!el||busy)return;if(el.dataset.view){session.view=el.dataset.view;session.revision++;persist();render();}else if(el.dataset.action)action(el);});
window.addEventListener("beforeunload",e=>{if(dirty||busy||conflict||storageError||hasEmergency()){e.preventDefault();e.returnValue="";}});
// IndexedDB compare-and-swap on every commit is the saved-state authority.
$("nav").innerHTML=views.map(([v,label])=>'<button data-view="'+v+'">'+label+"</button>").join("");
render();freeze(true);
(async()=>{try{db=await new Promise((resolve,reject)=>{const q=indexedDB.open("quote-source-desk",1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains("sessions"))q.result.createObjectStore("sessions",{keyPath:"key"});};q.onerror=()=>reject(q.error);q.onblocked=()=>reject(Error("Close another browser copy to upgrade storage"));q.onsuccess=()=>resolve(q.result);});const old=await readActive();if(old){session=old.session;seen=old.hash;dirty=M.hash(session)!==seen;if(dirty)persist();message="Complete saved session reopened, including unfinished forms.";}else{persist();}freeze(false);render();}catch(e){storageError=e.message;dirty=true;freeze(false);say("Browser storage unavailable. Download the complete session before leaving.");}})();
window.QuoteDesk={getSession:()=>M.clone(session),getRecovery:()=>M.clone(recoveryEnvelope()),exportFiles:()=>M.exports(session),flush,assessment:()=>M.assess(session)};
})(window.QuoteCore,window.QuoteSession,window.StudySHA,window.QuoteZIP,window.QuoteCSV,window.QuoteBinary,window.QuoteDomain,window.QUOTE_COURSES,window.QUOTE_SOURCE_FILES);
</script></body></html>
