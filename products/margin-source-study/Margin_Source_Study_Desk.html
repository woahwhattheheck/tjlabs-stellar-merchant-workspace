dit\");if(!value.reason.trim())throw Error(\"Explain the source-backed comparison revision\");if(index\u003c0)st.config.margin.comparisons.push(value.value);else st.config.margin.comparisons[index]=value.value;next=M.checkpoint(session,st,\"Comparison revision: \"+value.reason);}\n else if(kind===\"review\")next=M.recordReview(session,value);\n else if(kind===\"intake\")next=M.checkpoint(session,Core.importExtract(session.study,value),\"Retain original and mapped extract \"+value.kind);\n else if(kind===\"crosswalk\")next=M.checkpoint(session,Core.crosswalk(session.study,value.kind,value.pairs),\"Apply explicit identity map \"+value.kind);\n else if(kind===\"document-link\")next=M.checkpoint(session,Core.linkDocument(session.study,value),\"Link retained record document\");\n else throw Error(\"Unknown form\");\n next=M.retain(next,session,\"Complete form before saving \"+form.dataset.key);delete next.drafts[form.dataset.key];replace(next,\"Saved \"+kind+\". Comparison retains every unresolved field and source difference.\",[form.dataset.key]);\n }catch(err){say(err.message+\" — unfinished form retained.\");}});\ndocument.addEventListener(\"click\",e=>{const el=e.target.closest(\"button\");if(!el||busy)return;if(el.dataset.view){session.view=el.dataset.view;session.revision++;persist();render();}else if(el.dataset.action)action(el);});\nwindow.addEventListener(\"beforeunload\",e=>{if(dirty||busy||conflict||storageError||hasEmergency()){e.preventDefault();e.returnValue=\"\";}});\n// IndexedDB compare-and-swap on every commit is the saved-state authority.\n$(\"nav\").innerHTML=views.map(([v,label])=>'\u003cbutton data-view=\"'+v+'\">'+label+\"\u003c/button>\").join(\"\");\nrender();freeze(true);\n(async()=>{try{db=await new Promise((resolve,reject)=>{const q=indexedDB.open(\"margin-source-desk\",1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains(\"sessions\"))q.result.createObjectStore(\"sessions\",{keyPath:\"key\"});};q.onerror=()=>reject(q.error);q.onblocked=()=>reject(Error(\"Close another browser copy to upgrade storage\"));q.onsuccess=()=>resolve(q.result);});const old=await readActive();if(old){session=old.session;seen=old.hash;dirty=M.hash(session)!==seen;if(dirty)persist();message=\"Complete saved session reopened, including unfinished forms.\";}else{persist();}freeze(false);render();}catch(e){storageError=e.message;dirty=true;freeze(false);say(\"Browser storage unavailable. Download the complete session before leaving.\");}})();\nwindow.MarginDesk={getSession:()=>M.clone(session),getRecovery:()=>M.clone(recoveryEnvelope()),exportFiles:()=>M.exports(session),flush,assessment:()=>M.assess(session)};\n})(window.MarginCore,window.MarginSession,window.StudySHA,window.MarginZIP,window.MarginCSV,window.MarginBinary,window.MarginDomain,window.MARGIN_COURSES,window.MARGIN_SOURCE_FILES);\n"},{"path":"operator/installed-desk.js","content":"(function deskMain(Core,M,SHA,ZIP,CSV,Binary,Margin,courses,sourceFiles){\n\"use strict\";\nconst S=window.MarginInstalledSessions,C=window.MarginCodec,installed=window.MARGIN_INSTALLATION;let installedMeta={actor:\"\",retainedEmergency:[]},managed=null;const localRecovery=createManagedRecoveryStore({C,A:createMarginSourceStudyArchive(M,C),indexedDB}),localKey=\"standalone\";\n\nlet session=M.create(),seen=null,db=null,dirty=true,busy=false,conflict=false,storageError=\"\",saveTimer=null,queue=Promise.resolve(),message=\"Complete the study setup, or open the clearly labelled authored course.\",selectedFile=null,emergency={drafts:{},imports:[],reason:\"\"};\nfunction getInstalled(){return S.fromSession(session,emergency,installedMeta);}\nfunction emergencyCarrier(){return {schema:\"stellar-forge.margin-emergency-carrier.v1\",session:M.clone(session),emergency:S.clone(emergency),metadata:S.clone(installedMeta)};}\nfunction setInstalled(value){const v=S.validate(S.clone(value));session=v.workspace;emergency=v.emergency;installedMeta={actor:v.draft.actor,retainedEmergency:v.retainedEmergency};if(document.getElementById(\"installed-actor\"))document.getElementById(\"installed-actor\").value=v.draft.actor;}\nfunction selectInstalled(next,nextEmergency=emergency,metadata=installedMeta){const v=S.fromSession(next,nextEmergency,metadata);setInstalled(v);return v;}\nsetInstalled(S.receive(installed.carrier));\nconst $=id=>document.getElementById(id),esc=x=>String(x??\"\").replace(/[&\u003c>\"']/g,c=>({\"&\":\"&amp;\",\"\u003c\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[c])),now=()=>new Date().toISOString();\nconst views=[[\"study\",\"Study scope\"],[\"intake\",\"CSV intake & mapping\"],[\"selection\",\"Selected editions\"],[\"records\",\"Observed records\"],[\"crosswalks\",\"Identity maps\"],[\"documents\",\"Supporting originals\"],[\"plan\",\"Comparison plan\"],[\"timeline\",\"Margin observations\"],[\"compare\",\"Return comparison\"],[\"reviews\",\"Operations & finance\"],[\"recovery\",\"Save & recover\"]];\nfunction say(t){message=t;status();}\nfunction hasEmergency(){return Object.keys(emergency.drafts).length>0||emergency.imports.length>0;}\nfunction status(){if($(\"message\"))$(\"message\").textContent=message;if($(\"save-state\"))$(\"save-state\").textContent=busy?\"Working…\":hasEmergency()?\"Pending input is in memory — download emergency recovery\":conflict?\"Another saved branch exists — resolve in Save & recover\":storageError?\"Memory only: \"+storageError:dirty?\"Unsaved changes\":\"Saved in this browser\";if($(\"revision\"))$(\"revision\").textContent=session.study.id+\" · session revision \"+session.revision;}\nfunction freeze(v){busy=v;document.querySelectorAll(\"button,input,select,textarea\").forEach(e=>e.disabled=v);status();}\nfunction checkedSaved(value){if(!value)return null;const wrapped=S.receive(value.carrier);return {installed:wrapped,session:wrapped.workspace};}\nasync function readActive(){const r=await localRecovery.read(db,localKey);return r.value?{...checkedSaved(r.value),hash:r.sha256}:null;}\nasync function saveExact(snapshot,expected){const value={schema:\"stellar-forge.margin-local.v1\",carrier:S.pack(snapshot)},r=await localRecovery.save(db,localKey,value,expected);return r.conflict?{conflict:true,current:await readActive()}:{hash:r.sha256,sessionSha256:value.carrier.sha256};}\nfunction persist(){dirty=true;if(managed){try{managed.persist();managed.status();}catch(e){storageError=e.message;message=e.message;}status();return;}clearTimeout(saveTimer);saveTimer=setTimeout(()=>{saveTimer=null;enqueueSave();},150);status();}\nfunction enqueueSave(){const save=async()=>{if(conflict)return;try{const snap=getInstalled();const r=await saveExact(snap,seen);if(r.conflict){conflict=true;if(r.current)setInstalled(S.replace(r.current.installed,snap,\"Retain competing saved browser session\"));message=\"Complete working copy and competing saved copy are retained. Select a branch in Save & recover.\";dirty=true;}else{seen=r.hash;storageError=\"\";dirty=S.pack(getInstalled()).sha256!==r.sessionSha256;}}catch(e){storageError=e.message;dirty=true;}status();};queue=queue.then(save,save);return queue;}\nasync function flush(){if(saveTimer){clearTimeout(saveTimer);saveTimer=null;enqueueSave();}await queue;}\nfunction download(name,data,type=\"application/json\"){const blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement(\"a\");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}\nfunction recoveryEnvelope(){return hasEmergency()?{schema:\"margin.source-emergency/v1\",session,pending_forms:emergency.drafts,pending_imports:emergency.imports,reason:emergency.reason}:session;}\nfunction exportSession(){download(hasEmergency()?\"Margin_Source_Study_Complete_Emergency.json\":\"margin-source-session.json\",Core.json(hasEmergency()?emergencyCarrier():session));say(hasEmergency()?\"Complete emergency recovery downloaded, including every pending form and import.\":\"Complete session downloaded, including every unfinished form and retained branch.\");}\nfunction draftValue(key,fallback){return emergency.drafts[key]??session.drafts[key]??fallback;}\nfunction recordDraft(key,value){dirty=true;try{const nextEmergency=S.clone(emergency);delete nextEmergency.drafts[key];selectInstalled(M.draft(session,key,value),nextEmergency);persist();}catch(e){emergency.drafts[key]=M.clone(value);emergency.reason=e.message;dirty=true;message=e.message+\" The full pending form remains in memory; use Save complete file.\";status();}}\nfunction retainImport(kind,name,text,error){const p={kind,name,text,error,at:now()},key=\"pending-import:\"+SHA.sha256Utf8(kind+\"\\0\"+name+\"\\0\"+text).sha256;try{selectInstalled(M.draft(session,key,p));persist();}catch(e){if(!emergency.imports.some(x=>x.key===key))emergency.imports.push({key,...p});emergency.reason=e.message;dirty=true;}}\nfunction retainForm(key,reason){const prior=Object.hasOwn(emergency.drafts,key)?M.draft(session,key,emergency.drafts[key]):session;return M.retain(prior,prior,reason);}\nfunction optionsHtml(values,selected,labels={}){const multi=Array.isArray(selected),chosen=multi?selected:[String(selected??\"\")],all=[...values,...chosen.filter(x=>!values.includes(x))];return [...new Set(all)].map(x=>'\u003coption value=\"'+esc(x)+'\"'+(chosen.includes(x)?\" selected\":\"\")+'>'+esc((Object.hasOwn(labels,x)?labels[x]:undefined)??(values.includes(x)?String(x).replaceAll(\"_\",\" \"):\"[Unresolved] \"+x))+'\u003c/option>').join(\"\");}\nfunction control(path,label,value,{type=\"text\",options=null,nullable=false,list=null,help=\"\"}={}){\n const name=esc(path),v=value??\"\";let html;\n if(list){const chosen=Array.isArray(value)?value:[];html='\u003cselect multiple data-path=\"'+name+'\" data-array=\"1\">'+optionsHtml(list,chosen)+\"\u003c/select>\";}\n else if(options)html='\u003cselect data-path=\"'+name+'\">'+optionsHtml(options,v)+\"\u003c/select>\";\n else if(type===\"boolean\")html='\u003cselect data-path=\"'+name+'\" data-bool=\"1\">'+optionsHtml([\"true\",\"false\"],String(value))+\"\u003c/select>\";\n else if(type===\"decimal\")html='\u003cinput data-path=\"'+name+'\" value=\"'+esc(v)+'\" type=\"text\" inputmode=\"decimal\"'+(nullable?' data-null-text=\"1\"':\"\")+\">\";\n else if(type===\"textarea\")html='\u003ctextarea rows=\"4\" data-path=\"'+name+'\">'+esc(v)+'\u003c/textarea>';\n else html='\u003cinput data-path=\"'+name+'\" value=\"'+esc(v)+'\" type=\"'+(type===\"number\"?\"number\":\"text\")+'\"'+(type===\"number\"?' step=\"any\" data-number=\"1\"'+(nullable?' data-null=\"1\"':\"\"):\"\")+([\"at\",\"captured_at\",\"available_at\"].includes(path)?' placeholder=\"2026-10-15T00:00:00Z\"':\"\")+\">\";\n return '\u003clabel>'+esc(label)+html+(help?'\u003csmall>'+esc(help)+\"\u003c/small>\":\"\")+\"\u003c/label>\";\n}\nfunction at(obj,path){return path.split(\".\").reduce((o,k)=>o?.[k],obj);}\nfunction set(obj,path,value){const p=path.split(\".\");let x=obj;for(const k of p.slice(0,-1)){if(x[k]===undefined)x[k]={};x=x[k];}x[p.at(-1)]=value;}\nfunction collect(form,convert=false){const key=form.dataset.key,base=draftValue(key,JSON.parse(form.dataset.base)),obj=M.clone(base);for(const e of form.querySelectorAll(\"[data-path]\")){let v=e.multiple?Array.from(e.selectedOptions).map(o=>o.value):e.value;if(convert&&e.dataset.number){if(v===\"\"){if(e.dataset.null)v=null;else throw Error(e.dataset.path+\": enter a number\");}else{v=Number(v);if(!Number.isFinite(v))throw Error(e.dataset.path+\": enter a finite number\");}}if(e.dataset.bool)v=v===\"true\";if(e.dataset.nullText&&v===\"\")v=null;if(e.dataset.roles)v=String(v).split(\",\").map(s=>s.trim()).filter(Boolean);set(obj,e.dataset.path,v);}return obj;}\nfunction formOpen(key,base,kind=\"\",oldId=\"\"){return '\u003cform data-key=\"'+esc(key)+'\" data-kind=\"'+esc(kind)+'\" data-old=\"'+esc(oldId)+'\" data-base=\"'+esc(JSON.stringify(base))+'\">';}\nconst label=k=>k.replaceAll(\"_\",\" \").replace(/^./,c=>c.toUpperCase()),fmt=x=>x===null||x===undefined?\"Unobserved\":String(x);\nfunction table(headers,rows){return\"\u003cdiv class='table-wrap'>\u003ctable>\u003cthead>\u003ctr>\"+headers.map(x=>\"\u003cth>\"+esc(x)+\"\u003c/th>\").join(\"\")+\"\u003c/tr>\u003c/thead>\u003ctbody>\"+rows.map(r=>\"\u003ctr>\"+r.map(v=>\"\u003ctd>\"+esc(v)+\"\u003c/td>\").join(\"\")+\"\u003c/tr>\").join(\"\")+\"\u003c/tbody>\u003c/table>\u003c/div>\";}\nfunction studyView(){const base=Object.fromEntries(Object.entries(session.study.config).filter(([k])=>![\"selection\",\"margin\"].includes(k))),v=draftValue(\"config\",base);return\"\u003ch1>Margin Source Study Desk\u003c/h1>\u003cp>Study agreed plants, SKUs and accounting periods using supplied original and returned extracts. Existing ERP, payroll, agency, production and finance records remain authoritative. Map actual reports; preserve source definitions and current owner decisions.\u003c/p>\"+formOpen(\"config\",base,\"config\")+\"\u003cdiv class='grid'>\"+control(\"label\",\"Study label\",v.label)+control(\"data_class\",\"Data class\",v.data_class,{options:[\"operational\",\"authored_course\"]})+control(\"source_scope\",\"Original systems, sites, periods and extraction scope\",v.source_scope,{type:\"textarea\"})+control(\"returned_scope\",\"Returned study population and extraction scope\",v.returned_scope,{type:\"textarea\"})+control(\"authority_notes\",\"Operations/finance owners and source-system authority\",v.authority_notes,{type:\"textarea\"})+\"\u003c/div>\u003cbutton type='submit'>Save scope\u003c/button>\u003c/form>\u003ch2>Working notes\u003c/h2>\u003ctextarea id='study-notes' rows='5'>\"+esc(draftValue(\"study-notes\",{})?.text??session.study.notes)+\"\u003c/textarea>\u003cbutton data-action='save-notes'>Save notes\u003c/button>\u003ch2>Authored three-plant example\u003c/h2>\u003cp>Two complete fiscal weeks and three fictional plants show exact gram-to-kilogram conversion, changing product mix, a duplicated agency pool, incomplete allocation and a separate cooked process. The first return has three source differences. The corrected study retains all 25 originals. Reference-volume and current-volume cost changes differ in sign; gross margin and realised cash remain separate.\u003c/p>\u003cbutton data-action='course' data-course='first'>Open authored first return — three differences\u003c/button> \u003cbutton data-action='course' data-course='corrected'>Open authored corrected return\u003c/button>\";}\nfunction intakeView(){const kind=session.selection.intakeKind||\"sites\",side=session.selection.intakeSide||\"source\",key=\"intake:\"+kind+\":\"+side,v=draftValue(key,null);let h=\"\u003ch1>Original CSV and field mapping\u003c/h1>\u003cdiv class='actions'>\"+Core.KINDS.map(k=>\"\u003cbutton data-action='intake-kind' data-kind='\"+k+\"'\"+(k===kind?\" aria-current='true'\":\"\")+\">\"+esc(label(k))+\"\u003c/button>\").join(\"\")+\"\u003c/div>\u003cdiv class='actions'>\"+[\"source\",\"returned\"].map(x=>\"\u003cbutton data-action='intake-side' data-side='\"+x+\"'\"+(x===side?\" aria-current='true'\":\"\")+\">\"+(x===\"source\"?\"Original source\":\"Returned trial\")+\"\u003c/button>\").join(\"\")+\"\u003c/div>\u003cp>Retain the approved CSV extraction exactly. A blank mapping means the field was not observed; an empty cell in a mapped column is an observed blank. IDs are text, preserving leading zeros and punctuation. The current study retains every previously imported edition.\u003c/p>\u003cdiv class='actions'>\u003clabel class='file-label'>Choose \"+esc(kind)+\" CSV\u003cinput type='file' data-file='csv:\"+kind+\":\"+side+\"' accept='.csv,text/csv'>\u003c/label>\u003cbutton data-action='csv-template' data-kind='\"+kind+\"'>Download canonical header template\u003c/button>\u003c/div>\";\nif(!v)return h+\"\u003cp>No pending file for this table and side. You can switch sections without losing another table's pending file or mapping.\u003c/p>\";let t;try{t=Core.inspectCSV(v.content);}catch(e){return h+\"\u003cp class='notice'>\"+esc(e.message)+\"\u003c/p>\";}h+=\"\u003ch2>\"+esc(v.name)+\"\u003c/h2>\u003cp>\"+t.rows.length+\" parsed rows; exact original remains retained with this pending mapping.\u003c/p>\"+formOpen(key,{},\"intake\")+\"\u003cdiv class='grid'>\"+control(\"label\",\"Extract edition label\",v.label)+control(\"available_at\",\"This complete edition was available at (UTC)\",v.available_at??v.at,{help:\"Use the actual original availability instant. A later consolidated export cannot reconstruct earlier values. Capture time is retained separately.\"});\nfor(const field of Core.FIELDS[kind])h+=control(\"mapping.\"+field,label(field)+\" ← original column\",v.mapping[field],{options:[\"\",...t.header],help:field===\"id\"?\"Required stable source ID. Preserve exact original identifiers.\":\"Blank means unobserved; comparison will show it explicitly.\"});\nh+=\"\u003c/div>\u003cbutton type='submit'>Retain original and select this extract\u003c/button> \u003cbutton type='button' data-action='download-intake' data-key='\"+esc(key)+\"'>Download exact pending CSV\u003c/button>\u003c/form>\u003ch2>Original row preview\u003c/h2>\u003cp>First 20 rows are shown; every parsed row is retained and compared.\u003c/p>\"+table([\"Original lines\",...t.header],t.rows.slice(0,20).map(r=>[r.line_start+\"–\"+r.line_end,...r.values]));return h;}\nfunction selectionView(){let h=\"\u003ch1>Selected source and returned editions\u003c/h1>\u003cp>Each choice selects an exact original and mapping. Earlier extracts, mappings and comparisons remain in complete history. Choose a corrected returned export without replacing its first version.\u003c/p>\";\nfor(const side of [\"source\",\"returned\"]){h+=\"\u003ch2>\"+(side===\"source\"?\"Original source\":\"Returned trial\")+\"\u003c/h2>\u003cdiv class='grid'>\";for(const kind of Core.KINDS){const selected=session.study.config.selection[side][kind],es=session.study.extracts.filter(e=>e.kind===kind&&e.side===side);h+=\"\u003clabel>\"+esc(label(kind))+\"\u003cselect data-selection-kind='\"+kind+\"' data-selection-side='\"+side+\"'>\"+optionsHtml([\"\",...es.map(e=>e.id)],selected,Object.fromEntries([[\"\",\"No selected extract\"],...es.map(e=>[e.id,e.label+\" · \"+session.study.originals.find(o=>o.id===e.original_id)?.name])]))+\"\u003c/select>\u003c/label>\";}h+=\"\u003c/div>\";}\nh+=\"\u003ch2>All retained extracts\u003c/h2>\"+session.study.extracts.map(e=>\"\u003cdiv class='record'>\u003cstrong>\"+esc(e.label)+\"\u003c/strong>\u003csmall>\"+esc(e.side+\" · \"+e.kind+\" · available \"+e.available_at+\" · \"+e.id)+\"\u003c/small>\u003cbutton data-action='edit-extract' data-id='\"+e.id+\"'>Prepare mapping revision\u003c/button> \u003cbutton data-action='download-original' data-id='\"+e.original_id+\"'>Download exact original\u003c/button>\u003c/div>\").join(\"\");return h;}\nfunction crosswalkView(){const kind=session.selection.mapKind||\"costs\",key=\"crosswalk:\"+kind,base={kind,pairs:session.study.crosswalks.filter(x=>x.kind===kind).map(x=>({source_id:x.source_id,target_id:x.target_id}))},v=draftValue(key,base),src=Core.rows(session.study,kind,\"source\"),dst=Core.rows(session.study,kind,\"returned\");let h=\"\u003ch1>Explicit identity maps\u003c/h1>\u003cdiv class='actions'>\"+Core.KINDS.map(k=>\"\u003cbutton data-action='map-kind' data-kind='\"+k+\"'\"+(k===kind?\" aria-current='true'\":\"\")+\">\"+esc(label(k))+\"\u003c/button>\").join(\"\")+\"\u003c/div>\u003cp>Pair original IDs to returned IDs explicitly. Names and external-system references are separate evidence, not automatic identity matches. Sites, SKU definitions, unit rules, payroll pools, allocations and finance records have explicit identities. A shared economic pool must use one canonical identity across source systems.\u003c/p>\u003cbutton data-action='match-ids' data-kind='\"+kind+\"'>Add unique exact-ID pairs; keep existing choices\u003c/button>\"+formOpen(key,base,\"crosswalk\")+\"\u003cdiv class='table-wrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Original ID\u003c/th>\u003cth>Returned ID\u003c/th>\u003cth>Draft action\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\";\nv.pairs.forEach((p,i)=>{h+=\"\u003ctr>\u003ctd>\"+control(\"pairs.\"+i+\".source_id\",\"Original identity\",p.source_id,{options:[\"\",...src.map(r=>r.values.id).filter(Boolean)]})+\"\u003c/td>\u003ctd>\"+control(\"pairs.\"+i+\".target_id\",\"Returned identity\",p.target_id,{options:[\"\",...dst.map(r=>r.values.id).filter(Boolean)]})+\"\u003c/td>\u003ctd>\u003cbutton type='button' data-action='remove-pair' data-index='\"+i+\"'>Remove draft pair\u003c/button>\u003c/td>\u003c/tr>\";});h+=\"\u003c/tbody>\u003c/table>\u003c/div>\u003cbutton type='button' data-action='add-pair'>Add pair\u003c/button> \u003cbutton type='submit'>Apply complete \"+esc(kind)+\" map\u003c/button>\u003c/form>\u003ch2>Original identity context\u003c/h2>\"+table([\"ID\",\"Original fields\",\"Original row\"],src.map(r=>[r.values.id,Object.entries(r.values).filter(([k])=>k!==\"id\").map(([k,v])=>k+\": \"+fmt(v)).join(\" · \"),r.source.name+\":\"+r.source.line_start+\"–\"+r.source.line_end]));return h;}\nfunction documentsView(){const base={side:\"source\",kind:\"production\",record_id:\"\",document_id:\"\",notes:\"\"},v=draftValue(\"document-link\",base),kind=Core.KINDS.includes(v.kind)?v.kind:\"production\",side=v.side===\"returned\"?\"returned\":\"source\";let h=\"\u003ch1>Exact supporting originals\u003c/h1>\u003cp>Retain authorised extraction instructions, product specifications, cost-allocation workpapers and finance approvals as exact bytes. Same filenames with different bytes remain distinct. Link to the exact typed source or returned record; names and captions do not establish identity. Links here annotate the selected supplied export, while source capture and availability dates remain in their exact retained editions.\u003c/p>\u003clabel class='file-label'>Retain exact file\u003cinput type='file' data-file='document'>\u003c/label>\"+session.study.documents.map(d &&/^-?(0|[1-9]\\d*)(\\.\\d{1,18})?$/.test(x)&&x.length\u003c=90,'Use a decimal string with at most18 fractional places; no exponent',p);const neg=x[0]==='-',t=neg?x.slice(1):x,parts=t.split('.');return R(BigInt(parts.join(''))*(neg?-1n:1n),10n**BigInt(parts[1]?.length||0));}\nconst add=(a,b)=>R(a.n*b.d+b.n*a.d,a.d*b.d),sub=(a,b)=>R(a.n*b.d-b.n*a.d,a.d*b.d),mul=(a,b)=>R(a.n*b.n,a.d*b.d),div=(a,b)=>b.n===0n?null:R(a.n*b.d,a.d*b.n),zero=()=>R(0n),hundred=()=>R(100n),cmp=(a,b)=>a.n*b.d-b.n*a.d;\nfunction display(r,places=12){if(r===null)return null;const neg=r.n\u003c0n,n=neg?-r.n:r.n,scale=10n**BigInt(places),q=(n*scale*2n+r.d)/(2n*r.d),s=q.toString().padStart(places+1,'0'),out=places?s.slice(0,-places)+'.'+s.slice(-places):s;return(neg&&q?'−':'')+(places?out.replace(/\\.?0+$/,''):out).replace(/^$/,'0');}\nfunction value(r){if(r===null)return null;return{numerator:r.n.toString(),denominator:r.d.toString(),decimal:display(r)};}\nconst sum=a=>a.reduce(add,zero());\n\nmodule.exports={R,dec,add,sub,mul,div,zero,hundred,cmp,display,value,sum};\n"},{"path":"receiving/installed-result.json","content":"{\n  \"schema\": \"stellar-forge.margin-installed-courses.v1\",\n  \"runtime\": \"V8 production modules and generated HTML with explicit DOM/File/IndexedDB and declared file/client adapters\",\n  \"originalModelChecks\": [\n    {\n      \"name\": \"Whole source return repair retains first editions\",\n      \"passed\": true\n    },\n    {\n      \"name\": \"Reference mix and actual exposure remain signed and separate\",\n      \"passed\": true\n    },\n    {\n      \"name\": \"Gross margin and accepted cash never double subtract labour\",\n      \"passed\": true\n    },\n    {\n      \"name\": \"Cross-site cooked definition stays unmatched\",\n      \"passed\": true\n    },\n    {\n      \"name\": \"Duplicate economic source and incomplete allocation suppress rates\",\n      \"passed\": true\n    },\n    {\n      \"name\": \"Later correction cannot enter earlier knowledge\",\n  \"sharedOriginalObjects\": 1,\n    \"pendingRequestAndCompleteFormsReopen\": true,\n    \"conflictingProposalRetained\": true,\n    \"adoptionRetainsCompletePreimage\": true,\n    \"changedOriginalRejected\": true\n  },\n  \"mcp\": {\n    \"schema\": \"margin.installed-mcp-course.v1\",\n    \"declaredOriginalFiles\": 22,\n    \"sourceFamilies\": 11,\n    \"commands\": 40,\n    \"exactMappingAndAvailability\": true,\n    \"sourceBackedRowCorrection\": true,\n    \"dualRoleReview\": true,\n    \"reads\": {\n      \"plan\": {},\n      \"marginAvailability\": {\n        \"total\": 11,\n        \"nextOffset\": 2\n      },\n      \"periods\": {\n        \"total\": 2,\n        \"nextOffset\": null\n      },\n      \"costPools\": {\n        \"total\": 0,\n        \"nextOffset\": null\n      },\n      \"allocations\": {\n        \"total\": 0,\n        \"nextOffset\": null\n      },\n      \"measures\": {\n        \"total\": 12,\n        \"nextOffset\": 2\n      },\n      \"sitePeriods\": {\n        \"total\": 6,\n        \"nextOffset\": 2\n      },\n      \"comparisons\": {\n        \"total\": 3,\n        \"nextOffset\": 2\n      },\n      \"finance\": {\n        \"total\": 6,\n        \"nextOffset\": 2\n      },\n      \"benefits\": {\n        \"total\": 3,\n        \"nextOffset\": 2\n      },\n      \"issues\": {\n        \"total\": 26,\n        \"nextOffset\": 2\n      },\n      \"findings\": {\n        \"total\": 1,\n        \"nextOffset\": null\n      },\n      \"availability\": {\n        \"total\": 22,\n        \"nextOffset\": 2\n      },\n      \"rows\": {\n        \"total\": 25,\n        \"nextOffset\": 2\n      }\n    }\n  },\n  \"performance\": {\n    \"before\": {\n      \"bytes\": 524242,\n      \"originals\": 23,\n      \"objects\": 299,\n      \"history\": 40,\n      \"branches\": 40,\n      \"originalValidationMs\": 1139,\n      \"carrierPackMs\": 598,\n      \"managedReadMs\": 1439,\n      \"analysisMs\": 118\n    },\n    \"after\": {\n      \"managedReadMs nged after this correction began');next=core.editRow(w,p);}\n else if(operation.kind==='margin-plan'){next=core.clone(w);next.config.margin={...next.config.margin,...p,comparisons:w.config.margin.comparisons};core.validate(next);}\n else if(operation.kind==='comparison-plan'){if(p.study_id!==w.id||!p.reason?.trim())throw Error('Bind the exact study and explain the comparison revision');next=core.clone(w);const i=p.key===null?-1:next.config.margin.comparisons.findIndex(c=>c.id===p.key);if(p.key!==null&&(i\u003c0||originalSessions.hash(next.config.margin.comparisons[i])!==p.expected_sha256))throw Error('Comparison changed after this draft began');if(i\u003c0)next.config.margin.comparisons.push(p.value);else next.config.margin.comparisons[i]=p.value;core.validate(next);}\n else if(operation.kind==='remove-comparison'){next=core.clone(w);const i=next.config.margin.comparisons.findIndex(c=>c.id===p.id);if(i\u003c0||originalSessions.hash(next.config.margin.comparisons[i])!==p.expected_sha256)throw Error('Select the exact current comparison');next.config.margin.comparisons.splice(i,1);core.validate(next);}\n else if(operation.kind==='notes'){next=core.clone(w);next.notes=p.text;core.validate(next);}\n else throw Error('Choose a declared complete margin study operation');\n let successor=originalSessions.checkpoint(workspace,next,'Native '+reason);successor=originalSessions.retain(successor,workspace,'Complete editor before '+reason);return {workspace:originalSessions.validate(successor)};\n}\n"},{"path":"session.cjs","content":"'use strict';\nmodule.exports=(function sessionFactory(Core,SHA){\n\"use strict\";\nconst SCHEMA=\"margin.source-session/v1\";\nconst frozen=new WeakSet(),digestCache=new WeakMap(),studyCache=new WeakSet(),rootCache=new Map();\nconst clone=x=>JSON.parse(JSON.stringify(x)),now=()=>new Date().toISOString();\nfunction freezeDeep(x){if(!x||typeof x!==\"object\"||frozen.has(x))return x;for(const v of Object.values(x))freezeDeep(v);Object.freeze(x);frozen.add(x);return x;}\nfunction hash(x){if(x&&typeof x===\"object\"&&frozen.has(x)&&digestCache.has(x))return digestCache.get(x);const h=SHA.sha256Utf8(JSON.stringify(x)).sha256;if(x&&typeof x===\"object\"&&frozen.has(x))digestCache.set(x,h);return h;}\nfunction checkedStudy(st){if(studyCache.has(st))return st;shape(st);freezeDeep(st);studyCache.add(st);return st;}\n\nfunction assert(ok,msg){if(!ok)throw Error(msg);}\nfunction shape(s){return Core.validate(s);}\n\nconst LIMIT=40*1024*1024,LEGACY=\"margin.source-session/legacy\",collections=[\"originals\",\"documents\",\"document_links\",\"extracts\",\"crosswalks\",\"reviews\"];\nfunction create(study=Core.empty()){checkedStudy(study);return {schema:SCHEMA,id:\"session-\"+Date.now()+\"-\"+Math.random().toString(36).slice(2,8),revision:0,study:checkedStudy(clone(study)),drafts:{},view:\"study\",selection:{},history:[],backups:[],archive:{},saved_at:null};}\nfunction put(bank,value){const key=hash(value);if(!Object.hasOwn(bank,key)){bank[key]=freezeDeep(value);if(value&&typeof value===\"object\")digestCache.set(value,key);}return key;}\nfunction get(bank,key){assert(typeof key===\"string\"&&Object.hasOwn(bank,key),\"Missing retained object \"+key);return bank[key];}\nfunction packStudy(bank,study){const x={kind:\"study\",schema:study.schema,id:study.id,config:put(bank,study.config),notes:put(bank,study.notes)};for(const k of collections)x[k]=study[k].map(row=>put(bank,row));return put(bank,x);}\nfunction studyAt(s,key){const b=get(s.archive,key);assert(b.kind===\"study\",\"Invalid retained study\");const x={schema:b.schema,id:b.id,config:clone(get(s.archive,b.config)),notes:get(s.archive,b.notes)};for(const k of collections){assert(Array.isArray(b[k]),\"Invalid retained study collection\");x[k]=b[k].map(r=>clone(get(s.archive,r)));}return x;}\nfunction bodyAt(s,key){const b=get(s.archive,key);assert(b.kind===\"session\",\"Invalid retained session\");return {schema:SCHEMA,id:b.id,revision:b.revision,study:studyAt(s,b.study 4,crc32,packStoredZip,readStoredZip,packZip,readZip};\n"},{"path":"src/managed-storage.mjs","content":"/* MIT. Complete managed recovery proposals share immutable original workspace objects.\n   The saved head changes in the same transaction that retains the full proposal.\n   Earlier v1 recovery rows migrate on first successful publication and stay reopenable. */\nexport function createManagedRecoveryStore({C,A,workspaceSchema='margin.source-session/v1',indexedDB:factory=globalThis.indexedDB}){\n const hash=t=>C.hashText(t),copy=x=>JSON.parse(JSON.stringify(x)),need=(v,m)=>{if(!v)throw Error(m)},name='tjlabs.margin.managed.v1';\n const recordSchema='stellar-forge.margin-recovery-record.v1',headSchema='stellar-forge.margin-recovery-head.v1',refSchema='stellar-forge.margin-workspace-reference.v1';\n const objectCache=new WeakMap(),opened=new Map();\n function prepare(value,key){\n  const objects=new Map();\n  function visit(v){\n   if(v&&typeof v==='object'&&v.schema===workspaceSchema){\n    let o=objectCache.get(v);if(!o){const packed=A.serialize(v);o={id:hash(JSON.stringify(v)),content:packed.content,sha256:packed.sha256,bytes:packed.bytes,workspaceSha256:packed.workspace.sha256};if(Object.isFrozen(v))objectCache.set(v,o);}\n    const old=objects.get(o.id);need(!old||old.sha256===o.sha256,'One workspace head has conflicting complete originals');objects.set(o.id,o);return {schema:refSchema,id:o.id};\n   }\n   if(Array.isArray(v))return v.map(visit);\n   if(v&&typeof v==='object')return Object.fromEntries(Object.entries(v).map(([k,x])=>[k,visit(x)]));\n   return v;\n  }\n  const raw=JSON.stringify(value),expandedBytes=C.utf8Encode(raw).length;need(expandedBytes\u003c=256*1024*1024,'Complete browser recovery exceeds 256 MiB; save all originals before beginning a separate installation');\n  const body=visit(value),record={schema:recordSchema,installationId:key,body,bodySha256:hash(JSON.stringify(body)),expandedSha256:hash(raw),expandedBytes,objects:[...objects.values()].map(({content,...m})=>m)};record.id=hash(JSON.stringify(record));\n  return {record,objects:[...objects.values()]};\n }\n function checkRecord(r,key){need(r?.schema===recordSchema&&r.installationId===key&&Array.isArray(r.objects)&&r.body&&typeof r.id==='string','Complete recovery proposal is missing');const {id,...body}=r;need(hash(JSON.stringify(body))===id&&hash(JSON.stringify(r.body))===r.bodySha256,'Complete recovery proposal identity differs');return r;}\n function expand(r,objects,key){\n  checkRecord(r,key);const byId=new Map(objects.map(o=>[o?.id,o]));\n  function visit(v){\n   if(v&&typeof v==='object'&&v.schema===refSchema){\n    need(Object.keys(v).length===2,'Workspace reference changed');const o=byId.get(v.id),binding=r.objects.find(x=>x.id===v.id);\n    need(o&&binding&&o.sha256===binding.sha256&&o.bytes===binding.bytes&&o.workspaceSha256===binding.workspaceSha256&&C.utf8Encode(o.content).length===o.bytes&&hash(o.content)===o.sha256,'Complete original workspace object differs');\n    let cached=opened.get(o.id);if(!cached||cached.sha256!==o.sha256){const w=A.receive(o.content);need(hash(JSON.stringify(w))===o.id,'Recovered workspace head differs');cached={sha256:o.sha256,workspace:w};opened.set(o.id,cached);while(opened.size>8)opened.delete(opened.keys().next().value);}\n    return cached.workspace;\n   }\n   if(Array.isArray(v))return v.map(visit);\n   if(v&&typeof v==='object')return Object.fromEntries(Object.entries(v).map(([k,x])=>[k,visit(x)]));\n   return v;\n  }\n  const value=visit(r.body),raw=JSON.stringify(value);need(C.utf8Encode(raw).length===r.expandedBytes&&hash(raw)===r.expandedSha256,'Reopened complete recovery differs');return copy(value);\n }\n function open(){return new Promise((resolve,reject)=>{if(!factory)return reject(Error('IndexedDB is unavailable; save the complete recovery JSON'));const q=factory.open(name,2);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('sessions'))q.result.createObjectStore('sessions');for(const s of ['workspace-objects','recovery-proposals'])if(!q.result.objectStoreNames.contains(s))q.result.createObjectStore(s,{keyPath:'id'});};q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error);q.onblocked=()=>reject(Error('Close older margin openings after saving their recovery JSON, then reopen this application'));});}\n function transaction(db,mode,body){return new Promise((resolve,reject)=>{let answer,failure;const tx=db.transaction(['sessions','workspace-objects','recovery-proposals'],mode);const fail=e=>{failure=e;try{tx.abort()}catch{}};tx.oncomplete=()=>resolve(answer);tx.onerror=tx.onabort=()=>reject(failure||tx.error||Error('Complete recovery transaction did not commit'));try{body(tx,v=>{answer=v},fail)}catch(e){fail(e)}});}\n function loadIn(tx,key,id,done,fail){\n  const q=tx.objectStore('recovery-proposals').get(id);q.onsuccess=()=>{try{const r=checkRecord(q.result,key);need(r.id===id,'Requested proposal identity changed');const objects=[];let pending=r.objects.length;if(!pending){done({value:expand(r,objects,key),record:r});return;}for(const ref of r.objects){const get=tx.objectStore('workspace-objects').get(ref.id);get.onsuccess=()=>{try{objects.push(get.result);if(--pending===0)done({value:expand(r,objects,key),record:r});}catch(e){fail(e)}};}}catch(e){fail(e)}};\n }\n function headIn(tx,key,done,fail){const q=tx.objectStore('sessions').get(key);q.onsuccess=()=>{try{const h=q.result;if(!h){done({value:null,sha256:null});return;}if(h.schema===headSchema){need(h.installationId===key,'Browser installation head changed');loadIn(tx,key,h.recordId,r=>{need(r.record.expandedSha256===h.sha256,'Browser head identity changed');done({...r,sha256:h.sha256});},fail);}else done({value:h,sha256:hash(JSON.stringify(h)),legacy:true});}catch(e){fail(e)}};}\n function retainIn(tx,prepared,done,fail){\n  let pending=prepared.objects.length;const finish=()=>{tx.objectStore('recovery-proposals').put(prepared.record);done();};if(!pending){finish();return;}\n  for(const o of prepared.objects){const q=tx.objectStore('workspace-objects').get(o.id);q.onsuccess=()=>{try{const previous=q.result;if(previous)need(JSON.stringify(previous)===JSON.stringify(o),'Retained immutable workspace changed');else tx.objectStore('workspace-objects').add(o);if(--pending===0)finish();}catch(e){fail(e)}};}\n }\n function read(db,key){return transaction(db,'readonly',(tx,done,fail)=>headIn(tx,key,done,fail));}\n function load(db,key,id){return transaction(db,'readonly',(tx,done,fail)=>loadIn(tx,key,id,done,fail));}\n function commit(db,key,value,expectedSha256,transform){\n  return transaction(db,'readwrite',(tx,done,fail)=>headIn(tx,key,prior=>{try{\n   const next=transform?transform(copy(value),prior.value?copy(prior.value):null):value,prepared=prepare(next,key),conflict=!transform&&prior.sha256!==expectedSha256;\n   const publish=()=>retainIn(tx,prepared,()=>{if(!conflict)tx.objectStore('sessions').put({schema:headSchema,installationId:key,recordId:prepared.record.id,sha256:prepared.record.expandedSha256},key);done({value:next,sha256:prepared.record.expandedSha256,recordId:prepared.record.id,conflict,currentSha256:prior.sha256});},fail);\n   if(prior.legacy)retainIn(tx,prepare(prior.value,key),publish,fail);else publish();\n  }catch(e){fail(e)}},fail));\n }\n function list(db,key){return transaction(db,'readonly',(tx,done,fail)=>{const rows=[],q=tx.objectStore('recovery-proposals').openCursor();q.onsuccess=()=>{try{const c=q.result;if(!c){done(rows);return;}const r=c.value;if(r.installationId===key){checkRecord(r,key);rows.push({id:r.id,sha256:r.expandedSha256,bytes:r.expandedBytes,sequence:r.body.baseState?.sequence,pendingId:r.body.pending?.id||null,objects:r.objects.length});}c.continue();}catch(e){fail(e)}};});}\n return {name,open,read,load,list,prepare,expand,save:(db,key,value,expected)=>commit(db,key,value,expected),adopt:(db,key,value,transform)=>commit(db,key,value,null,transform)};\n}\n"},{"path":"src/managed.js","content":"/* MIT. Complete editable draft and original pending request live together in one IndexedDB transaction. */\nfunction createManagedSession({C,S,config,getSession,setSession,render,notice,download,isOperatorBusy=()=>false,recoveryStorage}){\n const hash=v=>S.hash(JSON.stringify(v)),copy=S.clone,key=config.installationId;let state=null,pending=null,history=[],branches=[],proposals=[],db=null,lastStored=null,ready=false,working=false,needsRefresh=false,dirtyPersistence=false,tail=Promise.resolve();\n const token=new URLSearchParams(location.hash.slice(1)).get('token')||'';historyReplace();function historyReplace(){if(location.hash)globalThis.history.replaceState(null,'',location.pathname);}\n const pane=document.getElementById('managed-controls');\n pane.innerHTML='\u003ch2>Managed workspace\u003c/h2>\u003cp id=\"managed-status\" role=\"status\">Opening the selected private session…\u003c/p>\u003cdiv class=\"actions\">\u003cbutton id=\"managed-save\">Save complete session\u003c/button>\u003cbutton id=\"managed-refresh\">Open newest saved edition\u003c/button>\u003cbutton id=\"managed-recover\">Recover original request\u003c/button>\u003cbutton id=\"managed-copy\">Save complete recovery JSON\u003c/button>\u003cbutton id=\"managed-adopt-browser\">Keep this browser branch; retain saved copy\u003c/button>\u003cbutton id=\"managed-export\">Save retained handover ZIP\u003c/button>\u003c/div>\u003clabel>Open complete recovery JSON\u003cinput id=\"managed-receive\" type=\"file\" accept=\".json\">\u003c/label>\u003cdiv id=\"managed-branches\">\u003c/div>';\n const status=message=>{renderBranches();document.getElementById('managed-status').textContent=message||(!ready?'Connecting…':pending?'An original save is pending. Recover it before further editing.':needsRefresh?'The save was rejected before commit. Open the newest edition; your complete local branch will be retained.':state?.carrier.sha256===S.pack(getSession()).sha256?'Complete session matches managed edition '+state.sequence+'.':'Local editable session has changes. Save it to the managed workspace.');};\n async function api(path,payload){const response=await fetch(path,{method:payload===undefined?'GET':'POST',headers:{authorization:'Bearer '+token,'x-margin-instance':config.instanceId,...(payload===undefined?{}:{'content-type':'application/json'})},body:payload===undefined?undefined:JSON.stringify(payload),redirect:'error'});const r=await response.json();if(!response.ok)throw Object.assign(Error(r.error?.message||'Managed request failed'),{code:r.error?.code});return r;}\n function shell(){return {schema:'stellar-forge.margin-recovery.v1',installationId:key,baseState:state,carrier:S.pack(getSession()),pending:copy(pending),history:copy(history),branches:copy(branches),needsRefresh};}\n\n function validateRecovery(value){\n  if(value?.schema!=='stellar-forge.margin-recovery.v1'||value.installationId!==key||!value.baseState||!Array.isArray(value.history)||typeof value.needsRefresh!=='boolean')throw Error('Select this installation’s complete recovery JSON');\n  const b=value.baseState;if(b.schema!=='stellar-forge.margin-view.v1'||b.installationId!==key||!Number.isSafeInteger(b.sequence)||b.sequence\u003c0||!Array.isArray(b.receipts)||!Array.isArray(b.rejections))throw Error('Recovery base edition is incomplete');\n  S.receive(JSON.stringify(b.carrier));\n  const original={schema:'stellar-forge.margin-state.v1',installationId:b.installationId,sequence:b.sequence,carrier:b.carrier,receipts:b.receipts,rejections:b.rejections};\n  if(hash(original)!==b.sha256)throw Error('Recovery base edition identity differs');\n  if(value.branches!==undefined&&(!Array.isArray(value.branches)||value.branches.some(b=>!b||typeof b.id!=='string'||typeof b.reason!=='string'||!b.recovery||hash(b.recovery)!==b.sha256)))throw Error('Retained complete browser branch identity differs');\n  const incoming=S.receive(JSON.stringify(value.carrier)),r=value.pending;\n  if(r!==null){\n   const keys=['schema','installationId','id','baseSha256','actor','at','kind','carrier'];\n   if(!r||r.schema!=='stellar-forge.margin-request.v1'||r.installationId!==key||r.kind!=='save'||r.baseSha256!==b.sha256||!keys.every(k=>Object.hasOwn(r,k))||Object.keys(r).some(k=>!keys.includes(k))||typeof r.id!=='string'||!r.id||r.id.length>120||typeof r.actor!=='string'||!r.actor||r.actor.length>240||typeof r.at!=='string'||r.at.length>40||!Number.isFinite(Date.parse(r.at)))throw Error('Recovery pending request is incomplete');\n   if(S.pack(S.receive(JSON.stringify(r.carrier))).sha256!==value.carrier.sha256)throw Error('Recovery editor differs from its exact pending successor');\n  }\n  return incoming;\n }\n\n\n function renderBranches(){\n  const node=document.getElementById('managed-branches');if(!node)return;node.replaceChildren();\n  if(!branches.length&&!proposals.length)return;const title=document.createElement('h3');title.textContent='Retained complete browser branches';node.append(title);\n  for(const p of proposals){const row=document.createElement('p'),button=document.createElement('button');button.textContent='Save complete proposal: edition '+p.sequence+(p.pendingId?' — original request '+p.pendingId:'')+' · '+p.id.slice(0,12);button.onclick=()=>{recoveryStorage.load(db,key,p.id).then(r=>download('Margin_Source_Study_Recovery_Proposal_'+p.id+'.json',JSON.stringify(r.value,null,2)+'\\n')).catch(e=>notice(e.message,true));};row.append(button);node.append(row);}\n  for(const b of branches){const row=document.createElement('p'),button=document.createElement('button');button.textContent='Save recovery JSON: '+b.reason+(b.recovery.pending?' — pending '+b.recovery.pending.id:'');button.onclick=()=>download('Margin_Source_Study_Browser_Branch_'+b.id+'.json',JSON.stringify(b.recovery,null,2)+'\\n');row.append(button);node.append(row);}\n }\n async function adoptBrowser(){\n  const work=tail.then(async()=>{\n   const selected=await recoveryStorage.adopt(db,key,shell(),(local,prior)=>{\n    if(prior)validateRecovery(prior);const next=copy(local),all=[...(local.branches||[]),...(prior?.branches||[])],seen=new Set(all.map(b=>b.sha256));\n    for(const [reason,recovery]of [['This local branch before explicit selection',local],['Other saved browser branch before explicit selection',prior]])if(recovery&&!seen.has(hash(recovery))){seen.add(hash(recovery));all.push({id:S.id(),reason,sha256:hash(recovery),recovery:copy(recovery)});}\n    next.branches=all;return next;\n   });\n   lastStored=selected.sha256;branches=selected.value.branches;dirtyPersistence=false;proposals=await recoveryStorage.list(db,key);status();notice('This browser branch is selected. Both complete preimages and earlier proposals remain available below.');\n  });tail=work.catch(()=>{});return work;\n }\n async function savedDB(value){\n  const result=await recoveryStorage.save(db,key,value,lastStored);proposals=await recoveryStorage.list(db,key);\n  if(result.conflict)throw Error('Another opening saved the browser head. This complete proposal is independently retained below; explicitly select this branch or receive the saved recovery.');\n  lastStored=result.sha256;\n }\n function persist(){if(!ready)return Promise.resolve();dirtyPersistence=true;const work=tail.then(async()=>{const value=shell();await savedDB(value);dirtyPersistence=hash(shell())!==hash(value);status();});tail=work.catch(()=>{});return work.catch(e=>{status('Complete session remains in this tab; browser persistence needs attention: '+e.message);throw e;});}\n async function finish(result){\n  if(!['COMMITTED','REJECTED_NOT_COMMITTED'].includes(result.outcome))throw Error('Original request remains unresolved');\n  if(result.record.requestSha256!==hash(pending)||JSON.stringify(result.record.request)!==JSON.stringify(pending))throw Error('Original request outcome identity differs');\n  history.push({requestId:pending.id,requestSha256:result.record.requestSha256,recordSha256:hash(result.record),outcome:result.outcome,sequence:result.record.sequence??null,editionSha256:result.state.sha256,error:result.record.error??null});pending=null;state=result.state;\n  if(result.outcome==='COMMITTED'){setSession(S.receive(JSON.stringify(state.carrier)));needsRefresh=false;}\n  else needsRefresh=true;\n  await persist();render();status();notice(result.outcome==='COMMITTED'?'Complete managed session saved; original request retained.':'Save rejected before commit: '+result.record.error.message,true);\n }\n async function recover(){if(!pending)throw Error('No original request is pending');let r=await api('/api/request-status',pending);if(r.outcome==='UNRECORDED')r=await api('/api/request',pending);await finish(r);}\n async function save(){if(pending||needsRefresh)throw Error('Recover the original request or open the newest edition first');const carrier=S.pack(getSession());if(carrier.sha256===state.carrier.sha256){status();return;}\n  if(!getSession().draft.actor.trim())throw Error('Enter the operation actor before saving');\n  pending={schema:'stellar-forge.margin-request.v1',installationId:key,id:S.id(),baseSha256:state.sha256,actor:getSession().draft.actor.trim(),at:S.now(),kind:'save',carrier};\n  await persist();status();await recover();\n }\n async function refresh(){if(pending)throw Error('Recover the original request first');const next=await api('/api/state');const local=getSession(),fresh=S.receive(JSON.stringify(next.carrier));setSession(S.pack(local).sha256===next.carrier.sha256?fresh:S.replace(local,fresh,'Complete local branch before opening newest managed edition'));state=next;needsRefresh=false;await persist();render();status();notice('Newest saved edition opened. The complete prior local branch is retained in Open and restore.');}\n async function retainedExport(){if(pending||needsRefresh||S.pack(getSession()).sha256!==state.carrier.sha256)throw Error('Save the complete current session before exporting its retained managed edition');const file=await api('/api/export',{expectedSha256:state.sha256}),parts=[];let offset=0;\n  for(;;){const r=await api('/api/file?id='+file.fileId+'&offset='+offset+'&limit=196608');if(r.sha256!==file.sha256||r.bytes!==file.bytes||r.offset!==offset)throw Error('Retained export identity changed');const b=C.fromBase64(r.contentBase64);parts.push(b);offset+=b.length;if(r.nextOffset===null)break;if(r.nextOffset!==offset||!b.length)throw Error('Retained export continuation changed');}\n  const bytes=new Uint8Array(offset);let at=0;for(const p of parts){bytes.set(p,at);at+=p.length;}if(offset!==file.bytes||C.sha256Bytes(bytes)!==file.sha256)throw Error('Complete retained export differs');download('Margin_Source_Study_Managed_Handover.zip',bytes,'application/zip');notice('Complete retained handover downloaded.');\n }\n function run(fn){if(working)return;if(isOperatorBusy()){notice('Wait for the current operator action before saving or receiving.',true);return;}if(!ready){notice('Open the current private connection before managed actions.',true);return;}working=true;status('Working with the original saved edition…');Promise.resolve().then(fn).catch(e=>notice(e.message,true)).finally(()=>{working=false;status();});}\n document.getElementById('managed-adopt-browser').onclick=()=>run(adoptBrowser);\n document.getElementById('managed-save').onclick=()=>run(save);document.getElementById('managed-refresh').onclick=()=>run(refresh);document.getElementById('managed-recover').onclick=()=>run(recover);document.getElementById('managed-export').onclick=()=>run(retainedExport);\n document.getElementById('managed-copy').onclick=()=>download('Margin_Source_Study_Recovery.json',JSON.stringify(shell(),null,2)+'\\n');\n document.getElementById('managed-receive').onchange=e=>run(async()=>{const file=e.target.files[0];if(!file)return;if(file.size>256*1024*1024)throw Error('Recovery file exceeds the complete limit');const originalBytes=new Uint8Array(await file.arrayBuffer()),originalText=C.utf8Decode(originalBytes);if(C.toBase64(C.utf8Encode(originalText))!==C.toBase64(originalBytes))throw Error('Select exact UTF-8 recovery JSON');const received=JSON.parse(originalText);const incoming=validateRecovery(received);if(pending&&JSON.stringify(pending)!==JSON.stringify(received.pending))throw Error('Recover the current original request before opening a different one');if(received.pending&&(received.pending.installationId!==key||received.pending.baseSha256!==received.baseState.sha256))throw Error('Recovery request binding differs');history.push({localRecoveryBeforeReceive:shell()});state=received.baseState;pending=received.pending;history.push(...received.history);branches.push(...(received.branches||[]));needsRefresh=!!received.needsRefresh;setSession(incoming);await persist();render();status();notice('Complete recovery opened; recover its exact original request or select the newest managed edition.');});\n for(const event of ['click','input','change'])document.addEventListener(event,e=>{if((!ready||pending||working)&&!pane.contains(e.target)){e.preventDefault();e.stopImmediatePropagation();notice('Wait for connection or recover the original managed request before editing.',true);}},true);\n window.addEventListener('beforeunload',e=>{if(pending||dirtyPersistence||ready&&state.carrier.sha256!==S.pack(getSession()).sha256){e.preventDefault();e.returnValue='';}});\n async function initialize(){\n  if(!/^[a-f0-9]{64}$/.test(token))throw Error('Open the current private Applications link');\n  db=await recoveryStorage.open();\n  const selected=await recoveryStorage.read(db,key),prior=selected.value;proposals=await recoveryStorage.list(db,key);\n  const current=await api('/api/state');if(current.installationId!==key)throw Error('The managed installation identity changed');\n  lastStored=prior?hash(prior):null;\n  if(prior){validateRecovery(prior);state=prior.baseState;pending=prior.pending;history=prior.history;branches=prior.branches||[];needsRefresh=!!prior.needsRefresh;setSession(S.receive(JSON.stringify(prior.carrier)));if(!pending&&s  if(kind==="document"){const study=Core.addDocument(session.study,{name:file.name,media_type:file.type||"application/octet-stream",bytes,at:now(),notes:"Exact original retained. Link to a source or returned record below."});next=M.checkpoint(session,study,"Retain original document "+file.name);next.view="documents";}
 else {const text=new TextDecoder("utf-8",{fatal:true,ignoreBOM:true}).decode(bytes);retainedText=text;
  if(kind==="session"){let x=JSON.parse(text.charCodeAt(0)===0xfeff?text.slice(1):text),pending=x.schema==="margin.source-emergency/v1"?x:null;if(pending)x=pending.session;
   if(x.schema===M.SCHEMA||x.schema===M.LEGACY){x=M.normalize(x);exportSession();next=M.takeSession(session,x,"Before imported replacement");}
   else {Core.validate(x);exportSession();next=M.use(session,x,"Before imported study replacement");}
   if(pending){if(!pending.pending_forms||typeof pending.pending_forms!=="object"||Array.isArray(pending.pending_forms)||!Array.isArray(pending.pending_imports))throw Error("Invalid emergency recovery");nextEmergency={drafts:{...pending.pending_forms},imports:[...pending.pending_imports],reason:pending.reason||"Imported pending recovery"};}
  } else if(kind.startsWith("csv:")){const [,recordKind,side]=kind.split(":");if(!Core.KINDS.includes(recordKind)||!["source","returned"].includes(side))throw Error("Choose record kind and side");const t=Core.inspectCSV(text),key="intake:"+recordKind+":"+side;
   next=retainForm(key,"Before replacing pending CSV "+key);next=M.draft(next,key,{kind:recordKind,side,name:file.name,content:text,label:file.name,at:now(),available_at:now(),mapping:Object.fromEntries(Core.FIELDS[recordKind].map(field=>[field,t.header.includes(field)?field:""]))});
   next.selection.intakeKind=recordKind;next.selection.intakeSide=side;next.view="intake";
  } else throw Error("Unknown import route");
 }
 M.validate(next);session=next;if(nextEmergency)emergency=nextEmergency;else if(kind.startsWith("csv:"))delete emergency.drafts["intake:"+kind.split(":")[1]+":"+kind.split(":")[2]];dirty=true;message="Opened "+file.name+". Prior applied state and unfinished forms remain recoverable.";persist();
 }catch(e){if(retainedText!==null)retainImport(kind,file.name,retainedText,e.message);else if(retainedBytes)retainBinary(kind,file,retainedBytes,e.message);message=e.message+" — selected study and readable import candidate retained.";}
 finally{freeze(false);render();}

async function adoptLocal(){freeze(true);await flush();try{const local=M.clone(session);const out=await transaction("readwrite",(st,done,fail)=>{const q=st.get("active");q.onsuccess=()=>{try{const old=checkedSaved(q.result);let next=old?M.retain(local,old.session,"Saved branch acknowledged during explicit adoption"):local;next=M.retain(next,local,"Local branch before explicit adoption");next.revision++;M.validate(next);const h=M.hash(next);st.put({key:"active",hash:h,session:next,updated_at:now()});done({next,hash:h});}catch(e){fail(e);}};});session=out.next;seen=out.hash;conflict=false;storageError="";dirty=hasEmergency();message="This branch is selected. Both complete preimages remain in recovery.";}catch(e){storageError=e.message;dirty=true;message="Adoption failed; both copies remain retained.";}finally{freeze(false);render();}}
async function action(el){if(busy)return;const act=el.dataset.action;try{if(hasEmergency()&&["new-study","course","open-branch","restore-edition","open-saved"].includes(act))throw Error("Resolve or download-and-clear pending input in Save & recover before replacing the study.");
 if(act==="download-session")exportSession();
 else if(act==="export-zip"){await flush();download("margin-source-complete.zip",ZIP.write(M.exports(session).concat(hasEmergency()?[{path:"emergency-recovery.json",content:Core.json(recoveryEnvelope())}]:[])),"application/zip");say("Complete study, report, editable tables, originals and branches exported.");}
 else if(act==="export-source"){download("margin-source-application-source.zip",ZIP.write(sourceFiles),"application/zip");say("Complete application source downloaded.");}
 else if(act==="report"){const a=M.assess(session);if(!a.ok)throw Error(a.error);download("margin-source-report.md",Core.report(session.study,a.result),"text/markdown");}

 else if(act==="clear-emergency"){if(!confirm("Download the complete emergency file and clear its pending input? Applied study remains."))return;exportSession();emergency={drafts:{},imports:[],reason:""};persist();render();}
 else if(act==="download-emergency-import"){const p=emergency.imports.find(x=>x.key===el.dataset.key);if(!p)throw Error("Pending import missing");download(p.name,p.base64?Binary.decode(p.base64):p.text,p.media_type||"text/plain");}

 else if(act==="record-kind"||act==="record-side"){const next=M.clone(session);if(act==="record-kind")next.selection.recordKind=el.dataset.kind;else if(act==="record-side")next.selection.recordSide=el.dataset.side;next.revision++;replace(next,"Selection changed; unfinished forms retained.");}
 else if(act==="new-record"||act==="edit-record"){const kind=session.selection.recordKind||"costs",side=session.selection.recordSide||"returned",key="record:"+kind+":"+side;let value=recordBase(kind,side);if(act==="edit-record"){const i=Number(el.dataset.index),row=Core.rows(session.study,kind,side)[i];if(!row)throw Error("Selected row missing");value.row_index=i;value.value=M.clone(row.values);}let next=retainForm(key,"Before preparing another record");next=M.draft(next,key,value);replace(next,"Record editor prepared; previous draft is recoverable.",[key]);}
 else if(act==="preview-document"){const next=M.clone(session);next.selection.previewDocument=el.dataset.id;next.revision++;replace(next,"Selected retained photo.");}
 else if(act==="new-comparison"||act==="edit-comparison"){const value=comparisonDraft();if(act==="edit-comparison"){const c=session.study.config.margin.comparisons[Number(el.dataset.index)];if(!c)throw Error("Comparison missing");value.key=c.id;value.expected_sha256=M.hash(c);value.value=M.clone(c);}let next=retainForm("comparison-plan","Before preparing another comparison");next=M.draft(next,"comparison-plan",value);replace(next,"Comparison editor prepared; previous draft retained.",["comparison-plan"]);}
 else if(act==="remove-comparison"){const st=M.clone(session.study),index=Number(el.dataset.index),c=st.config.margin.comparisons[index];if(!c)throw Error("Comparison missing");if(!confirm("Remove this comparison? The complete prior plan remains in history."))return;st.config.margin.comparisons.splice(index,1);replace(M.checkpoint(session,st,"Remove comparison "+c.id),"Comparison removed; predecessor retained.");}
 else if(act==="new-review"){let next=M.retain(session,session,"Before explicitly restarting review");const old=draftValue("review",null);if(old)next=M.draft(next,"retained-review:"+M.hash(old),old);next=M.draft(next,"review",M.reviewDraft(session));replace(next,"Review started for the current complete comparison. Previous notes remain retained.",["review"]);}
 else if(act==="new-study"){if(!confirm("Start an empty study? Current complete session is retained and downloaded first."))return;exportSession();replace(M.use(session,Core.empty(),"Before new empty study"),"Empty margin-source study opened.");}
 else if(act==="course"){if(!confirm("Open the authored example? It contains fictional administrative data. Current session is retained."))return;exportSession();const k=el.dataset.course;if(!courses[k])throw Error("Select an example");replace(M.use(session,courses[k],"Before authored "+k+" study"),"Authored "+k+" study opened.");}
 else if(["intake-kind","intake-side","map-kind"].includes(act)){const next=M.clone(session);if(act==="intake-kind")next.selection.intakeKind=el.dataset.kind;else if(act==="intake-side")next.selection.intakeSide=el.dataset.side;else next.selection.mapKind=el.dataset.kind;next.revision++;replace(next,"Selection updated; pending forms retained.");}
 else if(act==="add-pair"||act==="remove-pair"){const kind=session.selection.mapKind||"costs",key="crosswalk:"+kind,base={kind,pairs:session.study.crosswalks.filter(x=>x.kind===kind).map(({source_id,target_id})=>({source_id,target_id}))},v=M.clone(draftValue(key,base));let next=retainForm(key,"Before changing draft identity pairs");if(act==="add-pair")v.pairs.push({source_id:"",target_id:""});else v.pairs.splice(Number(el.dataset.index),1);next=M.draft(next,key,v);replace(next,"Draft identity pairs updated.",[key]);}
 else if(act==="match-ids"){const kind=el.dataset.kind,key="crosswalk:"+kind;let next=retainForm(key,"Before adding exact-ID pairs");next=M.checkpoint(next,Core.matchIds(next.study,kind),"Add unique exact-ID maps");delete next.drafts[key];replace(next,"Unique identical IDs added. Earlier applied maps and drafts remain recoverable.",[key]);}
 else if(act==="edit-extract"){const e=session.study.extracts.find(x=>x.id===el.dataset.id);if(!e)throw Error("Extract missing");const o=session.study.originals.find(x=>x.id===e.original_id),key="intake:"+e.kind+":"+e.side;let next=retainForm(key,"Before editing mapping "+e.id);next=M.draft(next,key,{kind:e.kind,side:e.side,name:o.name,content:o.content,label:e.label,at:now(),available_at:e.available_at,mapping:M.clone(e.mapping)});next.selection.intakeKind=e.kind;next.selection.intakeSide=e.side;next.view="intake";replace(next,"Mapping revision prepared; original extract remains retained.",[key]);}
 else if(act==="download-intake"){const p=draftValue(el.dataset.key,null);if(!p)throw Error("Pending CSV missing");download(p.name,p.content,"text/csv");}
 else if(act==="unlink-document"){const link=session.study.document_links[Number(el.dataset.index)];if(!link)throw Error("Link not found");if(!confirm("Remove this exact record-document link from the selected study? Its document and complete prior edition remain retained."))return;replace(M.checkpoint(session,Core.unlinkDocument(session.study,link),"Remove explicit record-document link"),"Link removed. Exact document and prior relationship remain recoverable.");}
 else if(act==="download-document"){const d=session.study.documents.find(x=>x.id===el.dataset.id);if(!d)throw Error("Document missing");download(d.name,Binary.decode(d.base64),d.media_type);}
 else if(act==="reset-draft"){let next=retainForm(el.dataset.key,"Before resetting draft "+el.dataset.key);delete next.drafts[el.dataset.key];next.revision++;replace(next,"Form reset; previous form is in recovery.",[el.dataset.key]);}
 else if(act==="download-pending"){const p=session.drafts[el.dataset.key];if(!p)throw Error("Import candidate not found");download(p.name,p.base64?Binary.decode(p.base64):p.text,p.media_type||"text/plain");}
 else if(act==="retry-pending"){const p=session.drafts[el.dataset.key];if(!p)throw Error("Import candidate not found");await openFile(new File([p.base64?Binary.decode(p.base64):p.text],p.name,{type:p.media_type||"text/plain"}),p.kind);}
 else if(act==="save-notes"){const st=M.clone(session.study);st.notes=draftValue("study-notes",{})?.text??$("study-notes").value;replace(M.checkpoint(session,st,"Save study notes"),"Notes saved.");}
 else if(act==="download-original"){const o=session.study.originals.find(x=>x.id===el.dataset.id);if(!o)throw Error("Original not found");download(o.name,o.content,"text/plain");}
 else if(act==="download-branch"){const b=session.backups.find(b=>b.hash===el.dataset.id);if(!b)throw Error("Branch not found");download("margin-source-branch-"+b.hash.slice(0,12)+".json",Core.json(M.branchSession(session,b)));}
 else if(act==="open-branch"){const b=session.backups.find(b=>b.hash===el.dataset.id);if(!b)throw Error("Branch not found");exportSession();replace(M.takeSession(session,M.branchSession(session,b),"Before opening retained branch"),"Retained branch opened. If another saved copy exists, acknowledge it explicitly.");}
 else if(act==="restore-edition"){const h=session.history[Number(el.dataset.index)];if(!h)throw Error("Edition not found");exportSession();replace(M.use(session,M.historyStudy(session,h),"Before restoring study edition"),"Study edition restored; complete prior session retained.");}
 else if(act==="adopt-local")await adoptLocal();
 else if(act==="open-saved"){freeze(true);await flush();const old=await readActive();if(!old)throw Error("No saved copy exists");exportSession();const next=M.takeSession(session,old.session,"Local session before opening saved branch");seen=old.hash;session=next;conflict=false;dirty=true;persist();message="Saved branch opened; local branch retained.";freeze(false);render();}
 }catch(e){freeze(false);say(e.message);}}
document.addEventListener("input",e=>{if(busy)return;if(e.target.id==="record-filter"){const q=e.target.value.toLowerCase();document.querySelectorAll("[data-filter]").forEach(x=>x.hidden=!x.dataset.filter.includes(q));return;}if(e.target.id==="study-notes"){recordDraft("study-notes",{text:e.target.value});return;}const form=e.target.closest("form[data-key]");if(form){recordDraft(form.dataset.key,collect(form));}});

 if(kind==="config"){const st=M.clone(session.study);st.config={...st.config,...value};next=M.checkpoint(session,st,"Save study scope");}

 else if(kind==="record"){if(value.study_id!==session.study.id||value.expected_extract_id!==(Core.selected(session.study,value.kind,value.side)?.id||null))throw Error("Selected records changed after this draft began; retain it and prepare a fresh correction");next=M.checkpoint(session,Core.editRow(session.study,value),"Record source-backed "+value.kind+" revision");}
