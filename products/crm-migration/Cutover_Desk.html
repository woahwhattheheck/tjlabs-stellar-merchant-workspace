.map(([p,t])=>({path:p,bytes:codec.utf8Encode(t).length,sha256:codec.sha256(codec.utf8Encode(t))}))};physical(dir);fs.mkdirSync(dir,{recursive:true});const planPath=path.join(dir,\"EXPORT_PLAN.json\");if(!fs.existsSync(planPath)&&fs.readdirSync(dir).length)throw Error(\"Use an empty output directory or the same retained export plan\");exactWrite(planPath,JSON.stringify(plan,null,2)+\"\\n\");for(const[p,t]of Object.entries(files))exactWrite(path.join(dir,p),t);exactWrite(path.join(dir,\"COMPLETE.json\"),JSON.stringify({schema:\"crm-cutover.export-complete.v1\",workspace_sha256:plan.workspace_sha256,files:plan.files.length},null,2)+\"\\n\");emit(ws);}\n else if(command===\"desk\"){const[file,output]=args;if(!file||!output)throw Error(\"desk WORKSPACE OUTPUT.html\");const files={};for(const sub of [\"runtime\",\"cutover\"]){for(const name of fs.readdirSync(path.resolve(__dirname,\"..\",sub))){if(/\\.(js|cjs)$/.test(name))files[sub+\"/\"+name]=fs.readFileSync(path.resolve(__dirname,\"..\",sub,name),\"utf8\");}}const ws=model.restore(read(file)),html=require(\"../cutover/render-desk.cjs\").renderDesk(files,model.archive(ws));exactWrite(output,html);emit(ws);}\n else throw Error(\"Commands:\\n  init WORKSPACE ID TITLE\\n  course WORKSPACE\\n  inspect WORKSPACE\\n  apply WORKSPACE OPERATION.json\\n  export WORKSPACE OUTPUT_DIRECTORY\\n  desk WORKSPACE OUTPUT.html\\nNode.js 18+; standard library only.\");\n}catch(e){process.stderr.write(e.message+\"\\n\");process.exitCode=1;}\n","native/receive-source.cjs":"#!/usr/bin/env node\n'use strict';\nconst fs=require(\"node:fs\"),path=require(\"node:path\"),zlib=require(\"node:zlib\"),crypto=require(\"node:crypto\");\nfunction digest(b){return crypto.createHash(\"sha256\").update(b).digest(\"hex\");}\nfunction writeExact(p,b){fs.mkdirSync(path.dirname(p),{recursive:true,mode:0o700});try{fs.writeFileSync(p,b,{flag:\"wx\",mode:0o600});}catch(e){if(e.code!==\"EEXIST\"||!fs.readFileSync(p).equals(b))throw Error(\"Different existing member: \"+p);}}\ntry{const[carrierFile,destination]=process.argv.slice(2);if(!carrierFile||!destination||!path.isAbsolute(destination))throw Error(\"Usage: node receive-source.cjs CARRIER.json /absolute/new/directory\");\n const carrier=JSON.parse(fs.readFileSync(carrierFile,\"utf8\"));if(carrier.schema!==\"crm-cutover.source-carrier.v1\"||carrier.codec!==\"gzip+base64\")throw Error(\"Expected complete private source carrier\");\n const raw=zlib.gunzipSync(Buffer.from(carrier.data,\"base64\"));if(raw.length!==carrier.decoded_bytes||digest(raw)!==carrier.decoded_sha256)throw Error(\"Whole source identity mismatch\");\n const bank=JSON.parse(new TextDecoder(\"utf-8\",{fatal:true}).decode(raw)),seen=new Set();if(bank.schema!==\"crm-cutover.source-bank.v1\"||!Array.isArray(bank.files))throw Error(\"Expected source bank\");\n for(const f of bank.files){if(typeof f.path!==\"string\"||!f.path||f.path.includes(\"\\\\\")||path.isAbsolute(f.path)||f.path.split(\"/\").some(x=>!x||x===\".\"||x===\"..\")||seen.has(f.path))throw Error(\"Invalid or duplicate source path\");seen.add(f.path);const bytes=Buffer.from(f.content,\"utf8\");if(bytes.length!==f.bytes||digest(bytes)!==f.sha256)throw Error(\"Member identity mismatch: \"+f.path);}\n const root=path.resolve(destination);fs.mkdirSync(root,{recursive:true,mode:0o700});if(fs.realpathSync(root)!==root)throw Error(\"Choose a physical destination without symlinks\");\n const plan={schema:\"crm-cutover.source-receiving.v1\",decoded_sha256:carrier.decoded_sha256,files:bank.files.map(({path,bytes,sha256})=>({path,bytes,sha256}))};\n const planPath=path.join(root,\"SOURCE_RECEIVING.json\");if(!fs.existsSync(planPath)&&fs.readdirSync(root).length)throw Error(\"Choose an empty destination or the original matching receiving plan\");\n writeExact(planPath,Buffer.from(JSON.stringify(plan,null,2)+\"\\n\"));\n for(const f of bank.files){const target=path.join(root,f.path);for(let p=path.dirname(target);p!==root;p=path.dirname(p)){if(fs.existsSync(p)&&fs.lstatSync(p).isSymbolicLink())throw Error(\"Symbolic-link member directory\");}if(fs.existsSync(target)&&fs.lstatSync(target).isSymbolicLink())throw Error(\"Symbolic-link member\");writeExact(target,Buffer.from(f.content,\"utf8\"));}\n writeExact(path.join(root,\"SOURCE_COMPLETE.json\"),Buffer.from(JSON.stringify({decoded_sha256:carrier.decoded_sha256,files:bank.files.length},null,2)+\"\\n\"));process.stdout.write(JSON.stringify({directory:root,files:bank.files.length,sha256:carrier.decoded_sha256})+\"\\n\");\n}catch(e){process.stderr.write(e.message+\"\\n\");process.exitCode=1;}\n"},"archive":{"schema":"crm-cutover.archive.v1","sha256":"569c1caf5c4ea30971396720133b20aeebd7166ed0f94e83efbfa985632540e4","workspace":{"schema":"crm-cutover.workspace.v1","id":"authored-live-cutover","title":"Live migration cutover — authored operating example","revision":41,"originals":{"companies-s0":{"id":"companies-s0","filename":"companies-s0.csv","content":"\"source_id\",\"name\",\"owner\"\r\n\"A\",\"Acme\",\"Mia\"\r\n\"B\",\"Beacon\",\"Noah\"\r\n","bytes":67,"sha256":"5f38c7017dd1d582a96c74651a885c80a6f50dde6e2ed9e6fb13bb9d2977de78","actor":"Authored course operator","at":"2026-10-14T18:00:01.000Z"},"companies-s1":{"id":"companies-s1","filename":"companies-s1.csv","content":"\"source_id\",\"name\",\"owner\"\r\n\"A\",\"Acme Group\",\"Mia\"\r\n\"B\",\"Beacon\",\"Noah\"\r\n","bytes":73,"sha256":"881e2ecaccfc14fe557ae6efc759fd4daa095ec5926c571da767d439e2eb9a5e","actor":"Authored course operator","at":"2026-10-14T18:00:02.000Z"},"companies-t0":{"id":"companies-t0","filename":"companies-t0.csv","content":"\"Record ID\",\"name\",\"hubspot_owner_id\"\r\n\"101\",\"Acme\",\"Mia\"\r\n\"102\",\"Beacon\",\"Noah\"\r\n","bytes":82,"sha256":"af3319fbbce69c8a308343464c0d63d2de2e1c246cd308adbc10a24764b14b6e","actor":"Authored course operator","at":"2026-10-14T18:00:03.000Z"},"companies-t1":{"id":"companies-t1","filename":"companies-t1.csv","content":"\"Record ID\",\"name\",\"hubspot_owner_  async function versions(){if(!db)throw Error('Local storage unavailable');const records=await new Promise((resolve,reject)=>{const r=db.transaction('versions','readonly').objectStore('versions').getAll();r.onsuccess=()=>resolve(r.result.filter(x=>x.id===ws.id));r.onerror=()=>reject(r.error);});if(!records.length)throw Error('No retained versions');$('#main').innerHTML='<h2>Saved versions</h2><p>Opening a version downloads the current workspace first and adopts the chosen branch. Both versions remain retained.</p>'+records.map((r,i)=>'<p><button data-version="'+i+'">Open revision '+r.archive.workspace.revision+'</button> '+esc(r.saved_at)+' · '+esc(r.hash.slice(0,16))+'</p>').join('');$('#main').querySelectorAll('[data-version]').forEach(b=>b.onclick=async()=>{try{await replace(m.restore(records[Number(b.dataset.version)].archive));}catch(e){status(e.message,true);}});}
 const opts=(values,value)=>values.map(x=>{const [v,l]=Array.isArray(x)?x:[x,x];return'<option value="'+esc(v)+'"'+(v===value?' selected':'')+'>'+esc(l)+'</option>';}).join('');
 const input=(path,value,label,type='text')=>'<label>'+esc(label)+'<input data-path="'+esc(path)+'" type="'+type+'" value="'+esc(value)+'"></label>';
 const select=(path,value,values,label)=>'<label>'+esc(label)+'<select data-path="'+esc(path)+'">'+opts(values,value)+'</select></label>';
 const table=(headers,rows)=>'<div class="scroll"><table><thead><tr>'+headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(v=>'<td>'+esc(typeof v==='object'?json(v):v)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
 const button=(action,label)=>'<button data-action="'+action+'">'+label+'</button>';
 function stats(){return '<div class="stats">'+[['Originals',Object.keys(ws.originals).length],['Plans',Object.keys(ws.plans).length],['Packets',Object.keys(ws.packets).length],['Operations',ws.revision]].map(([k,v])=>'<div><strong>'+v+'</strong><span>'+k+'</span></div>').join('')+'</div>';}
 function mapping(){
  const ids=Object.keys(ws.originals),o=draft.objects[objectIndex],a=draft.associations[relationIndex],sourceOptions=[['','Select original'],...ids.map(i=>[i,i+' · '+ws.originals[i].filename])],cols=id=>[['','Select column'],...(ws.originals[id]?cmp.parseCSV(ws.originals[id].content).headers:[])];
  let html='<h2>Four-snapshot mapping</h2><p>Retain distinct baseline and current exports from both systems. Save a new configuration edition after changing selections.</p><div class="toolbar"><label>Copy saved configuration<select id="copy-config">'+opts(Object.keys(ws.configurations),Object.keys(ws.configurations).at(-1))+'</select></label>'+button('copy-config','Copy into editor')+'</div><div class="toolbar"><label>Object<select id="object-select">'+opts(draft.objects.map((x,i)=>[String(i),x.title||x.id]),String(objectIndex))+'</select></label>'+button('add-object','Add object')+(o?button('remove-object','Remove object'):'')+'</div>';
  if(o){const p='objects.'+objectIndex+'.';html+='<div class="grid">'+input(p+'id',o.id,'Stable object ID')+input(p+'title',o.title,'Object title')+['baseSource','source','baseTarget','target','crosswalk'].map(k=>select(p+k,o[k],sourceOptions,({baseSource:'Source at rehearsal',source:'Source at cutover',baseTarget:'Target at rehearsal',target:'Target before cutover',crosswalk:'Retained source-to-target IDs'})[k])).join('')+select(p+'sourceId',o.sourceId,cols(o.source),'Source record ID')+select(p+'targetId',o.targetId,cols(o.target),'Target record ID')+select(p+'crosswalkColumns.source',o.crosswalkColumns.source,cols(o.crosswalk),'Crosswalk source ID')+select(p+'crosswalkColumns.target',o.crosswalkColumns.target,cols(o.crosswalk),'Crosswalk target ID')+'</div><h3>Compared properties</h3>';
   o.fields.forEach((f,i)=>{const q=p+'fields.'+i+'.';html+='<section class="card"><div class="grid">'+input(q+'id',f.id,'Field ID')+select(q+'source',f.source,cols(o.source),'Source column')+select(q+'target',f.target,cols(o.target),'Target internal property')+select(q+'type',f.type||'text',['text','trim','lower','decimal','date','enum'],'Comparison type')+(f.type==='decimal'?input(q+'scale',f.scale??2,'Decimal places','number'):'')+'</div>';
    if(f.type==='enum'){const rows=Object.entries(f.sourceMap||{}).map(([source,canonical])=>({source,canonical,target:Object.keys(f.targetMap||{}).find(k=>f.targetMap[k]===canonical)||''}));html+='<p>Exact source → canonical → target values</p>'+rows.map((r,j)=>'<div class="grid">'+['source','canonical','target'].map(k=>'<label>'+k+'<input data-enum="'+i+':'+j+':'+k+'" value="'+esc(r[k])+'"></label>').join('')+'<button data-remove-enum="'+i+':'+j+'">Remove value</button></div>').join('')+'<button data-add-enum="'+i+'">Add mapped value</button>';}
    html+='<button data-remove-field="'+i+'">Remove property</button></section>';});html+=button('add-field','Add property');}
  html+='<h3>Directed relationships</h3><div class="toolbar"><label>Family<select id="relation-select">'+opts(draft.associations.map((x,i)=>[String(i),x.title||x.id]),String(relationIndex))+'</select></label>'+button('add-relation','Add relationship family')+(a?button('remove-relation','Remove family'):'')+'</div>';
  if(a){const p='associations.'+relationIndex+'.',objs=draft.objects.map(o=>[o.id,o.title]);html+='<div class="grid">'+input(p+'id',a.id,'Family ID')+input(p+'title',a.title,'Title')+select(p+'fromObject',a.fromObject,objs,'From object')+select(p+'toObject',a.toObject,objs,'To object')+['baseSource','source','baseTarget','target'].map(k=>select(p+k,a[k],sourceOptions,k)).join('')+['from','to','type'].map(k=>select(p+'sourceColumns.'+k,a.sourceColumns[k],cols(a.source),'Source '+k)).join('')+['from','to','category','typeId'].map(k=>select(p+'targetColumns.'+k,a.targetColumns[k],cols(a.target),'Target '+k)).join('')+'</div>';
   a.types.forEach((t,i)=>{const q=p+'types.'+i+'.';html+='<section class="card"><div class="grid">'+input(q+'source',t.source,'Source relationship')+select(q+'category',t.category,['HUBSPOT_DEFINED','USER_DEFINED'],'Category')+input(q+'typeId',t.typeId,'Exact target type ID')+select(q+'primaryCompany',String(!!t.primaryCompany),['false','true'],'At most one primary company')+'</div><button data-remove-type="'+i+'">Remove type</button></section>';});html+=button('add-type','Add relationship type');}
  return html+'<div class="toolbar"><label>New configuration ID<input id="config-id" value="'+uid('config')+'"></label><label>Title<input id="config-title" value="Cutover window"></label>'+button('save-config','Save configuration edition')+'</div>';
 }
 function render(){
  $('#title').textContent=ws.title;$('#nav').innerHTML=['overview','originals','mapping','plans','packets','reconcile','history'].map(t=>'<button data-tab="'+t+'" aria-pressed="'+(t===tab)+'">'+t[0].toUpperCase()+t.slice(1)+'</button>').join('');let h=stats();
  if(tab==='overview')h+='<h2>Live migration cutover</h2><p>Import four snapshots, map properties and relationships, review concurrent edits, issue the proposed change packet, then reconcile an observed destination export. The included example uses authored CSV fixtures.</p><ol><li>Originals: add complete CSV editions.</li><li>Mapping: select baseline/current exports and retained IDs.</li><li>Plans: inspect four values and record decisions.</li><li>Packets: download proposed changes and guarded reversal.</li><li>Reconcile: compare actual exports with the issued packet.</li></ol><p>Each packet remains tied to the exact original files. Actual platform execution is recorded separately by the named operator.</p>';
  if(tab==='originals'){const s=ws.originals[sourceId];h+='<h2>Original CSVs</h2><div class="grid"><label>New original ID<input id="source-id" value="'+uid('source')+'"></label><label>Filename<input id="source-name" value="export.csv"></label><label>Load UTF-8 CSV<input type="file" id="csv-file" accept=".csv,text/csv"></label></div><label>Complete original text<textarea id="source-content" rows="7"></textarea></label>'+button('ingest','Retain original')+'<hr><label>Retained original<select id="source-select">'+opts(Object.keys(ws.originals),sourceId)+'</select></label>';
   if(s){const t=cmp.parseCSV(s.content);h+='<p>'+esc(s.filename)+' · '+s.bytes+' bytes · '+esc(s.sha256)+'</p>'+button('download-source','Download exact original')+table(t.headers,t.records.slice(0,150).map(r=>t.headers.map(k=>r.values[k])))+'<p>Showing '+Math.min(150,t.records.length)+' of '+t.records.length+' rows.</p>';}}
  if(tab==='mapping')h+=mapping();
  if(tab==='plans'){const p=ws.plans[planId];h+='<h2>Change plans</h2><div class="toolbar"><label>Configuration<select id="plan-config">'+opts(Object.keys(ws.configurations),Object.keys(ws.configurations).at(-1))+'</select></label><label>New plan ID<input id="new-plan" value="'+uid('plan')+'"></label>'+button('build-plan','Build plan')+'</div><label>Retained plan<select id="plan-select">'+opts(Object.keys(ws.plans),planId)+'</select></label>';
   if(p){h+='<p>'+p.output.items.length+' changes · '+p.output.issues.length+' input issues</p>'+table(['Issue','Object','Record','Detail'],p.output.issues.map(x=>[x.code,x.entity,x.record,x.message]))+'<label>Filter<input id="filter" value="'+esc(filter)+'" placeholder="Object, record or change kind"></label>';
    for(const x of p.output.items.filter(x=>[x.entity,x.record,x.kind,x.field].join(' ').toLowerCase().includes(filter.toLowerCase()))){const saved=p.decisions.filter(d=>d.item_id===x.id).at(-1),d=decisionDrafts[x.id]?{...saved,...decisionDrafts[x.id]}:saved;h+='<section class="card"><h3>'+esc(x.entity+' / '+x.record+(x.field?' / '+x.field:''))+'</h3><p>'+esc(x.kind)+(x.needsDecision?' · decision required':'')+'</p>'+table(['Source before','Source now','Target before','Target now','Proposed'],[[x.baseSource??'',x.source,x.baseTarget??'',x.target,x.proposal]])+'<details><summary>Original rows</summary>'+table(['Original','Row','Values'],x.refs.map(r=>[r.table,r.row,r.values]))+'</details>'+(d?'<p>Latest decision: '+esc(d.choice+' — '+(d.actor||'unsaved')+' — '+d.reason)+'</p>':'')+'<div class="grid"><label>Choice<select data-choice="'+x.id+'">'+opts(['defer','accept_source','preserve_target',...(!x.relation&&x.field?['custom']:[])],d?.choice||'defer')+'</select></label><label>Custom target value<input data-custom="'+x.id+'" value="'+esc(d?.value||'')+'"></label><label>Reason<input data-reason="'+x.id+'" value="'+esc(d?.reason||'')+'"></label></div><button data-decide="'+x.id+'">Record decision</button></section>';}
    h+='<div class="toolbar"><label>New packet ID<input id="new-packet" value="'+uid('packet')+'"></label>'+button('issue','Issue proposed change packet')+'</div>';}}
  if(tab==='packets'){const p=ws.packets[packetId];h+='<h2>Issued packets</h2><label>Packet<select id="packet-select">'+opts(Object.keys(ws.packets),packetId)+'</select></label>';if(p){h+='<p>Issued by '+esc(p.output.actor)+' at '+esc(p.output.at)+' · '+esc(p.output.sha256)+'</p>'+button('packet-download','Download complete packet')+button('reversal-download','Download guarded reversal')+table(['Order','Action','Object/family','Source ID','Target ID','Property','Value'],p.output.steps.map(s=>[s.order,s.kind,s.object||s.family,s.sourceId||s.from,s.targetId||s.to,s.property||s.type,s.value??s.properties??'']))+'<details><summary>Preserved destination work and explicit decisions</summary><pre>'+esc(json(p.output.preserved))+'</pre></details><h3>Record an actual platform execution</h3><p>Use only after the platform operator executed the selected steps.</p><label>Completed step IDs, one per line<textarea id="execution-steps" rows="4"></textarea></label><div class="grid"><label>Executed at (UTC)<input id="execution-at" value="'+new Date().toISOString()+'"></label><label>Job or change reference<input id="execution-ref"></label></div><label>Notes<textarea id="execution-notes"></textarea></label>'+button('record-execution','Record actual execution');}}
  if(tab==='reconcile'){const p=ws.packets[packetId];h+='<h2>Post-change observations</h2><label>Packet<select id="packet-select">'+opts(Object.keys(ws.packets),packetId)+'</select></label>';if(p){const choices=[['','Choose original'],...Object.keys(ws.originals)];h+='<p>Retain fresh complete destination exports and updated crosswalks in Originals, then select them here.</p>';for(const o of p.output.contract.objects)h+='<section class="card"><h3>'+esc(o.title)+'</h3><div class="grid"><label>Destination export<select data-observed="'+esc(o.id)+':target">'+opts(choices,'')+'</select></label><label>Updated source-to-target IDs<select data-observed="'+esc(o.id)+':crosswalk">'+opts(choices,'')+'</select></label></div></section>';for(const a of p.output.contract.associations)h+='<label>'+esc(a.title)+' destination relationships<select data-observed="'+esc(a.id)+':target">'+opts(choices,'')+'</select></label>';h+='<div class="toolbar"><label>New observation ID<input id="observation-id" value="'+uid('observed')+'"></label>'+button('reconcile','Reconcile retained originals')+button('check-reversal','Check reversal against observations')+'</div>';}
   for(const r of Object.values(ws.reconciliations).reverse())h+='<section class="card"><h3>'+esc(r.id)+' · '+r.output.findings.length+' differences</h3><p>'+esc(r.actor+' · '+r.at)+'</p>'+table(['Code','Object','Record','Property','Expected','Observed'],r.output.findings.map(x=>[x.code,x.entity,x.record,x.field,x.expected,x.actual]))+'</section>';}
  if(tab==='history')h+='<h2>Complete operation history</h2>'+table(['Revision','Operator','Time','Operation','Result'],ws.operations.slice().reverse().map(x=>[x.revision,x.request.actor,x.request.at,x.request.kind,x.result]))+'<h3>Recorded platform executions</h3>'+table(['Packet','Executed at','Recorded by','Reference'],ws.executions.map(x=>[x.packet_id,x.executed_at,x.recorded_by,x.reference]));
  $('#main').innerHTML=h;
 }
 function setPath(path,v){const parts=path.split('.');let at=draft;for(const part of parts.slice(0,-1))at=at[part];const last=parts.at(-1);at[last]=last==='scale'?Number(v):last==='primaryCompany'?v==='true':v;mappingDirty=true;}
 function enumRows(f){return Object.entries(f.sourceMap||{}).map(([source,canonical])=>({source,canonical,target:Object.keys(f.targetMap||{}).find(k=>f.targetMap[k]===canonical)||''}));}
 function writeEnum(f,rows){if(new Set(rows.map(r=>r.source)).size!==rows.length||new Set(rows.map(r=>r.target)).size!==rows.length)throw Error('Each source and target enum key must be distinct');f.sourceMap=Object.fromEntries(rows.map(r=>[r.source,r.canonical]));f.targetMap=Object.fromEntries(rows.map(r=>[r.target,r.canonical]));mappingDirty=true;}
 function observed(){const r={};document.querySelectorAll('[data-observed]').forEach(el=>{const [entity,role]=el.dataset.observed.split(':');if(!el.value)throw Error('Select every observation original');(r[entity]??={})[role]=el.value;});return r;}
 document.addEventListener('input',e=>{const el=e.target;if(el.dataset.path){setPath(el.dataset.path,el.value);return;}if(el.dataset.enum){mappingDirty=true;return;}if(el.id==='filter')return;if(el.closest('#main'))dirty=true;for(const k of ['choice','custom','reason'])if(el.dataset[k]){const id=el.dataset[k];(decisionDrafts[id]??={})[k==='custom'?'value':k]=el.value;}});
 document.addEventListener('change',async e=>{try{const el=e.target;
  if(el.dataset.path){setPath(el.dataset.path,el.value);if(el.dataset.path.endsWith('.type')&&el.value==='enum'){const f=draft.objects[objectIndex].fields[Number(el.dataset.path.split('.')[3])];f.sourceMap??={};f.targetMap??={};}render();return;}
  if(el.dataset.enum){const [i,j,k]=el.dataset.enum.split(':'),f=draft.objects[objectIndex].fields[Number(i)],rows=enumRows(f);rows[Number(j)][k]=el.value;writeEnum(f,rows);return;}
  if(el.id==='csv-file'&&el.files[0]){$('#source-content').value=await el.files[0].text();$('#source-name').value=el.files[0].name;dirty=true;return;}
  if(el.id==='filter'){filter=el.value;render();return;}
  const selections={'source-select':v=>sourceId=v,'object-select':v=>objectIndex=Number(v),'relation-select':v=>relationIndex=Number(v),'plan-select':v=>planId=v,'packet-select':v=>packetId=v};
  if(selections[el.id]){if(!['object-select','relation-select'].includes(el.id)&&dirty){if(!confirm('Discard unsaved form entries before changing selection?')){render();return;}dirty=false;decisionDrafts={};}selections[el.id](el.value);render();}
 }catch(error){status(error.message,true);}});
 document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;try{
  if(b.dataset.tab){if(dirty){if(!confirm('Discard unsaved form entries before changing pages?'))return;dirty=false;decisionDrafts={};}tab=b.dataset.tab;render();return;}
  if(b.dataset.removeField!==undefined){draft.objects[objectIndex].fields.splice(Number(b.dataset.removeField),1);mappingDirty=true;render();return;}
  if(b.dataset.removeType!==undefined){draft.associations[relationIndex].types.splice(Number(b.dataset.removeType),1);mappingDirty=true;render();return;}
  if(b.dataset.addEnum!==undefined){const f=draft.objects[objectIndex].fields[Number(b.dataset.addEnum)],rows=enumRows(f),n=rows.length+1;rows.push({source:'source-'+n,canonical:'value-'+n,target:'target-'+n});writeEnum(f,rows);render();return;}
  if(b.dataset.removeEnum!==undefined){const[i,j]=b.dataset.removeEnum.split(':').map(Number),f=draft.objects[objectIndex].fields[i],rows=enumRows(f);rows.splice(j,1);writeEnum(f,rows);render();return;}
  if(b.dataset.decide){const id=b.dataset.decide;await command('decide',{plan_id:planId,item_id:id,choice:document.querySelector('[data-choice="'+id+'"]').value,value:document.querySelector('[data-custom="'+id+'"]').value,reason:document.querySelector('[data-reason="'+id+'"]').value});delete decisionDrafts[id];dirty=Object.keys(decisionDrafts).length>0;render();return;}
  const a=b.dataset.action;if(!a)return;const o=draft.objects[objectIndex],r=draft.associations[relationIndex];
  if(a==='save-workspace'){saveWorkspace();status('Workspace downloaded. Unsaved form changes remain in this tab.');return;}
  if(a==='open-workspace'){$('#workspace-file').click();return;}
  if(a==='versions'){if(!discard())return;await versions();return;}
  if(a==='new-workspace'){const title=prompt('Workspace title');if(title?.trim())await replace(m.create(uid('cutover'),title.trim()));return;}
  if(a==='export'){download(ws.id+'-r'+ws.revision+'.zip',rt.zipper.zip(rt.exportFiles(ws)),'application/zip');return;}
  if(a==='ingest'){sourceId=$('#source-id').value;await command('ingest',{id:sourceId,filename:$('#source-name').value,content:$('#source-content').value});dirty=false;}
  if(a==='download-source'){const s=ws.originals[sourceId];download(s.filename,s.content,'text/csv;charset=utf-8');return;}
  if(a==='copy-config'){if(!discard())return;draft=clone(ws.configurations[$('#copy-config').value].contract);objectIndex=relationIndex=0;mappingDirty=false;}
  if(a==='add-object'){draft.objects.push({id:uid('object'),title:'New object',sourceId:'',targetId:'',baseSource:'',source:'',baseTarget:'',target:'',crosswalk:'',crosswalkColumns:{source:'',target:''},fields:[]});objectIndex=draft.objects.length-1;mappingDirty=true;}
  if(a==='remove-object'){draft.objects.splice(objectIndex,1);objectIndex=Math.max(0,objectIndex-1);mappingDirty=true;}
  if(a==='add-field'){o.fields.push({id:uid('field'),source:'',target:'',type:'text'});mappingDirty=true;}
  if(a==='add-relation'){draft.associations.push({id:uid('relation'),title:'New relationship',fromObject:draft.objects[0]?.id||'',toObject:draft.objects[1]?.id||'',baseSource:'',source:'',baseTarget:'',target:'',sourceColumns:{from:'',to:'',type:''},targetColumns:{from:'',to:'',category:'',typeId:''},types:[]});relationIndex=draft.associations.length-1;mappingDirty=true;}
  if(a==='remove-relation'){draft.associations.splice(relationIndex,1);relationIndex=Math.max(0,relationIndex-1);mappingDirty=true;}
  if(a==='add-type'){r.types.push({source:'relationship-'+(r.types.length+1),category:'USER_DEFINED',typeId:'',primaryCompany:false});mappingDirty=true;}
  if(a==='save-config'){await command('configure',{id:$('#config-id').value,title:$('#config-title').value,contract:draft});mappingDirty=false;dirty=false;}
  if(a==='build-plan'){planId=$('#new-plan').value;await command('plan',{id:planId,configuration_id:$('#plan-config').value});dirty=false;}
  if(a==='issue'){packetId=$('#new-packet').value;await command('issue_packet',{id:packetId,plan_id:planId});dirty=false;tab='packets';}
  if(a==='packet-download'){download(packetId+'.packet.json',ws.packets[packetId]);return;}
  if(a==='reversal-download'){download(packetId+'.reversal.json',ws.packets[packetId].output.reversal);return;}
  if(a==='record-execution'){await command('record_execution',{packet_id:packetId,step_ids:$('#execution-steps').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),executed_at:$('#execution-at').value,reference:$('#execution-ref').value,notes:$('#execution-notes').value});dirty=false;}
  if(a==='reconcile'){await command('reconcile',{id:$('#observation-id').value,packet_id:packetId,observed:observed()});dirty=false;}
  if(a==='check-reversal'){const selected=observed(),o={};for(const[e,roles]of Object.entries(selected))o[e]=Object.fromEntries(Object.entries(roles).map(([role,id])=>[role,ws.originals[id].content]));const result=rt.core.reversalCheck(ws.packets[packetId].output,o);download(packetId+'.reversal-check.json',result);status(result.ready.length+' eligible reversals · '+result.conflicts.length+' conflicts · '+result.manual.length+' created records needing manual review');return;}
  render();
 }catch(error){status(error.message,true);}});
 $('#workspace-file').addEventListener('change',async e=>{try{if(e.target.files[0]){const next=m.restore(JSON.parse(await e.target.files[0].text()));await replace(next);}}catch(error){status('Import failed: '+error.message,true);}finally{e.target.value='';}});
 addEventListener('beforeunload',e=>{if(dirty||mappingDirty||!persisted||busy){e.preventDefault();e.returnValue='';}});
 (async()=>{render();try{db=await openDB();const old=await getCurrent(ws.id);if(old){if(confirm('Open the locally saved version of this workspace?')){ws=m.restore(old.archive);expected=old.hash;persisted=true;reset();render();status('Opened local revision '+ws.revision);}else{status('Embedded copy open. Save it or use Saved versions before continuing this existing branch.',true);}}else await persist(ws);}catch(error){persisted=false;status('Local saving unavailable: '+error.message+'. Download the workspace before closing.',true);}})();
})();</script></body></html>
