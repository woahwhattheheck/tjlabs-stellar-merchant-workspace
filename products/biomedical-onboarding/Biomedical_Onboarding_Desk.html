from './src/session.mjs';\nconst core=Core,originalSessions=OriginalSessions,sessions=createBiomedicalOnboardingSessionAPI(core,originalSessions,codec);\nexport {core,originalSessions,sessions,codec};\nexport const workspaceHead=w=>{originalSessions.validate(w);return originalSessions.hash(w);};\nexport function applyDomain(workspace,operation){\n originalSessions.validate(workspace);if(operation.expectedHead!==workspaceHead(workspace))throw Error('The complete selected onboarding session changed');const p=operation.payload||{},w=workspace.study;let next,reason=operation.kind;\n if(operation.kind==='import')next=core.importExtract(w,p);\n else if(operation.kind==='choose')next=core.choose(w,p.kind,p.side,p.extractId);\n else if(operation.kind==='crosswalk')next=core.crosswalk(w,p.kind,p.pairs);\n else if(operation.kind==='match-ids')next=core.matchIds(w,p.kind);\n else if(operation.kind==='document')next=core.addDocument(w,{...p,bytes:codec.fromBase64(p.contentBase64)});\n else if(operation.kind==='link-document')next=core.linkDocument(w,p);\n else if(operation.kind==='unlink-document')next=core.unlinkDocument(w,p);\n else if(operation.kind==='review')next=core.review(w,p);\n else if(operation.kind==='configure'){next=core.clone(w);next.config={...p,selection:w.config.selection};core.validate(next);}\n else if(operation.kind==='notes'){next=core.clone(w);next.notes=p.text;core.validate(next);}\n else if(operation.kind==='migrate-v1'){const parsed=JSON.parse(p.originalText.replace(/^\\uFEFF/,'')),migrated=Migrate.migrate(parsed,p.originalText,p.filename,operation.at);return {workspace:originalSessions.takeSession(workspace,migrated,'Before explicit v1 migration')};}\n else throw Error('Choose a declared complete onboarding operation');\n let successor=originalSessions.checkpoint(workspace,next,'Native '+reason);successor=originalSessions.retain(successor,workspace,'Complete editor before '+reason);return {workspace:originalSessions.validate(successor)};\n}\n"},{"path":"session.cjs","content":"'use strict';\nmodule.exports=(function sessionFactory(Core,SHA){\n\"use strict\";\nconst SCHEMA=\"biomed.onboarding-session/v2\";\nconst frozen=new WeakSet(),digestCache=new WeakMap(),studyCache=new WeakSet(),rootCache=new Map();\nconst clone=x=>JSON.parse(JSON.stringify(x)),now=()=>new Date().toISOString();\nfunction freezeDeep(x){if(!x||typeof x!==\"object\"||frozen.has(x))return x;for(const v of Object.values(x))freezeDeep(v);Object.freeze(x);frozen.add(x);return x;}\nfunction hash(x){if(x&&typeof x===\"object\"&&frozen.has(x)&&digestCache.has(x))return digestCache.get(x);const h=SHA.sha256Utf8(JSON.stringify(x)).sha256;if(x&&typeof x===\"object\"&&frozen.has(x))digestCache.set(x,h);return h;}\nfunction checkedStudy(st){if(studyCache.has(st))return st;shape(st);freezeDeep(st);studyCache.add(st);return st;}\n\nfunction assert(ok,msg){if(!ok)throw Error(msg);}\nfunction shape(s){return Core.validate(s);}\n\nconst LIMIT=40*1024*1024,LEGACY=\"biomed.onboarding-session/legacy\",collections=[\"originals\",\"documents\",\"document_links\",\"extracts\",\"crosswalks\",\"reviews\"];\nfunction create(study=Core.empty()){checkedStudy(study);return {schema:SCHEMA,id:\"session-\"+Date.now()+\"-\"+Math.random().toString(36).slice(2,8),revision:0,study:checkedStudy(clone(study)),drafts:{},view:\"study\",selection:{},history:[],backups:[],archive:{},saved_at:null};}\nfunction put(bank,value){const key=hash(value);if(!Object.hasOwn(bank,key)){bank[key]=freezeDeep(value);if(value&&typeof value===\"object\")digestCache.set(value,key);}return key;}\nfunction get(bank,key){assert(typeof key===\"string\"&&Object.hasOwn(bank,key),\"Missing retained object \"+key);return bank[key];}\nfunction packStudy(bank,study){const x={kind:\"study\",schema:study.schema,id:study.id,config:put(bank,study.config),notes:put(bank,study.notes)};for(const k of collections)x[k]=study[k].map(row=>put(bank,row));return put(bank,x);}\nfunction studyAt(s,key){const b=get(s.archive,key);assert(b.kind===\"study\",\"Invalid retained study\");const x={schema:b.schema,id:b.id,config:clone(get(s.archive,b.config)),notes:get(s.archive,b.notes)};for(const k of collections){assert(Array.isArray(b[k]),\"Invalid retained study collection\");x[k]=b[k].map(r=>clone(get(s.archive,r)));}return x;}\nfunction bodyAt(s,key){const b=get(s.archive,key);assert(b.kind===\"session\",\"Invalid retained session\");return {schema:SCHEMA,id:b.id,revision:b.revision,study:studyAt(s,b.study_ref),drafts:clone(get(s.archive,b.drafts_ref)),view:b.view,selection:clone(get(s.archive,b.selection_ref)),history:clone(b.history),backups:[],archive:{...s.archive},saved_at:b.saved_at};}\nfunction branchInfo(s,b){const p=get(s.archive,b.session_ref),st=get(s.archive,p.study_ref);return {title:get(s.archive,st.config).label,revision:p.revision};}\nfunction branchSession(s,b){const x=bodyAt(s,b.session_ref);x.backups=clone(s.backups);return validate(x);}\nfunction historyStudy(s,h){return studyAt(s,h.study_ref);}\nfunction byteLength(str){let n=0;for(let i=0;i\u003cstr.length;i++){const c=str.charCodeAt(i);if(c\u003c128)n++;else if(c\u003c2048)n+=2;else if(c>=0xd800&&c\u003c=0xdbff&&i+1\u003cstr.length&&str.charCodeAt(i+1)>=0xdc00&&str.charCodeAt(i+1)\u003c=0xdfff){n+=4;i++;}else n+=3;}return n;}\nfunction validate(s){\n assert(s&&s.schema===SCHEMA,\"Unsupported session schema\");assert(typeof s.id===\"string\"&&Number.isSafeInteger(s.revision)&&s.revision>=0,\"Invalid session identity/revision\");checkedStudy(s.study);\n assert(s.drafts&&typeof s.drafts===\"object\"&&!Array.isArray(s.drafts),\"Invalid draft forms\");assert(s.selection&&typeof s.selection===\"object\"&&!Array.isArray(s.selection),\"Invalid selection\");assert(typeof s.view===\"string\"&&Array.isArray(s.history)&&Array.isArray(s.backups),\"Invalid session views/history/backups\");\n assert(s.archive&&typeof s.archive===\"object\"&&!Array.isArray(s.archive),\"Invalid recovery object bank\");\n for(const [k,v] of Object.entries(s.archive)){assert(/^[a-f0-9]{64}$/.test(k)&&hash(v)===k,\"Retained object changed: \"+k);freezeDeep(v);if(v&&typeof v===\"object\")digestCache.set(v,k);}\n const seenStudies=new Set(),checkStudy=k=>{if(seenStudies.has(k))return;seenStudies.add(k);const p=get(s.archive,k);assert(p.kind===\"study\",\"Invalid study root\");if(rootCache.has(k)){for(const ref of rootCache.get(k))get(s.archive,ref);}else{shape(studyAt(s,k));rootCache.set(k,[p.config,p.notes,...collections.flatMap(c=>p[c])]);}};\n const checkHistory=arr=>{assert(Array.isArray(arr),\"Invalid retained history\");for(const h of arr){assert(h&&typeof h.reason===\"string\"&&typeof h.at===\"string\",\"Invalid history\");checkStudy(h.study_ref);}};\n checkHistory(s.history);\n for(const b of s.backups){assert(b&&b.hash===b.session_ref&&typeof b.reason===\"string\"&&typeof b.at===\"string\",\"Invalid retained branch\");const p=get(s.archive,b.session_ref);assert(p.kind===\"session\"&&p.schema===SCHEMA&&typeof p.id===\"string\"&&Number.isSafeInteger(p.revision),\"Invalid retained branch identity\");checkStudy(p.study_ref);assert(get(s.archive,p.drafts_ref)&&typeof get(s.archive,p.drafts_ref)===\"object\",\"Invalid retained forms\");get(s.archive,p.selection_ref);checkHistory(p.history);}\n assert(byteLength(JSON.stringify(s))\u003c=LIMIT,\"Complete session exceeds 40 MiB. Pending input must be saved with the emergency recovery download.\");return s;\n}\nfunction normalize(input){\n if(input?.schema===SCHEMA)return validate(input);\n assert(input?.schema===LEGACY,\"Unsupported session schema\");const old=clone(input),out=create(shape(old.study));out.id=old.id;out.revision=old.revision;out.drafts=old.drafts;out.view=old.view;out.selection=old.selection;out.saved_at=old.saved_at;\n for(const h of old.history||[])out.history.push({at:h.at,reason:h.reason,study_ref:packStudy(out.archive,shape(h.study))});\n let x=out;for(const b of old.backups||[]){assert(b&&hash(b.session)===b.hash,\"Legacy retained branch changed\");const child=normalize(b.session);x=retain(x,child,b.reason);}\n return validate(x);\n}\nfunction retain(s,other,reason){validate(other);const bank={...s.archive,...other.archive},body={kind:\"session\",schema:SCHEMA,id:other.id,revision:other.revision,study_ref:packStudy(bank,other.study),drafts_ref:put(bank,clone(other.drafts)),view:other.view,selection_ref:put(bank,clone(other.selection)),history:clone(other.history),saved_at:other.saved_at},h=put(bank,body);\n const all=[...s.backups,...other.backups,{hash:h,session_ref:h,at:now(),reason}],seen=new Set();return {...s,drafts:clone(s.drafts),selection:clone(s.selection),archive:bank,backups:all.filter(a=>!seen.has(a.hash)&&seen.add(a.hash))};}\nfunction retainStudy(s,study,reason,at=now()){checkedStudy(study);const bank={...s.archive},study_ref=packStudy(bank,study);return validate({...s,archive:bank,history:[...s.history,{at,reason,study_ref}]});}\nfunction checkpoint(s,nextStudy,reason){checkedStudy(nextStudy);const bank={...s.archive},study_ref=packStudy(bank,s.study);return validate({...s,drafts:clone(s.drafts),selection:clone(s.selection),study:clone(nextStudy),archive:bank,history:[...s.history,{at:now(),reason,study_ref}],revision:s.revision+1,saved_at:null});}\nfunction draft(s,key,value){return validate({...s,drafts:{...s.drafts,[key]:clone(value)},revision:s.revision+1,saved_at:null});}\nfunction use(s,study,reason){let x=retain(s,s,reason);x=checkpoint(x,study,reason);return {...x,drafts:{},selection:{},view:\"study\"};}\nfunction takeSession(s,other,reason){other=normalize(other);let x=retain(other,s,reason);x=retain(x,other,\"Imported/opened session preimage\");return validate({...x,revision:x.revision+1,saved_at:null});}\nfunction reviewDraft(s){return{study_sha256:Core.digest(s.study),reviewer:\"\",at:now(),decision:\"revise\",notes:\"\"};}\nfunction recordReview(s,value){return checkpoint(s,Core.review(s.study,value),\"Record operator review\");}\nfunction assess(s){try{return{ok:true,result:Core.analyze(s.study)}}catch(e){return{ok:false,error:e.message};}}\nfunction exports(s){validate(s);return[{path:\"session.json\",content:Core.json(s)},...Core.exports(s.study),{path:\"recovery/index.json\",content:Core.json({schema:\"biomed.recovery-index/v2\",session:\"../session.json\",branches:s.backups,history:s.history,guide:\"The complete session carries every unfinished form and retained branch. Open it in Biomedical Onboarding Desk.\"})}];}\nreturn{assess,exports,SCHEMA,LEGACY,LIMIT,clone,hash,shape,create,validate,normalize,retain,retainStudy,checkpoint,draft,use,takeSession,historyStudy,branchSession,branchInfo,reviewDraft,recordReview,byteLength};\n})(require('./core.cjs'),require('./sha256.cjs'));\n"},{"path":"setup.mjs","content":"// MIT. Initialize the maintained Merchant host around declared Biomedical Onboarding Desk workspaces.\nimport {dirname,join,resolve} from 'node:path';\nimport {lstat} from 'node:fs/promises';\nimport {acquirePrivateDirectoryWriter} from '../../stellar/scf-starforge-20261009/sf30-seller-sdk/operations/history.mjs';\nimport {initReleaseStore,readReleaseState} from '../../stellar/scf-starforge-20261009/sf82-seller-pilot/releases.mjs';\nimport {privateDirectory,readJSON,writeJSON,need} from './host/io.mjs';\nimport {readBiomedicalOnboardingConfiguration} from './mcp.mjs';\nexport async function initializeMerchant(options){\n need(options&&typeof options.directory==='string'&&typeof options.connection==='string','BIOMEDICAL_SETUP','Choose the original merchant and Biomedical Onboarding Desk configuration paths.');\n const directory=resolve(options.directory),connection=resolve(options.connection),name=options.name||'Biomedical Onboarding Desk operator',selected=await readBiomedicalOnboardingConfiguration(connection);\n need(typeof name==='string'&&name.trim()===name&&name.length>0&&name.length\u003c=240,'BIOMEDICAL_NAME','Use a readable merchant name.');\n need(Object.values(selected.workspaces).every(s=>s.directory!==directory),'BIOMEDICAL_SETUP_CONFLICT','Give the merchant host its own private directory.');\n await privateDirectory(dirname(directory));await privateDirectory(directory,{create:true});const lease=await acquirePrivateDirectoryWriter(directory);\n try{\n const config=join(directory,'merchant-mcp.json'),value={schema:'stellar-forge.merchant-mcp.v1',name,releaseStore:'./releases',exportsDirectory:'./customer-exports',sources:{},biomedicalConnection:connection};\n let prior;try{prior=(await readJSON(config)).value;}catch(e){if(e.code!=='ENOENT')throw e;}\n need(!prior||JSON.stringify(prior)===JSON.stringify(value),'BIOMEDICAL_SETUP_CHANGED','This merchant directory has a different selected configuration.',409);\n const releases=join(directory,'releases');let releaseExists=true;\n try{await lstat(releases);}catch(e){if(e.code!=='ENOENT')throw e;releaseExists=false;}\n if(releaseExists){await privateDirectory(releases);await readReleaseState(releases);}else await initReleaseStore(releases);\n await privateDirectory(join(directory,'customer-exports'),{create:true});if(!prior)await writeJSON(config,value);\n await(await import('../../stellar-forge/mcp-merchant-operator/config.mjs')).readMerchantConfig(config);\n return {configuration:config,state:'INITIALIZED',reused:!!prior,workspaces:Object.keys(selected.workspaces),connectionSha256:selected.sha256};\n }finally{await lease.release();}\n}\n"},{"path":"sha256.cjs","content":"/**\n * Strict UTF-8 SHA-256 for retained complete text, with no runtime imports.\n *\n * Bundled upstream: emn178/js-sha256 1.0.0, build/sha256.cjs\n * Commit: 9a54fb31d4594762987e1b5d175265f6bac921de\n * Upstream blob: e3a08633357cb7ca248e14751f9270d95fbbbdf2\n * The upstream source between the markers is unchanged.\n *\n * Upstream license:\n * Copyright (c) 2014-2026 Chen, Yi-Cyuan\n * \n * MIT License\n * \n * Permission is hereby granted, free of charge, to any person obtaining\n * a copy of this software and associated documentation files (the\n * \"Softwa 'One workspace head has conflicting complete originals');objects.set(o.id,o);return {schema:refSchema,id:o.id};\n   }\n   if(Array.isArray(v))return v.map(visit);\n   if(v&&typeof v==='object')return Object.fromEntries(Object.entries(v).map(([k,x])=>[k,visit(x)]));\n   return v;\n  }\n  const raw=JSON.stringify(value),expandedBytes=C.utf8Encode(raw).length;need(expandedBytes\u003c=256*1024*1024,'Complete browser recovery exceeds 256 MiB; save all originals before beginning a separate installation');\n  const body=visit(value),record={schema:recordSchema,installationId:key,body,bodySha256:hash(JSON.stringify(body)),expandedSha256:hash(raw),expandedBytes,objects:[...objects.values()].map(({content,...m})=>m)};record.id=hash(JSON.stringify(record));\n  return {record,objects:[...objects.values()]};\n }\n function checkRecord(r,key){need(r?.schema===recordSchema&&r.installationId===key&&Array.isArray(r.objects)&&r.body&&typeof r.id==='string','Complete recovery proposal is missing');const {id,...body}=r;need(hash(JSON.stringify(body))===id&&hash(JSON.stringify(r.body))===r.bodySha256,'Complete recovery proposal identity differs');return r;}\n function expand(r,objects,key){\n  checkRecord(r,key);const byId=new Map(objects.map(o=>[o?.id,o]));\n  function visit(v){\n   if(v&&typeof v==='object'&&v.schema===refSchema){\n    need(Object.keys(v).length===2,'Workspace reference changed');const o=byId.get(v.id),binding=r.objects.find(x=>x.id===v.id);\n    need(o&&binding&&o.sha256===binding.sha256&&o.bytes===binding.bytes&&o.workspaceSha256===binding.workspaceSha256&&C.utf8Encode(o.content).length===o.bytes&&hash(o.content)===o.sha256,'Complete original workspace object differs');\n    let cached=opened.get(o.id);if(!cached||cached.sha256!==o.sha256){const w=A.receive(o.content);need(hash(JSON.stringify(w))===o.id,'Recovered workspace head differs');cached={sha256:o.sha256,workspace:w};opened.set(o.id,cached);while(opened.size>8)opened.delete(opened.keys().next().value);}\n    return cached.workspace;\n   }\n   if(Array.isArray(v))return v.map(visit);\n   if(v&&typeof v==='object')return Object.fromEntries(Object.entries(v).map(([k,x])=>[k,visit(x)]));\n   return v;\n  }\n  const value=visit(r.body),raw=JSON.stringify(value);need(C.utf8Encode(raw).length===r.expandedBytes&&hash(raw)===r.expandedSha256,'Reopened complete recovery differs');return copy(value);\n }\n function open(){return new Promise((resolve,reject)=>{if(!factory)return reject(Error('IndexedDB is unavailable; save the complete recovery JSON'));const q=factory.open(name,2);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('sessions'))q.result.createObjectStore('sessions');for(const s of ['workspace-objects','recovery-proposals'])if(!q.result.objectStoreNames.contains(s))q.result.createObjectStore(s,{keyPath:'id'});};q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error);q.onblocked=()=>reject(Error('Close older biomedical openings after saving their recovery JSON, then reopen this application'));});}\n function transaction(db,mode,body){return new Promise((resolve,reject)=>{let answer,failure;const tx=db.transaction(['sessions','workspace-objects','recovery-proposals'],mode);const fail=e=>{failure=e;try{tx.abort()}catch{}};tx.oncomplete=()=>resolve(answer);tx.onerror=tx.onabort=()=>reject(failure||tx.error||Error('Complete recovery transaction did not commit'));try{body(tx,v=>{answer=v},fail)}catch(e){fail(e)}});}\n function loadIn(tx,key,id,done,fail){\n  const q=tx.objectStore('recovery-proposals').get(id);q.onsuccess=()=>{try{const r=checkRecord(q.result,key);need(r.id===id,'Requested proposal identity changed');const objects=[];let pending=r.objects.length;if(!pending){done({value:expand(r,objects,key),record:r});return;}for(const ref of r.objects){const get=tx.objectStore('workspace-objects').get(ref.id);get.onsuccess=()=>{try{objects.push(get.result);if(--pending===0)done({value:expand(r,objects,key),record:r});}catch(e){fail(e)}};}}catch(e){fail nction list(db,key){return transaction(db,'readonly',(tx,done,fail)=>{const rows=[],q=tx.objectStore('recovery-proposals').openCursor();q.onsuccess=()=>{try{const c=q.result;if(!c){done(rows);return;}const r=c.value;if(r.installationId===key){checkRecord(r,key);rows.push({id:r.id,sha256:r.expandedSha256,bytes:r.expandedBytes,sequence:r.body.baseState?.sequence,pendingId:r.body.pending?.id||null,objects:r.objects.length});}c.continue();}catch(e){fail(e)}};});}\n return {name,open,read,load,list,prepare,expand,save:(db,key,value,expected)=>commit(db,key,value,expected),adopt:(db,key,value,transform)=>commit(db,key,value,null,transform)};\n}\n"},{"path":"src/managed.js","content":"/* MIT. Complete editable draft and original pending request live together in one IndexedDB transaction. */\nfunction createManagedSession({C,S,config,getSession,setSession,render,notice,download,isOperatorBusy=()=>false,recoveryStorage}){\n const hash=v=>S.hash(JSON.stringify(v)),copy=S.clone,key=config.installationId;let state=null,pending=null,history=[],branches=[],proposals=[],db=null,lastStored=null,ready=false,working=false,needsRefresh=false,dirtyPersistence=false,tail=Promise.resolve();\n const token=new URLSearchParams(location.hash.slice(1)).get('token')||'';historyReplace();function historyReplace(){if(location.hash)globalThis.history.replaceState(null,'',location.pathname);}\n const pane=document.getElementById('managed-controls');\n pane.innerHTML='\u003ch2>Managed workspace\u003c/h2>\u003cp id=\"managed-status\" role=\"status\">Opening the selected private session…\u003c/p>\u003cdiv class=\"actions\">\u003cbutton id=\"managed-save\">Save complete session\u003c/button>\u003cbutton id=\"managed-refresh\">Open newest saved edition\u003c/button>\u003cbutton id=\"managed-recover\">Recover original request\u003c/button>\u003cbutton id=\"managed-copy\">Save complete recovery JSON\u003c/button>\u003cbutton id=\"managed-adopt-browser\">Keep this browser branch; retain saved copy\u003c/button>\u003cbutton id=\"managed-export\">Save retained handover ZIP\u003c/button>\u003c/div>\u003clabel>Open complete recovery JSON\u003cinput id=\"managed-receive\" type=\"file\" accept=\".json\">\u003c/label>\u003cdiv id=\"managed-branches\">\u003c/div>';\n const status=message=>{renderBranches();document.getElementById('managed-status').textContent=message||(!ready?'Connecting…':pending?'An original save is pending. Recover it before further editing.':needsRefresh?'The save was rejected before commit. Open the newest edition; your complete local branch will be retained.':state?.carrier.sha256===S.pack(getSession()).sha256?'Complete session matches managed edition '+state.sequence+'.':'Local editable session has changes. Save it to the managed workspace.');};\n async function api(path,payload){const response=await fetch(path,{method:payload===undefined?'GET':'POST',headers:{authorization:'Bearer '+token,'x-biomedical-instance':config.instanceId,...(payload===undefined?{}:{'content-type':'application/json'})},body:payload===undefined?undefined:JSON.stringify(payload),redirect:'error'});const r=await response.json();if(!response.ok)throw Object.assign(Error(r.error?.message||'Managed request failed'),{code:r.error?.code});return r;}\n function shell(){return {schema:'stellar-forge.biomedical-recovery.v1',installationId:key,baseState:state,carrier:S.pack(getSession()),pending:copy(pending),history:copy(history),branches:copy(branches),needsRefresh};}\n\n function validateRecovery(value){\n  if(value?.schema!=='stellar-forge.biomedical-recovery.v1'||value.installationId!==key||!value.baseState||!Array.isArray(value.history)||typeof value.needsRefresh!=='boolean')throw Error('Select this installation’s complete recovery JSON');\n  const b=value.baseState;if(b.schema!=='stellar-forge.biomedical-view.v1'||b.installationId!==key||!Number.isSafeInteger(b.sequence)||b.sequence\u003c0||!Array.isArray(b.receipts)||!Array.isArray(b.rejections))throw Error('Recovery base edition is incomplete');\n  S.receive(JSON.stringify(b.carrier));\n  const original={schema:'stellar-forge.biomedical-state.v1',installationId:b.installationId,sequence:b.sequence,carrier:b.carrier,receipts:b.receipts,rejections:b.rejections};\n  if(hash(original)!==b.sha256)throw Error('Recovery base edition identity differs');\n  if(value.branches!==undefined&&(!Array.isArray(value.branches)||value.branches.some(b=>!b||typeof b.id!=='string'||typeof b.reason!=='string'||!b.recovery||hash(b.recovery)!==b.sha256)))throw Error('Retained complete browser branch identity differs');\n  const incoming=S.receive(JSON.stringify(value.carrier)),r=value.pending;\n  if(r!==null){\n   const keys=['schema','installationId','id','baseSha256','actor','at','kind','carrier'];\n   if(!r||r.schema!=='stellar-forge.biomedical-request.v1'||r.installationId!==key||r.kind!=='save'||r.baseSha256!==b.sha256||!keys.every(k=>Object.hasOwn(r,k))||Object.keys(r).some(k=>!keys.includes(k))||typeof r.id!=='string'||!r.id||r.id.length>120||typeof r.actor!=='string'||!r.actor||r.actor.length>240||typeof r.at!=='string'||r.at.length>40||!Number.isFinite(Date.parse(r.at)))throw Error('Recovery pending request is incomplete');\n   if(S.pack(S.receive(JSON.stringify(r.carrier))).sha256!==value.carrier.sha256)throw Error('Recovery editor differs from its exact pending successor');\n  }\n  return incoming;\n }\n\n\n function renderBranches(){\n  const node=document.getElementById('managed-branches');if(!node)return;node.replaceChildren();\n  if(!branches.length&&!proposals.length)return;const title=document.createElement('h3');title.textContent='Retained complete browser branches';node.append(title);\n  for(const p of proposals){const row=document.createElement('p'),button=document.createElement('button');button.textContent='Save complete proposal: edition '+p.sequence+(p.pendingId?' — original request '+p.pendingId:'')+' · '+p.id.slice(0,12);button.onclick=()=>{recoveryStorage.load(db,key,p.id).then(r=>download('Biomedical_Onboarding_Recovery_Proposal_'+p.id+'.json',JSON.stringify(r.value,null,2)+'\\n')).catch(e=>notice(e.message,true));};row.append(button);node.append(row);}\n  for(const b of branches){const row=document.createElement('p'),button=document.createElement('button');button.textContent='Save recovery JSON: '+b.reason+(b.recovery.pending?' — pending '+b.recovery.pending.id:'');button.onclick=()=>download('Biomedical_Onboarding_Browser_Branch_'+b.id+'.json',JSON.stringify(b.recovery,null,2)+'\\n');row.append(button);node.append(row);}\n }\n async function adoptBrowser(){\n  const work=tail.then(async()=>{\n   const selected=await recoveryStorage.adopt(db,key,shell(),(local,prior)=>{\n    if(prior)validateRecovery(prior);const next=copy(local),all=[...(local.branches||[]),...(prior?.branches||[])],seen=new Set(all.map(b=>b.sha256));\n    for(const [reason,recovery]of [['This local branch before explicit selection',local],['Other saved browser branch before explicit selection',prior]])if(recovery&&!seen.has(hash(recovery))){seen.add(hash(recovery));all.push({id:S.id(),reason,sha256:hash(recovery),recovery:copy(recovery)});}\n    next.branches=all;return next;\n   });\n   lastStored=selected.sha256;branches=selected.value.branches;dirtyPersistence=false;proposals=await recoveryStorage.list(db,key);status();notice('This browser branch is selected. Both complete preimages and earlier proposals remain available below.');\n  });tail=work.catch(()=>{});return work;\n }\n async function savedDB(value){\n  const result=await recoveryStorage.save(db,key,value,lastStored);proposals=await recoveryStorage.list(db,key);\n  if(result.conflict)throw Error('Another opening saved the browser head. This complete proposal is independently retained below; explicitly select this branch or receive the saved recovery.');\n  lastStored=result.sha256;\n }\n function persist(){if(!ready)return Promise.resolve();dirtyPersistence=true;const work=tail.then(async()=>{const value=shell();await savedDB(value);dirtyPersistence=hash(shell())!==hash(value);status();});tail=work.catch(()=>{});return work.catch(e=>{status('Complete session remains in this tab; browser persistence needs attention: '+e.message);throw e;});}\n async function finish(result){\n  if(!['COMMITTED','REJECTED_NOT_COMMITTED'].includes(result.outcome))throw Error('Original request remains unresolved');\n  if(result.record.requestSha256!==hash(pending)||JSON.stringify(result.record.request)!==JSON.stringify(pending))throw Error('Original request outcome identity differs');\n  history.push({requestId:pending.id,requestSha256:result.record.requestSha256,recordSha256:hash(result.record),outcome:result.outcome,sequence:result.record.sequence??null,editionSha256:result.state.sha256,error:result.record.error??null});pending=null;state=result.state;\n  if(result.outcome==='COMMITTED'){setSession(S.receive(JSON.stringify(state.carrier)));needsRefresh=false;}\n  else needsRefresh=true;\n  await persist();render();status();notice(result.outcome==='COMMITTED'?'Complete managed session saved; original request retained.':'Save rejected before commit: '+result.record.error.message,true);\n }\n async function recover(){if(!pending)throw Error('No original request is pending');let r=await api('/api/request-status',pending);if(r.outcome==='UNRECORDED')r=await api('/api/request',pending);await finish(r);}\n async function save(){if(pending||needsRefresh)throw Error('Recover the original request or open the newest edition first');const carrier=S.pack(getSession());if(carrier.sha256===state.carrier.sha256){status();return;}\n  if(!getSession().draft.actor.trim())throw Error('Enter the operation actor before saving');\n  pending={schema:'stellar-forge.biomedical-request.v1',installationId:key,id:S.id(),baseSha256:state.sha256,actor:getSession().draft.actor.trim(),at:S.now(),kind:'save',carrier};\n  await persist();status();await recover();\n }\n async function refresh(){if(pending)throw Error('Recover the original request first');const next=await api('/api/state');const local=getSession(),fresh=S.receive(JSON.stringify(next.carrier));setSession(S.pack(local).sha256===next.carrier.sha256?fresh:S.replace(local,fresh,'Complete local branch before opening newest managed edition'));state=next;needsRefresh=false;await persist();render();status();notice('Newest saved edition opened. The complete prior local branch is retained in Open and restore.');}\n async function retainedExport(){if(pending||needsRefresh||S.pack(getSession()).sha256!==state.carrier.sha256)throw Error('Save the complete current session before exporting its retained managed edition');const file=await api('/api/export',{expectedSha256:state.sha256}),parts=[];let offset=0;\n  for(;;){const r=await api('/api/file?id='+file.fileId+'&offset='+offset+'&limit=196608');if(r.sha256!==file.sha256||r.bytes!==file.bytes||r.offset!==offset)throw Error('Retained export identity changed');const b=C.fromBase64(r.contentBase64);parts.push(b);offset+=b.length;if(r.nextOffset===null)break;if(r.nextOffset!==offset||!b.length)throw Error('Retained export continuation changed');}\n  const bytes=new Uint8Array(offset);let at=0;for(const p of parts){bytes.set(p,at);at+=p.length;}if(offset!==file.bytes||C.sha256Bytes(bytes)!==file.sha256)throw Error('Complete retained export differs');download('Biomedical_Onboarding_Managed_Handover.zip',bytes,'application/zip');notice('Complete retained handover downloaded.');\n }\n function run(fn){if(working)return;if(isOperatorBusy()){notice('Wait for the current operator action before saving or receiving.',true);return;}if(!ready){notice('Open the current private connection before managed actions.',true);return;}working=true;status('Working with the original saved edition…');Promise.resolve().then(fn).catch(e=>notice(e.message,true)).finally(()=>{working=false;status();});}\n document.getElementById('managed-adopt-browser').onclick=()=>run(adoptBrowser);\n document.getElementById('managed-save').onclick=()=>run(save);document.getElementById('managed-refresh').onclick=()=>run(refresh);document.getElementById('managed-recover').onclick=()=>run(recover);document.getElementById('managed-export').onclick=()=>run(retainedExport);\n document.getElementById('managed-copy').onclick=()=>download('Biomedical_Onboarding_Recovery.json',JSON.stringify(shell(),null,2)+'\\n');\n document.getElementById('managed-receive').onchange=e=>run(async()=>{const file=e.target.files[0];if(!file)return;if(file.size>256*1024*1024)throw Error('Recovery file exceeds the complete limit');const originalBytes=new Uint8Array(await file.arrayBuffer()),originalText=C.utf8Decode(originalBytes);if(C.toBase64(C.utf8Encode(originalText))!==C.toBase64(originalBytes))throw Error('Select exact UTF-8 recovery JSON');const received=JSON.parse(originalText);const incoming=validateRecovery(received);if(pending&&JSON.stringify(pending)!==JSON.stringify(received.pending))throw Error('Recover the current original request before opening a different one');if(received.pending&&(received.pending.installationId!==key||received.pending.baseSha256!==received.baseState.sha256))throw Error('Recovery request binding differs');history.push({localRecoveryBeforeReceive:shell()});state=received.baseState;pending=received.pending;history.push(...received.history);branches.push(...(received.branches||[]));needsRefresh=!!received.needsRefresh;setSession(incoming);await persist();render();status();notice('Complete recovery opened; recover its exact original request or select the newest managed edition.');});\n for(const event of ['click','input','change'])document.addEventListener(event,e=>{if((!ready||pending||working)&&!pane.contains(e.target)){e.preventDefault();e.stopImmediatePropagation();notice('Wait for connection or recover the original managed request before editing.',true);}},true);\n window.addEventListener('beforeunload',e=>{if(pending||dirtyPersistence||ready&&state.carrier.sha256!==S.pack(getSession()).sha256){e.preventDefault();e.returnValue='';}});\n async function initialize(){\n  if(!/^[a-f0-9]{64}$/.test(token))throw Error('Open the current private Applications link');\n  db=await recoveryStorage.open();\n  const selected=await recoveryStorage.read(db,key),prior=selected.value;proposals=await recoveryStorage.list(db,key);\n  const current=await api('/api/state');if(current.installationId!==key)throw Error('The managed installation identity changed');\n  lastStored=prior?hash(prior):null;\n  if(prior){validateRecovery(prior);state=prior.baseState;pending=prior.pending;history=prior.history;branches=prior.branches||[];needsRefresh=!!prior.needsRefresh;setSession(S.receive(JSON.stringify(prior.carrier)));if(!pending&&state.sha256!==current.sha256)needsRefresh=true;}\n  else{state=current;setSession(S.receive(JSON.stringify(current.carrier)));}\n  ready=true;render();status();if(pending)notice('An exact original request is pending. Recover it with the current listener.');\n }\n initialize().catch(e=>{status('Managed connection needs attention: '+e.message);notice(e.message,true);});\n return {persist:()=>persist().catch(e=>notice(e.message,true)),status,export:retainedExport,isManaged:true};\n}\n"},{"path":"src/session.mjs","content":"// MIT. Installed carrier preserves the complete original compact session and emergency-only input.\nexport function createBiomedicalOnboardingSessionAPI(Core,M,C,options={}){\n const schema='stellar-forge.biomedical-editor-session.v1',carrierSchema='stellar-forge.biomedical-editor-carrier.v1',limit=options.maxBytes??128*1024*1024,clone=x=>JSON.parse(JSON.stringify(x)),hash=t=>C.sha256Bytes(C.utf8Encode(t)),need=(x,m)=>{if(!x)throw Error(m)};\n const emptyEmergency=()=>({drafts:{},imports:[],reason:''}),has=e=>Object.keys(e.drafts).length||e.imports.length;\n function checkEmergency(e){need(e&&e.drafts&&typeof e.drafts==='object'&&!Array.isArray(e.drafts)&&Array.isArray(e.imports)&&typeof e.reason==='string','Complete pending emergency lidate(value)));throw Error('Select a complete v2 onboarding study/session/carrier; migrate an original v1 file explicitly');}\n function retainEmergency(next,prior,reason){if(!has(prior.emergency))return next;const body={session:clone(prior.workspace),emergency:clone(prior.emergency)},sha256=hash(JSON.stringify(body));if(!next.retainedEmergency.some(x=>x.sha256===sha256))next.retainedEmergency.push({...body,sha256,reason});return next;}\n function replace(current,incoming,reason='Before opening complete session'){validate(current);validate(incoming);const next=clone(incoming);next.workspace=M.takeSession(current.workspace,incoming.workspace,reason);next.retainedEmergency=[...clone(current.retainedEmergency),...clone(incoming.retainedEmergency)].filter((x,i,a)=>a.findIndex(y=>y.sha256===x.sha256)===i);retainEmergency(next,current,reason);return validate(next);}\n function advance(current,workspace,operation){validate(current);const next=clone(current);next.workspace=M.validate(workspace);return validate(next);}\n return {schema,carrierSchema,limit,clone,copy:clone,hash,create,validate,pack,receive,fromSession,emptyEmergency,checkEmergency,replace,advance};\n}\n"},{"path":"tools.mjs","content":"// MIT. Complete original onboarding and exact-request interfaces.\nconst text=(max=120)=>({type:'string',minLength:1,maxLength:max}),sha={type:'string',pattern:'^[a-f0-9]{64}$'},integer={type:'integer',minimum:0};\nconst request={type:'object',properties:{id:text(),baseSha256:sha,actor:text(240),at:text(40)},required:['id','baseSha256','actor','at'],additionalProperties:false};\nconst kinds=['customers','facilities','assets','approved_pm','workorders','events','reports','billing'];\nexport function biomedicalTools(tool){const scope=p=>({workspace:text(64),...p}),read={readOnly:true,idempotent:true};return [\n tool('merchant_biomedical_status','List declared private installations or inspect the complete saved onboarding session.',scope({}),[],read),\n tool('merchant_biomedical eclared exact UTF-8 CSV, original binary document or complete v1 original; preserve every byte before original core processing.',scope({sourceInput:text(64),expectedSourceSha256:sha,kind:{type:'string',enum:['csv','document','v1']},recordKind:{type:'string',enum:kinds},side:{type:'string',enum:['source','returned']},mapping:{type:'object',additionalProperties:{type:'string'}},label:{type:'string'},notes:{type:'string'},mediaType:text(200),expectedHead:sha,request,recoverOnly:{type:'boolean'}}),['workspace','sourceInput','expectedSourceSha256','kind','expectedHead','request'],{idempotent:true}),\n tool('merchant_biomedical_receive','Receive a complete installed carrier, original v2/legacy session, study, emergency file or exact original managed request.',scope({sourceInput:text(64),expectedSourceSha256:sha,kind:{type:'string',enum:['working','session','study','emergency','request']},request,recoverOnly:{type:'boolean'}}),['workspace','sourceInput','expectedSourceSha256','kind'],{idempotent:true}),\n tool('merchant_biomedical_export','Retain all maintained source, original CSV/binary files, exact comparisons, compact working/history/branches, pending emergency input, editable HTML and host history.',scope({expectedSha256:sha}),['workspace','expectedSha256'],{idempotent:true}),\n tool('merchant_biomedical_file','Read a retained complete handover by exact hash and byte range, including after Applications stops.',scope({fileId:sha,offset:integer,limit:{type:'integer',minimum:1,maximum:196608}}),['workspace','fileId'],read)\n];}\n"},{"path":"zip.cjs","content":"'use strict';\nmodule.exports=(function zipFactory(){\n\"use strict\";\nconst utf=s=>{const a=[];for(const ch of s){let cp=ch.codePointAt(0);if(cp\u003c128)a.push(cp);else if(cp\u003c2048)a.push(192|(cp>>6),128|(cp&63));else if(cp\u003c65536)a.push(224|(cp>>12),128|((cp>>6)&63),128|(cp&63));else a.push(240|(cp>>18),128|((cp>>12)&63),128|((cp>>6)&63),128|(cp&63));}return new Uint8Array(a);};\nconst table=Array.from(  else if(act==="course"){if(!confirm("Open the authored example? It contains fictional administrative data. Current session is retained."))return;exportSession();const k=el.dataset.course;if(!courses[k])throw Error("Select an example");replace(M.use(session,courses[k],"Before authored "+k+" study"),"Authored "+k+" study opened.");}
 else if(["intake-kind","intake-side","map-kind"].includes(act)){const next=M.clone(session);if(act==="intake-kind")next.selection.intakeKind=el.dataset.kind;else if(act==="intake-side")next.selection.intakeSide=el.dataset.side;else next.selection.mapKind=el.dataset.kind;next.revision++;replace(next,"Selection updated; pending forms retained.");}
 else if(act==="add-pair"||act==="remove-pair"){const kind=session.selection.mapKind||"assets",key="crosswalk:"+kind,base={kind,pairs:session.study.crosswalks.filter(x=>x.kind===kind).map(({source_id,target_id})=>({source_id,target_id}))},v=M.clone(draftValue(key,base));let next=retainForm(key,"Before changing draft identity pairs");if(act==="add-pair")v.pairs.push({source_id:"",target_id:""});else v.pairs.splice(Number(el.dataset.index),1);next=M.draft(next,key,v);replace(next,"Draft identity pairs updated.",[key]);}
 else if(act==="match-ids"){const kind=el.dataset.kind,key="crosswalk:"+kind;let next=retainForm(key,"Before adding exact-ID pairs");next=M.checkpoint(next,Core.matchIds(next.study,kind),"Add unique exact-ID maps");delete next.drafts[key];replace(next,"Unique identical IDs added. Earlier applied maps and drafts remain recoverable.",[key]);}
 else if(act==="edit-extract"){const e=session.study.extracts.find(x=>x.id===el.dataset.id);if(!e)throw Error("Extract missing");const o=session.study.originals.find(x=>x.id===e.original_id),key="intake:"+e.kind+":"+e.side;let next=retainForm(key,"Before editing mapping "+e.id);next=M.draft(next,key,{kind:e.kind,side:e.side,name:o.name,content:o.content,label:e.label,at:o.captured_at,mapping:M.clone(e.mapping)});next.selection.intakeKind=e.kind;next.selection.intakeSide=e.side;next.view="intake";replace(next,"Mapping revision prepared; original extract remains retained.",[key]);}
 else if(act==="download-intake"){const p=draftValue(el.dataset.key,null);if(!p)throw Error("Pending CSV missing");download(p.name,p.content,"text/csv");}
 else if(act==="unlink-document"){const link=session.study.document_links[Number(el.dataset.index)];if(!link)throw Error("Link not found");if(!confirm("Remove this exact report-document link from the selected study? Its document and complete prior edition remain retained."))return;replace(M.checkpoint(session,Core.unlinkDocument(session.study,link),"Remove explicit report-document link"),"Link removed. Exact document and prior relationship remain recoverable.");}
 else if(act==="download-document"){const d=session.study.documents.find(x=>x.id===el.dataset.id);if(!d)throw Error("Document missing");download(d.name,Binary.decode(d.base64),d.media_type);}
 else if(act==="reset-draft"){let next=retainForm(el.dataset.key,"Before resetting draft "+el.dataset.key);delete next.drafts[el.dataset.key];next.revision++;replace(next,"Form reset; previous form is in recovery.",[el.dataset.key]);}
 else if(act==="download-pending"){const p=session.drafts[el.dataset.key];if(!p)throw Error("Import candidate not found");download(p.name,p.base64?Binary.decode(p.base64):p.text,p.media_type||"text/plain");}
 else if(act==="retry-pending"){const p=session.drafts[el.dataset.key];if(!p)throw Error("Import candidate not found");await openFile(new File([p.base64?Binary.decode(p.base64):p.text],p.name,{type:p.media_type||"text/plain"}),p.kind);}
 else if(act==="save-notes"){const st=M.clone(session.study);st.notes=draftValue("study-notes",{})?.text??$("study-notes").value;replace(M.checkpoint(session,st,"Save study notes"),"Notes saved.");}
 else if(act==="download-original"){const o=session.study.originals.find(x=>x.id===el.dataset.id);if(!o)throw Error("Original not found");download(o.name,o.content,"text/plain");}
 else if(act==="download-branch"){const b=session.backups.find(b=>b.hash===el.dataset.id);if(!b)throw Error("Branch not found");download("biomed-branch-"+b.hash.slice(0,12)+".json",Core.json(M.branchSession(session,b)));}
 else if(act==="open-branch"){const b=session.backups.find(b=>b.hash===el.dataset.id);if(!b)throw Error("Branch not found");exportSession();replace(M.takeSession(session,M.branchSession(session,b),"Before opening retained branch"),"Retained branch opened. If another saved copy exists, acknowledge it explicitly.");}
 else if(act==="restore-edition"){const h=session.history[Number(el.dataset.index)];if(!h)throw Error("Edition not found");exportSession();replace(M.use(session,M.historyStudy(session,h),"Before restoring study edition"),"Study edition restored; complete prior session retained.");}
 else if(act==="adopt-local")await adoptLocal();
 else if(act==="open-saved"){freeze(true);await flush();const old=await readActive();if(!old)throw Error("No saved copy exists");exportSession();const next=M.takeSession(session,old.session,"Local session before opening saved branch");seen=old.hash;session=next;conflict=false;dirty=true;persist();message="Saved branch opened; local branch retained.";freeze(false);render();}
 }catch(e){freeze(false);say(e.message);}}
document.addEventListener("input",e=>{if(busy)return;if(e.target.id==="record-filter"){const q=e.target.value.toLowerCase();document.querySelectorAll("[data-filter]").forEach(x=>x.hidden=!x.dataset.filter.includes(q));return;}if(e.target.id==="study-notes"){recordDraft("study-notes",{text:e.target.value});return;}const form=e.target.closest("form[data-key]");if(form){recordDraft(form.dataset.key,collect(form));}});
document.addEventListener("change",e=>{if(e.target.dataset.file)openFile(e.target.files?.[0],e.target.dataset.file);else if(!busy&&e.target.dataset.selectionKind){try{const kind=e.target.dataset.selectionKind,side=e.target.dataset.selectionSide;replace(M.checkpoint(session,Core.choose(session.study,kind,side,e.target.value),"Select "+side+" "+kind),"Selected exact retained edition.");}catch(err){say(err.message);render();}}else if(!busy&&e.target.matches("select")){const form=e.target.closest("form[data-key]");if(form){recordDraft(form.dataset.key,collect(form));if(form.dataset.key==="document-link"&&e.target.dataset.path==="side")render();}}});
document.addEventListener("submit",e=>{const form=e.target.closest("form[data-key]");if(!form)return;e.preventDefault();if(busy)return;try{const value=collect(form,true),kind=form.dataset.kind;let next;
 if(kind==="config"){const st=M.clone(session.study);st.config={...value,selection:st.config.selection};next=M.checkpoint(session,st,"Save study scope");}
 else if(kind==="review")next=M.recordReview(session,value);
 else if(kind==="intake")next=M.checkpoint(session,Core.importExtract(session.study,value),"Retain original and mapped extract "+value.kind);
 else if(kind==="crosswalk")next=M.checkpoint(session,Core.crosswalk(session.study,value.kind,value.pairs),"Apply explicit identity map "+value.kind);
 else if(kind==="document-link")next=M.checkpoint(session,Core.linkDocument(session.study,value),"Link retained report document");
 else throw Error("Unknown form");
 next=M.retain(next,session,"Complete form before saving "+form.dataset.key);delete next.drafts[form.dataset.key];replace(next,"Saved "+kind+". Comparison retains every unresolved field and source difference.",[form.dataset.key]);
 }catch(err){say(err.message+" — unfinished form retained.");}});
document.addEventListener("click",e=>{const el=e.target.closest("button");if(!el||busy)return;if(el.dataset.view){session.view=el.dataset.view;session.revision++;persist();render();}else if(el.dataset.action)action(el);});
window.addEventListener("beforeunload",e=>{if(dirty||busy||conflict||storageError||hasEmergency()){e.preventDefault();e.returnValue="";}});
// IndexedDB compare-and-swap on every commit is the saved-state authority.
$("nav").innerHTML=views.map(([v,label])=>'<button data-view="'+v+'">'+label+"</button>").join("");
render();freeze(true);
(async()=>{try{db=await new Promise((resolve,reject)=>{const q=indexedDB.open("biomed-onboarding-desk",1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains("sessions"))q.result.createObjectStore("sessions",{keyPath:"key"});};q.onerror=()=>reject(q.error);q.onblocked=()=>reject(Error("Close another browser copy to upgrade storage"));q.onsuccess=()=>resolve(q.result);});const old=await readActive();if(old){session=old.session;seen=old.hash;dirty=M.hash(session)!==seen;if(dirty)persist();message="Complete saved session reopened, including unfinished forms.";}else{persist();}freeze(false);render();}catch(e){storageError=e.message;dirty=true;freeze(false);say("Browser storage unavailable. Download the complete session before leaving.");}})();
window.BiomedDesk={getSession:()=>M.clone(session),getRecovery:()=>M.clone(recoveryEnvelope()),exportFiles:()=>M.exports(session),flush,assessment:()=>M.assess(session)};
})(window.BiomedCore,window.BiomedSession,window.StudySHA,window.BiomedZIP,window.BiomedCSV,window.BiomedBinary,window.BiomedMigrate,window.BIOMED_COURSES,window.BIOMED_SOURCE_FILES);
