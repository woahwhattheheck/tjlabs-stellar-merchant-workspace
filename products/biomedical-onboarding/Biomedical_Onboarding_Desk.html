mains separate\",checks,retained_branches:records.get(\"active\").session.backups.length};\n};\n"},{"path":"operator/browser-result.json","content":"{\n  \"schema\": \"biomed.browser-handler-receiving/v1\",\n  \"runtime\": \"Actual generated HTML script with injected DOM/IndexedDB in V8; rendered-browser observation remains separate\",\n  \"checks\": [\n    \"Actual generated HTML renders empty onboarding forms\",\n    \"Authored first return opens through actual click handler\",\n    \"Actual handler renders intake\",\n    \"Actual handler renders selection\",\n    \"Actual handler renders crosswalks\",\n    \"Actual handler renders documents\",\n    \"Actual handler renders compare\",\n    \"Actual handler renders reviews\",\n    \"Actual handler renders recovery\",\n    \"Actual handler renders study\",\n    \"Corrected edition opens with all originals\",\n    \"Original CSV stages exact BOM bytes and mapping before application\",\n    \"Actual mapping form applies selected extract and retains original\",\n    \"Existing extract prepares a normal mapping revision\",\n    \"Replacement retains complete unfinished mapped original\",\n    \"Second tab detects current saved-state conflict\",\n    \"Explicit adoption retains both whole preimages\",\n    \"Adopted branch continues ordinary saves\",\n    \"Old tab rejects a newly unseen successor\",\n    \"Complete working export uses actual action\",\n    \"Actual submit rejects stale retained review\",\n    \"Explicit review restart retains original decision draft\",\n    \"Unresolved selected report/document identities remain visible and selected\",\n    \"Actual binary-document import retains BOM and CRLF bytes\",\n    \"Actual link form exposes additional exact report bytes\",\n    \"Normal link correction keeps bytes and previous relationship in history\",\n    \"Failed CSV remains exact in recovery\",\n    \"Actual complete-session and source exports execute\"\n  ],\n  \"retained_branches\": 17\n}\n"},{"path":"operator/complete-course.cjs","content":"'use strict';\nmodule.exports=function completeCourse(){\n const C=require('../core.cjs'),M=require('../session.cjs'),CSV=require('../csv.cjs'),B=require('../binary.cjs'),ZIP=require('../zip.cjs'),Mig=require('../migrate.cjs'),OldM=require('../prior-first-edition/session.cjs'),OldC=require('../prior-first-edition/core.cjs'),auth=require('../examples/course.cjs').make(),checks=[];\n const check=(x,label)=>{if(!x)throw Error(label);checks.push(label);};\n check(auth.firstResult.findings.length===9&&auth.firstResult.findings.every(x=>x.code==='VALUE_CHANGED'),'Equal row counts expose nine real field/link changes');\n check(auth.correctedResult.findings.length===0&&auth.correctedResult.document_comparisons.every(x=>x.state==='exact_bytes_match'),'Corrected fields and linked attachment bytes agree');\n check(auth.corrected.originals.length===24&&auth.corrected.documents.length===3,'All three rounds of eight originals and three authored documents retained');\n const moved=C.rows(auth.corrected,'assets','source').find(x=>x.values.id==='A2'),historic=C.rows(auth.corrected,'events','source').find(x=>x.values.id==='E2');\n check(moved.values.facility_id==='F2'&&historic.values.facility_id==='F1'&&moved.values.serial==='','Moved equipment preserves historical location and observed blank serial');\n let changed=C.addDocument(auth.corrected,{name:'changed-report.txt',media_type:'text/plain',bytes:ZIP.utf('changed\\r\\n'),at:'2026-10-15T04:00:00Z'});changed=C.clone(changed);changed.document_links=changed.document_links.filter(x=>!(x.side==='returned'&&x.report_id==='T-R1'));changed=C.linkDocument(changed,{side:'returned',report_id:'T-R1',document_id:changed.documents.at(-1).id});\n const differences=C.analyze(changed);check(differences.findings.some(x=>x.code==='REPORT_DOCUMENT_MISSING')&&differences.findings.some(x=>x.code==='REPORT_DOCUMENT_ADDITIONAL'),'Changed returned attachment is compared by retained SHA sets');\n const unavailable=C.clone(auth.corrected);unavailable.document_links=[];check(C.analyze(unavailable).document_comparisons.every(x=>x.state==='unobserved'),'No attachment bytes on either side remains visibly unobserved');\n let s=M.create(auth.corrected);s=M.draft(s,'intake:assets:returned',{content:'\\ufeffid,tag\\r\\n001,007\\r\\n',mapping:{id:'id',tag:'tag'}});s=M.draft(s,'crosswalk:assets',{pairs:[{source_id:'A2',target_id:'T-A2'}]});const old=M.clone(s);s=M.checkpoint(s,changed,'Changed returned attachment');s=M.retain(s,old,'Before changed report');s=M.validate(JSON.parse(JSON.stringify(s)));\n check(s.drafts['intake:assets:returned'].content.charCodeAt(0)===0xfeff&&M.branchSession(s,s.backups[0]).study.documents.length===3,'Complete pending mappings and independent prior branch survive serialization');\n const draft=M.reviewDraft(s);s=M.draft(s,'review',draft);const w=C.clone(s.study);w.notes='Changed after review draft';s=M.checkpoint(s,w,'Changed selection note');let rejected=false;try{M.recordReview(s,{...draft,reviewer:'Course reviewer',decision:'accepted'});}catch{rejected=true;}check(rejected,'A pending earlier-digest review cannot sign a later study');\n let w2=C.review(auth.corrected,{study_sha256:C.digest(auth.corrected),reviewer:'Author',at:'2026-10-15T04:00:00Z',decision:'accepted',notes:''});w2=C.review(w2,{study_sha256:C.digest(w2),reviewer:'Author',at:'2026-10-15T04:01:00Z',decision:'revise',notes:'Recheck source'});check(C.analyze(w2).decision==='revision_requested','Latest same-digest revision request supersedes acceptance');\n const legacy=OldM.create(require('../prior-first-edition/examples/course.cjs').make().corrected),legacyText=OldC.json(legacy);let ls=OldM.draft(legacy,'unfinished',{text:'retain me'});ls=OldM.checkpoint(ls,{...OldC.clone(ls.study),notes:'Later v1 notes'},'Actual earlier v1 history reason');ls=OldM.retain(ls,legacy,'Earlier v1 branch');const migrated=Mig.migrate(ls,OldC.json(ls),'old.session.json','2026-10-15T04:00:00Z');check(migrated.study.config.selection.source.customers===''&&migrated.drafts.unfinished.text==='retain me'&&migrated.backups.length>0,'Explicit v1 migration retains complete forms/branches and leaves new kinds unselected');\n check(migrated.history[0].reason===ls.history[0].reason&&migrated.history[0].at===ls.history[0].at&&M.historyStudy(migrated,migrated.history[0]).notes===OldM.historyStudy(ls,ls.history[0]).notes,'Migrated history retains exact original reason, timestamp and study pairing');\n const exact=migrated.study.documents.find(x=>x.name==='old.session.json');check(B.encode(ZIP.utf(OldC.json(ls)))===exact.base64,'Exact original v1 envelope survives migration unchanged');\n const csv=CSV.table('\\ufeffid,note\\r\\n001,\"a\\rb\\r\\nc\"\\r\\n002,x\\r\\n');check(csv.rows[0].line_start===2&&csv.rows[0].line_end===4&&csv.rows[1].line_start===5,'Quoted CR and CRLF source spans count accurately without changing text');\n const ex=M.exports(s),zip=ZIP.write(ex);check(zip.length>0&&ex.some(x=>x.path==='selected/availability.json')&&ex.some(x=>x.bytes),'Complete export includes availability manifest and exact binary documents');\n const av=C.availability(migrated.study).tables.find(x=>x.kind==='facilities'&&x.side==='source');check(av.fields.customer_id.observed===false,'Migration explicitly distinguishes unobserved added columns from observed blank cells');\n const replay=M.validate(JSON.parse(JSON.stringify(M.takeSession(s,migrated,'Open migrated branch'))));check(replay.backups.length>=s.backups.length&&replay.study.documents.some(x=>x.name==='old.session.json'),'Full replacement retains prior current session and migrated original');\n return{schema:'biomed.complete-course/v1',checks:checks.length,passed:checks,initial_differences:9,corrected_differences:0,export_files:ex.length,zip_bytes:zip.length,session_bytes:M.byteLength(JSON.stringify(s))};\n};\n"},{"path":"operator/complete-result.json","content":"{\n  \"schema\": \"biomed.complete-course/v1\",\n  \"checks\": 16,\n  \"passed\": [\n    \"Equal row counts expose nine real field/link changes\",\n    \"Corrected fields and linked attachment bytes agree\",\n    \"All three rounds of eight originals and three authored documents retained\",\n    \"Moved equipment preserves historical location and observed blank serial\",\n    \"Changed returned attachment is compared by retained SHA sets\",\n    \"No attachment bytes on either side remains visibly unobserved\",\n    \"Complete pending mappings and independent prior branch survive serialization\",\n    \"A pending earlier-digest review cannot sign a later study\",\n    \"Latest same-digest revision request supersedes acceptance\",\n    \"Explicit v1 migration retains complete forms/branches and leaves new kinds unselected\",\n    \"Migrated history retains exact original reason, timestamp and study pairing\",\n    \"Exact original v1 envelope survives migration unchanged\",\n    \"Quoted CR and CRLF source spans count accurately without changing text\",\n    \"Complete export includes availability manifest and exact binary documents\",\n    \"Migration explicitly distinguishes unobserved added columns from observed blank cells\",\n    \"Full replacement retains prior current session and migrated original\"\n  ],\n  \"initial_differences\": 9,\n  \"corrected_differences\": 0,\n  \"export_files\": 53,\n  \"zip_bytes\": 195293,\n  \"session_bytes\": 73595\n}\n"},{"path":"operator/desk.js","content":"(function deskMain(Core,M,SHA,ZIP,CSV,Binary,Migrate,courses,sourceFiles){\n\"use strict\";\nlet session=M.create(),seen=null,db=null,dirty=true,busy=false,conflict=false,storageError=\"\",saveTimer=null,queue=Promise.resolve(),message=\"Complete the study setup, or open the clearly labelled authored course.\",selectedFile=null,emergency={drafts:{},imports:[],reason:\"\"};\nconst $=id=>document.getElementById(id),esc=x=>String(x??\"\").replace(/[&\u003c>\"']/g,c=>({\"&\":\"&amp;\",\"\u003c\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[c])),now=()=>new Date().toISOString();\nconst views=[[\"study\",\"Scope & plan\"],[\"intake\",\"CSV intake & mapping\"],[\"selection\",\"Selected editions\"],[\"crosswalks\",\"Identity maps\"],[\"documents\",\"Original documents\"],[\"compare\",\"Comparison\"],[\"reviews\",\"Review\"],[\"recovery\",\"Save & recover\"]];\nfunction say(t){message=t;status();}\nfunction hasEmergency(){return Object.keys(emergency.drafts).length>0||emergency.imports.length>0;}\nfunction status(){if($(\"message\"))$(\"message\").textContent=message;if($(\"save-state\"))$(\"save-state\").textContent=busy?\"Working…\":hasEmergency()?\"Pending input is in memory — download emergency recovery\":conflict?\"Another saved branch exists — resolve in Save & recover\":storageError?\"Memory only: \"+storageError:dirty?\"Unsaved changes\":\"Saved in this browser\";if($(\"revision\"))$(\"revision\").textContent=session.study.id+\" · session revision \"+session.revision;}\nfunction freeze(v){busy=v;document.querySelectorAll(\"button,input,select,textarea\").forEach(e=>e.disabled=v);status();}\nfunction transaction(mode,fn){return new Promise((resolve,reject)=>{if(!db)return reject(Error(\"Browser storage unavailable\"));const tx=db.transaction(\"sessions\",mode),st=tx.objectStore(\"sessions\");let result;tx.oncomplete=()=>resolve(result);tx.onerror=()=>reject(tx.error||Error(\"Browser storage failed\"));tx.onabort=()=>reject(tx.error||Error(\"Browser save aborted\"));fn(st,x=>{result=x;},e=>{try{tx.abort();}catch{}reject(e);});});}\nfunction checkedSaved(v){if(!v)return null;if(M.hash(v.session)!==v.hash)throw Error(\"Saved session digest mismatch\");return {...v,session:M.normalize(v.session)};}\nfunction readActive(){return transaction(\"readonly\",(st,done,fail)=>{const q=st.get(\"active\");q.onsuccess=()=>{try{const v=checkedSaved(q.result);done(v||null);}catch(e){fail(e);}};});}\nfunction saveExact(snapshot,expected){return transaction(\"readwrite\",(st,done,fail)=>{const q=st.get(\"active\");q.onsuccess=()=>{try{const old=checkedSaved(q.result);if((old?.hash||null)!==expected){done({conflict:true,current:old||null});return;}const h=M.hash(snapshot);st.put({key:\"active\",hash:h,session:snapshot,updated_at:now()});done({hash:h});}catch(e){fail(e);}};});}\nfunction persist(){dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(()=>{saveTimer=null;enqueueSave();},150);status();}\nfunction enqueueSave(){queue=queue.then(async()=>{if(conflict)return;const snap=M.clone(session);try{const r=await saveExact(snap,seen);if(r.conflict){conflict=true;if(r.current)session=M.retain(session,r.current.session,\"Other tab's saved branch\");message=\"Your complete working copy and the competing saved copy are retained. Use Save & recover to select a branch.\";dirty=true;}else{seen=r.hash;storageError=\"\";dirty=hasEmergency()||M.hash(session)!==r.hash;}}catch(e){storageError=e.message;dirty=true;}status();});return queue;}\nasync function flush(){if(saveTimer){clearTimeout(saveTimer);saveTimer=null;enqueueSave();}await queue;}\nfunction download(name,data,type=\"application/json\"){const blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement(\"a\");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}\nfunction recoveryEnvelope(){return hasEmergency()?{schema:\"biomed.onboarding-emergency/v1\",session,pending_forms:emergency.drafts,pending_imports:emergency.imports,reason:emergency.reason}:session;}\nfunction exportSession(){download(hasEmergency()?\"biomed-emergency-recovery.json\":\"biomed-onboarding-session.json\",Core.json(recoveryEnvelope()));say(hasEmergency()?\"Complete emergency recovery downloaded, including every pending form and import.\":\"Complete session downloaded, including every unfinished form and retained branch.\");}\nfunction draftValue(key,fallback){return emergency.drafts[key]??session.drafts[key]??fallback;}\nfunction recordDraft(key,value){dirty=true;try{session=M.draft(session,key,value);delete emergency.drafts[key];persist();}catch(e){emergency.drafts[key]=M.clone(value);emergency.reason=e.message;dirty=true;message=e.message+\" The full pending form remains in memory; use Save complete file.\";status();}}\nfunction retainImport(kind,name,text,error){const p={kind,name,text,error,at:now()},key=\"pending-import:\"+SHA.sha256Utf8(kind+\"\\0\"+name+\"\\0\"+text).sha256;try{session=M.draft(session,key,p);persist();}catch(e){if(!emergency.imports.some(x=>x.key===key))emergency.imports.push({key,...p});emergency.reason=e.message;dirty=true;}}\nfunction retainForm(key,reason){const prior=Object.hasOwn(emergency.drafts,key)?M.draft(session,key,emergency.drafts[key]):session;return M.retain(prior,prior,reason);}\nfunction optionsHtml(values,selected,labels={}){const multi=Array.isArray(selected),chosen=multi?selected:[String(selected??\"\")],all=[...values,...chosen.filter(x=>!values.includes(x))];return [...new Set(all)].map(x=>'\u003coption value=\"'+esc(x)+'\"'+(chosen.includes(x)?\" selected\":\"\")+'>'+esc((Object.hasOwn(labels,x)?labels[x]:undefined)??(values.includes(x)?String(x).replaceAll(\"_\",\" \"):\"[Unresolved] \"+x))+'\u003c/option>').join(\"\");}\nfunction control(path,label,value,{type=\"text\",options=null,nullable=false,list=null,help=\"\"}={}){\n const name=esc(path),v=value??\"\";let html;\n if(list){const chosen=Array.isArray(value)?value:[];html='\u003cselect multiple data-path=\"'+name+'\" data-array=\"1\">'+optionsHtml(list,chosen)+\"\u003c/select>\";}\n else if(options)html='\u003cselect data-path=\"'+name+'\">'+optionsHtml(options,v)+\"\u003c/select>\";\n else if(type===\"boolean\")html='\u003cselect data-path=\"'+name+'\" data-bool=\"1\">'+optionsHtml([\"true\",\"false\"],String(value))+\"\u003c/select>\";\n else if(type===\"decimal\")html='\u003cinput data-path=\"'+name+'\" value=\"'+esc(v)+'\" type=\"text\" inputmode=\"decimal\"'+(nullable?' data-null-text=\"1\"':\"\")+\">\";\n else if(type===\"textarea\")html='\u003ctextarea rows=\"4\" data-path=\"'+name+'\">'+esc(v)+'\u003c/textarea>';\n else html='\u003cinput data-path=\"'+name+'\" value=\"'+esc(v)+'\" type=\"'+(type===\"number\"?\"number\":\"text\")+'\"'+(type===\"number\"?' step=\"any\" data-number=\"1\"'+(nullable?' data-null=\"1\"':\"\"):\"\")+([\"at\",\"captured_at\",\"available_at\"].includes(path)?' placeholder=\"2026-10-15T00:00:00Z\"':\"\")+\">\";\n return '\u003clabel>'+esc(label)+html+(help?'\u003csmall>'+esc(help)+\"\u003c/small>\":\"\")+\"\u003c/label>\";\n}\nfunction at(obj,path){return path.split(\".\").reduce((o,k)=>o?.[k],obj);}\nfunction set(obj,path,value){const p=path.split(\".\");let x=obj;for(const k of p.slice(0,-1)){if(x[k]===undefined)x[k]={};x=x[k];}x[p.at(-1)]=value;}\nfunction collect(form,convert=false){const key=form.dataset.key,base=draftValue(key,JSON.parse(form.dataset.base)),obj=M.clone(base);for(const e of form.querySelectorAll(\"[data-path]\")){let v=e.multiple?Array.from(e.selectedOptions).map(o=>o.value):e.value;if(convert&&e.dataset.number){if(v===\"\"){if(e.dataset.null)v=null;else throw Error(e.dataset.path+\": enter a number\");}else{v=Number(v);if(!Number.isFinite(v))throw Error(e.dataset.path+\": enter a finite number\");}}if(e.dataset.bool)v=v===\"true\";if(e.dataset.nullText&&v===\"\")v=null;if(e.dataset.roles)v=String(v).split(\",\").map(s=>s.trim()).filter(Boolean);set(obj,e.dataset.path,v);}return obj;}\nfunction formOpen(key,base,kind=\"\",oldId=\"\"){return '\u003cform data-key=\"'+esc(key)+'\" data-kind=\"'+esc(kind)+'\" data-old=\"'+esc(oldId)+'\" data-base=\"'+esc(JSON.stringify(base))+'\">';}\nconst label=k=>k.replaceAll(\"_\",\" \").replace(/^./,c=>c.toUpperCase()),fmt=x=>x===null||x===undefined?\"Unobserved\":String(x);\nfunction table(headers,rows){return\"\u003cdiv class='table-wrap'>\u003ctable>\u003cthead>\u003ctr>\"+headers.map(x=>\"\u003cth>\"+esc(x)+\"\u003c/th>\").join(\"\")+\"\u003c/tr>\u003c/thead>\u003ctbody>\"+rows.map(r=>\"\u003ctr>\"+r.map(v=>\"\u003ctd>\"+esc(v)+\"\u003c/td>\").join(\"\")+\"\u003c/tr>\").join(\"\")+\"\u003c/tbody>\u003c/table>\u003c/div>\";}\nfunction studyView(){const base=Object.fromEntries(Object.entries(session.study.config).filter(([k])=>k!==\"selection\")),v=draftValue(\"config\",base);return\"\u003ch1>Biomedical onboarding study\u003c/h1>\u003cp>Compare one authorised original cohort with an actual returned trial export. Define the same record boundary on both sides. This independent working model prepares a transfer comparison; confirm the actual platform schema with its builder.\u003c/p>\"+formOpen(\"config\",base,\"config\")+\"\u003cdiv class='grid'>\"+control(\"label\",\"Study label\",v.label)+control(\"data_class\",\"Data class\",v.data_class,{options:[\"operational\",\"authored_course\"]})+control(\"source_scope\",\"Original population, source systems and extraction dates\",v.source_scope,{type:\"textarea\"})+control(\"returned_scope\",\"Returned population, environment and extraction dates\",v.returned_scope,{type:\"textarea\"})+control(\"authority_notes\",\"Source owner, approved procedure/schedule references and selection notes\",v.authority_notes,{type:\"textarea\"})+\"\u003c/div>\u003cbutton type='submit'>Save scope\u003c/button>\u003c/form>\u003ch2>Working notes\u003c/h2>\u003ctextarea id='study-notes' rows='5'>\"+esc(draftValue(\"study-notes\",{})?.text??session.study.notes)+\"\u003c/textarea>\u003cbutton data-action='save-notes'>Save notes\u003c/button>\u003ch2>Authored full-chain example\u003c/h2>\u003cp>The fictional course retains a moved device's historical facility, repeated printed tags, a blank serial, source-approved PM references, distinct repair/return visits and report/billing links. It contains no physical readings or authentic signatures.\u003c/p>\u003cbutton data-action='course' data-course='first'>Open first returned edition — nine differences\u003c/button> \u003cbutton data-action='course' data-course='corrected'>Open corrected edition — retained originals\u003c/button>\";}\nfunction intakeView(){const kind=session.selection.intakeKind||\"facilities\",side=session.selection.intakeSide||\"source\",key=\"intake:\"+kind+\":\"+side,v=draftValue(key,null);let h=\"\u003ch1>Original CSV and field mapping\u003c/h1>\u003cdiv class='actions'>\"+Core.KINDS.map(k=>\"\u003cbutton data-action='intake-kind' data-kind='\"+k+\"'\"+(k===kind?\" aria-current='true'\":\"\")+\">\"+esc(label(k))+\"\u003c/button>\").join(\"\")+\"\u003c/div>\u003cdiv class='actions'>\"+[\"source\",\"returned\"].map(x=>\"\u003cbutton data-action='intake-side' data-side='\"+x+\"'\"+(x===side?\" aria-current='true'\":\"\")+\">\"+(x===\"source\"?\"Original source\":\"Returned trial\")+\"\u003c/button>\").join(\"\")+\"\u003c/div>\u003cp>Retain the approved CSV extraction exactly. A blank mapping means the field was not observed; an empty cell in a mapped column is an observed blank. IDs are text, preserving leading zeros and punctuation. The current study retains every previously imported edition.\u003c/p>\u003cdiv class='actions'>\u003clabel class='file-label'>Choose \"+esc(kind)+\" CSV\u003cinput type='file' data-file='csv:\"+kind+\":\"+side+\"' accept='.csv,text/csv'>\u003c/label>\u003cbutton data-action='csv-template' data-kind='\"+kind+\"'>Download canonical header template\u003c/button>\u003c/div>\";\nif(!v)return h+\"\u003cp>No pending file for this table and side. You can switch sections without losing another table's pending file or mapping.\u003c/p>\";let t;try{t=Core.inspectCSV(v.content);}catch(e){return h+\"\u003cp class='notice'>\"+esc(e.message)+\"\u003c/p>\";}h+=\"\u003ch2>\"+esc(v.name)+\"\u003c/h2>\u003cp>\"+t.rows.length+\" parsed rows; exact original remains retained with this pending mapping.\u003c/p>\"+formOpen(key,{},\"intake\")+\"\u003cdiv class='grid'>\"+control(\"label\",\"Extract edition label\",v.label);\nfor(const field of Core.FIELDS[kind])h+=control(\"mapping.\"+field,label(field)+\" ← original column\",v.mapping[field],{options:[\"\",...t.header],help:field===\"id\"?\"Required stable source ID. Do not substitute a label or infer a serial.\":\"Blank means unobserved; comparison will show it explicitly.\"});\nh+=\"\u003c/div>\u003cbutton type='submit'>Retain original and select this extract\u003c/button> \u003cbutton type='button' data-action='download-intake' data-key='\"+esc(key)+\"'>Download exact pending CSV\u003c/button>\u003c/form>\u003ch2>Original row preview\u003c/h2>\u003cp>First 20 rows are shown; every parsed row is retained and compared.\u003c/p>\"+table([\"Original lines\",...t.header],t.rows.slice(0,20).map(r=>[r.line_start+\"–\"+r.line_end,...r.values]));return h;}\nfunction selectionView(){let h=\"\u003ch1>Selected source and returned editions\u003c/h1>\u003cp>Each choice selects an exact original and mapping. Earlier extracts, mappings and comparisons remain in complete history. Choose a corrected returned export without replacing its first version.\u003c/p>\";\nfor(const side of [\"source\",\"returned\"]){h+=\"\u003ch2>\"+(side===\"source\"?\"Original source\":\"Returned trial\")+\"\u003c/h2>\u003cdiv class='grid'>\";for(const kind of Core.KINDS){const selected=session.study.config.selection[side][kind],es=session.study.extracts.filter(e=>e.kind===kind&&e.side===side);h+=\"\u003clabel>\"+esc(label(kind))+\"\u003cselect data-selection-kind='\"+kind+\"' data-selection-side='\"+side+\"'>\"+optionsHtml([\"\",...es.map(e=>e.id)],selected,Object.fromEntries([[\"\",\"No selected extract\"],...es.map(e=>[e.id,e.label+\" · \"+session.study.originals.find(o=>o.id===e.original_id)?.name])]))+\"\u003c/select>\u003c/label>\";}h+=\"\u003c/div>\";}\nh+=\"\u003ch2>All retained extracts\u003c/h2>\"+session.study.extracts.map(e=>\"\u003cdiv class='record'>\u003cstrong>\"+esc(e.label)+\"\u003c/strong>\u003csmall>\"+esc(e.side+\" · \"+e.kind+\" · \"+e.id)+\"\u003c/small>\u003cbutton data-action='edit-extract' data-id='\"+e.id+\"'>Prepare mapping revision\u003c/button> \u003c .decision)+\"\u003c/p>\u003cp>Original: \"+esc(r.scope.source)+\"\u003c/p>\u003cp>Returned: \"+esc(r.scope.returned)+\"\u003c/p>\"+table([\"Record kind\",\"Original rows\",\"Returned rows\"],Core.KINDS.map(k=>[label(k),r.counts[k].source,r.counts[k].returned]))+\"\u003ch2>Exact differences and unresolved evidence\u003c/h2>\"+table([\"Finding\",\"Kind / side\",\"ID / field\",\"Expected\",\"Returned\",\"Original row\",\"Detail\"],r.findings.map(x=>[x.code,x.kind+\" / \"+x.side,x.record_id+\" / \"+x.field,fmt(x.expected),fmt(x.actual),x.source?x.source.name+\":\"+x.source.line_start+\"–\"+x.source.line_end:\"\",x.detail]))+\"\u003ch2>Retained report bytes\u003c/h2>\"+table([\"Original report\",\"Returned report\",\"Byte comparison\",\"Original hashes\",\"Returned hashes\"],r.document_comparisons.map(d=>[d.source_report_id,d.returned_report_id,d.state,d.source_sha256.join(\", \"),d.returned_sha256.join(\", \")]))+\"\u003cp>Unobserved means neither side supplied linked document bytes. A matching reference alone does not establish matching attachment contents.\u003c/p>\u003ch2>Column availability\u003c/h2>\u003cp>Unobserved fields are distinct from source-observed blank cells. The export includes an explicit availability manifest.\u003c/p>\"+table([\"Kind / side\",\"Extract\",\"Unobserved columns\"],Core.availability(session.study).tables.map(t=>[t.kind+\" / \"+t.side,t.extract_id||\"None\",Object.entries(t.fields).filter(([k,v])=>!v.observed).map(([k])=>k).join(\", \")]))+\"\u003ch2>Interpretation\u003c/h2>\u003cp>\"+esc(r.limits)+\"\u003c/p>\u003cp>Equal counts alone do not establish transfer fidelity. A recorded acceptance leaves every difference visible. Review the exact selected record boundary and every unresolved identity before preparing the next trial.\u003c/p>\u003cp class='mono'>\"+esc(r.study_sha256)+\"\u003c/p>\u003cdiv class='actions'>\u003cbutton data-action='report'>Download comparison report\u003c/button>\u003cbutton data-action='export-zip'>Download complete working export\u003c/button>\u003c/div>\";return h;}\nfunction reviewsView(){const base=M.reviewDraft(session),v=draftValue(\"review\",base),stale=v.study_sha256!==Core.digest(session.study),r=Core.analyze(session.study);return\"\u003ch1>Named onboarding review\u003c/h1>\u003cp>Review applies to the complete current source, selected extracts, maps and document links. Earlier decisions remain historical after a change. A later request to revise supersedes an earlier acceptance for the same digest.\u003c/p>\"+(stale?\"\u003cp class='notice'>This pending review belongs to an earlier edition. Its notes remain retained.\u003c/p>\u003cbutton data-action='new-review'>Start current review; retain earlier draft\u003c/button>\":\"\")+formOpen(\"review\",base,\"review\")+\"\u003cdiv class='grid'>\"+control(\"reviewer\",\"Reviewer\",v.reviewer)+control(\"at\",\"Reviewed at (UTC)\",v.at)+control(\"decision\",\"Decision\",v.decision,{options:[\"accepted\",\"revise\"]})+control(\"notes\",\"Review findings and next source correction\",v.notes,{type:\"textarea\"})+\"\u003c/div>\u003cbutton type='submit'>Record review\u003c/button>\u003c/form>\"+table([\"Reviewer\",\"Time\",\"Decision\",\"Edition\",\"Notes\"],session.study.reviews.map(x=>[x.reviewer,x.at,x.decision,x.study_sha256===r.study_sha256?\"Current\":\"Earlier\",x.notes]));}\n\nfunction emergencyView(){return !hasEmergency()?\"\":\"\u003csection class='notice'>\u003ch2>Pending input retained in memory\u003c/h2>\u003cp>\"+esc(emergency.reason)+\"\u003c/p>\u003cbutton data-action='download-session'>Download complete emergency recovery\u003c/button>\u003cbutton data-action='clear-emergency'>Download and clear pending input\u003c/button>\"+Object.entries(emergency.drafts).map(([k])=>\"\u003cp>Pending form: \"+esc(k)+\"\u003c/p>\").join(\"\")+emergency.imports.map(p=>\"\u003cp>\"+esc(p.name)+\" \u003cbutton data-action='download-emergency-import' data-key='\"+esc(p.key)+\"'>Download exact file\u003c/button>\u003c/p>\").join(\"\")+\"\u003c/section>\";}\nfunction recoveryView(){return emergencyView()+\"\u003ch1>Save & recover\u003c/h1>\u003cp>Download the complete session to move between browsers or keep an independent copy. It includes the study, all unfinished forms, review history, source originals and retained browser branches.\u003c/p>\u003cdiv class='actions'>\u003cbutton data-action='download-session'>Download complete session\u003c/button>\u003cbutton data-action='export-zip'>Download complete export ZIP\u003c/button>\u003cbutton data-action='export-source'>Download application source ZIP\u003c/button>\u003clabel class='file-label'>Open session or study JSON\u003cinput type='file' data-file='session' accept='.json,application/json'>\u003c/label>\u003c/div>\"+(conflict?\"\u003cdiv class='notice'>\u003ch2>Choose how to continue\u003c/h2>\u003cp>The saved copy changed in another tab. Both copies are retained. Selecting your browser branch acknowledges the current saved copy in one atomic transaction; it remains available below.\u003c/p>\u003cbutton data-action='adopt-local'>Keep this browser branch; retain saved copy\u003c/button>\u003cbutton data-action='open-saved'>Open saved copy; retain this branch\u003c/button>\u003c/div>\":\"\")+\"\u003ch2>Retained full branches\u003c/h2>\"+(session.backups.length?session.backups.map(b=>\"\u003cdiv class='record'>\u003cstrong>\"+esc(b.reason)+\"\u003c/strong>\u003csmall>\"+esc(b.at)+\" · \"+esc(M.branchInfo(session,b).title)+\" · revision \"+M.branchInfo(session,b).revision+\"\u003c/small>\u003cdiv class='actions'>\u003cbutton data-action='download-branch' data-id='\"+b.hash+\"'>Download complete branch\u003c/button>\u003cbutton data-action='open-branch' data-id='\"+b.hash+\"'>Open branch (retain current)\u003c/button>\u003c/div>\u003c/div>\").join(\"\"):\"\u003cp>No prior branch has been replaced.\u003c/p>\")+\"\u003ch2>Retained import candidates\u003c/h2>\"+Object.entries(session.drafts).filter(([k])=>k.startsWith(\"pending-import:\")).map(([k,p])=>\"\u003cdiv class='record'>\u003cstrong>\"+esc(p.name)+\"\u003c/strong>\u003cp>\"+esc(p.error)+\"\u003c/p>\u003cbutton data-action='download-pending' data-key='\"+esc(k)+\"'>Download original candidate\u003c/button>\u003cbutton data-action='retry-pending' data-key='\"+esc(k)+\"'>Retry against current study\u003c/button>\u003c/div>\").join(\"\")+\"\u003ch2>Study edition history\u003c/h2>\"+session.history.map((h,i)=>\"\u003cdiv class='record'>\u003cspan>\"+esc(h.at+\" — \"+h.reason)+\"\u003c/span>\u003cbutton data-action='restore-edition' data-index='\"+i+\"'>Restore study edition (retain current session)\u003c/button>\u003c/div>\").join(\"\");}\nfunction render(){const view=session.view;document.querySelectorAll(\"nav button\").forEach(b=>b.setAttribute(\"aria-current\",b.dataset.view===view?\"page\":\"false\"));const fn={study:studyView,intake:intakeView,selection:selectionView,crosswalks:crosswalkView,documents:documentsView,compare:compareView,reviews:reviewsView,recovery:recoveryView}[view]||studyView;$(\"main\").innerHTML=fn();status();if(busy)freeze(true);}\nfunction replace(next,msg,clearDraftKeys=[]){const nextEmergency=S.clone(emergency);for(const key of clearDraftKeys)delete nextEmergency.drafts[key];selectInstalled(next,nextEmergency);dirty=true;message=msg;persist();render();}\nfunction retainBinary(kind,file,bytes,error){const base64=Binary.encode(bytes),p={kind,name:file.name,media_type:file.type||\"application/octet-stream\",base64,error,at:now()},key=\"pending-import:\"+SHA.sha256Utf8(kind+\"\\0\"+file.name+\"\\0\"+base64).sha256;try{selectInstalled(M.draft(session,key,p));persist();}catch(e){if(!emergency.imports.some(x=>x.key===key))emergency.imports.push({key,...p});emergency.reason=e.message;dirty=true;}}\nasync function openFile(file,kind){if(!file)return;if(kind===\"session\"&&hasEmergency()){say(\"Download and clear pending recovery before opening another session.\");return;}if(busy)return;freeze(true);const before=M.hash(session);await flush();let retainedText=null,retainedBytes=null;try{\n if(file.size>(kind===\"session\"?256:24)*1024*1024)throw Error(\"File exceeds the import limit; choose a smaller authorised cohort\");\n const bytes=new Uint8Array(await file.arrayBuffer());retainedBytes=bytes;if(M.hash(session)!==before)throw Error(\"Session changed during the file read; the original candidate is retained\");\n let next,nextEmergency=null,nextMetadata=installedMeta;\n if(kind===\"document\"){const study=Core.addDocument(session.study,{name:file.name,media_type:file.type||\"application/octet-stream\",bytes,at:now(),notes:\"Exact original retained. Link to a source or returned report below.\"});next=M.checkpoint(session,study,\"Retain original document \"+file.name);next.view=\"documents\";}\n else {const text=new TextDecoder(\"utf-8\",{fatal:true,ignoreBOM:true}).decode(bytes);retainedText=text;\n  if(kind===\"session\"){let x=JSON.parse(text.charCodeAt(0)===0xfeff?text.slice(1):text),pending=x.schema===\"biomed.onboarding-emergency/v1\"?x:null;if(pending)x=pending.session;if(x.schema===S.carrierSchema||x.schema===S.schema||x.schema===\"stellar-forge.biomedical-emergency-carrier.v1\"){const received=S.receive(x),joined=S.replace(getInstalled(),received,\"Before opening complete installed carrier\");x=joined.workspace;nextEmergency=joined.emergency;nextMetadata={actor:joined.draft.actor,retainedEmergency:joined.retainedEmergency};}\n   if(x.schema===\"biomed.onboarding-study/v1\"||x.schema===\"biomed.onboarding-session/v1\"){if(!confirm(\"Migrate the first edition to the full chain? Its exact file, forms and earlier editions will be retained; new kinds stay unselected.\"))return;x=Migrate.migrate(x,text,file.name,now());}\n   if(x.schema===M.SCHEMA||x.schema===M.LEGACY){x=M.normalize(x);exportSession();next=M.takeSession(session,x,\"Before imported replacement\");}\n   else {Core.validate(x);exportSession();next=M.use(session,x,\"Before imported study replacement\");}\n   if(pending){if(!pending.pending_forms||typeof pending.pending_forms!==\"object\"||Array.isArray(pending.pending_forms)||!Array.isArray(pending.pending_imports))throw Error(\"Invalid emergency recovery\");nextEmergency={drafts:{...pending.pending_forms},imports:[...pending.pending_imports],reason:pending.reason||\"Imported pending recovery\"};}\n  } else if(kind.startsWith(\"csv:\")){const [,recordKind,side]=kind.split(\":\");if(!Core.KINDS.includes(recordKind)||![\"source\",\"returned\"].includes(side))throw Error(\"Choose record kind and side\");const t=Core.inspectCSV(text),key=\"intake:\"+recordKind+\":\"+side;\n   next=retainForm(key,\"Before replacing pending CSV \"+key);next=M.draft(next,key,{kind:recordKind,side,name:file.name,content:text,label:file.name,at:now(),mapping:Object.fromEntries(Core.FIELDS[recordKind].map(field=>[field,t.header.includes(field)?field:\"\"]))});\n   next.selection.intakeKind=recordKind;next.selection.intakeSide=side;next.view=\"intake\";\n  } else throw Error(\"Unknown import route\");\n }\n const selectedEmergency=nextEmergency||S.clone(emergency);if(!nextEmergency&&kind.startsWith(\"csv:\"))delete selectedEmergency.drafts[\"intake:\"+kind.split(\":\")[1]+\":\"+kind.split(\":\")[2]];selectInstalled(next,selectedEmergency,nextMetadata);dirty=true;message=\"Opened \"+file.name+\". Prior applied state and unfinished forms remain recoverable.\";persist();\n }catch(e){if(retainedText!==null)retainImport(kind,file.name,retainedText,e.message);else if(retainedBytes)retainBinary(kind,file,retainedBytes,e.message);message=e.message+\" — selected study and readable import candidate retained.\";}\n finally{freeze(false);render();}\n}\nasync function adoptLocal(){freeze(true);await flush();try{const local=getInstalled(),out=await localRecovery.adopt(db,localKey,{schema:\"stellar-forge.biomedical-local.v1\",carrier:S.pack(local)},(selected,previous)=>{const prior=previous?S.receive(previous.carrier):local,joined=S.replace(prior,local,\"Explicit adoption retains both browser preimages\");return {...selected,carrier:S.pack(joined)};});setInstalled(S.receive(out.value.carrier));seen=out.sha256;conflict=false;storageError=\"\";dirty=false;message=\"This complete branch is selected; both preimages remain recoverable.\";}catch(e){storageError=e.message;dirty=true;message=\"Adoption failed; complete working state remains retained.\";}finally{freeze(false);render();}}\nasync function action(el){if(busy)return;const act=el.dataset.action;try{if(hasEmergency()&&[\"new-study\",\"course\",\"open-branch\",\"restore-edition\",\"open-saved\"].includes(act))throw Error(\"Resolve or download-and-clear pending input in Save & recover before replacing the study.\");\n if(act===\"installed-working\"){try{download(\"Biomedical_Onboarding_Working.json\",Core.json(S.pack(getInstalled())));}catch(e){download(\"Biomedical_Onboarding_Complete_Emergency.json\",Core.json(emergencyCarrier()));say(e.message+\" Complete original session, pending inputs and installed metadata are in the emergency file.\");}}\n else if(act===\"installed-editable\"){download(\"Biomedical_Onboarding_Editable.html\",buildBiomedicalOnboardingDesk(Object.fromEntries(sourceFiles.map(x=>[x.path,x.content])),{carrier:S.pack(getInstalled())}),\"text/html\");}\n else if(act===\"installed-handover\"){if(managed)await managed.export();else{const carrier=S.pack(getInstalled()),state={installationId:\"standalone\",sha256:carrier.sha256,sequence:0,carrier,receipts:[],rejections:[]};download(\"Biomedical_Onboarding_Full_Handover.zip\",buildBiomedicalOnboardingExport(Object.fromEntries(sourceFiles.map(x=>[x.path,x.content])),state,[],[],{codec:C,core:Core,originalSessions:M,sessions:S,buildDesk:buildBiomedicalOnboardingDesk,zip:window.BiomedicalZIP}),\"application/zip\");}}\n else if(act===\"download-session\")exportSession();\n else if(act===\"export-zip\"){await flush();download(\"biomed-onboarding-complete.zip\",ZIP.write(M.exports(session).concat([{path:\"installed-working.json\",content:Core.json(S.pack(getInstalled()))}],hasEmergency()?[{path:\"emergency-recovery.json\",content:Core.json(recoveryEnvelope())}]:[])),\"application/zip\");say(\"Complete study, report, editable tables, originals and branches exported.\");}\n else if(act===\"export-source\"){download(\"biomed-onboarding-application-source.zip\",ZIP.write(sourceFiles),\"application/zip\");say(\"Complete application source downloaded.\");}\n else if(act===\"report\"){const a=M.assess(session);if(!a.ok)throw Error(a.error);download(\"biomed-onboarding-report.md\",Core.report(session.study,a.result),\"text/markdown\");}\n\n else if(act===\"csv-template\"){if(!Core.KINDS.includes(el.dataset.kind))throw Error(\"Unknown record kind\");download(el.dataset.kind+\".csv\",CSV.csv([Core.FIELDS[el.dataset.kind]]),\"text/csv\");}\n else if(act===\"clear-emergency\"){if(!confirm(\"Download the complete emergency file and clear its pending input? Applied study remains.\"))return;exportSession();setInstalled(S.replace(getInstalled(),S.fromSession(session,S.emptyEmergency(),installedMeta),\"Before clearing exported emergency input\"));persist();render();}\n else if(act===\"download-emergency-import\"){const p=emergency.imports.find(x=>x.key===el.dataset.key);if(!p)throw Error(\"Pending import missing\");download(p.name,p.base64?Binary.decode(p.base64):p.text,p.media_type||\"text/plain\");}\n else if(act===\"new-review\"){let next=M.retain(session,session,\"Before explicitly restarting review\");const old=draftValue(\"review\",null);if(old)next=M.draft(next,\"retained-review:\"+M.hash(old),old);next=M.draft(next,\"review\",M.reviewDraft(session));replace(next,\"Review started for the current complete comparison. Previous notes remain retained.\",[\"review\"]);}\n else if(act===\"new-study\"){if(!confirm(\"Start an empty study? Current complete session is retained and downloaded first.\"))return;exportSession();replace(M.use(session,Core.empty(),\"Before new empty study\"),\"Empty onboarding study opened.\");}\n else if(act===\"course\"){if(!confirm(\"Open the authored example? It contains fictional administrative data. Current session is retained.\"))return;exportSession();const k=el.dataset.course;if(!courses[k])throw Error(\"Select an example\");replace(M.use(session,courses[k],\"Before authored \"+k+\" study\"),\"Authored \"+k+\" study opened.\");}\n else if([\"intake-kind\",\"intake-side\",\"map-kind\"].includes(act)){const next=M.clone(session);if(act===\"intake-kind\")next.selection.intakeKind=el.dataset.kind;else if(act===\"intake-side\")next.selection.intakeSide=el.dataset.side;else next.selection.mapKind=el.dataset.kind;next.revision++;replace(next,\"Selection updated; pending forms retained.\");}\n else if(act===\"add-pair\"||act===\"remove-pair\"){const kind=session.selection.mapKind||\"assets\",key=\"crosswalk:\"+kind,base={kind,pairs:session.study.crosswalks.filter(x=>x.kind===kind).map(({source_id,target_id})=>({source_id,target_id}))},v=M.clone(draftValue(key,base));let next=retainForm(key,\"Before changing draft identity pairs\");if(act===\"add-pair\")v.pairs.push({source_id:\"\",target_id:\"\"});else v.pairs.splice(Number(el.dataset.index),1);next=M.draft(next,key,v);replace(next,\"Draft identity pairs updated.\",[key]);}\n else if(act===\"match-ids\"){const kind=el.dataset.kind,key=\"crosswalk:\"+kind;let next=retainForm(key,\"Before adding exact-ID pairs\");next=M.checkpoint(next,Core.matchIds(next.study,kind),\"Add unique exact-ID maps\");delete next.drafts[key];replace(next,\"Unique identical IDs added. Earlier applied maps and drafts remain recoverable.\",[key]);}\n else if(act===\"edit-extract\"){const e=session.study.extracts.find(x=>x.id===el.dataset.id);if(!e)throw Error(\"Extract missing\");const o=session.study.originals.find(x=>x.id===e.original_id),key=\"intake:\"+e.kind+\":\"+e.side;let next=retainForm(key,\"Before editing mapping \"+e.id);next=M.draft(next,key,{kind:e.kind,side:e.side,name:o.name,content:o.content,label:e.label,at:o.captured_at,mapping:M.clone(e.mapping)});next.selection.intakeKind=e.kind;next.selection.intakeSide=e.side;next.view=\"intake\";replace(next,\"Mapping revision prepared; original extract remains retained.\",[key]);}\n else if(act===\"download-intake\"){const p=draftValue(el.dataset.key,null);if(!p)throw Error(\"Pending CSV missing\");download(p.name,p.content,\"text/csv\");}\n else if(act===\"unlink-document\"){const link=session.study.document_links[Number(el.dataset.index)];if(!link)throw Error(\"Link not found\");if(!confirm(\"Remove this exact report-document link from the selected study? Its document and complete prior edition remain retained.\"))return;replace(M.checkpoint(session,Core.unlinkDocument(session.study,link),\"Remove explicit report-document link\"),\"Link removed. Exact document and prior relationship remain recoverable.\");}\n else if(act===\"download-document\"){const d=session.study.documents.find(x=>x.id===el.dataset.id);if(!d)throw Error(\"Document missing\");download(d.name,Binary.decode(d.base64),d.media_type);}\n else if(act===\"reset-draft\"){let next=retainForm(el.dataset.key,\"Before resetting draft \"+el.dataset.key);delete next.drafts[el.dataset.key];next.revision++;replace(next,\"Form reset; previous form is in recovery.\",[el.dataset.key]);}\n else if(act===\"download-pending\"){const p=session.drafts[el.dataset.key];if(!p)throw Error(\"Import candidate not found\");download(p.name,p.base64?Binary.decode(p.base64):p.text,p.media_type||\"text/plain\");}\n else if(act===\"retry-pending\"){const p=session.drafts[el.dataset.key];if(!p)throw Error(\"Import candidate not found\");await openFile(new File([p.base64?Binary.decode(p.base64):p.text],p.name,{type:p.media_type||\"text/plain\"}),p.kind);}\n else if(act===\"save-notes\"){const st=M.clone(session.study);st.notes=draftValue(\"study-notes\",{})?.text??$(\"study-notes\").value;replace(M.checkpoint(session,st,\"Save study notes\"),\"Notes saved.\");}\n else if(act===\"download-original\"){const o=session.study.originals.find(x=>x.id===el.dataset.id);if(!o)throw Error(\"Original not found\");download(o.name,o.content,\"text/plain\");}\n else if(act===\"download-branch\"){const b=session.backups.find(b=>b.hash===el.dataset.id);if(!b)throw Error(\"Branch not found\");download(\"biomed-branch-\"+b.hash.slice(0,12)+\".json\",Core.json(M.branchSession(session,b)));}\n else if(act===\"open-branch\"){const b=session.backups.find(b=>b.hash===el.dataset.id);if(!b)throw Error(\"Branch not found\");exportSession();replace(M.takeSession(session,M.branchSession(session,b),\"Before opening retained branch\"),\"Retained branch opened. If another saved copy exists, acknowledge it explicitly.\");}\n else if(act===\"restore-edition\"){const h=session.history[Number(el.dataset.index)];if(!h)throw Error(\"Edition not found\");exportSession();replace(M.use(session,M.historyStudy(session,h),\"Before restoring study edition\"),\"Study edition restored; complete prior session retained.\");}\n else if(act===\"adopt-local\")await adoptLocal();\n else if(act===\"open-saved\"){freeze(true);await flush();const old=await readActive();if(!old)throw Error(\"No saved copy exists\");exportSession();const next=S.replace(getInstalled(),old.installed,\"Local session before opening saved branch\");seen=old.hash;setInstalled(next);conflict=false;dirty=true;persist();message=\"Saved branch opened; local branch retained.\";freeze(false);render();}\n }catch(e){freeze(false);say(e.message);}}\ndocument.addEventListener(\"input\",e=>{if(busy)return;if(e.target.id===\"record-filter\"){const q=e.target.value.toLowerCase();document.querySelectorAll(\"[data-filter]\").forEach(x=>x.hidden=!x.dataset.filter.includes(q));return;}if(e.target.id===\"study-notes\"){recordDraft(\"study-notes\",{text:e.target.value});return;}const form=e.target.closest(\"form[data-key]\");if(form){recordDraft(form.dataset.key,collect(form));}});\ndocument.addEventListener(\"change\",e=>{if(e.target.dataset.file)openFil vetica,sans-serif}header{background:#fff;border-bottom:1px solid #c9c9c7;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:16px}header strong{font-size:20px}small{display:block;color:#626466;font-size:12px}.status{padding:10px 22px;background:#eee;border-bottom:1px solid #ccc;display:flex;gap:24px;flex-wrap:wrap}.status span:first-child{font-weight:bold}.shell{display:grid;grid-template-columns:190px minmax(0,1fr);max-width:1600px;margin:auto}nav{padding:18px 12px;border-right:1px solid #ccc;min-height:calc(100vh - 160px)}nav button{display:block;width:100%;text-align:left;margin:0 0 7px}button,input,select,textarea{font:inherit}button{background:#fff;border:1px solid #9c9e9f;border-radius:3px;padding:7px 11px;color:#202124;cursor:pointer}button:hover{background:#e9e9e7}button[aria-current=page],button[aria-current=true]{background:#303234;color:white;border-color:#303234}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #222;outline-offset:2px}button:disabled,input:disabled,select:disabled,textarea:disabled{opacity:.55;cursor:wait}main{min-width:0;padding:24px;max-width:1350px}h1{font-size:25px;margin:0 0 14px}h2{font-size:19px;margin:24px 0 12px}h3{font-size:16px;margin:18px 0 10px}p{max-width:1000px}form,fieldset{min-width:0}fieldset{border:1px solid #ccc;margin:14px 0;padding:14px}legend{font-weight:bold}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;margin:12px 0 18px}label{display:block;font-weight:bold}input,select,textarea{display:block;width:100%;padding:8px;border:1px solid #a5a5a5;border-radius:2px;background:#fff;color:#202124;font-weight:normal}select[multiple]{min-height:86px}textarea{resize:vertical}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}.file-label{display:inline-block;border:1px solid #aaa;background:white;padding:7px 10px;font-weight:normal}.file-label input{max-width:230px;font-size:12px;padding:3px;border:0}.split{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px}.record{background:white;border:1px solid #ccc;margin:9px 0;padding:10px;overflow-wrap:anywhere}.record>button:first-child{width:100%;text-align:left}.record>div{margin-top:8px}.record small{margin:4px 0}.record button{padding:5px 8px;font-size:13px}.table-wrap{overflow:auto;border:1px solid #ccc;background:#fff;margin:12px 0}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid #ddd;padding:9px 10px;vertical-align:top;text-align:left}th{background:#eee}tr:last-child td{border-bottom:0}.mono{font:12px/1.5 ui-monospace,monospace;overflow-wrap:anywhere}.notice{border:1px solid #979797;background:#fff;padding:14px}.muted{color:#626466;font-size:12px}footer{border-top:1px solid #ccc;padding:12px 22px;color:#626466;background:white;font-size:12px}#study-notes{max-width:1000px}\n@media(max-width:1000px){.split{grid-template-columns:190px minmax(0,1fr)}.shell{grid-template-columns:155px minmax(0,1fr)}main{padding:18px}.grid{grid-template-columns:1fr}}\n@media(max-width:700px){header{display:block;padding:14px}.status{padding:10px 14px;gap:8px}.shell{display:block}nav{min-height:0;border-right:0;border-bottom:1px solid #ccc;display:flex;overflow:auto;gap:6px;padding:10px}nav button{width:auto;white-space:nowrap;margin:0}.split{display:block}.split aside{max-height:240px;overflow:auto;margin-bottom:20px}main{padding:16px}.grid{grid-template-columns:1fr}header .actions{margin-bottom:0}h1{font-size:22px}}\n`;\n\nmodule.exports={renderDesk};\n"},{"path":"package.json","content":"{\n  \"name\": \"biomedical-onboarding\",\n  \"version\": \"1.0.0\",\n  \"private\": true,\n  \"type\": \"module\",\n  \"engines\": {\n    \"node\": \">=20\"\n  },\n  \"scripts\": {\n    \"receive:installed\": \"node native/receive-installed.mjs\"\n  }\n}\n"},{"path":"prior-first-edition/DOMAIN_CONTRACT.md","content":"# Biomedical service onboarding study — complete current source\n\nThe study compares an explicitly selected original export with a returned trial export. It preserves the original UTF-8 text (including BOM and line endings), column mapping, exact source line ranges, selected extract editions, explicit identity maps, all prior study editions and editable session drafts.\n\n## Current completed model\n\nThree linked record kinds: facilities, assets and service events. Facility fields: id/name/address. Assets: id/facility_id/tag/serial/manufacturer/model/status/next_due/procedure_ref. Events: id/asset_id/event_type/performed_at/recorded_due/status/report_ref/procedure_ref/findings_text/technician_ref. These are the study's comparison fields, not a claimed the supplying system import schema. The owner supplies the actual current export and deliberately maps its real columns.\n\nNo ID is inferred from a name or serial. A source ID maps explicitly to a returned ID, including facility and asset references. Unique exact same IDs can be deliberately paired with matchIds; renamed IDs need the explicit map. Null mapping means unobserved; mapped blank string is an actual observed blank. Unknown fields stay visible as FIELD_UNMAPPED. Duplicates, missing parents, dangling maps, many-to-one maps, unexpected returned identities and exact selected-field changes remain findings. Equal row counts alone do not pass a comparison.\n\nSource record values are compared exactly. A date value is retained, not interpreted as a new maintenance instruction. The selected original procedure/report reference remains a literal reference; file existence, signature authenticity and device suitability require the operating company's actual systems and review. Signed report binaries can remain at an approved original locator with a retained checksum in a later operator extension; current text comparison does not claim to authenticate a signature.\n\nThe data class is operational or authored_course. Current review records bind the whole selected study digest. A review records the named operator's decision and can acknowledge differences; it does not silently remove them or certify equipment safety. Earlier reviews stay historical after a selected-source/configuration/map change.\n\n## Completed receiving exercise\n\nexamples/course.cjs constructs two fictional facilities, three fictional assets and three fictional service events. The initial returned extract has the same row counts but five deliberate differences: asset facility, serial, event's linked asset, recorded service date and report reference. The actual core returns five VALUE_CHANGED findings. A corrected returned edition returns zero findings; all nine source/first/corrected original CSV files remain available. UTF-8 BOM exists in original input and is preserved. Fixture dates and statuses are administrative examples, with no invented physical test readings.\n\n## API and source\n\ncore.cjs: empty/validate/digest/inspectCSV/importExtract/selected/rows/choose/crosswalk/matchIds/analyze/review/report/exports. Every mutation returns a new full study. Exports contain full study, comparison, Markdown report, selected canonical tables, crosswalks and every original with a source index.\n\nsession.cjs: the maintained compact content-addressed browser-session model adapted from the reviewed pilot-measurement operator. create/validate/normalize/retain/checkpoint/draft/use/takeSession/historyStudy/branchSession/branchInfo/reviewDraft/recordReview. Complete draft state is distinct from committed domain study. Forty-MiB validation applies to complete retained session; browser must stage the full successor and only then discard an emergency form.\n\ncsv.cjs: exact quoted CSV parser with CR, LF and CRLF line accounting; no source trimming or silent row-width repair. sha256.cjs is the existing maintained dependency. No npm installation is required for these CommonJS modules.\n\n## Receiving work now assigned\n\nRevenue delivery owns complete ordinary browser form/UI, native CLI, portable recovery/export, exact source handover and meaningful model/handler/native course. Continue this complete current source rather than authoring another parallel core. Add any useful customer/company, billing reference, report attachment or approved-PM document linkage to this contract deliberately, while preserving this original complete edition.\n\nThe UI should start with source selection/mapping, then explicit crosswalks, comparison and review. Keep imported originals, initial/corrected returned editions and all unfinished forms through save/reopen, conflict adoption and export. A saved review must reject a changed selected digest. Source columns may be omitted explicitly and then appear as unobserved, not silently equal.\n\nThis retained first edition defines an independent offline receiving model. Actual source and destination owners supply their production schema and authorised administrative records.\n"},{"path":"prior-first-edition/core.cjs","content":"'use strict';\nconst SHA=require('./sha256.cjs'),CSV=require('./csv.cjs');\nconst SCHEMA='biomed.onboarding-study/v1';\nconst KINDS=['facilities','assets','events'];\nconst FIELDS={\n facilities:['id','name','address'],\n assets:['id','facility_id','tag','serial','manufacturer','model','status','next_due','procedure_ref'],\n events:['id','asset_id','event_type','performed_at','recorded_due','status','report_ref','procedure_ref','findings_text','technician_ref']\n};\nconst clone=x=>JSON.parse(JSON.stringify(x)),hash=x=>SHA.sha256Utf8(JSON.stringify(x)).sha256,json=x=>JSON.stringify(x,null,2)+'\\n';\nfunction assert(v,m){if(!v)throw Error(m);}\nfunction text(v,n){assert(typeof v==='string',n+' must be text');return v;}\nfunction id(v,n){text(v,n);assert(/^[A-Za-z0-9][A-Za-z0-9_.-]{0,99}$/.test(v),'Use a simple '+n);return v;}\nfunction stamp(v){assert(typeof v==='string'&&/^\\d{4}-\\d{2}-\\d{2}T/.test(v)&&Number.isFinite(Date.parse(v)),'Use an ISO timestamp');return v;}\nfunction empty(label='New onboarding study'){return{schema:SCHEMA,id:'study-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),config:{label,data_class:'operational',source_scope:'',returned_scope:'',authority_notes:'',selection:{source:{facilities:'',assets:'',events:''},returned:{facilities:'',assets:'',events:''}}},originals:[],extracts:[],crosswalks:[],reviews:[],notes:''};}\nfunction validate(w){\n assert(w&&w.schema===SCHEMA,'Unsupported onboarding study');id(w.id,'study ID');assert(w.config&&typeof w.config==='object','Study configuration missing');\n for(const k of ['label','data_class','source_scope','returned_scope','authority_notes'])text(w.config[k],k);\n assert(['operational','authored_course'].includes(w.config.data_class),'Unknown data class');\n for(const a of ['originals','extracts','crosswalks','reviews'])assert(Array.isArray(w[a]),'Missing '+a);text(w.notes,'Notes');\n const seen=new Set();for(const o of w.originals){id(o.id,'original ID');assert(!seen.has(o.id),'Duplicate original ID');seen.add(o.id);text(o.name,'Original name');text(o.content,'Original text');stamp(o.captured_at);assert(SHA.sha256Utf8(o.content).sha256===o.sha256,'Original content digest mismatch');}\n seen.clear();for(const e of w.extracts){id(e.id,'extract ID');assert(!seen.has(e.id),'Duplicate extract ID');seen.add(e.id);assert(KINDS.includes(e.kind)&&['source','returned'].includes(e.side),'Unknown extract kind/side');const o=w.originals.find(x=>x.id===e.original_id);assert(o,'Extract original is missing');const t=CSV.table(o.content);assert(e.mapping&&typeof e.mapping==='object','Mapping missing');assert(Object.keys(e.mapping).sort().join()===FIELDS[e.kind].slice().sort().join(),'Mapping must define every canonical field');for(const [k,v]of Object.entries(e.mapping))assert(typeof v==='string'&&(v===''&&k!=='id'||t.header.includes(v)),'Unknown original column for '+k);assert(new Set(Object.values(e.mapping).filter(Boolean)).size===Object.values(e.mapping).filter(Boolean).length,'A source column cannot silently serve two canonical fields');text(e.label,'Extract label');}\n for(const side of ['source','returned'])for(const kind of KINDS){const v=w.config.selection?.[side]?.[kind];text(v,'Selected extract');if(v)assert(w.extracts.some(e=>e.id===v&&e.side===side&&e.kind===kind),'Selected extract kind/side mismatch');}\n const maps=new Set();for(const x of w.crosswalks){assert(KINDS.includes(x.kind),'Crosswalk kind');text(x.source_id,'Source ID');text(x.target_id,'Returned ID');assert(x.source_id&&x.target_id,'Crosswalk IDs cannot be blank');const key=x.kind+'\\0'+x.source_id;assert(!maps.has(key),'Duplicate source crosswalk');maps.add(key);}\n for(const r of w.reviews){assert(typeof r.study_sha256==='string'&&/^[a-f0-9]{64}$/.test(r.study_sha256),'Review digest');text(r.reviewer,'Reviewer');text(r.notes,'Review notes');stamp(r.at);assert(['accepted','revise'].includes(r.decision),'Review decision');}\n return w;\n}\nfunction digest(w){validate(w);return hash({...w,reviews:[]});}\nfunction inspectCSV(content){return CSV.table(content);}\nfunction importExtract(w,{kind,side,name,content,mapping,label,at}){\n validate(w);assert(KINDS.includes(kind)&&['source','returned'].includes(side),'Select kind and side');text(name,'Filename');text(content,'Original');stamp(at);CSV.table(content);\n const x=clone(w),sha=SHA.sha256Utf8(content).sha256,oid='original-'+hash([name,sha]).slice(0,32);\n if(!x.originals.some(o=>o.id===oid))x.originals.push({id:oid,name,content,sha256:sha,captured_at:at});\n const eid='extract-'+hash([oid,kind,side,mapping]).slice(0,32);\n if(!x.extracts.some(e=>e.id===eid))x.extracts.push({id:eid,kind,side,original_id:oid,mapping:clone(mapping),label:label||name});\n x.config.selection[side][kind]=eid;return validate(x);\n}\nfunction selected(w,kind,side){return w.extracts.find(e=>e.id===w.config.selection[side][kind])||null;}\nfunction rows(w,kind,side){\n const e=selected(w,kind,side);if(!e)return[];\n const o=w.originals.find(x=>x.id===e.original_id),t=CSV.table(o.content),idx=Object.fromEntries(t.header.map((v,i)=>[v,i]));\n return t.rows.map(r=>({values:Object.fromEntries(FIELDS[kind].map(k=>[k,e.mapping[k]?r.values[idx[e.mapping[k]]]:null])),source:{original_id:o.id,sha256:o.sha256,extract_id:e.id,name:o.name,line_start:r.line_start,line_end:r.line_end}}));\n}\nfunction choose(w,kind,side,extractId){const x=clone(w);x.config.selection[side][kind]=extractId;return validate(x);}\nfunction crosswalk(w,kind,pairs){const x=clone(w);x.crosswalks=x.crosswalks.filter(r=>r.kind!==kind).concat(pairs.map(r=>({kind,source_id:r.source_id,target_id:r.target_id})));return validate(x);}\nfunction matchIds(w,kind){validate(w);const s=rows(w,kind,'source'),t=rows(w,kind,'returned'),sc=new Map(),tc=new Map();for(const r of s)sc.set(r.values.id,(sc.get(r.values.id)||0)+1);for(const r of t)tc.set(r.values.id,(tc.get(r.values.id)||0)+1);return crosswalk(w,kind,s.filter(r=>r.values.id&&sc.get(r.values.id)===1&&tc.get(r.values.id)===1).map(r=>({source_id:r.values.id,target_id:r.values.id})));}\nfunction analyze(w){\n validate(w);const findings=[],counts={},indexes={},data={},maps={};let complete=true;\n const add=(code,kind,side,row,field,expected,actual,detail)=>findings.push({code,kind,side,record_id:row?.values?.id||'',field:field||'',expected:expected??null,actual:actual??null,detail,source:row?.source||null});\n for(const kind of KINDS){\n  data[kind]={};indexes[kind]={};counts[kind]={};maps[kind]=new Map();\n  for(const side of ['source','returned']){\n   const e=selected(w,kind,side);if(!e){complete=false;add('EXTRACT_MISSING',kind,side,null,'',null,null,'Select an exact original extract.');}\n   const list=rows(w,kind,side),idx=new Map();data[kind][side]=list;counts[kind][side]=list.length;\n   for(const r of list){const key=r.values.id;if(!key)add('ID_EMPTY',kind,side,r,'id',null,key,'A row has no stable ID.');else{if(!idx.has(key))idx.set(key,[]);idx.get(key).push(r);}}\n   for(const [key,rs]of idx)if(rs.length>1)for(const r of rs)add('ID_DUPLICATE',kind,side,r,'id','Unique ID',key,'Every repeated row remains retained; resolve identity in the selected source.');\n   indexes[kind][side]=idx;\n   if(e)for(const field of FIELDS[kind])if(!e.mapping[field])add('FIELD_UNMAPPED',kind,side,null,field,'Explicit original column',null,'This field is unavailable; it is not an empty or verified value.');\n  }\n  const targets=new Map();for(const x of w.crosswalks.filter(r=>r.kind===kind)){\n   maps[kind].set(x.source_id,x.target_id);targets.set(x.target_id,(targets.get(x.target_id)||0)+1);\n   if(!indexes[kind].source.has(x.source_id)||!indexes[kind].returned.has(x.target_id))add('CROSSWALK_DANGLING',kind,'both',null,'id',x.source_id,x.target_id,'A mapping names an ID outside the selected editions.');\n  }\n  for(const [key,n]of targets)if(n>1)add('CROSSWALK_TARGET_REUSED',kind,'both',null,'id','One source ID',key,'Multiple original identities map to the same returned identity.');\n }\n for(const side of ['source','returned']){\n  for(const [kind,field,parent]of [['assets','facility_id','facilities'],['events','asset_id','assets']]){\n   for(const r of data[kind][side]){const key=r.values[field];if(key===null)continue;if(!key||!indexes[parent][side].has(key))add('REFERENCE_MISSING',kind,side,r,field,parent+' ID',key,'Linked parent identity is missing.');else if(indexes[parent][side].get(key).length!==1)add('REFERENCE_AMBIGUOUS',kind,side,r,field,'Unique parent',key,'The parent ID selects more than one record.');}\n  }\n }\n for(const kind of KINDS){\n  const mappedTargets=new Set();\n  for(const r of data[kind].source){\n   const originalId=r.values.id;if(!originalId||indexes[kind].source.get(originalId)?.length!==1)continue;\n   const targetId=maps[kind].get(originalId);if(!targetId){add('SOURCE_UNMAPPED',kind,'source',r,'id','Explicit crosswalk',null,'Original identity has no selected returned counterpart.');continue;}\n   mappedTargets.add(targetId);const matches=indexes[kind].returned.get(targetId)||[];\n   if(matches.length!==1){add('RETURNED_ID_UNRESOLVED',kind,'source',r,'id','One returned row',matches.length,'The crosswalk does not resolve one returned row.');continue;}\n   const target=matches[0];\n   for(const field of FIELDS[kind].filter(x=>x!=='id')){\n    let expected=r.values[field],actual=target.values[field];if(expected===null||actual===null)continue;\n    const parent=kind==='assets'&&field==='facility_id'?'facilities':kind==='events'&&field==='asset_id'?'assets':null;\n    if(parent){const mapped=maps[parent].get(expected);if(!mapped){add('PARENT_CROSSWALK_MISSING',kind,'source',r,field,expected,actual,'Parent IDs need their own explicit crosswalk.');continue;}expected=mapped;}\n    if(expected!==actual)add('VALUE_CHANGED',kind,'returned',target,field,expected,actual,'Exact original value differs in the returned edition.');\n   }\n  }\n  for(const r of data[kind].returned)if(r.values.id&&!mappedTargets.has(r.values.id))add('RETURNED_UNEXPECTED',kind,'returned',r,'id','Mapped original',r.values.id,'Returned row has no original counterpart in this selected scope.');\n }\n const d=digest(w),reviews=w.reviews.filter(x=>x.study_sha256===d);\n return{schema:'biomed.onboarding-comparison/v1',study_sha256:d,data_class:w.config.data_class,scope:{source:w.config.source_scope,returned:w.config.returned_scope},complete_extract_selection:complete,counts,findings,comparison_state:!complete?'incomplete':findings.length?'differences_for_review':'selected_fields_match',reviews,decision:reviews.some(r=>r.decision==='accepted')?'recorded_acceptance':reviews.some(r=>r.decision==='revise')?'revision_requested':'unreviewed',limits:'Data-transfer comparison only. It does not assess device safety, choose procedures or maintenance intervals, create clinical readings, authenticate signatures, or release equipment.'};\n}\nfunction review(w,{study_sha256,reviewer,at,decision,notes}){\n assert(study_sha256===digest(w),'Review belongs to another selected edition; start a new review.');\n text(reviewer,'Reviewer');assert(reviewer.trim(),'Reviewer required');stamp(at);assert(['accepted','revise'].includes(decision),'Review decision');text(notes,'Review notes');\n const x=clone(w),r={study_sha256,reviewer,at,decision,notes};if(!x.reviews.some(q=>hash(q)===hash(r)))x.reviews.push(r);return validate(x);\n}\nfunction report(w){const r=analyze(w),esc=x=>String(x??'').replace(/\\|/g,'\\\\|').replace(/[\\r\\n]+/g,' ');\n return '# '+w.config.label+'\\n\\nData class: '+r.data_class+'\\n\\nSource scope: '+r.scope.source+'\\n\\nReturned scope: '+r.scope.returned+'\\n\\nSelected edition: '+r.study_sha256+'\\n\\nComparison: '+r.comparison_state+'; review: '+r.decision+'\\n\\n| Kind | Original rows | Returned rows |\\n|---|---:|---:|\\n'+KINDS.map(k=>'| '+k+' | '+r.counts[k].source+' | '+r.counts[k].returned+' |').join('\\n')+'\\n\\n## Differences\\n\\n'+(r.findings.length?'| Code | Kind | ID | Field | Expected | Returned | Original location |\\n|---|---|---|---|---|---|---|\\n'+r.findings.map(x=>'| '+[x.code,x.kind,x.record_id,x.field,x.expected,x.actual,x.source?x.source.name+':'+x.source.line_start+'–'+x.source.line_end:''].map(esc).join(' | ')+' |').join('\\n'):'Every selected canonical field matches through the explicit identity maps.')+'\\n\\n## Operator review\\n\\n'+(r.reviews.length?r.reviews.map(x=>x.at+' — '+x.reviewer+' — '+x.decision+'\\n\\n'+x.notes).join('\\n\\n'):'No review recorded for this edition.')+'\\n\\n'+r.limits+'\\n';\n}\nfunction exports(w){validate(w);const r=analyze(w),out=[{path:'study.json',content:json(w)},{path:'comparison.json',content:json(r)},{path:'comparison.md',content:report(w)},{path:'crosswalks.csv',content:CSV.csv([['kind','source_id','target_id'],...w.crosswalks.map(x=>[x.kind,x.source_id,x.target_id])])}];for(const side of ['source','returned'])for(const kind of KINDS)out.push({path:'selected/'+side+'-'+kind+'.csv',content:CSV.csv([FIELDS[kind],...rows(w,kind,side).map(x=>FIELDS[kind].map(k=>x.values[k]===null?'
