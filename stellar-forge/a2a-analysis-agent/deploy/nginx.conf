# Select the existing hostname and certificate paths before installing.
server {
    listen 443 ssl;
    server_name analysis.example.com;
    ssl_certificate /etc/letsencrypt/live/analysis.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/analysis.example.com/privkey.pem;

    client_max_body_size 1m;

    location = /a2a {
        proxy_pass http://127.0.0.1:41242;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /.well-known/agent-card.json {
        proxy_pass http://127.0.0.1:41242;
        proxy_set_header Host $host;
    }

    location = / {
        proxy_pass http://127.0.0.1:41242;
        proxy_set_header Host $host;
    }
}
