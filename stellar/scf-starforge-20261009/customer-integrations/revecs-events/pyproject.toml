[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "revecs-event-workspace"
version = "1.0.0"
description = "Complete customer event receiving and portable monitoring for Biotech Catalyst Sentinel"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
payments = ["x402[evm,requests]==2.25.0"]

[project.scripts]
revecs-events = "revecs_events.cli:main"

[tool.setuptools.packages.find]
include = ["revecs_events*"]

[tool.setuptools.package-data]
revecs_events = ["public/*", "OPERATING.md", "LICENSE", "payment-requirements.txt"]
