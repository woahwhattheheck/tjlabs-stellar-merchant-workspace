  /v1/ports/{locode}/capacity-by-operator/:
    get:
      operationId: ports_capacity_by_operator_retrieve
      description: Returns the monthly time series of capacity by operator, aggregating
        over the TEU of all calling vessels in the period. The default keeps the eight
        largest operators and sums the rest as Others. Pass top=0 to return every
        operator. flow=import, flow=export, flow=transshipment, or flow=cargo switches
        from vessel capacity to container volume (TEU). Imports and exports are the
        gross volume series split by operator. Transshipment is the same port total
        as the container-volume endpoint, split by operator. operator=CMA CGM limits
        the volume series to that carrier; with flow=cargo it returns Imports, Exports,
        and Transshipment.
      summary: Port capacity by operator
      parameters:
      - in: query
        name: flow
        schema:
          type: string
        description: throughput (default, vessel TEU), import, export, transshipment,
          or cargo (import, export, and transshipment together).
      - in: path
        name: locode
        schema:
          type: string
        required: true
      - in: query
        name: operator
        schema:
          type: string
        description: Carrier name as it appears on the series, for example CMA CGM.
          Returns that carrier only.
      - in: query
        name: top
        schema:
          type: string
        description: Operators kept as their own series. The rest are summed as Others.
          0 or all returns every operator. Default 8. Ignored when operator is set.
      tags:
      - ⚓ Ports
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                CapacityByOperator:
                  value:
                    type: timeseries
                    title: Throughput by operator
                    series:
                    - code: Mediterranean Shipping
                      name: Mediterranean Shipping
                      display: stacked
                    - code: Hapag-Lloyd
                      name: Hapag-Lloyd
                      display: stacked
                    - code: CMA CGM
                      name: CMA CGM
                      display: stacked
                    - code: Maersk
                      name: Maersk
                      display: stacked
                    - code: Ocean Network Express
                      name: Ocean Network Express
                      display: stacked
                    - code: Others
                      name: Others
                      display: stacked
                    data:
                    - Date: '2022-02-01'
                      Mediterranean Shipping: 84622.0
                      Hapag-Lloyd: 61658.0
                      CMA CGM: 54621.0
                      Maersk: 18385.0
                      Ocean Network Express: 13918.0
                      Others: 38394.0
                    - Date: '2022-03-01'
                      Mediterranean Shipping: 156663.0
                      Hapag-Lloyd: 95629.0
                      CMA CGM: 74605.0
                      Maersk: 29990.0
                      Ocean Network Express: 235.0
                      Others: 26042.0
                  summary: Sample timeseries response
                  description: One sample response of capacity by operator and date.
          description: Capacity by operator
      x-codeSamples:
      - lang: python
        label: Python Requests
        source: |
          import requests

          url = "https://api.econdb.com/v1/ports/<locode>/capacity-by-operator/"
          headers = {"Authorization": "Token YOUR_API_KEY"}

          response = requests.get(url, headers=headers)
          items = response.json()
          print(items)

          import pandas as pd
          df = pd.DataFrame(items['data']).set_index('Date')
          df.plot()
      - lang: bash
        label: cURL
        source: |
          curl -H "Authorization: Token YOUR_API_KEY" \
               https://api.econdb.com/v1/ports/<locode>/capacity-by-operator/
