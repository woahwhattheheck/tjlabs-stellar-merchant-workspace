components:
  schemas:
    ContainerTraffic:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        series:
          type: array
          items:
            $ref: '#/components/schemas/SeriesItem'
        data:
          type: array
          items:
            $ref: '#/components/schemas/ContainerTrafficDataPoint'
      required:
      - data
      - series
      - title
      - type
    ContainerTrafficDataPoint:
      type: object
      properties:
        Date:
          type: string
          format: date
        Exports:
          type: number
          format: double
          nullable: true
        Imports:
          type: number
          format: double
          nullable: true
        Transshipment:
          type: number
          format: double
          nullable: true
      required:
      - Date
      - Exports
      - Imports
      - Transshipment
    DwellTime:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        series:
          type: array
          items:
            $ref: '#/components/schemas/SeriesItem'
        data:
          type: array
          items:
            $ref: '#/components/schemas/DwellTimeDataPoint'
      required:
      - data
      - series
      - title
      - type
    DwellTimeDataPoint:
      type: object
      properties:
        Date:
          type: string
          format: date
        Exports:
          type: number
          format: double
          nullable: true
        Imports:
          type: number
          format: double
          nullable: true
        Transshipment:
          type: number
          format: double
          nullable: true
        RailImports:
          type: number
          format: double
          nullable: true
      required:
      - Date
      - Exports
      - Imports
      - RailImports
      - Transshipment
    MacroIndicatorExample:
      type: object
      properties:
        ticker:
          type: string
        description:
          type: string
        geography:
          type: string
        frequency:
          type: string
        dataset:
          type: string
        units:
          type: string
          nullable: true
        additional_metadata:
          type: object
          additionalProperties: {}
        data:
          type: object
          additionalProperties: {}
      required:
      - additional_metadata
      - data
      - dataset
      - description
      - frequency
      - geography
      - ticker
      - units
    Port:
      type: object
      properties:
        name:
          type: string
          nullable: true
          maxLength: 70
        locode:
          type: string
          nullable: true
          maxLength: 6
        iso2:
          type: string
          nullable: true
          maxLength: 2
        lat:
          type: number
          format: double
          nullable: true
        lon:
          type: number
          format: double
          nullable: true
        timezone:
          type: string
          nullable: true
          maxLength: 45
        region:
          type: string
          nullable: true
          maxLength: 45
    Portcalls:
      type: object
      properties:
        start:
          type: string
          format: date-time
          nullable: true
        end:
          type: string
          format: date-time
          nullable: true
        ship_name:
          type: string
          readOnly: true
        ship_imo:
          type: integer
          readOnly: true
        locode:
          type: string
          readOnly: true
        port_name:
          type: string
          readOnly: true
        import_count:
          type: number
          format: double
          nullable: true
        export_count:
          type: number
          format: double
          nullable: true
      required:
      - locode
      - port_name
      - ship_imo
      - ship_name
    Schedule:
      type: object
      properties:
        start_date:
          type: string
          format: date-time
          readOnly: true
        end_date:
          type: string
          format: date-time
          readOnly: true
        voyage_code:
          type: string
          readOnly: true
        terminal_code:
          type: string
          readOnly: true
        ship_name:
          type: string
          readOnly: true
        ship_imo:
          type: integer
          readOnly: true
        ship_teu:
          type: integer
          readOnly: true
        locode:
          type: string
          readOnly: true
        port_name:
          type: string
          readOnly: true
      required:
      - end_date
      - locode
      - port_name
      - ship_imo
      - ship_name
      - ship_teu
      - start_date
      - terminal_code
      - voyage_code
    SeriesItem:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        axis:
          type: integer
      required:
      - axis
      - code
      - name
    Vessels:
      type: object
      properties:
        imo:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        mmsi:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        name:
          type: string
          nullable: true
          maxLength: 70
        country_code:
          type: string
          nullable: true
          maxLength: 2
        ship_type:
          type: string
          readOnly: true
        callsign:
          type: string
          nullable: true
          maxLength: 12
        owner:
          type: string
          nullable: true
          maxLength: 45
        operator_name:
          type: string
          readOnly: true
        last_lat:
          type: number
          format: double
          nullable: true
        last_signal:
          type: string
          readOnly: true
        last_lon:
          type: number
          format: double
          nullable: true
        last_navstat:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        last_heading:
          type: number
          format: double
          nullable: true
        last_speed:
          type: number
          format: double
          nullable: true
        last_draught:
          type: number
          format: double
          nullable: true
        last_eta:
          type: string
          format: date-time
          nullable: true
        destination:
          type: string
          readOnly: true
        previous_port:
          type: string
          readOnly: true
        gross_tonnage:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        deadweight:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
      required:
      - destination
      - last_signal
      - mmsi
      - operator_name
      - previous_port
      - ship_type
    VesselsPositions:
      type: object
      properties:
        ref_period:
          type: string
          format: date-time
          nullable: true
        destination:
          type: string
          readOnly: true
        guessed_port:
          type: string
          readOnly: true
        eta:
          type: string
          format: date-time
          nullable: true
        lat:
          type: number
          format: double
          nullable: true
        lon:
          type: number
          format: double
          nullable: true
        draught:
          type: number
          format: double
          nullable: true
        sog:
          type: number
          format: double
          nullable: true
        cog:
          type: number
          format: double
          nullable: true
        heading:
          type: number
          format: double
          nullable: true
        navstat:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
      required:
      - destination
      - guessed_port
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
servers:
- url: https://api.econdb.com
  description: Production API
tags:
- name: ⚓ Ports
  description: Port indicators such as container traffic as well as vessel call history.
- name: 🚢 Vessels
  description: Vessel indicators and ship tracking.
- name: 🌊 Global
  description: Global shipping indicators
- name: ➡️ Point to point
  description: Origin <> destination indicators
- name: 🌐 Time series
  description: Macroeconomic indicators time series data.
x-tagGroups:
- name: Shipping
  tags:
  - ⚓ Ports
  - 🚢 Vessels
  - 🌊 Global
  - ➡️ Point to point
- name: Macro
  tags:
  - 🌐 Time series
