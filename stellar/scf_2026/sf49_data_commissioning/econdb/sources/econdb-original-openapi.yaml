openapi: 3.0.3
info:
  title: Econdb API documentation
  version: ''
  description: |2

    Released on July 29, 2025, the [Econdb](https://www.econdb.com) API provides access to a wide range of shipping-related indicators and macroeconomic data.

    For any questions or support, please contact us at [contact@econdb.com](mailto:contact@econdb.com).

    This user guide is available in two style formats:
    - [Documentation style Redoc](https://developers.econdb.com/docs/)
    - [Documentation style Swagger](https://developers.econdb.com/swagger/)
paths:
  /v1/point2point/container-volume/:
    get:
      operationId: point2point_container_volume_retrieve
      description: Returns the monthly time series of trade between two partners
      summary: Trade between two partners
      parameters:
      - in: query
        name: is_export
        schema:
          type: integer
          default: '1'
        description: 1 to display exports, 0 for imports
      - in: query
        name: partner
        schema:
          type: string
        description: Country of partner
      - in: query
        name: port_partner
        schema:
          type: string
        description: Port of partner (locode)
      - in: query
        name: port_reference
        schema:
          type: string
        description: Port of reference (locode)
      - in: query
        name: reference
        schema:
          type: string
        description: Country of reference
      - in: query
        name: region_partner
        schema:
          type: string
        description: Region of partner
      - in: query
        name: region_reference
        schema:
          type: string
        description: Region of reference
      tags:
      - ➡️ Point to point
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                SampleContainerVolume:
                  value:
                    type: timeseries
                    title: Container trade - ES BCN < CN SHA (TEU)
                    series:
                    - code: ES BCN < CN SHA
                      name: ES BCN < CN SHA (TEU)
                      axis: 0
                      display: bar
                    data:
                    - Date: '2022-02-21'
                      ES BCN < CN SHA: 3320.8
                    - Date: '2022-02-28'
                      ES BCN < CN SHA: 1810.5
                    - Date: '2022-03-07'
                      ES BCN < CN SHA: 5762.0
                  summary: Sample timeseries response
          description: A timeseries showing container volumes between partners.
      x-codeSamples:
      - lang: python
        label: Python Requests
        source: |
          import requests

          url = "https://api.econdb.com/v1/point2point/container-volume/?port_reference=ES BCN&port_partner=CN SHA&is_export=0"
          headers = {"Authorization": "Token YOUR_API_KEY"}

          response = requests.get(url, headers=headers)
          items = response.json()
          print(items)

          import pandas as pd
          df = pd.DataFrame(items['data']).set_index('Date')
          df.plot()
      - lang: bash
        label: cURL
        source: |
          curl -H "Authorization: Token YOUR_API_KEY" \
               https://api.econdb.com/v1/point2point/container-volume/?port_reference=ES%20BCN&port_partner=CN%20SHA&is_export=0
  /v1/point2point/transit-time/:
    get:
      operationId: point2point_transit_time_retrieve
      description: Returns the monthly time series of average transit time  between
        two partners
      summary: Bilateral transit time
      parameters:
      - in: query
        name: is_export
        schema:
          type: integer
          default: '1'
        description: 1 to display exports, 0 for imports
      - in: query
        name: partner
        schema:
          type: string
        description: Country of partner
      - in: query
        name: port_partner
        schema:
          type: string
        description: Port of partner (locode)
      - in: query
        name: port_reference
        schema:
          type: string
        description: Port of reference (locode)
      - in: query
        name: reference
        schema:
          type: string
        description: Country of reference
      - in: query
        name: region_partner
        schema:
          type: string
        description: Region of partner
      - in: query
        name: region_reference
        schema:
          type: string
        description: Region of reference
      tags:
      - ➡️ Point to point
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                SampleTransitTime:
                  value:
                    type: timeseries
                    title: Voyage duration - ES BCN < CN SHA (days)
                    series:
                    - code: ES BCN < CN SHA
                      name: ES BCN < CN SHA (days)
                      display: line
                      axis: 0
                    - code: range
                      name: Range
                      display: area
                      axis: 0
                    data:
                    - Date: '2022-02-21'
                      ES BCN < CN SHA: 29.74
                      range:
                      - 26.0
                      - 31.61
                    - Date: '2022-02-28'
                      ES BCN < CN SHA: 33.545
                      range:
                      - 32.23
                      - 34.76
                    - Date: '2022-03-07'
                      ES BCN < CN SHA: 38.0
                      range:
                      - 38.0
                      - 38.0
                  summary: Sample timeseries response
          description: A timeseries showing transit time between partners.
      x-codeSamples:
      - lang: python
        label: Python Requests
        source: |
          import requests

          url = "https://api.econdb.com/v1/point2point/transit-time/?port_reference=ES BCN&port_partner=CN SHA&is_export=0"
          headers = {"Authorization": "Token YOUR_API_KEY"}

